[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vvz-ai-editor"
version = "0.1.0"
description = "AI editor: structural YAML documents by tree paths — load, validate, get/set, safe batched writes (plan_task_v1)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ai", "yaml", "editor", "ruamel", "jsonpath", "validation", "mcp"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "ruamel.yaml>=0.18.0",
  "jsonpath-ng>=1.6.0",
  "jsonschema>=4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/vvz/ai_editor"
Documentation = "https://github.com/vvz/ai_editor/tree/main/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_editor*"]

[tool.setuptools.package-data]
ai_editor = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["ai_editor", "tests"]
