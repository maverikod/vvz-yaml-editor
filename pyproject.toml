[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vvz-ai-editor"
version = "0.1.0"
description = "Universal document editor for AI models and MCP servers."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "code-analysis-client>=1.0.9",
    "cryptography>=41.0.0",
    "gitpython>=3.1.0",
    "html2text>=2020.1.16",
    "jsonpath-ng>=1.6.0",
    "jsonschema>=4.0.0",
    "lark>=1.1.0",
    "libcst>=1.1.0",
    "lxml>=5.0",
    "mcp-proxy-adapter",
    "mistune>=3.0",
    "ruamel.yaml>=0.18.0",
]

[project.scripts]
ai-editor = "ai_editor.interfaces.cli:main"
aiedmgr = "ai_editor.interfaces.service_manager:main"

[tool.hatch.build.targets.wheel]
packages = ["ai_editor"]
