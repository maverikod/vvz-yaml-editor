- tests/path_language/
- tests/reader/
- tests/validation/
- tests/transaction_writer/
- tests/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - G-001 public result and error envelope concepts
  - G-002 in-memory YAML document model concepts
  - G-003 structural path resolution public contracts
  - G-005/T-002 mutation contract models
  may_be_used_by:
  - G-005 batch dispatch and rollback step
  - G-007 checked write pipeline
public_contracts_provided:
- set operation implementation
- replace_block operation implementation
operation_policy:
  set:
    purpose: Replace scalar or structured value at an existing structural path.
    changed_paths_rule: Report the normalized target path when a value changes.
    invalid_targets: Return typed failure for missing, ambiguous, or unsupported target
      paths.
  replace_block:
    purpose: Replace an entire mapping or sequence block at an existing structural
      path.
    changed_paths_rule: Report the normalized block path when the block changes.
    invalid_targets: Return typed failure when the target is missing, ambiguous, or
      not a replaceable block.
  no_change_policy: If the new value is structurally equal to the current value, return
    success with would-change semantics defined by T-002 contracts and no false changed
    path.
responsibilities:
- Apply set only to the selected in-memory YAML node.
- Apply replace_block only to the selected in-memory mapping or sequence block.
- Preserve unrelated document branches, ordering, and comments where the underlying
  YAML document object supports them.
- Return typed errors rather than partial success for invalid targets.
implementation_notes:
- This step may share helper code inside replace_ops.py only.
- It must not duplicate the structural path parser; it must call public G-003 path
  resolution contracts.
- It must not mutate the document before target resolution succeeds.
- It must not implement full batch rollback; that belongs to a later G-005 tactical
  step.
verification:
  scope: tactical_completion_gate
  commands:
  - python -m pytest tests/mutations/test_replace_ops.py
  expected:
  - set modifies only the selected scalar or structured node.
  - replace_block replaces only the selected mapping or sequence block.
  - Missing, ambiguous, or unsupported targets return typed errors.
  - Unrelated document branches remain unchanged.
  - No file I/O, validation, rendering, writer, CLI, or MCP behavior is introduced.
acceptance_criteria:
- set and replace_block are implemented independently from append, delete, move, and
  batch orchestration.
- Every successful replacement reports exact normalized changed_paths.
- Invalid targets return typed errors defined by the mutation contracts.
- This step edits only its owned code and test paths during implementation.
model_assignment_spec:
  performer: coding_agent
  instruction: Work only on yaml_editor/mutations/replace_ops.py and tests/mutations/test_replace_ops.py.
    Implement pure in-memory set and replace_block mutation behavior over already
    loaded YAML document objects using public path_language resolution contracts and
    G-005 mutation contracts. Do not implement append, delete, move, batch rollback,
    validation, rendering, file I/O, transaction writing, CLI, or MCP wrappers. Do
    not edit .venv, venv, site-packages, installed dependencies, or sibling-owned
    mutation files.
