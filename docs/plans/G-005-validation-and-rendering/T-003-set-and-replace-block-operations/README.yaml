format: tactical_step_v1
parent_step_id: G-005
parent_step_name: mutation_operations
tactical_step_id: T-003
tactical_step_name: set_and_replace_block_operations
title: Set and replace_block mutation operations
status: draft
source_documents:
- docs/tech_spec.md
- docs/plans/create_pip_package_for_mcp.yaml
- docs/plans/G-005-validation-and-rendering/README.yaml
intent: Own the pure in-memory replacement-style mutation operations for already loaded
  YAML document objects. This tactical step implements set and replace_block behavior
  only, using structural paths and returning exact normalized changed_paths without
  reading files, validating schemas, rendering YAML, writing files, or exposing CLI/MCP
  wrappers.
self_contained_context:
  global_goal: G-005 owns structural in-memory mutation operations over already loaded
    YAML document objects.
  technical_spec_basis:
  - yaml_set replaces a scalar or structured value selected by a YAML path.
  - yaml_replace_block replaces an entire mapping or sequence block selected by a
    YAML path.
  - Ordinary model workflows must use structural YAML paths, not line ranges.
  - changed_paths must be exact normalized structural paths.
  parent_boundaries:
  - Use public path_language contracts for target and parent resolution.
  - Do not implement path parsing inside this step.
  - Do not validate plan_task_v1 schema or semantics.
  - Do not render or write YAML text.
  - Do not implement append, delete, move, batch rollback, CLI, or MCP wrappers.
owned_code_paths:
- yaml_editor/mutations/replace_ops.py
owned_test_paths:
- tests/mutations/test_replace_ops.py
owned_docs_paths: []
forbidden_paths:
- pyproject.toml
- README.md
- yaml_editor/contracts/
- yaml_editor/document_io/
- yaml_editor/path_language/
- yaml_editor/reader/
- yaml_editor/validation/
