format: tactical_step_v1
parent_step_id: G-005
parent_step_name: mutation_operations
tactical_step_id: T-001
tactical_step_name: mutations_package_boundary
title: Mutations package boundary and public surface
status: draft
source_documents:
- docs/tech_spec.md
- docs/plans/create_pip_package_for_mcp.yaml
- docs/plans/G-005-validation-and-rendering/README.yaml
intent: Own the package boundary for the pure in-memory YAML mutation subsystem. This
  tactical step defines the public exports, import boundaries, and subsystem non-goals
  for yaml_editor/mutations so later operation implementations have a stable package
  surface without reading files, validating schemas, rendering YAML, writing files,
  exposing CLI, or exposing MCP wrappers.
self_contained_context:
  global_goal: G-005 owns structural in-memory mutation operations over already loaded
    YAML document objects.
  required_operations:
  - set replaces a scalar or structured value at a structural path.
  - replace_block replaces a complete mapping or sequence block at a structural path.
  - append appends a value to a sequence and can dedupe.
  - delete removes a mapping key or sequence item.
  - move reorders an item inside a sequence.
  required_public_contracts:
  - MutationOperation
  - MutationBatchResult
  - apply_mutation(document, operation)
  - apply_mutation_batch(document, operations)
  - collect_changed_paths(operation_result)
  required_boundaries:
  - Mutations operate only on already loaded in-memory YAML document objects.
  - Mutations delegate structural path parsing and target resolution to path_language
    public contracts.
  - Mutations must not read files from disk.
  - Mutations must not render YAML text for persistence.
  - Mutations must not validate plan_task_v1 schema or semantics.
  - Mutations must not create backups, perform atomic writes, expose CLI commands,
    or expose MCP commands.
owned_code_paths:
- yaml_editor/mutations/__init__.py
- yaml_editor/mutations/package_boundary.py
owned_test_paths:
- tests/mutations/test_package_boundary.py
owned_docs_paths: []
forbidden_paths:
- pyproject.toml
- README.md
- yaml_editor/contracts/
- yaml_editor/document_io/
- yaml_editor/path_language/
- yaml_editor/reader/
- yaml_editor/validation/
- yaml_editor/transaction_writer/
- yaml_editor/interfaces/
- tests/document_io/
- tests/path_language/
- tests/reader/
- tests/validation/
- tests/transaction_writer/
- tests/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - G-001 public contracts and error envelope concepts
  - G-002 in-memory YAML document model concepts
  - G-003 structural path language public contracts
  may_be_used_by:
  - G-005 operation implementation tactical steps
  - G-007 checked write pipeline
public_contracts_provided:
- yaml_editor.mutations package import boundary
- public mutation exports list
boundary_policy:
  exports_must_include:
  - MutationOperation
  - MutationBatchResult
  - apply_mutation
  - apply_mutation_batch
  - collect_changed_paths
  exports_must_not_include:
  - file loading helpers
  - validation helpers
  - rendering helpers
  - backup or atomic write helpers
  - CLI or MCP wrapper functions
  import_rules:
  - Package boundary may import only mutation-owned modules and stable public contracts
    from earlier global subsystems.
  - Package boundary must not import reader, validation, transaction_writer, interfaces,
    CLI, or MCP-specific modules.
responsibilities:
- Create the mutations package boundary with explicit public exports.
- Document and test forbidden cross-subsystem imports.
- Keep package import side-effect free and safe for MCP servers to import.
implementation_notes:
- This step is not responsible for implementing operation algorithms.
- This step is not responsible for operation DTO fields beyond exposing the stable
  names owned by this subsystem.
- Tests should verify importability and absence of forbidden downstream imports by
  inspecting package imports or module attributes.
verification:
  scope: tactical_completion_gate
  commands:
  - python -m pytest tests/mutations/test_package_boundary.py
  expected:
  - yaml_editor.mutations imports without reading or writing files.
  - Public exports expose mutation names required by G-005.
  - No forbidden reader, validation, transaction_writer, interface, CLI, or MCP imports
    are introduced.
acceptance_criteria:
- Package boundary is limited to mutation subsystem ownership.
- Importing yaml_editor.mutations has no disk, validation, render, write, CLI, or
  MCP side effects.
- Public surface is stable enough for operation and writer steps to depend on without
  duplicating mutation logic.
model_assignment_spec:
  performer: coding_agent
  instruction: Work only on yaml_editor/mutations/__init__.py, yaml_editor/mutations/package_boundary.py,
    and tests/mutations/test_package_boundary.py. Implement the mutations package
    boundary and public exports for the pure in-memory mutation subsystem. Do not
    implement individual operations here. Do not read or write YAML files, validate
    schemas, render YAML, create backups, implement CLI or MCP wrappers, or modify
    any sibling subsystem. Do not edit .venv, venv, site-packages, or installed dependencies.
