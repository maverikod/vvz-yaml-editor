tactical_step_name: dispatch_batch_rollback
title: Mutation dispatch, batch rollback, and changed path aggregation
status: draft
source_documents:
- docs/tech_spec.md
- docs/plans/create_pip_package_for_mcp.yaml
- docs/plans/G-005-validation-and-rendering/README.yaml
intent: Own the orchestration layer for the pure in-memory mutation subsystem. This
  tactical step dispatches one MutationOperation to the correct operation module,
  applies operation batches atomically in memory, rolls back caller-visible document
  state on failure, and aggregates normalized changed_paths without reading files,
  validating schemas, rendering YAML, writing files, or exposing CLI/MCP wrappers.
self_contained_context:
  global_goal: G-005 owns structural in-memory mutation operations over already loaded
    YAML document objects.
  technical_spec_basis:
  - yaml_write_checked will later use an operations list, but this G-005 step owns
    only the in-memory patch portion.
  - A batch must apply operations deterministically and must not leave partial in-memory
    mutations after failure.
  - changed_paths must be exact normalized structural paths.
  - Regular operation behavior is owned by separate operation modules; this step must
    orchestrate, not reimplement.
  parent_boundaries:
  - Dispatch supported operations: set, replace_block, append, delete, move.
  - Use mutation contracts for request, result, diagnostics, and changed path shapes.
  - Delegate operation-specific behavior to sibling G-005 operation modules.
  - Do not validate plan_task_v1 schema or semantics.
  - Do not render or write YAML text.
  - Do not read files, create backups, implement transaction writer behavior, CLI,
    or MCP wrappers.
