allowed_dependencies:
  may_depend_on:
  - G-001 public result and error envelope concepts
  - G-002 in-memory YAML document model concepts
  - G-003 structural path resolution public contracts
  - G-005/T-002 mutation contract models
  - G-005/T-003 set and replace_block operations
  - G-005/T-004 append operation
  - G-005/T-005 delete operation
  - G-005/T-006 move operation
  may_be_used_by:
  - G-007 checked write pipeline
public_contracts_provided:
- apply_mutation(document, operation)
- apply_mutation_batch(document, operations)
- collect_changed_paths(operation_result)
- all-or-nothing in-memory batch mutation behavior
engine_policy:
  dispatch:
    supported_ops:
    - set
    - replace_block
    - append
    - delete
    - move
    requirement: Dispatch by operation name to the owning operation module without
      duplicating operation internals.
  batch:
    requirement: Apply operations in input order to an already loaded in-memory YAML
      document object.
    rollback_requirement: If any operation fails, restore the caller-visible document
      to its pre-batch state.
    failure_reporting: Report the failing operation index, typed error, partial results
      before rollback, and rolled_back=true.
  changed_paths:
    requirement: Aggregate changed_paths deterministically in operation order.
    duplicate_policy: Duplicate path handling must be explicit and tested; preserving
      first-seen order is preferred unless the shared contract requires otherwise.
responsibilities:
- Provide the public G-005 entry points for single-operation and batch mutation application.
- Guarantee all-or-nothing in-memory batch behavior.
- Aggregate changed_paths from operation results without inventing line ranges.
- Return truthful typed diagnostics for unsupported operations and failed batches.
implementation_notes:
- Use copy or restore semantics appropriate for the in-memory YAML document type and
  document the chosen behavior in tests.
- Batch rollback must not rely on disk backups, temporary files, or transaction writer
  behavior.
- This step must not duplicate set, replace_block, append, delete, or move algorithm
  internals.
- This step must not call validation, rendering, writer, CLI, or MCP modules.
verification:
  scope: tactical_completion_gate
  commands:
  - python -m pytest tests/mutations/test_mutation_engine.py
  optional_cross_step_commands:
  - python -m pytest tests/mutations
  expected:
  - apply_mutation dispatches every supported operation to the correct owned operation
    module.
  - apply_mutation_batch applies successful operations in order.
  - A failed batch restores the original in-memory document.
  - collect_changed_paths returns deterministic normalized paths.
  - Unsupported operations return typed errors.
  - No file I/O, validation, rendering, writer, CLI, or MCP behavior is introduced.
acceptance_criteria:
- Engine exposes the public contracts listed by parent G-005.
- Failed batch leaves the caller-visible in-memory document unchanged.
- Engine depends on operation modules but does not own or duplicate their internal
  operation semantics.
- This step edits only its owned code and test paths during implementation.
model_assignment_spec:
  performer: coding_agent
  instruction: Work only on yaml_editor/mutations/engine.py and tests/mutations/test_mutation_engine.py.
    Implement pure in-memory mutation dispatch, batch application, rollback on failure,
    and changed path aggregation by delegating operation-specific behavior to the
    sibling G-005 operation modules and using G-005 mutation contracts. Do not duplicate
    operation internals. Do not implement validation, rendering, file I/O, transaction
    writing, CLI, or MCP wrappers. Do not edit .venv, venv, site-packages, installed
    dependencies, or sibling-owned mutation files.
