allowed_dependencies:
  may_depend_on:
  - G-001-package-contracts-and-distribution
  may_be_used_by:
  - G-010 YAMLFormatter (owns YAML and text mutation implementations)
  - G-013 CSTFormatter (owns CST mutation implementations)
  - G-015 session layer (triggers mutation via formatter, then commits to session
    git)
public_contracts_provided:
- 'AbstractFormatter abstract mutation methods: mutate_set, mutate_replace_block,
  mutate_append, mutate_delete, mutate_move (defined in G-010 ai_editor/formatters/base.py)'
core_responsibilities:
- Mutations must live inside the formatter that owns them. Do not create ai_editor/mutations/.
- Each formatter implements mutate_set, mutate_replace_block, mutate_append, mutate_delete,
  mutate_move.
- Mutations operate only on the in-memory document — never read or write files.
- After every successful mutation the session layer (G-015) calls render() and commits
  to session git branch buf/<buffer_id>.
mutation_operations:
- op: set
  purpose: Replace scalar or structured value at a structural address.
- op: replace_block
  purpose: Replace an entire mapping or sequence block.
- op: append
  purpose: Append a value to a sequence, optionally with dedupe.
- op: delete
  purpose: Delete a mapping key or sequence item.
- op: move
  purpose: Move a sequence item to a new index (YAML and text only; CST uses delete+insert).
subsystem_independence_rules:
- Mutations must live inside the formatter that owns them. Do not create a standalone
  mutations module.
- Formatters must not read or write files in mutation methods.
- Formatters must not validate plan_task_v1 schema inside mutation methods.
- Formatters must not expose CLI or MCP commands directly.
- Session layer (G-015) is responsible for committing rendered buffer to session git
  after every mutation.
implementation_outline:
- Read G-010 for AbstractFormatter abstract mutation method contracts.
- Read G-013 for CST-specific mutation implementation details.
- Mutation tests live under tests/formatters/ alongside the formatter they belong
  to.
- Do not create ai_editor/mutations/ or any standalone mutation module.
verification:
  scope: internal_g010_mutations
  commands:
  - python -m pytest tests/formatters/yaml/ -k mutation
  - python -m pytest tests/formatters/cst/ -k mutation
  - python -m pytest tests/formatters/text/ -k mutation
  expected:
  - YAML formatter mutate_set modifies only the selected node.
  - YAML formatter mutate_append with dedupe=True is idempotent.
  - YAML formatter mutate_delete removes only the selected key or item.
  - YAML formatter mutate_move changes only sequence ordering.
  - Failed mutation leaves original in-memory document unchanged.
  - After every mutation session layer commits rendered buffer to session git branch.
acceptance_criteria:
- No standalone ai_editor/mutations/ module exists.
- All mutation code lives inside the formatter that owns it (G-010 for YAML/text,
  G-013 for CST).
- AbstractFormatter abstract mutation methods are defined in G-010 ai_editor/formatters/base.py.
- After every successful mutation the session layer (G-015) commits rendered buffer
  to session git.
model_assignment_spec:
  performer: coding_agent
  instruction: 'Implement mutation operations inside each formatter. AbstractFormatter
    (G-010) defines abstract methods: mutate_set, mutate_replace_block, mutate_append,
    mutate_delete, mutate_move. Each formatter implements these for its document model.
    After every successful mutation the session layer (G-015) calls render() and commits
    the result to session git branch buf/<buffer_id>. Do NOT create ai_editor/mutations/
    as a standalone module. Mutation tests live under tests/formatters/. Read G-010
    for abstract contract. Read G-013 for CST details.

    '
