format: global_package_step_v2
plan_id: yaml_editor_pip_package_for_mcp
step_id: G-005
step_name: mutation_operations
title: In-memory mutation operations subsystem
status: draft
source_plan: docs/plans/create_pip_package_for_mcp.yaml
global_intent: Own the pure in-memory YAML mutation subsystem. This block defines
  structural edit operations over already-loaded YAML documents and returns changed
  paths and diagnostics without reading files, validating schemas, rendering final
  output, or writing to disk.
why_this_block_exists: 'Lower-level mutation tasks must understand the complete mutation
  responsibility: apply deterministic structural operations to a YamlDocument through
  path_language and report exact changes. This must stay separate from validation
  and transaction writing.'
owned_code_paths:
- yaml_editor/mutations/
- tests/mutations/
owned_docs_paths:
- docs/mutation_operations.md
forbidden_code_paths:
- yaml_editor/contracts/
- yaml_editor/document_io/
- yaml_editor/path_language/
- yaml_editor/reader/
- yaml_editor/validation/
- yaml_editor/transaction_writer/
- yaml_editor/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - G-001-package-contracts-and-distribution
  - G-002-document-io
  - G-003-path-language
  may_be_used_by:
  - G-007-transaction-writer
public_contracts_provided:
- MutationOperation
- MutationBatchResult
- apply_mutation(document, operation)
- apply_mutation_batch(document, operations)
- collect_changed_paths(operation_result)
core_responsibilities:
- Implement set, replace_block, append, delete, and move operations.
- Apply operations only to in-memory YAML document objects.
- Use path_language to resolve mutation targets and parents.
- Track changed_paths using normalized structural paths.
- Provide all-or-nothing in-memory batch mutation behavior.
mutation_operations:
- op: set
  purpose: Replace scalar or structured value at a structural path.
- op: replace_block
  purpose: Replace an entire mapping or sequence block.
- op: append
  purpose: Append a value to a sequence, optionally with dedupe.
- op: delete
  purpose: Delete a mapping key or sequence item.
- op: move
  purpose: Move a sequence item to a new index.
subsystem_independence_rules:
- This subsystem must not read files from disk.
- This subsystem must not render YAML text for persistence.
- This subsystem must not validate plan_task_v1 schema or semantics.
- This subsystem must not create backups or perform atomic writes.
- This subsystem must not expose CLI or MCP commands.
- Transaction writer must call this subsystem instead of reimplementing mutations.
implementation_outline:
- Define mutation operation DTOs or typed dict contracts inside mutations package.
- Implement single-operation mutation functions.
- Implement batch application with rollback on failure.
- Implement dedupe semantics for append.
- Add tests for exact changed paths and no side effects outside selected nodes.
verification:
  commands:
  - python -m pytest tests/mutations
  expected:
  - set modifies only the selected node.
  - append with dedupe=true is idempotent.
  - delete removes only the selected key or item.
  - move changes only sequence ordering.
  - failed batch leaves original in-memory document unchanged.
acceptance_criteria:
- Mutation code is independent from reader, validation, writer, and interfaces.
- Every operation reports exact changed_paths.
- Invalid target types return typed errors.
- Lower-level mutation tasks can be decomposed without touching other subsystems.
model_assignment_spec:
  performer: coding_agent
  instruction: Implement only pure in-memory mutation operations. Do not read or write
    files, validate schemas, implement CLI/MCP wrappers, or modify other subsystem
    directories. All cross-subsystem usage must go through document_io and path_language
    public contracts.
observations_template:
- command: ''
  expected: ''
  actual: ''
  error: ''
  status: ''
