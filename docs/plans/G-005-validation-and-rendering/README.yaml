status: obsolete_absorbed
source_plan: docs/plans/create_pip_package_for_mcp.yaml
global_intent: 'G-005 is ABSORBED into G-010 (AbstractFormatter) and G-013 (CSTFormatter).
  Mutations are formatter-internal operations. AbstractFormatter defines abstract
  mutation methods (mutate_set, mutate_replace_block, mutate_append, mutate_delete,
  mutate_move) that each formatter implements. After every successful mutation the
  session layer (G-015) calls render() and commits the result to the session git branch
  buf/<buffer_id>. No standalone ai_editor/mutations/ module exists.

  '
why_this_block_exists: 'This step is kept for historical reference only. Its content
  is fully absorbed into G-010 (AbstractFormatter abstract mutation contract + YAML/text
  implementations) and G-013 (CST mutation implementations). Do not implement any
  code under ai_editor/mutations/. Read G-010 for the abstract mutation interface
  definition. Read G-013 for CST-specific mutation implementation details.

  '
owned_code_paths:
- ai_editor/formatters/yaml/  (YAML mutation code, owned by G-010)
- ai_editor/formatters/cst/   (CST mutation code, owned by G-013)
- ai_editor/formatters/text/  (text mutation code, owned by G-010)
- tests/formatters/            (mutation tests alongside formatter tests)
