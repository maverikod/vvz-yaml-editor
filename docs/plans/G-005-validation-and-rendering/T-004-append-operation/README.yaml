  - G-005 batch dispatch and rollback step
  - G-007 checked write pipeline
public_contracts_provided:
- append operation implementation
- dedupe behavior for sequence append
operation_policy:
  append:
    purpose: Append a scalar or structured value to an existing sequence selected
      by structural path.
    changed_paths_rule: Report the normalized sequence path or appended item path
      according to the shared mutation contract; tests must make the selected convention
      explicit.
    invalid_targets: Return typed failure for missing, ambiguous, or non-sequence
      target paths.
  dedupe:
    purpose: When dedupe=true, avoid appending a value that is already structurally
      equal to an existing sequence item.
    no_change_rule: Existing equal item must produce deterministic success/no-change
      behavior and must not report a false changed path.
    equality_basis: Structural equality of the in-memory YAML value, not rendered
      text and not line ranges.
responsibilities:
- Append exactly one value to the selected in-memory sequence when dedupe does not
  suppress the operation.
- Preserve existing sequence order and unrelated document branches.
- Return typed errors for non-sequence, missing, or ambiguous targets.
- Keep dedupe behavior deterministic and idempotent.
implementation_notes:
- This step must not duplicate structural path parser logic; it must call public G-003
  path resolution contracts.
- Dedupe must compare YAML values structurally in memory.
- This step must not call validation, rendering, writer, CLI, or MCP modules.
- Batch rollback belongs to a later G-005 tactical step, not here.
verification:
  scope: tactical_completion_gate
  commands:
  - python -m pytest tests/mutations/test_append_ops.py
  expected:
  - append adds exactly one item to a selected sequence.
  - append with dedupe=true is idempotent for an existing equal item.
  - append to a mapping or scalar returns a typed target mismatch error.
  - Missing or ambiguous targets return typed errors.
  - No file I/O, validation, rendering, writer, CLI, or MCP behavior is introduced.
acceptance_criteria:
- append is implemented independently from set, replace_block, delete, move, and batch
  orchestration.
- dedupe behavior is deterministic, idempotent, and covered by tactical tests.
- Every successful change reports exact normalized changed_paths.
- This step edits only its owned code and test paths during implementation.
model_assignment_spec:
  performer: coding_agent
  instruction: Work only on yaml_editor/mutations/append_ops.py and tests/mutations/test_append_ops.py.
    Implement pure in-memory append behavior with dedupe semantics for sequence targets
    over already loaded YAML document objects using public path_language resolution
    contracts and G-005 mutation contracts. Do not implement set, replace_block, delete,
    move, batch rollback, validation, rendering, file I/O, transaction writing, CLI,
    or MCP wrappers. Do not edit .venv, venv, site-packages, installed dependencies,
    or sibling-owned mutation files.
