intent: Own the pure in-memory append operation for already loaded YAML document objects.
  This tactical step appends values to sequence targets selected by structural paths
  and defines optional dedupe behavior, while avoiding file reads, schema validation,
  rendering, writing, CLI, MCP, and other mutation operations.
self_contained_context:
  global_goal: G-005 owns structural in-memory mutation operations over already loaded
    YAML document objects.
  technical_spec_basis:
  - yaml_append adds an item to a list selected by structural YAML path.
  - yaml_append supports dedupe=true to protect against duplicate list entries.
  - Ordinary model workflows must use structural YAML paths, not line ranges.
  - changed_paths must be exact normalized structural paths.
  parent_boundaries:
  - Use public path_language contracts for sequence target resolution.
  - Do not implement path parsing inside this step.
  - Do not validate plan_task_v1 schema or semantics.
  - Do not render or write YAML text.
  - Do not implement set, replace_block, delete, move, batch rollback, CLI, or MCP
    wrappers.
