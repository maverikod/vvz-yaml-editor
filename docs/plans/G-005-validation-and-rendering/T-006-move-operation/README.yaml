public_contracts_provided:
- move operation implementation
operation_policy:
  move:
    purpose: Move one resolved sequence item to to_index inside its parent sequence.
    changed_paths_rule: Report the normalized affected sequence path or item-ordering
      paths according to the shared mutation contract; tests must make the selected
      convention explicit.
    invalid_targets: Return typed failure for missing, ambiguous, non-sequence parent,
      or invalid index targets.
  index_policy:
    first_index: to_index 0 moves the item to the start.
    last_index: to_index at the last valid position moves the item to the end.
    same_index: Moving to the same effective index must be deterministic and must
      not corrupt ordering.
    out_of_range: Out-of-range indexes return typed failure unless the shared contract
      explicitly defines clamping.
responsibilities:
- Resolve from_path to exactly one sequence item.
- Move the item only inside its current parent sequence.
- Preserve the moved item's in-memory structure and unrelated document branches.
- Return typed errors for invalid targets or indexes.
implementation_notes:
- Cross-sequence moves are out of scope for this step.
- Same-index moves may be represented as a no-change success if the contract from
  T-002 allows it.
- This step must not call validation, rendering, writer, CLI, or MCP modules.
- Batch rollback belongs to a later G-005 tactical step, not here.
verification:
  scope: tactical_completion_gate
  commands:
  - python -m pytest tests/mutations/test_move_ops.py
  expected:
  - move reorders exactly one selected item inside its parent sequence.
  - move to first, last, and same effective index is deterministic.
  - Invalid indexes and non-sequence parents return typed errors.
  - Unrelated mapping and sequence branches remain unchanged.
  - No file I/O, validation, rendering, writer, CLI, or MCP behavior is introduced.
acceptance_criteria:
- move is implemented independently from set, replace_block, append, delete, and batch
  orchestration.
- Boundary index behavior is specified and covered by tactical tests.
- Every successful move reports exact normalized changed_paths or explicit no-change
  semantics.
- This step edits only its owned code and test paths during implementation.
model_assignment_spec:
  performer: coding_agent
  instruction: Work only on yaml_editor/mutations/move_ops.py and tests/mutations/test_move_ops.py.
    Implement pure in-memory sequence item move behavior over already loaded YAML
    document objects using public path_language resolution contracts and G-005 mutation
    contracts. Do not implement set, replace_block, append, delete, batch rollback,
    validation, rendering, file I/O, transaction writing, CLI, or MCP wrappers. Do
    not edit .venv, venv, site-packages, installed dependencies, or sibling-owned
    mutation files.
