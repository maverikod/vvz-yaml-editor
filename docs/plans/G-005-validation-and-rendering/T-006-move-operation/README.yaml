intent: Own the pure in-memory move operation for already loaded YAML document objects.
  This tactical step reorders exactly one item inside a sequence selected by structural
  path and target index, reporting deterministic changed_paths without reading files,
  validating schemas, rendering YAML, writing files, or exposing CLI/MCP wrappers.
self_contained_context:
  global_goal: G-005 owns structural in-memory mutation operations over already loaded
    YAML document objects.
  technical_spec_basis:
  - yaml_move moves a selected list item to a new index.
  - The request shape uses from_path and to_index.
  - Ordinary model workflows must use structural YAML paths, not line ranges.
  - changed_paths must be exact normalized structural paths.
  parent_boundaries:
  - Use public path_language contracts to resolve from_path and parent sequence.
  - Move is limited to reordering within one parent sequence unless the parent plan
    is later changed by a human decision.
  - Do not implement path parsing inside this step.
  - Do not validate plan_task_v1 schema or semantics.
  - Do not render or write YAML text.
  - Do not implement set, replace_block, append, delete, batch rollback, CLI, or MCP
    wrappers.
