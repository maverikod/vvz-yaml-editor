tactical_step_name: delete_operation
title: Delete mutation operation
status: draft
source_documents:
- docs/tech_spec.md
- docs/plans/create_pip_package_for_mcp.yaml
- docs/plans/G-005-validation-and-rendering/README.yaml
intent: Own the pure in-memory delete operation for already loaded YAML document objects.
  This tactical step removes a mapping key or sequence item selected by structural
  path and reports exact normalized changed_paths without reading files, validating
  schemas, rendering YAML, writing files, or exposing CLI/MCP wrappers.
self_contained_context:
  global_goal: G-005 owns structural in-memory mutation operations over already loaded
    YAML document objects.
  technical_spec_basis:
  - yaml_delete deletes a field or list item selected by structural YAML path.
  - Example structural paths include commands[name=buf_diff].metadata.best_practices[1].
  - Ordinary model workflows must use structural YAML paths, not line ranges.
  - changed_paths must be exact normalized structural paths.
  parent_boundaries:
  - Use public path_language contracts for target and parent resolution.
  - Deletion requires parent resolution, not only target resolution.
  - Do not implement path parsing inside this step.
  - Do not validate plan_task_v1 schema or semantics.
  - Do not render or write YAML text.
  - Do not implement set, replace_block, append, move, batch rollback, CLI, or MCP
    wrappers.
owned_code_paths:
- yaml_editor/mutations/delete_ops.py
owned_test_paths:
- tests/mutations/test_delete_ops.py
