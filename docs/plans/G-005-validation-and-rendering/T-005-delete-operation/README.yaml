allowed_dependencies:
  may_depend_on:
  - G-001 public result and error envelope concepts
  - G-002 in-memory YAML document model concepts
  - G-003 structural path resolution and parent resolution public contracts
  - G-005/T-002 mutation contract models
  may_be_used_by:
  - G-005 batch dispatch and rollback step
  - G-007 checked write pipeline
public_contracts_provided:
- delete operation implementation
operation_policy:
  delete:
    purpose: Delete an existing mapping key or sequence item selected by structural
      path.
    changed_paths_rule: Report the normalized deleted path and any parent-path convention
      required by the shared mutation contract.
    invalid_targets: Return typed failure for missing, ambiguous, unsupported, or
      unsafe root-delete targets.
  mapping_key_delete:
    requirement: Remove only the selected key from its parent mapping.
    non_goal: Do not reorder or normalize unrelated mapping keys.
  sequence_item_delete:
    requirement: Remove only the selected item index or resolved filtered item from
      its parent sequence.
    non_goal: Do not alter unrelated sequence values beyond natural index shifting
      after deletion.
responsibilities:
- Resolve the selected node and its parent through public path_language contracts.
- Remove only the selected mapping key or sequence item.
- Return typed errors for missing, ambiguous, unsupported, or unsafe delete targets.
- Preserve unrelated document branches, mapping order, and sequence content where
  possible.
implementation_notes:
- This step must not silently ignore missing paths.
- Root/full-document delete is out of scope unless the parent G-005 contract is explicitly
  expanded by a human decision.
- Sequence deletion should use the resolved item index at operation time.
- Batch rollback belongs to a later G-005 tactical step, not here.
verification:
  scope: tactical_completion_gate
  commands:
  - python -m pytest tests/mutations/test_delete_ops.py
  expected:
  - delete removes only the selected mapping key.
  - delete removes only the selected sequence item.
  - Missing, ambiguous, unsupported, or unsafe targets return typed errors.
  - Unrelated document branches remain unchanged.
  - No file I/O, validation, rendering, writer, CLI, or MCP behavior is introduced.
acceptance_criteria:
- delete is implemented independently from set, replace_block, append, move, and batch
  orchestration.
- Every successful delete reports exact normalized changed_paths.
- Invalid delete targets return typed errors defined by the mutation contracts.
- This step edits only its owned code and test paths during implementation.
model_assignment_spec:
  performer: coding_agent
  instruction: Work only on yaml_editor/mutations/delete_ops.py and tests/mutations/test_delete_ops.py.
    Implement pure in-memory delete behavior for mapping keys and sequence items over
    already loaded YAML document objects using public path_language parent resolution
    contracts and G-005 mutation contracts. Do not implement set, replace_block, append,
    move, batch rollback, validation, rendering, file I/O, transaction writing, CLI,
    or MCP wrappers. Do not edit .venv, venv, site-packages, installed dependencies,
    or sibling-owned mutation files.
