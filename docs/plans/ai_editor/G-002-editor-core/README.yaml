executor_brief:
  owns_paths:
  - ai_editor/editor_core/
  - ai_editor/config/
  - ai_editor/writer.py
  - tests/editor_core/
  tree_and_write_orchestration:
    buffer_uses_formatter: AbstractBuffer (C-010) holds one AbstractFormatter (C-021) for buffer lifetime; formatter owns in-memory Tree
    registry: FormatterRegistry (C-012) maps extension/name -> formatter class; registration at HooksRegister startup
    writer_split:
      write_buf: session .buf files only (atomic, no backup)
      write_result: local derived artifacts (backup + atomic + read-back)
      project_files: never written locally — CodeAnalysisClient.upload_content only
    write_pipeline: disk commit path runs through formatter.write() (C-068); session buf updates use Writer.write_buf separately on each mutation
  explicit_non_scope:
  - buffer open/close/save lifecycle (session layer)
  - session git, clipboard, ses_settings
  - sidecar persistence timing (session writes Sidecar after mutation; formatter defines Sidecar format)
  ca_client: single gateway for all project file I/O; FileLock under external ca_session_id
cascade_note: changed — recheck for base-class tree ownership + write orchestration; I1c source_ranges audited 2026-05-21; cycle_2 triple-autonomy 2026-05-21
