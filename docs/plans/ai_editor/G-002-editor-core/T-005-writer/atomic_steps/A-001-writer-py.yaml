  suffix=\".tmp\")\n        try:\n            os.write(fd, encoded)\n            os.fsync(fd)\n\
  \        finally:\n            os.close(fd)\n        os.replace(tmp, path)\n\n \
  \   def write_result(\n        self,\n        content: str | bytes,\n        path:
