  with the following exact content:\n\n```python\n\"\"\"Writer — local disk write
  utilities for session buf files and derived artifacts.\n\nWriter has two distinct
  responsibilities:\n  write_buf: atomic write for session buf files only; no backup.\n\
  \  write_result: backup + atomic write + read-back for local derived artifacts only.\n\
  \nNeither method writes project files. Project files are written only via\nCodeAnalysisClient.upload_content.\n\
  \"\"\"\nfrom __future__ import annotations\n\nimport os\nimport shutil\nimport tempfile\n\
  from pathlib import Path\nfrom typing import Any\n\n\nclass Writer:\n    \"\"\"\
  Local disk write utilities for session buf files and derived artifacts.\n\n    Neither
  write_buf nor write_result writes project files. Project files\n    are written
  only via CodeAnalysisClient.upload_content.\n    \"\"\"\n\n    def write_buf(self,
  content: str | bytes, path: Path) -> None:\n        \"\"\"Atomically write content
  to a session buf file.\n\n        No backup is created. Uses a temp file + os.replace
  for atomicity.\n\n        Args:\n            content: String or bytes to write.\n\
  \            path: Absolute path to the destination buf file.\n        \"\"\"\n\
  \        path.parent.mkdir(parents=True, exist_ok=True)\n        encoded = content.encode(\"\
