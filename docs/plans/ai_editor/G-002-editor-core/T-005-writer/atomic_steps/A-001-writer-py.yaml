  \          3. Read back the written file and return its text content.\n\n      \
  \  Args:\n            content: String or bytes to write.\n            path: Absolute
  path to the destination artifact file.\n            backup_suffix: Suffix for the
  backup copy. Default '.bak'.\n\n        Returns:\n            The text content read
  back from path after writing.\n        \"\"\"\n        path.parent.mkdir(parents=True,
  exist_ok=True)\n        backup = path.with_suffix(path.suffix + backup_suffix)\n\
  \        if path.exists():\n            shutil.copy2(path, backup)\n        encoded
  = content.encode(\"utf-8\") if isinstance(content, str) else content\n        fd,
  tmp = tempfile.mkstemp(dir=path.parent, suffix=\".tmp\")\n        try:\n       \
  \     os.write(fd, encoded)\n            os.fsync(fd)\n        finally:\n      \
  \      os.close(fd)\n        os.replace(tmp, path)\n        return path.read_text(encoding=\"\
