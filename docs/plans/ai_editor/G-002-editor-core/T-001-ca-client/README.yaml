step_id: T-001
parent_global_step: G-002
name: Code analysis server client — download, upload, advisory lock
status: draft
description: "Create CodeAnalysisClient — the single HTTP gateway for all CA server
  calls. No other module reads or writes project files directly from disk. Implements:
  download_file (chunked + SHA-256 verify + lock acquire), upload_file (chunked +
  unlock_after_write), advisory_lock_batch, advisory_unlock, release_all_locks_for_session,
  list_project_files, list_backup_versions, restore_backup_file, file_lock_status.
  Auth: mTLS (default) or HTTPS+token (token read from env, never cached).\n"
