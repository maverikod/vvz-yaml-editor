  type: ai_editor.contracts
  description: ResultEnvelope, ErrorCode, Diagnostic importable from 
    ai_editor.contracts.
- name: CodeAnalysisServerConfig
  type: G-002/T-002 output
  description: "CodeAnalysisServerConfig from ai_editor.config.config_section. May
    not exist yet; use TYPE_CHECKING import if needed.\n"
outputs:
- name: ai_editor/editor_core/ca_client.py
  type: file
  description: "CodeAnalysisClient class. Constructor: CodeAnalysisClient(config:
    CodeAnalysisServerConfig). Public methods: download_file, upload_file, list_project_files,
    list_backup_versions, restore_backup_file, advisory_lock_batch, advisory_unlock,
    release_all_locks_for_session, file_lock_status. download_file returns tuple(bytes,
