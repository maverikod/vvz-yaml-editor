  File content to create exactly:
  ```python
  """AiEditorConfigGenerator writes validated config atomically."""
  from __future__ import annotations

  import json
  import os
  from pathlib import Path
  from typing import Any

  from mcp_proxy_adapter.core.config.simple_config_generator import SimpleConfigGenerator

  from ai_editor.config.config_validator import AiEditorConfigValidator


  class ConfigGenerationError(RuntimeError):
      """Raised when generated config fails ai_editor validation."""

      def __init__(self, errors: list[str]):
          self.errors = errors
          super().__init__("; ".join(errors))


  class AiEditorConfigGenerator(SimpleConfigGenerator):
      """Generate config and append ai_editor/code_analysis_server sections."""

      def generate(self, protocol: str, out_path: str = "config.json", **kwargs: Any) -> str:
          """Generate config via adapter, validate it, then atomically replace output."""
          out_file = Path(out_path)
          tmp_file = Path(f"{out_path}.tmp")

          small_file_threshold = kwargs.pop("small_file_threshold", "50kb")
          small_file_formatter = kwargs.pop("small_file_formatter", "text")
          sessions_base_dir = kwargs.pop("sessions_base_dir", "/tmp/ai_editor_sessions")

          ca_host = kwargs.pop("ca_host", "localhost")
          ca_port = kwargs.pop("ca_port", 15000)
          ca_protocol = kwargs.pop("ca_protocol", protocol)
          ca_servername = kwargs.pop("ca_servername", None)
          ca_check_hostname = kwargs.pop("ca_check_hostname", True)
          ca_ssl = kwargs.pop("ca_ssl", None)
          ca_auth_use_token = kwargs.pop("ca_auth_use_token", False)
          ca_auth_token_env = kwargs.pop("ca_auth_token_env", None)

          try:
              super().generate(protocol=protocol, out_path=str(tmp_file), **kwargs)
              raw = json.loads(tmp_file.read_text(encoding="utf-8"))

              raw.setdefault("ai_editor", {})
              raw["ai_editor"].setdefault("formatter", {})
              raw["ai_editor"]["formatter"]["small_file_threshold"] = small_file_threshold
              raw["ai_editor"]["formatter"]["small_file_formatter"] = small_file_formatter
              raw["ai_editor"].setdefault("sessions", {})
              raw["ai_editor"]["sessions"]["base_dir"] = sessions_base_dir

              raw.setdefault("code_analysis_server", {})
              raw["code_analysis_server"]["host"] = ca_host
              raw["code_analysis_server"]["port"] = ca_port
              raw["code_analysis_server"]["protocol"] = ca_protocol
              raw["code_analysis_server"]["servername"] = ca_servername
              raw["code_analysis_server"]["check_hostname"] = ca_check_hostname
              raw["code_analysis_server"]["ssl"] = ca_ssl
              raw["code_analysis_server"].setdefault("auth", {})
              raw["code_analysis_server"]["auth"]["use_token"] = ca_auth_use_token
              raw["code_analysis_server"]["auth"]["token_env"] = ca_auth_token_env

              validation_errors = AiEditorConfigValidator(config_path=str(tmp_file)).validate(raw)
              if validation_errors:
                  raise ConfigGenerationError(
                      [getattr(err, "message", str(err)) for err in validation_errors]
                  )

              tmp_file.write_text(
                  json.dumps(raw, indent=2, ensure_ascii=False),
                  encoding="utf-8",
              )
              out_file.parent.mkdir(parents=True, exist_ok=True)
              os.replace(tmp_file, out_file)
              return str(out_file)
          except ConfigGenerationError:
              if tmp_file.exists():
                  tmp_file.unlink()
              raise
          except Exception:
              if tmp_file.exists():
                  tmp_file.unlink()
              raise
  ```
