step_id: T-004
parent_global_step: G-002
name: Config generator — AiEditorConfigGenerator
status: draft
description: "Create AiEditorConfigGenerator inheriting SimpleConfigGenerator from
  mcp_proxy_adapter. generate(protocol, out_path, **kwargs) must: (1) call super().generate()
  writing to a temp file (out_path + \".tmp\"), NOT to out_path directly; (2) read
  temp file, append ai_editor and code_analysis_server sections from kwargs with sensible
  defaults; (3) run AiEditorConfigValidator on temp file content; on validation errors
  delete temp file and raise ConfigGenerationError; (4) on success os.replace(tmp,
  out_path) atomically. ConfigGenerationError is a RuntimeError subclass carrying
  list of validation errors. Not used at runtime; developer utility for initial setup
  only.\n"
concepts:
- C-019
inputs:
- name: T-002 output
  type: ai_editor.config.config_section
  description: AiEditorConfig and CodeAnalysisServerConfig must be importable.
- name: T-003 output
  type: ai_editor.config.config_validator
  description: AiEditorConfigValidator must be importable.
- name: SimpleConfigGenerator
  type: mcp_proxy_adapter.core.config.simple_config_generator
  description: SimpleConfigGenerator from mcp_proxy_adapter; called via 
    super().generate().
outputs:
- name: ai_editor/config/config_generator.py
  type: file
  description: "AiEditorConfigGenerator(inherits SimpleConfigGenerator) with generate(protocol:
    str, out_path: str = \"config.json\", **kwargs) -> str. ConfigGenerationError(RuntimeError)
    carrying list of errors. generate() writes to temp first, validates, renames on
    success, deletes temp and raises on failure. Returns out_path on success.\n"
atomic_steps:
- A-001
