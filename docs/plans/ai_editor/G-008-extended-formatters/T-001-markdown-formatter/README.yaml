step_id: T-001
parent_global_step: G-008
name: MarkdownFormatter — mistune AST, MdNode model, parse/render/skeleton
status: frozen
description: "Implement MarkdownFormatter using mistune>=3.0. This step covers the\n\
  foundational layer: parse, render, render_skeleton, address resolution,\nget_unit,
  iter_units. Mutation and clipboard in T-002.\n\nLibrary choice rationale (see source_spec.md
  G-008 Part 1):\n  mistune>=3.0: pure Python, AST renderer, GFM support, active maintenance.\n\
  \nMdNode dataclass fields:\n  node_type: str (heading|paragraph|code_block|list|list_item|blockquote|\n\
  \             thematic_break|html_block|table|table_head|table_body|\n         \
  \    table_row|image|link)\n  level: int | None (heading level 1-6)\n  content:
  str (raw text content)\n  children: list[MdNode]\n  attrs: dict (url, alt, lang,
  etc.)\n  source_pos: tuple[int,int] | None\n\ndocument model: list[MdNode] (top-level
  nodes only; children nested)\n\nAddress model:\n  int: top-level node index\n  \"\
  heading:<text>\": first heading whose content matches text\n  \"N.M\": Nth top-level
  node, Mth child\n  None: whole document (mutate_replace_block only)\n\nrender_skeleton
  rules:\n  - Headings: \"# Heading text\" (level indicator)\n  - Paragraphs: first
  60 chars + \" # N chars\" if longer\n  - Code blocks: \"```<lang>\\n<first line>\\
  n... N lines\"\n  - Lists: \"- [N items] item1 | item2 | item3...\"\n  - Tables:
  \"| col1 | col2 | ... | (N rows)\"\n  - Images: \"![alt](url)\"\n  - Links: \"[text](url)\"\
  \n\nvalidate_document: mistune parse round-trip structural check.\nAll Markdown
  is syntactically valid; validation only checks structural\nround-trip (not byte-identical).\n\
  \nRegistered extensions: .md .markdown (overrides TextFormatter).\n"
