  MarkdownFormatter(AbstractFormatter):\n  formatter_name = \"markdown\"\n  registered_extensions
  = [\".md\", \".markdown\"]\n\nModule-level helper _token_to_mdnode(tok: dict) ->
  MdNode:\n  Dispatches on tok[\"type\"]: heading->MdNode(node_type=\"heading\",content=joined
  children raw,level=attrs.level,attrs=tok.attrs,source_pos=tok.position,children=recursive);
  paragraph->MdNode(node_type=\"paragraph\",content=joined children raw); code/block_code->MdNode(node_type=\"\
