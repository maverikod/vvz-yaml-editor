  thematic_break->MdNode(node_type=\"thematic_break\",content=\"---\"); block_html->MdNode(node_type=\"\
  html_block\",attrs={\"_content\":tok.raw}); table->MdNode(node_type=\"table\",children=recursive);
  image->MdNode(node_type=\"image\",attrs=tok.attrs); link->MdNode(node_type=\"link\"\
