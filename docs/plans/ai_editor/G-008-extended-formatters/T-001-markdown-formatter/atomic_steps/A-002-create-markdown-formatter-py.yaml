  \nModule-level helper _node_display(n: MdNode) -> str:\n  heading: \"#\"*level +
  \" \" + content (max 80 chars); paragraph: content[:60] + \" # N chars\" if >60;
  code_block: \"```\"+info+\"\\n\"+content[:40]; list: \"- [N items]\"; table: \"\
