prompt: "Project: ai_editor. File: ai_editor/contracts/diagnostic.py. Operation: create_file.\n\
  \nMRS concept C-003 (Diagnostic): Structured diagnostic message produced by validation\n\
  or error handling, carrying a code, human message, optional path, and detail dict.\n\
  Fields: code: str, message: str, path: str | None, details: dict.\nThe class must
  be a frozen dataclass (immutable after construction).\n\nCreate the directory ai_editor/contracts/
  if it does not exist.\nThen create the file ai_editor/contracts/diagnostic.py with
  the following exact content:\n\n```python\n\"\"\"Diagnostic dataclass for structured
  validation and error messages.\"\"\"\nfrom __future__ import annotations\n\nfrom
  dataclasses import dataclass, field\nfrom typing import Any\n\n\n@dataclass(frozen=True)\n\
  class Diagnostic:\n    \"\"\"Structured diagnostic message from validation or error
  handling.\n\n    Attributes:\n        code: Stable error code string identifying
  the diagnostic type.\n        message: Human-readable description of the diagnostic.\n\
  \        path: Optional dot-separated or slash-separated location within\n     \
  \       the document where the diagnostic applies. None if not applicable.\n   \
  \     details: Additional key-value diagnostic fields. Empty dict by default.\n\
  \    \"\"\"\n\n    code: str\n    message: str\n    path: str | None = None\n  \
  \  details: dict[str, Any] = field(default_factory=dict)\n```\n\nIf the file already
  exists, overwrite it entirely with the content above."
