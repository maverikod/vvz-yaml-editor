  ,\n    \"jsonschema>=4.0.0\",\n    \"libcst>=1.1.0\",\n    \"lark>=1.1.0\",\n  \
  \  \"gitpython>=3.1.0\",\n    \"cryptography>=41.0.0\",\n    \"mistune>=3.0.0\"\
  ,\n    \"lxml>=5.0.0\",\n    \"beautifulsoup4>=4.12.0\",\n]\n\n[project.scripts]\n\
