name: aiedmgr service manager script
status: draft
description: 'Create scripts/aiedmgr Python script with five subcommands: start: (1)
  SimpleConfig(config).load() -> model; (2) AiEditorConfigValidator .validate(model.raw)
  — CRITICAL: takes model.raw not empty dict; abort on errors; (3) subprocess.Popen
  launching ai_editor.main with log redirect; (4) write PID file; (5) wait 2s and
  check process still running. stop: read PID, SIGTERM, wait up to 30s, SIGKILL if
  still running, remove PID. status: read PID, os.kill(pid, 0) to check liveness.
  restart: stop then start. generate-config: AiEditorConfigGenerator.generate(protocol,
  out_path); ConfigGenerationError -> print errors, exit 1. PID file default: ai_editor.pid.
  Log file: logs/ai_editor.log. Config from --config arg or AI_EDITOR_CONFIG env var.

  '
