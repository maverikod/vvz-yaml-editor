prompt: "Project: ai_editor. Tactical step: parent tactical step. File: scripts/aiedmgr. Operation: create_file.\n\nFive subcommands: start, stop, status, restart, generate-config. start validates SimpleConfig.load().raw via AiEditorConfigValidator before Popen. PID file ai_editor.pid; log logs/ai_editor.log; 30s SIGTERM then SIGKILL.\n\nCreate with exact content:\n\n```python\n#!/usr/bin/env python3\n\"\"\"Service manager for ai_editor — start/stop/status/restart/generate-config.\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nimport os\nimport signal\nimport subprocess\nimport sys\nimport time\nfrom pathlib import Path\n\nfrom mcp_proxy_adapter.core.config.simple_config import SimpleConfig\n\nfrom ai_editor.config.config_generator import AiEditorConfigGenerator, ConfigGenerationError\nfrom ai_editor.config.config_validator import AiEditorConfigValidator\n\nDEFAULT_PID = \"ai_editor.pid\"\nDEFAULT_LOG = \"logs/ai_editor.log\"\n\n\ndef _config_path(args: argparse.Namespace)\
  \ -> str:\n    return args.config or os.environ.get(\"AI_EDITOR_CONFIG\", \"config.json\")\n\n\ndef _read_pid(pid_file: Path) -> int | None:\n    if not pid_file.exists():\n        return None\n    try:\n        return int(pid_file.read_text(encoding=\"utf-8\").strip())\n    except ValueError:\n        return None\n\n\ndef cmd_start(args: argparse.Namespace) -> None:\n    config_path = _config_path(args)\n    model = SimpleConfig(config_path).load()\n    errors = AiEditorConfigValidator().validate(model.raw)\n    if errors:\n        for e in errors:\n            print(e, file=sys.stderr)\n        sys.exit(1)\n    pid_file = Path(args.pid_file)\n    log_path = Path(args.log_file)\n    log_path.parent.mkdir(parents=True, exist_ok=True)\n    log_fh = open(log_path, \"a\", encoding=\"utf-8\")\n    proc = subprocess.Popen(\n        [sys.executable, \"-m\", \"ai_editor.main\", \"--config\", config_path],\n        stdout=log_fh,\n        stderr=subprocess.STDOUT,\n    )\n    pid_file.write_text(str(proc.pid),\
  \ encoding=\"utf-8\")\n    time.sleep(2)\n    if proc.poll() is not None:\n        print(\"ai_editor failed to start; see log\", file=sys.stderr)\n        sys.exit(1)\n    print(f\"started pid={proc.pid}\")\n\n\ndef cmd_stop(args: argparse.Namespace) -> None:\n    pid_file = Path(args.pid_file)\n    pid = _read_pid(pid_file)\n    if pid is None:\n        print(\"not running\")\n        return\n    os.kill(pid, signal.SIGTERM)\n    for _ in range(30):\n        try:\n            os.kill(pid, 0)\n        except OSError:\n            pid_file.unlink(missing_ok=True)\n            print(\"stopped\")\n            return\n        time.sleep(1)\n    os.kill(pid, signal.SIGKILL)\n    pid_file.unlink(missing_ok=True)\n    print(\"killed\")\n\n\ndef cmd_status(args: argparse.Namespace) -> None:\n    pid = _read_pid(Path(args.pid_file))\n    if pid is None:\n        print(\"stopped\")\n        sys.exit(1)\n    try:\n        os.kill(pid, 0)\n    except OSError:\n        print(\"stopped (stale pid file)\"\
  )\n        sys.exit(1)\n    print(f\"running pid={pid}\")\n\n\ndef cmd_restart(args: argparse.Namespace) -> None:\n    cmd_stop(args)\n    cmd_start(args)\n\n\ndef cmd_generate_config(args: argparse.Namespace) -> None:\n    gen = AiEditorConfigGenerator()\n    try:\n        gen.generate(args.protocol, args.out_path)\n    except ConfigGenerationError as exc:\n        for e in exc.errors:\n            print(e, file=sys.stderr)\n        sys.exit(1)\n    print(f\"wrote {args.out_path}\")\n\n\ndef main() -> None:\n    parser = argparse.ArgumentParser(prog=\"aiedmgr\")\n    parser.add_argument(\"--config\", default=None)\n    parser.add_argument(\"--pid-file\", default=DEFAULT_PID)\n    parser.add_argument(\"--log-file\", default=DEFAULT_LOG)\n    sub = parser.add_subparsers(dest=\"command\", required=True)\n    sub.add_parser(\"start\")\n    sub.add_parser(\"stop\")\n    sub.add_parser(\"status\")\n    sub.add_parser(\"restart\")\n    p = sub.add_parser(\"generate-config\")\n    p.add_argument(\"\
  protocol\", choices=[\"https\", \"mtls\"])\n    p.add_argument(\"out_path\")\n    args = parser.parse_args()\n    {\n        \"start\": cmd_start,\n        \"stop\": cmd_stop,\n        \"status\": cmd_status,\n        \"restart\": cmd_restart,\n        \"generate-config\": cmd_generate_config,\n    }[args.command](args)\n\n\nif __name__ == \"__main__\":\n    main()```"
