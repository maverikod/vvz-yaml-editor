name: main.py startup sequence
status: draft
description: "Create main.py implementing the full ai_editor startup sequence (six\
  \ steps):\n(1) model = SimpleConfig(config_path).load() via adapter's own config\
  \ reader.\n(2) errors = AiEditorConfigValidator().validate(model.raw);\n    if any\
  \ errors: log and sys.exit(1).\n(3) ai_cfg = AiEditorConfig.from_config_json(config_path);\n\
  \    ca_cfg = CodeAnalysisServerConfig.from_config_json(config_path);\n    from\
  \ ai_editor.api_init import init_api;\n    init_api(ai_cfg, ca_cfg, formatter_registry)\n\
  \    — builds CAClient and SessionManager singletons, runs startup_sweep.\n(4) app\
  \ = create_app(app_config=model.raw, config_path=config_path)\n    — adapter creates\
  \ ASGI app and handles proxy registration.\n(5) register_custom_commands_hook(register_ai_editor_commands).\n\
  (6) runner = UnifiedServerRunner(); runner.run_server(app, server_config).\n\nConfig\
  \ path from --config arg or AI_EDITOR_CONFIG env var, default config.json.\nai_editor\
  \ NEVER implements HTTP routes or handlers.\nProxy registration controlled by config\
  \ (auto_on_startup), not hardcoded;\n5 retries with exponential backoff; if proxy\
  \ unreachable server still starts.\n"
