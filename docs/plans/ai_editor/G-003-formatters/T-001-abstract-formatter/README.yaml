description: "Implement AbstractFormatter base class (C-021) owning in-memory Tree
  (C-063) of TreeNode (C-064), stable_id assignment and integrity (C-031), all structural
  and fragment operations, navigation, generic Sidecar production (C-032), WritePipeline
  orchestration (C-068), and list_commands() returning FormatterCommandCatalog (C-022;
  catalog datatypes from ai_editor.formatters.catalog). Base implements: open_tree
  (subclass parse, base assigns stable_ids, build or update session-side generic sidecar),
  export, render_skeleton, normalize_address, get_unit, iter_units, match_unit, compare_units,
  diagnostics, insert/delete/move/replace_node, mutate_batch, multiple_replace, copy/cut/paste_fragment,
  write (export, diff preview, temp file, subclass linters, atomic rename). Subclass
  abstract hooks only: parse, render, node_from_source, node_to_source, linters. stable_id
  assigned and preserved by base only; subclasses never assign, read, or depend on
  stable_ids. FormatterUnit address = stable_id. Generic Sidecar (C-032): session-side
  <session_dir>/<buffer_id>.tree after every mutation; project-side <dir>/.tree/<stem>.tree
  on save; header TREE_V1 fmt=<formatter_name> sha256=<source_sha256> tree_sha256=<tree_body_sha256>;
  JSON body serialising stable_id node map; atomic write; load validates source_sha256
  (mismatch rebuilds from source). list_commands() assembles FormatterCommandCatalog
  using FormatterCommandMetadata from catalog module. C-066 SourceOfTruth and C-067
  AutoCreateTree are owned by G-005 session layer, not this tactical step. MUTATION
  INVARIANTS: mutate_batch and multiple_replace use all-or-nothing rollback (MUTATION_ROLLBACK
  on any op failure). Each single structural op (insert/delete/move/replace_node)
  runs post-mutation validation (parse + tree invariants); on failure rolls back that
  op only (MUTATION_ROLLBACK). write() runs step-0 pre-write validation before diff
  preview (PRE_WRITE_VALIDATION_FAILED on error). INVALIDONOPEN (C-069): when AbstractFormatter
  cannot parse file at open, format_group falls back to text; is_invalid=True; model
  receives warning; commit blocked until re-parse succeeds; on success format_group
  restored. VIEWER INVARIANTS (NQ-005 / NQ-006 / NQ-008, see viewer_features.yaml):
  (NQ-008 no-self-content-child) get_unit / render_skeleton must never produce a synthetic
  block that duplicates the focus node body — if focus has children, return children
  as block_set; a scalar focus with no children returns total_blocks=0 and blocks=[].
  (NQ-006 resolved: option B) Both YamlFormatter and JsonFormatter surface scalar
  values inline in mapping children via attributes.value — specified in T-004 and
  T-013. (NQ-005 YAML heuristic start_line) When tree metadata lacks start_line for
  a node, use heuristic key-search in source: regex r'^\\s*{last_part}\\s*:' for string
  keys, r'^\\s*[\\\"\\']{last_part}[\\\"\\'\\]\\s*:' for quoted keys, first '- ' line
  for numeric last_part — specified in T-004 yaml_address.py. (NQ-001 full_text_threshold)
  AbstractFormatter exposes full_text_max_lines: int = 200; when file line count is
  below threshold render_skeleton returns full annotated file content with all stable_id
  markers intact; editing via markers is unchanged."
