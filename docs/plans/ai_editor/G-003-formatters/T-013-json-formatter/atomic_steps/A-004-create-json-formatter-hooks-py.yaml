  ```

  Tree shape (all nodes leave stable_id="" — base assigns later):
  - node_kind values: "root", "mapping", "sequence", "scalar" only.
  - root: single child representing document top-level value (mapping, sequence, or scalar). root display_text="(json document)"; start_line=1; end_line=1; metadata={}.
  - mapping: metadata={}; children ordered by dict insertion order; each child is an "entry" pseudo-structure OR map each entry as scalar key node — use this rule: mapping node's children are value nodes only; each value child metadata includes {"key": "<str>"} identifying its dict key.
  - sequence: metadata={}; children are element nodes in order; each child metadata includes {"index": int}.
  - scalar: metadata={"value": <python value>, "json_type": "string"|"number"|"boolean"|"null"}; children=[]; display_text = truncated json.dumps of value max 120 chars.

  Private module helpers (allowed):
  - `_DISPLAY_MAX = 120`
  - `_scalar_display(value) -> str`
  - `_json_type(value) -> str`
  - `_value_to_node(value, *, key: str | None = None, index: int | None = None) -> TreeNode`
  - `_node_to_value(node: TreeNode) -> Any`
  - `_build_root_node(value: Any) -> TreeNode`

  Method requirements:

  ```python
  def parse(self, raw_content: str) -> TreeNode:
      """json.loads raw_content; wrap in root TreeNode via _build_root_node. Raise ValueError with message prefix 'JSON parse error:' on JSONDecodeError."""

  def render(self, tree: Tree) -> str:
      """Serialize tree.root via _node_to_value then json.dumps(..., indent=2, ensure_ascii=False) + trailing newline."""

  def node_from_source(self, raw_block: str) -> TreeNode:
      """Parse JSON fragment; return mapping|sequence|scalar node (NOT root wrapper). Strip leading/trailing whitespace before parse."""

  def node_to_source(self, node: TreeNode) -> str:
      """Return JSON text for node subtree: json.dumps(_node_to_value(node), indent=2, ensure_ascii=False). Raise ValueError for unknown node_kind."""

  def linters(self) -> list[Linter]:
      """Return two callables: (1) _lint_json_parse path->ValidationResult reads file text and json.loads; (2) _lint_jsonschema optional — if self._schema is None return success immediately; else lazy-import jsonschema and validate parsed file against self._schema; ImportError -> success (optional). Diagnostics use codes JSON_PARSE_FAILED and SCHEMA_VALIDATION_FAILED."""
  ```

