  ```python
  def json_validate_document(
      doc: Any,
      schema: dict[str, Any] | None = None,
      options: dict[str, Any] | None = None,
  ) -> ValidationResult:
      """
      Validate JSON document.

      - If doc is str: attempt json.loads; on JSONDecodeError return ValidationResult(success=False, diagnostics=[Diagnostic(code='JSON_PARSE_FAILED', ...)])
      - If doc is not str: treat as already-parsed JSON value; verify json.dumps(doc) succeeds (JSON-serializable).
      - options may contain {'require_schema': bool}. When schema is not None and jsonschema is importable, validate with jsonschema.Draft7Validator; on ImportError and require_schema True return failure SCHEMA_NOT_FOUND; on ImportError and require_schema False skip schema check.
      - Schema validation errors produce Diagnostic(code='SCHEMA_VALIDATION_FAILED', message=..., path=json pointer or '', details={'validator': ...}).
      - Success returns ValidationResult(success=True, diagnostics=[]).
      """


  def json_match_unit(unit: FormatterUnit, query: dict[str, Any]) -> bool:
      """
      Match FormatterUnit against query dict.

      Supported query keys (all optional; all provided keys must match):
      - contains_text: str — case-insensitive substring of unit.display_text
      - node_type: str — must equal unit.unit_kind
      - metadata_key: str — key must exist in unit.metadata
      - metadata_value: Any — if metadata_key also set, unit.metadata[metadata_key] must equal this value; if only metadata_value, any metadata value must equal it
      Return True when all provided constraints pass; False otherwise.
      """


  def json_compare_units(
      unit_a: FormatterUnit,
      unit_b: FormatterUnit,
      options: dict[str, Any] | None = None,
  ) -> ComparisonResult:
      """
      Compare two units. options may contain ignore_metadata: bool (default False).

      equal when unit_kind matches and:
      - ignore_metadata False: address, unit_kind, display_text, metadata all equal
      - ignore_metadata True: address, unit_kind, display_text equal

      details always includes keys: address_a, address_b, unit_kind_a, unit_kind_b, metadata_equal (bool).
      """
  ```

