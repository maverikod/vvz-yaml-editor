prompt: "Project: ai_editor. Tactical step: T-013 JsonFormatter (C-028). File: ai_editor/formatters/json/validation.py. Operation: create_file.\n\nMRS excerpts:\n- C-028 JsonFormatter: linters [json_parse, jsonschema_optional]; no comment preservation.\n- C-021 AbstractFormatter: base owns match_unit/compare_units defaults; JsonFormatter overrides delegate here.\n\nContracts (inline signatures — Use only the inlined excerpts below, not live imports from the codebase.):\n```python\nfrom dataclasses import dataclass, field\nfrom typing import Any\n\n@dataclass(frozen=True)\nclass Diagnostic:\n    code: str\n    message: str\n    path: str | None = None\n    details: dict[str, Any] = field(default_factory=dict)\n\n@dataclass\nclass ValidationResult:\n    success: bool\n    diagnostics: list[Diagnostic] = field(default_factory=list)\n\n@dataclass\nclass FormatterUnit:\n    address: str\n    unit_kind: str\n    display_text: str\n    metadata: dict[str, Any] = field(default_factory=dict)\n\n\
  @dataclass\nclass ComparisonResult:\n    equal: bool\n    details: dict[str, Any] = field(default_factory=dict)\n```\n\nImports to use:\n```python\nfrom __future__ import annotations\n\nimport json\nfrom typing import Any\n\nfrom ai_editor.contracts.diagnostic import Diagnostic\nfrom ai_editor.contracts.results import ValidationResult\nfrom ai_editor.formatters.base import ComparisonResult, FormatterUnit\n```\n\nImplement exactly these public functions (NO json_validate_content function):\n\n```python\ndef json_validate_document(\n    doc: Any,\n    schema: dict[str, Any] | None = None,\n    options: dict[str, Any] | None = None,\n) -> ValidationResult:\n    \"\"\"\n    Validate JSON document.\n\n    - If doc is str: attempt json.loads; on JSONDecodeError return ValidationResult(success=False, diagnostics=[Diagnostic(code='JSON_PARSE_FAILED', ...)])\n    - If doc is not str: treat as already-parsed JSON value; verify json.dumps(doc) succeeds (JSON-serializable).\n    - options may contain\
  \ {'require_schema': bool}. When schema is not None and jsonschema is importable, validate with jsonschema.Draft7Validator; on ImportError and require_schema True return failure SCHEMA_NOT_FOUND; on ImportError and require_schema False skip schema check.\n    - Schema validation errors produce Diagnostic(code='SCHEMA_VALIDATION_FAILED', message=..., path=json pointer or '', details={'validator': ...}).\n    - Success returns ValidationResult(success=True, diagnostics=[]).\n    \"\"\"\n\n\ndef json_match_unit(unit: FormatterUnit, query: dict[str, Any]) -> bool:\n    \"\"\"\n    Match FormatterUnit against query dict.\n\n    Supported query keys (all optional; all provided keys must match):\n    - contains_text: str — case-insensitive substring of unit.display_text\n    - node_type: str — must equal unit.unit_kind\n    - metadata_key: str — key must exist in unit.metadata\n    - metadata_value: Any — if metadata_key also set, unit.metadata[metadata_key] must equal this value; if only metadata_value,\
  \ any metadata value must equal it\n    Return True when all provided constraints pass; False otherwise.\n    \"\"\"\n\n\ndef json_compare_units(\n    unit_a: FormatterUnit,\n    unit_b: FormatterUnit,\n    options: dict[str, Any] | None = None,\n) -> ComparisonResult:\n    \"\"\"\n    Compare two units. options may contain ignore_metadata: bool (default False).\n\n    equal when unit_kind matches and:\n    - ignore_metadata False: address, unit_kind, display_text, metadata all equal\n    - ignore_metadata True: address, unit_kind, display_text equal\n\n    details always includes keys: address_a, address_b, unit_kind_a, unit_kind_b, metadata_equal (bool).\n    \"\"\"\n```\n\nModule docstring: \"JSON document validation and FormatterUnit matching for ai_editor JsonFormatter.\"\n\nConstraints: file under 200 lines; use lazy try/import for jsonschema inside json_validate_document only; do NOT define json_validate_content; no Tree imports.\n"
