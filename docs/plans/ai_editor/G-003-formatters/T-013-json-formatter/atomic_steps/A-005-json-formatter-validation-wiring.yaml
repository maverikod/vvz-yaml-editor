  Add imports:
  ```python
  from ai_editor.formatters.base import AbstractFormatter, ComparisonResult, FormatterUnit, Linter
  from ai_editor.formatters.json.validation import (
      json_compare_units,
      json_match_unit,
      json_validate_document,
  )
  ```

  Add these methods to JsonFormatter (override base defaults):

  ```python
  def validate_document(
      self,
      schema: dict[str, Any] | None = None,
      options: dict[str, Any] | None = None,
  ) -> ValidationResult:
      """Validate current tree as JSON. Uses self._tree; returns ValidationResult(success=False) with diagnostic when no tree loaded. Serialize via _node_to_value(self._tree.root) then json_validate_document(data, schema or self._schema, options)."""

  def match_unit(self, unit: FormatterUnit, query: dict[str, Any]) -> bool:
      return json_match_unit(unit, query)

  def compare_units(
      self,
      unit_a: FormatterUnit,
      unit_b: FormatterUnit,
      options: dict[str, Any] | None = None,
  ) -> ComparisonResult:
      return json_compare_units(unit_a, unit_b, options)

  def diagnostics(self, tree: Tree | None = None) -> list[Diagnostic]:
      """Run json_validate_document on active tree (tree arg or self._tree). Return ValidationResult.diagnostics list (empty when valid)."""
  ```

  Replace entire file with complete merged content (all A-004 code preserved verbatim plus new imports and four methods above). File must remain under 350 lines.

