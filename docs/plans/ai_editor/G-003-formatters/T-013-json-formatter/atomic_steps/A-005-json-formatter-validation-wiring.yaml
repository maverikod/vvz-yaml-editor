prompt: "Project: ai_editor. Tactical step: T-013. File: ai_editor/formatters/json/formatter.py. Operation: modify_file.\n\nPrior state: file exists after lower-priority changes on this file with JsonFormatter class implementing parse, render, node_from_source, node_to_source, linters, constructor with optional schema, and all private tree helpers (_value_to_node, _node_to_value, _build_root_node, _scalar_display, _json_type, linter factories). Do NOT remove or alter any  hook logic.\n\nAdd imports:\n```python\nfrom ai_editor.formatters.base import AbstractFormatter, ComparisonResult, FormatterUnit, Linter\nfrom ai_editor.formatters.json.validation import (\n    json_compare_units,\n    json_match_unit,\n    json_validate_document,\n)\n```\n\nAdd these methods to JsonFormatter (override base defaults):\n\n```python\ndef validate_document(\n    self,\n    schema: dict[str, Any] | None = None,\n    options: dict[str, Any] | None = None,\n) -> ValidationResult:\n    \"\"\"Validate current tree\
  \ as JSON. Uses self._tree; returns ValidationResult(success=False) with diagnostic when no tree loaded. Serialize via _node_to_value(self._tree.root) then json_validate_document(data, schema or self._schema, options).\"\"\"\n\ndef match_unit(self, unit: FormatterUnit, query: dict[str, Any]) -> bool:\n    return json_match_unit(unit, query)\n\ndef compare_units(\n    self,\n    unit_a: FormatterUnit,\n    unit_b: FormatterUnit,\n    options: dict[str, Any] | None = None,\n) -> ComparisonResult:\n    return json_compare_units(unit_a, unit_b, options)\n\ndef diagnostics(self, tree: Tree | None = None) -> list[Diagnostic]:\n    \"\"\"Run json_validate_document on active tree (tree arg or self._tree). Return ValidationResult.diagnostics list (empty when valid).\"\"\"\n```\n\nReplace entire file with complete merged content (all  code preserved verbatim plus new imports and four methods above). File must remain under 350 lines.\n\nConstraints: still do NOT override structural ops, write, list_commands,\
  \ normalize_address, get_unit, iter_units; no imports from address.py or mutations.py yet; no json_validate_content anywhere.\n"
