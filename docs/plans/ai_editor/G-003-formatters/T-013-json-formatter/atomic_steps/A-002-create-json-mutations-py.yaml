  Module-level clipboard (for copy/cut/paste):
  ```python
  _CLIPBOARD: Any | None = None
  ```

  Private helper:
  ```python
  def _deepcopy_document(document: Any) -> Any:
      return copy.deepcopy(document)

  def _parse_json_value(content: Any) -> Any:
      """If content is str, json.loads it; else return content as-is (must be JSON-serializable). Raises ValueError on invalid JSON string."""
  ```

  Public functions — each returns `tuple[Any, list[str]]` where the first element is the (possibly mutated) document deep copy and the second is `changed_paths` (list of normalized address strings affected). On JsonAddressError, let it propagate.

  ```python
  def json_mutate_set(document: Any, address: str, value: Any) -> tuple[Any, list[str]]:
      """Replace value at address with value (deep-copied). changed_paths = [normalized address]."""


  def json_mutate_replace_block(document: Any, address: str, content: Any) -> tuple[Any, list[str]]:
      """Replace subtree at address with parsed content (_parse_json_value). Empty address replaces entire document root. changed_paths = [normalized address or '' for root]."""


  def json_mutate_append(document: Any, address: str, value: Any, *, dedupe: bool = False) -> tuple[Any, list[str]]:
      """Append value to list at address, or insert key into dict at address when value is dict (merge keys). If target is list: append item. If target is dict and value is dict: update/merge keys. dedupe=True on list: skip append when an equal item already present (==). changed_paths = [normalized address]. Raises JsonAddressError(TARGET_TYPE_MISMATCH) for scalar targets."""


  def json_mutate_delete(document: Any, address: str) -> tuple[Any, list[str]]:
      """Remove key or list index at address. changed_paths = [normalized address]."""


  def json_mutate_move(document: Any, source_address: str, target_address: str, position: int | str = "last") -> tuple[Any, list[str]]:
      """Cut subtree at source_address and insert under target. target must resolve to list (append/insert) or dict (merge if moved value is dict, else error). position applies when target is list: 'first'|'last'|int index. changed_paths = sorted unique normalized addresses of source and target. Raises JsonAddressError when move would nest into itself."""
  ```

  Clipboard functions:
  ```python
  def json_copy_fragment(document: Any, address: str) -> tuple[Any, list[str]]:
      """Deep-copy subtree at address into module _CLIPBOARD. Document unchanged. Return (document, [])."""


  def json_cut_fragment(document: Any, address: str) -> tuple[Any, list[str]]:
      """Copy to _CLIPBOARD then delete at address. Return (mutated_document, [normalized address])."""


  def json_paste_fragment(document: Any, target_address: str, position: int | str = "last") -> tuple[Any, list[str]]:
      """Insert _CLIPBOARD content under target_address (same rules as json_mutate_append for list; dict merge for dict target). Raises JsonAddressError with error_code 'CLIPBOARD_EMPTY' if _CLIPBOARD is None. Return (mutated_document, [normalized target_address])."""
  ```

  Mutation semantics:
  - Always work on deep copy of input document; never mutate caller's document in place.
  - Normalize every returned path via normalize_json_address.
  - json_mutate_move: extract value first, delete source, then insert at target.
  - For list paste/append with position: 'first' -> insert(0), 'last' -> append, int -> insert at index.

  Module docstring: "Document-level JSON mutations by structural address for ai_editor JsonFormatter."

