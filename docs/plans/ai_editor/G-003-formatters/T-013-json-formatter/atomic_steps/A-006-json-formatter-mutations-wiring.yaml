prompt: "Project: ai_editor. Tactical step: T-013. File: ai_editor/formatters/json/formatter.py. Operation: modify_file.\n\nPrior state: file exists after lower-priority changes on this file with complete JsonFormatter including  converter hooks, linters, validate_document, match_unit, compare_units, diagnostics, and all private tree helpers.\n\nAdd imports:\n```python\nfrom ai_editor.contracts.results import OperationResult\nfrom ai_editor.contracts.error_codes import ErrorCode\nfrom ai_editor.formatters.json.address import JsonAddressError, resolve_json_address\nfrom ai_editor.formatters.json import mutations as json_mutations\n```\n\nAdd private helpers to JsonFormatter:\n\n```python\ndef _tree_to_document(self) -> Any:\n    \"\"\"Return parsed JSON value from self._tree.root via _node_to_value. Raise RuntimeError if no tree.\"\"\"\n\ndef _apply_document(self, document: Any) -> None:\n    \"\"\"Rebuild self._tree from document using _build_root_node wrapped in Tree; call self._id_index.clear()
            if self._tree:
                self._assign_stable_ids(self._tree.root).\"\
  \"\"\n```\n\nAdd public document-mutation methods (structural-path addresses, NOT stable_id — for legacy/document-level callers):\n\n```python\ndef resolve_address(self, address: str) -> Any:\n    \"\"\"resolve_json_address(self._tree_to_document(), address). Raises JsonAddressError.\"\"\"\n\ndef document_mutate_set(self, address: str, value: Any) -> tuple[list[str], OperationResult]:\n    \"\"\"Call json_mutations.json_mutate_set; _apply_document; return (changed_paths, OperationResult(success=True)). On JsonAddressError return ([], OperationResult(success=False, error_code=ErrorCode.ADDRESS_NOT_FOUND, message=str(exc))).\"\"\"\n\ndef document_mutate_replace_block(self, address: str, content: Any) -> tuple[list[str], OperationResult]:\n    \"\"\"Delegate json_mutations.json_mutate_replace_block; same error/apply pattern.\"\"\"\n\ndef document_mutate_append(self, address: str, value: Any, *, dedupe: bool = False) -> tuple[list[str], OperationResult]:\n    \"\"\"Delegate json_mutations.json_mutate_append.\"\
  \"\"\n\ndef document_mutate_delete(self, address: str) -> tuple[list[str], OperationResult]:\n    \"\"\"Delegate json_mutations.json_mutate_delete.\"\"\"\n\ndef document_mutate_move(self, source: str, target: str, position: int | str = \"last\") -> tuple[list[str], OperationResult]:\n    \"\"\"Delegate json_mutations.json_mutate_move.\"\"\"\n\ndef document_copy_fragment(self, address: str) -> tuple[list[str], OperationResult]:\n    \"\"\"Delegate json_mutations.json_copy_fragment; changed_paths always [].\"\"\"\n\ndef document_cut_fragment(self, address: str) -> tuple[list[str], OperationResult]:\n    \"\"\"Delegate json_mutations.json_cut_fragment.\"\"\"\n\ndef document_paste_fragment(self, target: str, position: int | str = \"last\") -> tuple[list[str], OperationResult]:\n    \"\"\"Delegate json_mutations.json_paste_fragment. Map JsonAddressError CLIPBOARD_EMPTY to ErrorCode.CLIPBOARD_EMPTY.\"\"\"\n```\n\nError mapping for JsonAddressError:\n- error_code PATH_NOT_FOUND -> ErrorCode.ADDRESS_NOT_FOUND\n\
  - error_code PATH_NOT_UNIQUE -> ErrorCode.ADDRESS_AMBIGUOUS\n- error_code PATH_PARSE_FAILED or TARGET_TYPE_MISMATCH -> ErrorCode.ADDRESS_INVALID\n- error_code CLIPBOARD_EMPTY -> ErrorCode.CLIPBOARD_EMPTY\n\nReplace entire file with complete merged content (preserve ALL  and  code plus new imports, helpers, and nine public document_* methods). File must stay at or under 400 lines.\n\nConstraints: do NOT override base structural ops (insert/delete/move/replace_node/copy_fragment/cut_fragment/paste_fragment on stable_id); document_* methods are additive; no json_validate_content.\n"
