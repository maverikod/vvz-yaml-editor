  ```

  Implement:

  def _build_tree_index(
      tree: CSTTree,
      *,
      previous_metadata_map: dict[str, TreeNodeMetadata] | None = None,
      previous_obj_to_id: dict[int, str] | None = None,
      persisted_node_ids: PersistedNodeIds | None = None,
  ) -> None:
  - Clear and rebuild tree.node_map, metadata_map, parent_map; preserve node_id_aliases unless previous_metadata_map is None (then clear aliases).
  - Use MetadataWrapper(tree.module).resolve(PositionProvider, ParentNodeProvider).
  - DFS from module with path_indices starting (0,); assign node_id from persisted_node_ids[path] else previous exact position key else new uuid4.
  - stable_id: from previous meta for same node_id else get_stable_id(node) else node_id.
  - Build TreeNodeMetadata with type, kind, name, qualname, decorators=_get_decorator_names for FunctionDef else (), lines/cols, children_ids, parent_id, docstring copied from previous meta when present.
  - Set tree.root_node_id at depth 0.
  - If previous_obj_to_id: populate node_id_aliases when object id maps to new node_id.

  def load_file_to_tree(file_path: str | Path) -> CSTTree:
  - Read utf-8, strip_persisted_node_ids + strip_inline lines, parse module, CSTTree.create(module).
  - Try project_cst_path sidecar via load_sidecar; when valid and sidecar_matches_built_tree after index with persisted path map + previous sidecar metadata, restore aliases from payload.
  - Else full _build_tree_index.
  - Return tree (NO global registry).

  def create_tree_from_code(source_code: str) -> CSTTree:
  - Strip markers, parse, create, _build_tree_index, return.

  def reload_tree_from_file(tree: CSTTree, file_path: str | Path) -> CSTTree:
  - Re-read file, preserve tree_id, previous metadata as previous_metadata_map, clear aliases, re-index, return same tree object updated.

  Constraints: file under 280 lines; only stdlib + libcst + ai_editor.formatters.cst imports.
