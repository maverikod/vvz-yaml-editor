  Port cst-code cst_tree/tree_range_finder.py adapted to accept CSTTree directly (no global get_tree registry).

  ```python
  """Find CST nodes by source line range."""
  from __future__ import annotations

  from ai_editor.formatters.cst.models import CSTTree
  from ai_editor.formatters.cst.tree_node_metadata import TreeNodeMetadata


  def find_node_by_range(
      tree: CSTTree,
      start_line: int,
      end_line: int,
      prefer_exact: bool = False,
  ) -> TreeNodeMetadata | None:
      """
      Find metadata for the node covering [start_line, end_line] (1-based inclusive).

      Raises ValueError when start_line > end_line.
      When prefer_exact=True, prefer exact start/end match; else smallest spanning node.
      """
      if start_line > end_line:
          raise ValueError(f"Invalid range: start_line ({start_line}) > end_line ({end_line})")
      candidates: list[TreeNodeMetadata] = []
      for meta in tree.metadata_map.values():
          if meta.start_line <= start_line and end_line <= meta.end_line:
              candidates.append(meta)
      if not candidates:
          return None
      if prefer_exact:
          for c in candidates:
              if c.start_line == start_line and c.end_line == end_line:
                  return c
      return min(candidates, key=lambda m: (m.end_line - m.start_line, m.start_line))
  ```

