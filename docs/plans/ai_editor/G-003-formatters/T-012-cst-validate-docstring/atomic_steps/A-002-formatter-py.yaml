prompt: "Project: ai_editor. Tactical step: T-012. File: ai_editor/formatters/cst/formatter.py. Operation: create_file.\n\nImplement CSTFormatter(AbstractFormatter) — converter hooks + CST-specific helpers; structural orchestration delegates to imported CST modules (NOT base overrides for stable_id assignment).\n\nBase API (inline from parent tactical step — Use only the inlined excerpts below, not live imports from the codebase.):\n```python\nfrom ai_editor.formatters.base import AbstractFormatter, FormatterUnit, ComparisonResult, Linter\nfrom ai_editor.contracts.results import ValidationResult\nfrom ai_editor.contracts.diagnostic import Diagnostic\n# AbstractFormatter abstract: parse, render, node_from_source, node_to_source, linters\n# Base owns open_tree, insert, delete, move, replace_node, mutate_batch, write, get_unit, render_skeleton, etc.\n```\n\nCST modules (inline signatures):\n```python\nfrom ai_editor.formatters.cst.models import CSTTree\nfrom ai_editor.formatters.cst.tree_builder\
  \ import create_tree_from_code, reload_tree_from_file\nfrom ai_editor.formatters.cst.tree_modifier import modify_tree, rollback_tree_to_code\nfrom ai_editor.formatters.cst.tree_modifier_ops import sort_operations\nfrom ai_editor.formatters.cst.skeleton import build_declarative_overview, build_node_declarative_overview\nfrom ai_editor.formatters.cst.sidecar import save_sidecar, project_cst_path\nfrom ai_editor.formatters.cst.docstring_meta import DocstringMeta\nfrom ai_editor.writer import Writer\n```\n\nClass CSTFormatter(AbstractFormatter):\n- formatter_name = \"cst\"\n- registered_extensions = [\".py\"]\n- Instance field `_tree: CSTTree | None = None` holds last parsed CST.\n\nHooks:\n- parse(raw_content) -> TreeNode: set self._tree = create_tree_from_code(\"buffer.py\", raw_content); return _cst_tree_to_tree_node(self._tree) where helper builds TreeNode root (node_kind=\"root\", stable_id=\"\", children=[]) and stores CSTTree id in root.metadata[\"cst_tree_id\"]=tree.tree_id and keeps\
  \ tree on formatter.\n- render(tree: Tree) -> str: return self._tree.module.code if self._tree else \"\"\n- node_from_source(raw_block) -> TreeNode: libcst parse single statement/def; TreeNode with stable_id=\"\" and metadata {\"source\": raw_block}\n- node_to_source(node) -> str: return str(node.metadata.get(\"source\", \"\"))\n- linters() -> list[Linter]: return [_compile_linter] where compile(tree.module.code) is checked when path provided to ValidationResult\n\nCST integration methods (public on formatter instance):\n- validate_document(tree: CSTTree) -> ValidationResult: compile(tree.module.code, \"<cst>\", \"exec\"); on SyntaxError emit Diagnostic with line/col/message; success empty diagnostics\n- mutate_set / mutate_replace_block / mutate_append / mutate_delete / mutate_move: build operation dicts addressed by stable_id via tree.find_by_stable_id; call modify_tree; return updated CSTTree\n- _sort_operations(ops, tree): delegate sort_operations\n- _apply_operation(tree, op): modify_tree(tree,\
  \ [op])\n- to_string(fragment: CSTTree) -> str: json.dumps({meta.stable_id: meta.to_sidecar_dict() for meta in fragment.metadata_map.values()})\n- from_string(body: str) -> CSTTree: parse JSON + create_tree_from_code placeholder (document as minimal restore of metadata only)\n- match_unit(a, b) -> bool: a.address == b.address\n- compare_units(a, b, options) -> ComparisonResult: ComparisonResult(equal=a.address==b.address and a.unit_kind==b.unit_kind)\n\ndef write(self, content: str, path, *, tree: CSTTree | None = None) -> None:\n    Writer().write_result(content, Path(path)); when tree is not None call save_sidecar(project_cst_path(Path(path)), tree, Writer())\n\nModule-level docstring. Under 400 lines.\n"
