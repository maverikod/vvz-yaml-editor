name: YamlFormatter — parse, render, address resolution
status: frozen
description: "YamlFormatter converters: parse via ruamel round-trip, render preserving
  comments/order, node_from_source, node_to_source. Address = stable_id. No per-format
  structural mutations. VIEWER INVARIANTS: (NQ-006 option B) YamlFormatter surfaces
  scalar values inline in mapping children — each mapping child node exposes its scalar
  value via attributes.value without requiring a drill-down. (NQ-005) yaml_address.py
  implements heuristic start_line fallback when PyYAML metadata lacks start_line:
  for string keys regex r'^\\s*{last_part}\\s*:'; for quoted keys r'^\\s*[\"\\'][last_part}[\"\
  \\'\\]\\s*:'; for numeric last_part (list index) first '- ' line in subtree. Without
  this fallback annotated full_text mode produces incomplete line-to-pointer mapping.
  (NQ-001) YamlFormatter respects AbstractFormatter.full_text_max_lines — when file
  is below threshold, render_skeleton returns full annotated source with all stable_id
  markers."
