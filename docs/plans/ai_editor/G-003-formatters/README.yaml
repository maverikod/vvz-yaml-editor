executor_brief:
  owns_paths:
  - ai_editor/formatters/
  - ai_editor/schemas/
  - tests/formatters/
  base_class_owns:
  - in-memory Tree (C-063) of TreeNode (C-064)
  - stable_id assignment and integrity (subclasses never assign or read ids)
  - structural ops: insert, delete, move, replace_node, mutate_batch, 
      multiple_replace
  - fragment ops: copy_fragment, cut_fragment, paste_fragment
  - navigation/search hooks: normalize_address, get_unit, iter_units, 
      match_unit, compare_units, diagnostics
  - Sidecar (C-032) production and WritePipeline (C-068) orchestration
  subclass_hooks_only:
  - parse(raw_content) -> tree_nodes
  - render(tree) -> raw_content
  - node_from_source(raw_block) -> node
  - node_to_source(node) -> raw_block
  - linters() -> list[Linter]
  insert_position: first | last | 0-based sibling index; content is raw block 
    source converted via node_from_source
  replace_node: swaps node body via node_from_source; preserves existing 
    stable_id
  write_pipeline_steps:
  - export via subclass render
  - diff preview to caller
  - temp file write
  - subclass linters on temp
  - atomic rename on success; abort and return errors on lint failure
  sidecar_locations:
    session: <session_dir>/<buffer_id>.tree
    project: <dir>/.tree/<stem>.tree
    header: TREE_V1 fmt=<formatter> sha256=<source> tree_sha256=<body>
  formatter_backends:
    TextFormatter: paragraph/line TreeNode kinds; converter-only
    YamlFormatter: 'structural TreeNode; stable_id address; inline scalar surfacing
      in mapping children (attributes.value, NQ-006); YAML heuristic start_line fallback
      for annotated full_text (NQ-005); no-self-content-child: mapping focus returns
      key-children only, scalar focus total_blocks=0 (NQ-008)'
    JsonFormatter: 'structural TreeNode; stable_id address; scalar NOT surfaced inline
      in mapping children — caller drills down (NQ-006 asymmetry vs YAML, design decision
      pending); no-self-content-child: mapping focus returns key-children only, scalar
      focus total_blocks=0 (NQ-008)'
    CSTFormatter: CSTTree extends Tree; Sidecar .cst paths; PythonFileHandler 
      integration
  validation_chain: formatter.validate_document -> buffer.validate -> 
    session.write_all; write rejected on failure
  display_quirks_ref: code_analysis docs/plans/ai_editor/viewer_features.yaml
