step_id: G-003
name: Formatters — AbstractFormatter base, unified tree, Text/YAML/JSON/CST backends
status: needs_review
description: 'Defines AbstractFormatter as the base class owning the in-memory Tree, all structural operations, stable_id identity, Sidecar production, and WritePipeline orchestration. Subclasses (Text, YAML, JSON, CST) implement conversion hooks only: parse, render, node_from_source, node_to_source, linters. Every format uses the unified TreeNode model and Sidecar (.tree session-side, .tree/<stem>.tree project-side; CST specialisation uses .cst paths). SourceOfTruth: source file at open; tree file after first mutation (modified=True). AutoCreateTree on preview-without-tree and after CA fetch. CSTFormatter is a specialisation, not a separate structural paradigm. Display-quirk reference: code_analysis docs/plans/ai_editor/viewer_features.yaml.'
