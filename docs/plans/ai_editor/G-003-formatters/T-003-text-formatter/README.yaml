    from dataclasses import dataclass, field
    from typing import Any

    @dataclass
    class TreeNode:
        stable_id: str
        node_kind: str
        start_line: int
        end_line: int
        display_text: str
        metadata: dict[str, Any] = field(default_factory=dict)
        children: list[TreeNode] = field(default_factory=list)

