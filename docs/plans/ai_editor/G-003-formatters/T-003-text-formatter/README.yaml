    Private helpers (module-level functions, not methods) are allowed for paragraph splitting and line-range indexing.

    Document tree shape (all hook outputs leave stable_id as empty string; base assigns IDs later):
    - parse/render operate on root node_kind="root" with children node_kind="paragraph".
    - Each paragraph has children node_kind="line" (one node per source line in that paragraph).
    - No other node_kind values.

    Paragraph splitting (parse and node_from_source for multi-line blocks):
    - Split source into physical lines preserving whether the final line ends with "\n" for render round-trip.
    - A line is blank when strip() is empty.
    - Paragraphs are maximal contiguous runs of non-blank lines separated by one or more blank lines.
    - If the file has zero blank separators between non-blank lines, the entire file is exactly one paragraph (even when multiple lines).
    - Empty file: root with zero paragraph children.

    Line ranges (1-based inclusive on every node):
    - Each line node covers exactly one source line number.
    - Each paragraph node start_line = first child line start_line; end_line = last child line end_line.
    - Root start_line=1; end_line = last line number in file or 0 when empty.

    display_text:
    - line: stripped line text truncated to 120 chars.
    - paragraph: first line display_text, or "(empty paragraph)" when no lines.
    - root: "(text document)" or similar short label.

    metadata:
    - line nodes: {"text": "<stripped line without trailing newline>"}
    - paragraph/root: {} unless needed; do not store stable_id in metadata.

    Method requirements:

    def parse(self, raw_content: str) -> TreeNode:
      Build root TreeNode with node_kind="root", stable_id="", children=paragraph nodes per rules above. Never assign non-empty stable_id on any returned node.

    def render(self, tree: Tree) -> str:
      Serialize tree.root: for each paragraph child in order, join its line children via node_to_source (each line ends with "\n"), then join paragraphs with "\n\n" (blank line between blocks). If root has zero paragraphs, return "". Preserve a trailing file newline only when the original parse input ended with "\n" — store that flag in root.metadata["trailing_newline"] during parse and read it during render.

    def node_from_source(self, raw_block: str) -> TreeNode:
      - If raw_block contains no "\n": return single line node (node_kind="line") with start_line=end_line=1 and metadata text from stripped content.
      - Otherwise: return paragraph node whose line children are built from splitlines() of raw_block (drop a single trailing empty splitline caused by trailing newline).
      - When raw_block contains blank-line separators (one or more blank lines between non-blank lines): return a single paragraph TreeNode for the FIRST paragraph only; lines belonging to subsequent paragraphs are out of scope for this hook (base insert handles one block at a time).
      - When every line is non-blank (no blank-line separators): one paragraph with multiple line children.
      - All returned nodes: stable_id=""; compute provisional start_line=1..n for children sequentially (base reindexes on insert).

    def node_to_source(self, node: TreeNode) -> str:
      - line: metadata["text"] plus "\n"
      - paragraph: concatenate child line sources in order (no extra blank between lines inside paragraph)
      - root: delegate render logic (concatenate paragraphs with "\n\n")
      - Raise ValueError for unknown node_kind.

    def linters(self) -> list[Linter]:
      return []

    Module docstring: "Plain-text formatter: paragraph/line tree conversion hooks for ai_editor."

