    TextFormatter class (complete TextFormatter implementation; self-contained reference):
    ```python
    """Plain-text formatter: paragraph/line tree conversion hooks for ai_editor."""
    from __future__ import annotations

    from ai_editor.formatters.base import AbstractFormatter, Linter
    from ai_editor.formatters.tree import Tree, TreeNode

    _DISPLAY_MAX = 120


    def _truncate_display(text: str) -> str:
        if len(text) <= _DISPLAY_MAX:
            return text
        return text[:_DISPLAY_MAX]


    def _is_blank(line: str) -> bool:
        return not line.strip()


    def _physical_lines(raw_content: str) -> tuple[list[str], bool]:
        trailing = raw_content.endswith("\n")
        if not raw_content:
            return [], trailing
        return raw_content.splitlines(), trailing


    def _split_into_paragraphs(lines: list[str]) -> list[list[str]]:
        paragraphs: list[list[str]] = []
        current: list[str] = []
        for line in lines:
            if _is_blank(line):
                if current:
                    paragraphs.append(current)
                    current = []
            else:
                current.append(line)
        if current:
            paragraphs.append(current)
        return paragraphs


    def _line_node(line_num: int, line: str) -> TreeNode:
        stripped = line.strip()
        return TreeNode(
            stable_id="",
            node_kind="line",
            start_line=line_num,
            end_line=line_num,
            display_text=_truncate_display(stripped),
            metadata={"text": stripped},
            children=[],
        )


    def _paragraph_node(start: int, lines: list[str]) -> TreeNode:
        children = [_line_node(start + i, ln) for i, ln in enumerate(lines)]
        display = children[0].display_text if children else "(empty paragraph)"
        end = children[-1].end_line if children else start
        return TreeNode(
            stable_id="",
            node_kind="paragraph",
            start_line=start,
            end_line=end,
            display_text=display,
            metadata={},
            children=children,
        )


    class TextFormatter(AbstractFormatter):
        formatter_name = "text"
        registered_extensions = [".txt", ".log", ".rst", ".ini", ".cfg", ".toml"]

        def parse(self, raw_content: str) -> TreeNode:
            lines, trailing = _physical_lines(raw_content)
            paragraphs = _split_into_paragraphs(lines)
            children: list[TreeNode] = []
            line_num = 1
            for para_lines in paragraphs:
                node = _paragraph_node(line_num, para_lines)
                children.append(node)
                line_num = node.end_line + 1
            end_line = children[-1].end_line if children else 0
            meta: dict = {}
            if trailing:
                meta["trailing_newline"] = True
            return TreeNode(
                stable_id="",
                node_kind="root",
                start_line=1,
                end_line=end_line,
                display_text="(text document)",
                metadata=meta,
                children=children,
            )

        def render(self, tree: Tree) -> str:
            root = tree.root
            parts: list[str] = []
            for para in root.children:
                if para.node_kind != "paragraph":
                    continue
                parts.append(self.node_to_source(para).rstrip("\n"))
            text = "\n\n".join(parts)
            if root.metadata.get("trailing_newline"):
                text += "\n"
            return text

        def node_from_source(self, raw_block: str) -> TreeNode:
            if "\n" not in raw_block:
                stripped = raw_block.strip()
                return TreeNode(
                    stable_id="",
                    node_kind="line",
                    start_line=1,
                    end_line=1,
                    display_text=_truncate_display(stripped),
                    metadata={"text": stripped},
                    children=[],
                )
            lines = raw_block.splitlines()
            if raw_block.endswith("\n") and lines and lines[-1] == "":
                lines = lines[:-1]
            has_blank = any(_is_blank(ln) for ln in lines)
            if has_blank:
                para_lines = _split_into_paragraphs(lines)[0]
            else:
                para_lines = lines
            return _paragraph_node(1, para_lines)

        def node_to_source(self, node: TreeNode) -> str:
            if node.node_kind == "line":
                return node.metadata["text"] + "\n"
            if node.node_kind == "paragraph":
                return "".join(self.node_to_source(child) for child in node.children)
            if node.node_kind == "root":
                parts: list[str] = []
                for para in node.children:
                    if para.node_kind == "paragraph":
                        parts.append(self.node_to_source(para).rstrip("\n"))
                text = "\n\n".join(parts)
                if node.metadata.get("trailing_newline"):
                    text += "\n"
                return text
            raise ValueError(f"unknown node_kind: {node.node_kind!r}")

        def linters(self) -> list[Linter]:
            return []
    ```

