name: TextFormatter
status: frozen
description: 'TextFormatter subclass (C-025): converter hooks only. Document model
  is paragraph/line tree (root -> paragraph -> line). Paragraphs split by blank lines;
  no blanks => one paragraph. Implements parse, render, node_from_source, node_to_source.
  linters() returns empty list. Does not override base structural ops, stable_id handling,
  Sidecar production, WritePipeline, or list_commands. windowed_preview(offset, limit)
  always available — returns lines [offset, offset+limit) with 1-based line numbers;
  available in InvalidOnOpen mode and normal text mode. Extensions: .txt .log .rst
  .ini .cfg .toml.'
