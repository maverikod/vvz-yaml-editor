  \  paragraphs: list[list[str]] = []\n    current: list[str] = []\n    for line in lines:\n        if _is_blank(line):\n            if current:\n                paragraphs.append(current)\n                current = []\n        else:\n            current.append(line)\n    if current:\n        paragraphs.append(current)\n    return paragraphs\n\n\ndef _line_node(line_num: int, line: str) -> TreeNode:\n    stripped = line.strip()\n    return TreeNode(\n        stable_id=\"\",\n        node_kind=\"line\",\n        start_line=line_num,\n        end_line=line_num,\n        display_text=_truncate_display(stripped),\n        metadata={\"text\": stripped},\n        children=[],\n    )\n\n\ndef _paragraph_node(start: int, lines: list[str]) -> TreeNode:\n    children = [_line_node(start + i, ln) for i, ln in enumerate(lines)]\n    display = children[0].display_text if children else \"(empty paragraph)\"\n    end = children[-1].end_line if children else start\n    return TreeNode(\n        stable_id=\"\
  \",\n        node_kind=\"paragraph\",\n        start_line=start,\n        end_line=end,\n        display_text=display,\n        metadata={},\n        children=children,\n    )\n\n\nclass TextFormatter(AbstractFormatter):\n    formatter_name = \"text\"\n    registered_extensions = [\".txt\", \".log\", \".rst\", \".ini\", \".cfg\", \".toml\"]\n\n    def parse(self, raw_content: str) -> TreeNode:\n        lines, trailing = _physical_lines(raw_content)\n        paragraphs = _split_into_paragraphs(lines)\n        children: list[TreeNode] = []\n        line_num = 1\n        for para_lines in paragraphs:\n            node = _paragraph_node(line_num, para_lines)\n            children.append(node)\n            line_num = node.end_line + 1\n        end_line = children[-1].end_line if children else 0\n        meta: dict = {}\n        if trailing:\n            meta[\"trailing_newline\"] = True\n        return TreeNode(\n            stable_id=\"\",\n            node_kind=\"root\",\n            start_line=1,\n\
  \            end_line=end_line,\n            display_text=\"(text document)\",\n            metadata=meta,\n            children=children,\n        )\n\n    def render(self, tree: Tree) -> str:\n        root = tree.root\n        parts: list[str] = []\n        for para in root.children:\n            if para.node_kind != \"paragraph\":\n                continue\n            parts.append(self.node_to_source(para).rstrip(\"\\n\"))\n        text = \"\\n\\n\".join(parts)\n        if root.metadata.get(\"trailing_newline\"):\n            text += \"\\n\"\n        return text\n\n    def node_from_source(self, raw_block: str) -> TreeNode:\n        if \"\\n\" not in raw_block:\n            stripped = raw_block.strip()\n            return TreeNode(\n                stable_id=\"\",\n                node_kind=\"line\",\n                start_line=1,\n                end_line=1,\n                display_text=_truncate_display(stripped),\n                metadata={\"text\": stripped},\n               \
  \ children=[],\n            )\n        lines = raw_block.splitlines()\n        if raw_block.endswith(\"\\n\") and lines and lines[-1] == \"\":\n            lines = lines[:-1]\n        has_blank = any(_is_blank(ln) for ln in lines)\n        if has_blank:\n            para_lines = _split_into_paragraphs(lines)[0]\n        else:\n            para_lines = lines\n        return _paragraph_node(1, para_lines)\n\n    def node_to_source(self, node: TreeNode) -> str:\n        if node.node_kind == \"line\":\n            return node.metadata[\"text\"] + \"\\n\"\n        if node.node_kind == \"paragraph\":\n            return \"\".join(self.node_to_source(child) for child in node.children)\n        if node.node_kind == \"root\":\n            parts: list[str] = []\n            for para in node.children:\n                if para.node_kind == \"paragraph\":\n                    parts.append(self.node_to_source(para).rstrip(\"\\n\"))\n            text = \"\\n\\n\".join(parts)\n            if node.metadata.get(\"\
