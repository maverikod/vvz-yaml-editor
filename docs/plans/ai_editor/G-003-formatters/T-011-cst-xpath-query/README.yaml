name: CSTFormatter — XPath query engine (Lark LALR)
status: needs_review
description: Implement the XPath-like query engine for CSTFormatter (C-029). 
  Creates a Lark LALR grammar parser (parser.py), an index builder over CSTTree 
  (C-030) producing NodeInfo/Match dataclasses (index_builder.py), and a query 
  executor (executor.py) exposing query_tree(tree, selector) -> list[Match] and 
  cst_list_units(tree) -> list[dict]. Query results return stable_id (C-031) 
  addresses directly usable by AbstractFormatter (C-021) structural operations. 
  C-037 SearchQuery is an upstream concept (G-004); this TS implements only the 
  CSTFormatter-internal query mechanism it satisfies.
