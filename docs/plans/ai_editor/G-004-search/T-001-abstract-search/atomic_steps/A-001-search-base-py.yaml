prompt: "Project: ai_editor. Tactical step parent tactical step. File: ai_editor/search/base.py. Operation: create_file.\n\nMRS:\n  C-035 AbstractSearch: find, find_one, list_units over formatter Tree; no file I/O; session_key diagnostic only.\n  C-036 SearchMatch: buffer_id, formatter, address (node stable_id for all formatters), preview, unit_kind, metadata.\n\nPreconditions: ai_editor/contracts/error_codes.py exists (SEARCH_NO_MATCH, SEARCH_MULTIPLE_MATCHES for find_one errors in concrete impl).\n\nCreate ai_editor/search/ if missing. Create ai_editor/search/base.py with exactly:\n\n```python\n\"\"\"AbstractSearch contract and SearchMatch result type.\"\"\"\nfrom __future__ import annotations\n\nfrom abc import ABC, abstractmethod\nfrom dataclasses import dataclass, field\nfrom typing import Any\n\n\n@dataclass\nclass SearchMatch:\n    \"\"\"Single search result with a tree stable_id address usable in BufferAddress.\n\n    Attributes:\n        buffer_id: Buffer containing the match.\n\
  \        formatter: Formatter name (e.g. text, yaml, cst).\n        address: Node stable_id (UUID str) for all formatters.\n        preview: Short human-readable preview of the matched unit.\n        unit_kind: Format-defined unit kind string.\n        metadata: Additional match metadata from the formatter.\n    \"\"\"\n\n    buffer_id: str\n    formatter: str\n    address: Any\n    preview: str\n    unit_kind: str\n    metadata: dict[str, Any] = field(default_factory=dict)\n\n\nclass AbstractSearch(ABC):\n    \"\"\"Search interface over a formatter in-memory Tree.\n\n    Does not open or write files. session_key is diagnostic only.\n    Delegates unit iteration and matching to formatter base hooks.\n    \"\"\"\n\n    @abstractmethod\n    def find(\n        self,\n        session_key: str,\n        buffer_id: str,\n        query: dict[str, Any],\n        scope: str | None = None,\n    ) -> list[SearchMatch]:\n        \"\"\"Return all units matching query within optional scope.\"\"\"\n\n\
  \    @abstractmethod\n    def find_one(\n        self,\n        session_key: str,\n        buffer_id: str,\n        query: dict[str, Any],\n        scope: str | None = None,\n    ) -> SearchMatch | dict[str, Any]:\n        \"\"\"Return exactly one match or an error dict (never raises).\"\"\"\n\n    @abstractmethod\n    def list_units(\n        self,\n        session_key: str,\n        buffer_id: str,\n        scope: str | None = None,\n    ) -> list[SearchMatch]:\n        \"\"\"List all navigable units in scope without applying a query filter.\"\"\"\n```\n\nConstraints: under 120 lines; no concrete Search class here; Google-style docstrings on public types."
