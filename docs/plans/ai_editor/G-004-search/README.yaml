  - tests/search/
  unified_tree_search:
    engine: AbstractSearch (C-035) delegates to formatter base iter_units, 
      match_unit, compare_units on in-memory Tree
    address_model: SearchMatch.address is node stable_id (UUID) for every 
      formatter; legacy HRS per-format address examples (yaml path, text line 
      range) are superseded by this unified model
