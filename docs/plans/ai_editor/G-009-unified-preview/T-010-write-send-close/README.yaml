name: Write, send, close command split and session artifact layout
status: draft
description: >
  Implement NativeExport (C-081), FileRelay (C-082), BufferClose (C-083) command
  semantics. file_write exports tree to native session file; modified=False.
  file_send relays native file only; precondition modified=False; file_id resolves
  project; optional unlock. file_close deletes .tree + .ext + unlock. Session dir
  layout two artifacts per buffer. Decompose legacy save into write+send+close.
