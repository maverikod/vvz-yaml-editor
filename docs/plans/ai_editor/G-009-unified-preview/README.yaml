executor_brief:
  formatter_triad:
    reader: parse + node_from_source; source -> un-ID'd nodes (C-076)
    classifier: node_kind registry + parent-child validation (C-073)
    exporter: render + node_to_source; graph -> source (C-078)
  base_class_owns:
  - DocumentGraph (C-074) lifecycle
  - TreeFileAuthority (C-080): tree file on disk with stable_ids; native export separate
  - stable_id assign-once at ingest (C-031); persisted in tree file body
  - every mutation write_tree_file + git commit; Exporter NOT on mutate path
  - structural insert at parent + position (first/last/before/after/index)
  - StableIdTransfer (C-079) in-memory only for re-parse ops; ids never in native file
  command_semantics:
    open: lock=True -> writable path; lock=False -> readonly forced (no lock => RO)
    mutate: write_tree_file + git commit; allowed in buffer RO; blocked by session.readonly only
    write: NativeExport; preview→.pending; approve=True commit; approve=False delete temp
    export_diff: ExportDiffPreview (C-085); file_export_diff / buf_export_diff; RO allowed
    send: FileRelay; BUFFER_READONLY if buffer.readonly or session.readonly
    close: BufferClose (C-083) delete tree + native; unlock if locked
  preview_owns:
  - build_preview(document, node_ref=None) -> PreviewEnvelope
  - command layer returns PreviewEnvelope dict not bare string
  - NQ-008 no-self-content-child in blocks list
  migration_rules:
  - stable_ids in tree file on disk; never in native source on disk
  - mutate path write_tree_file + git commit; export path Exporter.render only
  - ingest assign ids once; edit loads tree file not re-parse native each time
  - CST StableIdTransfer transient in-memory only
  - sidecar/tree UUIDs preserved on migration
  owns_paths:
  - ai_editor/formatters/
  - ai_editor/sessions/buffer_open.py
  - ai_editor/sessions/buffer_api.py
  - ai_editor/commands/file_open_*
  - ai_editor/commands/buf_get_state_*
  - docs/plans/ai_editor/viewer_features.yaml
  - tests/formatters/
  - tests/sessions/
  parity_ref:
  - code_analysis universal_file_preview handlers
  - code_analysis docs/plans/ai_editor/viewer_features.yaml
  - ai_editor docs/plans/ai_editor/viewer_features.yaml (local gap tracker)
