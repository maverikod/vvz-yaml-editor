step_id: G-009
name: Unified DocumentNode graph and CA-aligned preview envelope
status: draft
description: >
  Corrective global step closing implementation drift from G-003. Formalises
  formatter as three parts — Reader (C-076), Classifier (C-073), Exporter (C-078)
  — over one DocumentGraph (C-074) of DocumentNode (C-070). Base class owns
  mutation API and orchestration; format-owned FormatterMutationBackend (C-087)
  applies changes per syntax. static stable_id (C-031) via StableIdTransfer (C-079)
  for re-parse formats, PreviewEnvelope (C-071) with CA parity (C-075). Eliminates
  TreeNode/CSTTree split and string-only command preview.
