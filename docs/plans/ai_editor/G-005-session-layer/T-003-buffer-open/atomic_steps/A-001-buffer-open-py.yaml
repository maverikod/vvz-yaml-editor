prompt: "Project: ai_editor. Parent: G-005/T-003. File: ai_editor/sessions/buffer_open.py. Operation: create_file.\n\nMRS:\n  C-010 Buffer: one file + one formatter for buffer lifetime; buffer_id and formatter immutable after open; fields include modified, readonly, buf_file_path.\n  C-038 Session: buffers share session_dir + session git + clipboard; external CASession (ca_session_id) — never session_create/delete; canonical id session_key.\n  C-062 CASession: external ca_session_id at connect; used for lock_file/unlock_file; stored in ses_settings.json; ai_editor never owns CA session lifecycle.\n  C-066 SourceOfTruth: source file at open; tree sidecar authoritative once buffer.modified=True (all formats).\n  C-067 AutoCreateTree: formatter.open_tree immediately after CA fetch and when preview would miss tree file.\n  C-032 Sidecar: session <session_dir>/<buffer_id>.tree; project <dir>/.tree/<stem>.tree; header TREE_V1 fmt=<formatter> sha256=<source> tree_sha256=<tree>; written after every\
  \ mutation once modified=True (SourceOfTruth).\n  C-021 AbstractFormatter: open_tree, export, render_skeleton, structural mutations, write pipeline; produces Sidecar (C-032).\n\nPreconditions (modules from G-001/G-002/G-003 — do not open other repo files):\n  from ai_editor.contracts import (\n      BufferDescriptor, Diagnostic, ErrorCode, OperationResult,\n      SessionDescriptor, WriteAllResult,\n  )\n  from ai_editor.editor_core.ca_client import CodeAnalysisClient\n  from ai_editor.editor_core.registry import FormatterRegistry\n  from ai_editor.editor_core.save_pipeline import run_save_as_pipeline, run_save_pipeline, run_validate\n  from ai_editor.editor_core.writer import Writer\n  from ai_editor.formatters.base import AbstractFormatter\n  from ai_editor.formatters.sidecar import save_sidecar, session_sidecar_path\n  ErrorCode: use UNDO_NOT_AVAILABLE / REDO_NOT_AVAILABLE for undo/redo limits (not SEARCH_*).\n  Git failures: append Diagnostic(code='HISTORY_UNAVAILABLE', message=...)\
  \ — not ErrorCode enum.\nG-005 executor_brief: sidecar session_path <session_dir>/<buffer_id>.tree; AutoCreateTree after CA fetch via formatter.open_tree.\n\nCreate parent package directories if missing. Create ai_editor/sessions/buffer_open.py with exactly:\n\n```python\n\"\"\"Open remote buffer: CA fetch, lock, tree build, buf write, git commit.\"\"\"\nfrom __future__ import annotations\n\nimport uuid\nfrom pathlib import Path\nfrom typing import Any\n\nfrom ai_editor.contracts import Diagnostic, ErrorCode\nfrom ai_editor.editor_core.ca_client import CodeAnalysisClient\nfrom ai_editor.editor_core.registry import FormatterRegistry\nfrom ai_editor.editor_core.writer import Writer\nfrom ai_editor.formatters.sidecar import save_sidecar, session_sidecar_path\nfrom ai_editor.sessions.session_dir import add_buffer_to_settings, read_session_settings\nfrom ai_editor.sessions.session_git import commit_buffer, create_buffer_branch, get_repo\n\ndef _source_text(formatter: Any, tree: Any) -> str:\n\
  \    \"\"\"Full source bytes/text for buf write and upload (never skeleton).\"\"\"\n    if getattr(formatter, \"formatter_name\", \"\") == \"cst\":\n        module = getattr(tree, \"module\", None) or getattr(tree, \"document\", None)\n        if module is not None and hasattr(module, \"code\"):\n            return module.code\n    exported = formatter.export(tree)\n    if isinstance(exported, dict) and exported.get(\"content\"):\n        return str(exported[\"content\"])\n    return formatter.render(tree)\n\n\ndef _resolve_formatter(\n    registry: FormatterRegistry,\n    file_path: str,\n    formatter: str,\n    open_as_text: bool,\n) -> Any:\n    \"\"\"Pick formatter class by name or extension.\"\"\"\n    if open_as_text:\n        cls = registry.get_by_name(\"text\")\n    elif formatter != \"auto\":\n        cls = registry.get_by_name(formatter)\n    else:\n        ext = Path(file_path).suffix.lower()\n        cls = registry.get_by_extension(ext)\n    if cls is None:\n        raise\
  \ ValueError(ErrorCode.FORMATTER_NOT_FOUND.value)\n    return cls()\n\n\ndef open_buffer(\n    session_dir: Path,\n    session_key: str,\n    project_id: str,\n    file_path: str,\n    ca_client: CodeAnalysisClient,\n    formatter_registry: FormatterRegistry,\n    repo: Any,\n    config: dict[str, Any],\n    formatter: str = \"auto\",\n    open_as_text: bool = False,\n    readonly: bool = False,\n) -> dict[str, Any]:\n    \"\"\"Open file from CA server into session.\n\n    AutoCreateTree: formatter.open_tree immediately after fetch (C-067).\n    SourceOfTruth at open: source file until first mutation (C-066).\n\n    Returns:\n        buf_dict on success or error dict with success=False.\n    \"\"\"\n    settings = read_session_settings(session_dir)\n    ca_session_id = settings.get(\"ca_session_id\") or config.get(\"ca_session_id\", \"\")\n    try:\n        fmt_cls = _resolve_formatter(formatter_registry, file_path, formatter, open_as_text)\n    except ValueError:\n        return {\n \
  \           \"success\": False,\n            \"error_code\": ErrorCode.FORMATTER_NOT_FOUND,\n            \"message\": f\"no formatter for {file_path}\",\n        }\n    formatter_inst = fmt_cls()\n    try:\n        content_bytes, file_id = ca_client.download_content(\n            project_id, file_path, readonly=readonly\n        )\n    except Exception as exc:\n        return {\n            \"success\": False,\n            \"error_code\": ErrorCode.FILE_NOT_FOUND,\n            \"message\": str(exc),\n        }\n    content = content_bytes.decode(\"utf-8\")\n    if not readonly and file_id:\n        try:\n            ca_client.lock_file(ca_session_id, project_id, file_id)\n        except Exception:\n            return {\n                \"success\": False,\n                \"error_code\": ErrorCode.BUFFER_LOCKED,\n                \"message\": \"file lock held by another session\",\n            }\n    buffer_id = str(uuid.uuid4())\n    suffix = Path(file_path).suffix or \".txt\"\n    buf_path\
  \ = session_dir / f\"{buffer_id}{suffix}\"\n    tree = formatter_inst.open_tree(content)\n    sidecar_path = session_sidecar_path(session_dir, buffer_id)\n    save_sidecar(sidecar_path, formatter_inst.formatter_name, content, tree)\n    Writer().write_buf(content, buf_path)\n    create_buffer_branch(repo, buffer_id, buf_path)\n    commit_buffer(repo, buffer_id, buf_path, f\"open: {file_path}\")\n    buf_dict: dict[str, Any] = {\n        \"buffer_id\": buffer_id,\n        \"relative_path\": file_path,\n        \"file_type\": \"remote\",\n        \"lock_mode\": \"none\" if readonly else \"full\",\n        \"lock_session_id\": None if readonly else ca_session_id,\n        \"file_id\": file_id,\n        \"modified\": False,\n        \"saved\": True,\n        \"readonly\": readonly,\n        \"formatter\": formatter_inst.formatter_name,\n        \"buf_file_path\": str(buf_path),\n        \"project_id\": project_id,\n        \"filename\": Path(file_path).name,\n        \"redo_stack\": [],\n\
  \    }\n    add_buffer_to_settings(session_dir, buf_dict)\n    view = formatter_inst.render_skeleton()\n    return {\n        \"success\": True,\n        \"buffer_id\": buffer_id,\n        \"view\": view,\n        \"diagnostics\": [],\n        \"buf_dict\": buf_dict,\n    }\n```\n"
