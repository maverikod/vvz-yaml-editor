prompt: "Project: ai_editor. Parent: parent tactical step. File: ai_editor/sessions/buffer_mutation.py. Operation: create_file.\n\nMRS:\n  C-010 Buffer: one file + one formatter for buffer lifetime; buffer_id and formatter immutable after open; fields include modified, readonly, buf_file_path.\n  C-038 Session: buffers share session_dir + session git + clipboard; external CASession (ca_session_id) — never session_create/delete; canonical id session_key.\n  C-066 SourceOfTruth: source file at open; tree sidecar authoritative once buffer.modified=True (all formats).\n  C-032 Sidecar: session <session_dir>/<buffer_id>.tree; project <dir>/.tree/<stem>.tree; header TREE_V1 fmt=<formatter> sha256=<source> tree_sha256=<tree>; written after every mutation once modified=True (SourceOfTruth).\n  C-021 AbstractFormatter: open_tree, export, render_skeleton, structural mutations, write pipeline; produces Sidecar (C-032).\n\nPreconditions (modules from G-001/G-002/G-003 — Use only the inlined excerpt\
  \ below, not live imports from the codebase. other repo files):\n  from ai_editor.contracts import (\n      BufferDescriptor, Diagnostic, ErrorCode, OperationResult,\n      SessionDescriptor, WriteAllResult,\n  )\n  from ai_editor.editor_core.ca_client import CodeAnalysisClient\n  from ai_editor.editor_core.registry import FormatterRegistry\n  from ai_editor.editor_core.save_pipeline import run_save_as_pipeline, run_save_pipeline, run_validate\n  from ai_editor.editor_core.writer import Writer\n  from ai_editor.formatters.base import AbstractFormatter\n  from ai_editor.formatters.sidecar import save_sidecar, session_sidecar_path\n  ErrorCode: use UNDO_NOT_AVAILABLE / REDO_NOT_AVAILABLE for undo/redo limits (not SEARCH_*).\n  Git failures: append Diagnostic(code='HISTORY_UNAVAILABLE', message=...) — not ErrorCode enum.\n\nCreate parent package directories if missing. Create ai_editor/sessions/buffer_mutation.py with exactly:\n\n```python\n\"\"\"Mandatory write_buf + sidecar + git commit\
  \ after every mutation.\"\"\"\nfrom __future__ import annotations\n\nfrom pathlib import Path\nfrom typing import Any\n\nfrom ai_editor.contracts import Diagnostic, ErrorCode\nfrom ai_editor.editor_core.writer import Writer\nfrom ai_editor.formatters.sidecar import save_sidecar, session_sidecar_path\nfrom ai_editor.sessions.session_dir import read_session_settings, update_buffer_in_settings\nfrom ai_editor.sessions.session_git import commit_buffer, history_diagnostic\n\ndef _source_text(formatter: Any, tree: Any) -> str:\n    \"\"\"Full source bytes/text for buf write and upload (never skeleton).\"\"\"\n    if getattr(formatter, \"formatter_name\", \"\") == \"cst\":\n        module = getattr(tree, \"module\", None) or getattr(tree, \"document\", None)\n        if module is not None and hasattr(module, \"code\"):\n            return module.code\n    exported = formatter.export(tree)\n    if isinstance(exported, dict) and exported.get(\"content\"):\n        return str(exported[\"content\"\
  ])\n    return formatter.render(tree)\n\n\ndef execute_mutation(\n    session_dir: Path,\n    buffer_id: str,\n    formatter: Any,\n    document: Any,\n    new_document: Any,\n    command_name: str,\n    params_summary: str,\n    repo: Any,\n    readonly_session: bool = False,\n    readonly_buffer: bool = False,\n) -> dict[str, Any]:\n    \"\"\"Apply mutation: write buf, session sidecar, ses_settings, git commit.\"\"\"\n    if readonly_session or readonly_buffer:\n        return {\n            \"success\": False,\n            \"error_code\": ErrorCode.BUFFER_READONLY,\n            \"message\": \"readonly\",\n        }\n    if document is new_document:\n        return {\"success\": True, \"message\": \"unchanged\", \"diagnostics\": []}\n    settings = read_session_settings(session_dir)\n    buf_meta = next(\n        (b for b in settings.get(\"open_buffers\", []) if b[\"buffer_id\"] == buffer_id),\n        None,\n    )\n    if not buf_meta:\n        return {\n            \"success\": False,\n\
  \            \"error_code\": ErrorCode.BUFFER_NOT_FOUND,\n            \"message\": buffer_id,\n        }\n    buf_path = Path(buf_meta[\"buf_file_path\"])\n    source = _source_text(formatter, new_document)\n    Writer().write_buf(source, buf_path)\n    sidecar = session_sidecar_path(session_dir, buffer_id)\n    save_sidecar(sidecar, formatter.formatter_name, source, new_document)\n    update_buffer_in_settings(\n        session_dir,\n        buffer_id,\n        {\"modified\": True, \"redo_stack\": []},\n    )\n    diagnostics: list[Diagnostic] = []\n    try:\n        commit_buffer(\n            repo,\n            buffer_id,\n            buf_path,\n            f\"{command_name}: {params_summary}\",\n        )\n    except Exception as exc:\n        diagnostics.append(history_diagnostic(exc))\n    return {\"success\": True, \"diagnostics\": diagnostics}\n```\n"
