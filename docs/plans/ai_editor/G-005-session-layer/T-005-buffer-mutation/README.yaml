step_id: T-005
parent_global_step: G-005
name: Buffer mutation — mandatory write_buf and git commit after every change
status: needs_review
description: "Every mutation via base-class tree ops. Sets modified=True (SourceOfTruth
  -> tree Sidecar). Writes session-side Sidecar after mutation + buf file + git commit.\n\
  Invariant: buf write (Writer.write_buf) is a mandatory atomic part of every mutation
  — if write_buf fails the mutation is rolled back and returns error. file_get always
  reads from buf file; in-memory tree and buf file are always consistent after any
  completed mutation. This design structurally prevents stale-read after mutation
  (contrast: CA-server BUG-UNIVERSAL-FILE-PREVIEW-TREE-TEMP-DRAFT-001 where preview
  session binding could return pre-edit state)."
