prompt: "Project: ai_editor. Parent: parent tactical step. File: ai_editor/sessions/buffer_reload.py. Operation: create_file.\n\nMRS:\n  C-010 Buffer: one file + one formatter for buffer lifetime; buffer_id and formatter immutable after open; fields include modified, readonly, buf_file_path.\n  C-067 AutoCreateTree: formatter.open_tree immediately after CA fetch and when preview would miss tree file.\n  C-021 AbstractFormatter: open_tree, export, render_skeleton, structural mutations, write pipeline; produces Sidecar (C-032).\n  C-032 Sidecar: session <session_dir>/<buffer_id>.tree; project <dir>/.tree/<stem>.tree; header TREE_V1 fmt=<formatter> sha256=<source> tree_sha256=<tree>; written after every mutation once modified=True (SourceOfTruth).\n\nPreconditions (modules from G-001/G-002/G-003 — Use only the inlined excerpt below, not live imports from the codebase. other repo files):\n  from ai_editor.contracts import (\n      BufferDescriptor, Diagnostic, ErrorCode, OperationResult,\n \
  \     SessionDescriptor, WriteAllResult,\n  )\n  from ai_editor.editor_core.ca_client import CodeAnalysisClient\n  from ai_editor.editor_core.registry import FormatterRegistry\n  from ai_editor.editor_core.save_pipeline import run_save_as_pipeline, run_save_pipeline, run_validate\n  from ai_editor.editor_core.writer import Writer\n  from ai_editor.formatters.base import AbstractFormatter\n  from ai_editor.formatters.sidecar import save_sidecar, session_sidecar_path\n  ErrorCode: use UNDO_NOT_AVAILABLE / REDO_NOT_AVAILABLE for undo/redo limits (not SEARCH_*).\n  Git failures: append Diagnostic(code='HISTORY_UNAVAILABLE', message=...) — not ErrorCode enum.\n\nCreate parent package directories if missing. Create ai_editor/sessions/buffer_reload.py with exactly:\n\n```python\n\"\"\"Reload remote buffer from CA server.\"\"\"\nfrom __future__ import annotations\n\nfrom pathlib import Path\nfrom typing import Any\n\nfrom ai_editor.contracts import Diagnostic, ErrorCode\nfrom ai_editor.editor_core.ca_client\
  \ import CodeAnalysisClient\nfrom ai_editor.editor_core.registry import FormatterRegistry\nfrom ai_editor.editor_core.writer import Writer\nfrom ai_editor.formatters.sidecar import save_sidecar, session_sidecar_path\nfrom ai_editor.sessions.session_dir import read_session_settings, update_buffer_in_settings\nfrom ai_editor.sessions.session_git import commit_buffer, history_diagnostic\n\ndef _source_text(formatter: Any, tree: Any) -> str:\n    \"\"\"Full source bytes/text for buf write and upload (never skeleton).\"\"\"\n    if getattr(formatter, \"formatter_name\", \"\") == \"cst\":\n        module = getattr(tree, \"module\", None) or getattr(tree, \"document\", None)\n        if module is not None and hasattr(module, \"code\"):\n            return module.code\n    exported = formatter.export(tree)\n    if isinstance(exported, dict) and exported.get(\"content\"):\n        return str(exported[\"content\"])\n    return formatter.render(tree)\n\n\ndef reload_buffer(\n    session_dir: Path,\n\
  \    session_key: str,\n    buffer_id: str,\n    ca_client: CodeAnalysisClient,\n    formatter_registry: FormatterRegistry,\n    repo: Any,\n) -> dict[str, Any]:\n    \"\"\"Re-download remote buffer; rebuild tree+sidecar; modified=False.\"\"\"\n    diagnostics: list[Diagnostic] = []\n    settings = read_session_settings(session_dir)\n    buf = next(\n        (b for b in settings.get(\"open_buffers\", []) if b[\"buffer_id\"] == buffer_id),\n        None,\n    )\n    if not buf:\n        return {\n            \"success\": False,\n            \"error_code\": ErrorCode.BUFFER_NOT_FOUND,\n            \"message\": buffer_id,\n        }\n    if buf.get(\"file_type\") != \"remote\":\n        return {\n            \"success\": False,\n            \"error_code\": ErrorCode.BUFFER_INVALID,\n            \"message\": \"local buffer cannot reload\",\n        }\n    rel = buf[\"relative_path\"]\n    project_id = buf[\"project_id\"]\n    try:\n        content_bytes, _fid = ca_client.download_content(\n\
  \            project_id, rel, readonly=True\n        )\n    except Exception as exc:\n        return {\n            \"success\": False,\n            \"error_code\": ErrorCode.BUFFER_RELOAD_FAILED,\n            \"message\": str(exc),\n        }\n    content = content_bytes.decode(\"utf-8\")\n    cls = formatter_registry.get_by_name(buf[\"formatter\"])\n    if cls is None:\n        return {\n            \"success\": False,\n            \"error_code\": ErrorCode.FORMATTER_NOT_FOUND,\n            \"message\": buf[\"formatter\"],\n        }\n    formatter = cls()\n    try:\n        tree = formatter.open_tree(content)\n    except Exception as exc:\n        return {\n            \"success\": False,\n            \"error_code\": ErrorCode.FORMATTER_PARSE_ERROR,\n            \"message\": str(exc),\n        }\n    buf_path = Path(buf[\"buf_file_path\"])\n    Writer().write_buf(content, buf_path)\n    save_sidecar(\n        session_sidecar_path(session_dir, buffer_id),\n        formatter.formatter_name,\n\
  \        content,\n        tree,\n    )\n    try:\n        commit_buffer(repo, buffer_id, buf_path, f\"reload: {rel}\")\n    except Exception as exc:\n        diagnostics.append(history_diagnostic(exc))\n    update_buffer_in_settings(\n        session_dir, buffer_id, {\"modified\": False, \"redo_stack\": []}\n    )\n    return {\n        \"success\": True,\n        \"view\": formatter.render_skeleton(),\n        \"diagnostics\": diagnostics,\n    }\n```\n"
