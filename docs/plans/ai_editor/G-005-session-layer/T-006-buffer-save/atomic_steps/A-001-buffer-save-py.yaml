prompt: "Project: ai_editor. Parent: G-005/T-006. File: ai_editor/sessions/buffer_save.py. Operation: create_file.\n\nMRS:\n  C-010 Buffer: one file + one formatter for buffer lifetime; buffer_id and formatter immutable after open; fields include modified, readonly, buf_file_path.\n  C-068 WritePipeline: export, diff preview, temp write, linters, atomic rename; session save uses run_save_pipeline after formatter export.\n  C-032 Sidecar: session <session_dir>/<buffer_id>.tree; project <dir>/.tree/<stem>.tree; header TREE_V1 fmt=<formatter> sha256=<source> tree_sha256=<tree>; written after every mutation once modified=True (SourceOfTruth).\n  C-021 AbstractFormatter: open_tree, export, render_skeleton, structural mutations, write pipeline; produces Sidecar (C-032).\n\nPreconditions (modules from G-001/G-002/G-003 — do not open other repo files):\n  from ai_editor.contracts import (\n      BufferDescriptor, Diagnostic, ErrorCode, OperationResult,\n      SessionDescriptor, WriteAllResult,\n\
  \  )\n  from ai_editor.editor_core.ca_client import CodeAnalysisClient\n  from ai_editor.editor_core.registry import FormatterRegistry\n  from ai_editor.editor_core.save_pipeline import run_save_as_pipeline, run_save_pipeline, run_validate\n  from ai_editor.editor_core.writer import Writer\n  from ai_editor.formatters.base import AbstractFormatter\n  from ai_editor.formatters.sidecar import save_sidecar, session_sidecar_path\n  ErrorCode: use UNDO_NOT_AVAILABLE / REDO_NOT_AVAILABLE for undo/redo limits (not SEARCH_*).\n  Git failures: append Diagnostic(code='HISTORY_UNAVAILABLE', message=...) — not ErrorCode enum.\n\nCreate parent package directories if missing. Create ai_editor/sessions/buffer_save.py with exactly:\n\n```python\n\"\"\"Explicit save via save pipeline and CA upload.\"\"\"\nfrom __future__ import annotations\n\nfrom pathlib import Path\nfrom typing import Any\n\nfrom ai_editor.contracts import ErrorCode, OperationResult\nfrom ai_editor.editor_core.ca_client import CodeAnalysisClient\n\
  from ai_editor.editor_core.save_pipeline import run_save_as_pipeline, run_save_pipeline\nfrom ai_editor.sessions.session_dir import read_session_settings, remove_buffer_from_settings, update_buffer_in_settings\nfrom ai_editor.sessions.session_git import commit_buffer, delete_buffer_branch\n\n\ndef save_buffer(\n    session_dir: Path,\n    buffer_id: str,\n    formatter: Any,\n    document: Any,\n    ca_client: CodeAnalysisClient,\n    repo: Any,\n    *,\n    close: bool = False,\n) -> OperationResult:\n    \"\"\"Save buffer to CA; optional unlock+close when close=True.\"\"\"\n    settings = read_session_settings(session_dir)\n    buf = next(\n        (b for b in settings.get(\"open_buffers\", []) if b[\"buffer_id\"] == buffer_id),\n        None,\n    )\n    if not buf:\n        return OperationResult(\n            success=False,\n            error_code=ErrorCode.BUFFER_NOT_FOUND,\n            message=buffer_id,\n        )\n    rel = buf.get(\"relative_path\")\n    if not rel:\n       \
  \ return OperationResult(\n            success=False,\n            error_code=ErrorCode.BUFFER_SAVE_FAILED,\n            message=\"unsaved local buffer\",\n        )\n    result = run_save_pipeline(\n        formatter,\n        document,\n        rel,\n        ca_client,\n        buf[\"project_id\"],\n        buf.get(\"file_id\"),\n        commit_message=f\"ai_editor: save {rel}\",\n    )\n    if not result.success:\n        return result\n    update_buffer_in_settings(\n        session_dir, buffer_id, {\"modified\": False, \"saved\": True}\n    )\n    if close and buf.get(\"lock_session_id\") and buf.get(\"file_id\"):\n        ca_client.unlock_file(\n            buf[\"lock_session_id\"], buf[\"project_id\"], buf[\"file_id\"]\n        )\n        delete_buffer_branch(repo, buffer_id)\n        remove_buffer_from_settings(session_dir, buffer_id)\n    return result\n\n\ndef save_as_buffer(\n    session_dir: Path,\n    buffer_id: str,\n    formatter: Any,\n    document: Any,\n    ca_client:\
  \ CodeAnalysisClient,\n    new_relative_path: str,\n    overwrite: bool = False,\n    repo: Any | None = None,\n) -> OperationResult:\n    \"\"\"Save buffer content to a new project path.\"\"\"\n    settings = read_session_settings(session_dir)\n    buf = next(\n        (b for b in settings.get(\"open_buffers\", []) if b[\"buffer_id\"] == buffer_id),\n        None,\n    )\n    if not buf:\n        return OperationResult(\n            success=False,\n            error_code=ErrorCode.BUFFER_NOT_FOUND,\n            message=buffer_id,\n        )\n    result = run_save_as_pipeline(\n        formatter,\n        document,\n        new_relative_path,\n        ca_client,\n        buf[\"project_id\"],\n        overwrite,\n    )\n    if result.success:\n        update_buffer_in_settings(\n            session_dir,\n            buffer_id,\n            {\n                \"relative_path\": new_relative_path,\n                \"modified\": False,\n                \"saved\": True,\n                \"\
  file_type\": \"remote\",\n            },\n        )\n    return result\n```\n"
