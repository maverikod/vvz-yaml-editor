    \  document, repo) -> None.\ncut_to_clipboard(session_dir, buffer_id, source_address,\
    \ formatter,\n  document, repo) -> tuple[new_document, fragment].\npaste_from_clipboard(session_dir,\
    \ buffer_id, target_address, mode,\n  formatter, document, repo) -> tuple[new_document,\
    \ diagnostics].\n"
