prompt: "Project: ai_editor. Parent: parent tactical step. File: ai_editor/sessions/recovery.py. Operation: create_file.\n\nMRS:\n  C-038 Session: buffers share session_dir + session git + clipboard; external CASession (ca_session_id) — never session_create/delete; canonical id session_key.\n  C-039 SessionDirectory: <sessions_base_dir>/<session_key>/ with ses_settings.json, git/, buffer files, clipboard.json; exists iff directory exists.\n  C-044 StartupSweep: policy B — delete orphan dirs (missing/corrupt ses_settings); release stale locks on valid dirs via unlock_file; no TTL.\n\nPreconditions (modules from G-001/G-002/G-003 — Use only the inlined excerpt below, not live imports from the codebase. other repo files):\n  from ai_editor.contracts import (\n      BufferDescriptor, Diagnostic, ErrorCode, OperationResult,\n      SessionDescriptor, WriteAllResult,\n  )\n  from ai_editor.editor_core.ca_client import CodeAnalysisClient\n  from ai_editor.editor_core.registry import FormatterRegistry\n\
  \  from ai_editor.editor_core.save_pipeline import run_save_as_pipeline, run_save_pipeline, run_validate\n  from ai_editor.editor_core.writer import Writer\n  from ai_editor.formatters.base import AbstractFormatter\n  from ai_editor.formatters.sidecar import save_sidecar, session_sidecar_path\n  ErrorCode: use UNDO_NOT_AVAILABLE / REDO_NOT_AVAILABLE for undo/redo limits (not SEARCH_*).\n  Git failures: append Diagnostic(code='HISTORY_UNAVAILABLE', message=...) — not ErrorCode enum.\nUse ca_client.unlock_file (not advisory_unlock alias).\n\nCreate parent package directories if missing. Create ai_editor/sessions/recovery.py with exactly:\n\n```python\n\"\"\"Startup sweep and session reconnect helpers.\"\"\"\nfrom __future__ import annotations\n\nimport logging\nimport shutil\nfrom pathlib import Path\nfrom typing import Any\n\nfrom ai_editor.contracts import ErrorCode\nfrom ai_editor.editor_core.ca_client import CodeAnalysisClient\nfrom ai_editor.sessions.session_dir import SETTINGS_NAME,\
  \ read_session_settings\n\nlogger = logging.getLogger(__name__)\n\n\ndef release_all_locks_for_session(\n    ca_client: CodeAnalysisClient,\n    buffers: list[dict[str, Any]],\n    allow_foreign_session: bool = False,\n) -> None:\n    \"\"\"Best-effort unlock_file per locked buffer.\"\"\"\n    _ = allow_foreign_session\n    for buf in buffers:\n        lock_id = buf.get(\"lock_session_id\")\n        file_id = buf.get(\"file_id\")\n        project_id = buf.get(\"project_id\")\n        if not lock_id or not file_id or not project_id:\n            continue\n        try:\n            ca_client.unlock_file(lock_id, project_id, file_id)\n        except Exception as exc:\n            logger.warning(\"unlock failed: %s\", exc)\n\n\ndef startup_sweep(base_dir: str | Path, ca_client: CodeAnalysisClient) -> None:\n    \"\"\"Policy B: drop orphan dirs; release stale locks on valid dirs.\"\"\"\n    base = Path(base_dir)\n    if not base.exists():\n        return\n    for child in base.iterdir():\n\
  \        if not child.is_dir():\n            continue\n        settings_path = child / SETTINGS_NAME\n        try:\n            if not settings_path.exists():\n                shutil.rmtree(child, ignore_errors=True)\n                continue\n            settings = read_session_settings(child)\n        except Exception:\n            shutil.rmtree(child, ignore_errors=True)\n            continue\n        buffers = settings.get(\"open_buffers\", [])\n        stale = [\n            b\n            for b in buffers\n            if b.get(\"lock_mode\") == \"full\"\n            and not b.get(\"saved\")\n            and not b.get(\"readonly\")\n            and b.get(\"lock_session_id\")\n        ]\n        release_all_locks_for_session(ca_client, stale, allow_foreign_session=True)\n\n\ndef reconnect_session(base_dir: str | Path, session_key: str) -> dict[str, Any]:\n    \"\"\"Load ses_settings for existing session directory.\"\"\"\n    session_dir = Path(base_dir) / session_key\n    if not session_dir.is_dir():\n\
  \        raise ValueError(ErrorCode.SESSION_NOT_FOUND.value)\n    return read_session_settings(session_dir)\n```\n"
