- description: read_session_settings.
  name: G-005/T-001 output
  type: ai_editor.sessions.session_dir
- description: CodeAnalysisClient.advisory_unlock.
  name: G-002/T-001 output
  type: ai_editor.editor_core.ca_client
- description: ErrorCode (SESSION_NOT_FOUND).
  name: G-001 contracts
  type: ai_editor.contracts
outputs:
