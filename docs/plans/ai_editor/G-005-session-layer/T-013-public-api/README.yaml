step_id: T-013
parent_global_step: G-005
name: Public session API — connect, reconnect, close_session, session_status
status: draft
description: 'Create public session API that the command layer (G-006) calls. Four
  operations: connect, reconnect, close_session_api, session_status. All return SessionDescriptor.
  _settings_to_descriptor(settings: dict) helper converts ses_settings.json dict to
  SessionDescriptor, mapping open_buffers dicts to list[BufferDescriptor] (public
  fields only). connect(base_dir, ca_client, formatter_registry, config, readonly=False):
  NO save_always parameter; creates session dir, inits session git, returns SessionDescriptor.
  reconnect(base_dir, session_key, ca_client): calls reconnect_session() -> dict,
  converts via _settings_to_descriptor; raises SESSION_NOT_FOUND if missing. close_session_api(base_dir,
  session_key, ca_client, force=False): NO project_id parameter; close_session uses
  per-buffer project_id. session_status(base_dir, session_key): read-only, raises
  SESSION_NOT_FOUND if absent.

  '
