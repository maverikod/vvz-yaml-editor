prompt: "Project: ai_editor. Parent: parent tactical step. File: ai_editor/sessions/buffer_new.py. Operation: create_file.\n\nMRS:\n  C-038 Session: buffers share session_dir + session git + clipboard; external CASession (ca_session_id) — never session_create/delete; canonical id session_key.\n  C-010 Buffer: one file + one formatter for buffer lifetime; buffer_id and formatter immutable after open; fields include modified, readonly, buf_file_path.\n  C-043 BufferFile: session working copy at <session_dir>/<buffer_id>.<ext>; full source via write_buf after every mutation.\n\nPreconditions (modules from G-001/G-002/G-003 — Use only the inlined excerpt below, not live imports from the codebase. other repo files):\n  from ai_editor.contracts import (\n      BufferDescriptor, Diagnostic, ErrorCode, OperationResult,\n      SessionDescriptor, WriteAllResult,\n  )\n  from ai_editor.editor_core.ca_client import CodeAnalysisClient\n  from ai_editor.editor_core.registry import FormatterRegistry\n\
  \  from ai_editor.editor_core.save_pipeline import run_save_as_pipeline, run_save_pipeline, run_validate\n  from ai_editor.editor_core.writer import Writer\n  from ai_editor.formatters.base import AbstractFormatter\n  from ai_editor.formatters.sidecar import save_sidecar, session_sidecar_path\n  ErrorCode: use UNDO_NOT_AVAILABLE / REDO_NOT_AVAILABLE for undo/redo limits (not SEARCH_*).\n  Git failures: append Diagnostic(code='HISTORY_UNAVAILABLE', message=...) — not ErrorCode enum.\n\nCreate parent package directories if missing. Create ai_editor/sessions/buffer_new.py with exactly:\n\n```python\n\"\"\"Create unsaved local buffer from initial content.\"\"\"\nfrom __future__ import annotations\n\nimport uuid\nfrom pathlib import Path\nfrom typing import Any\n\nfrom ai_editor.contracts import Diagnostic, ErrorCode\nfrom ai_editor.editor_core.registry import FormatterRegistry\nfrom ai_editor.editor_core.writer import Writer\nfrom ai_editor.formatters.sidecar import save_sidecar, session_sidecar_path\n\
  from ai_editor.sessions.session_dir import add_buffer_to_settings\nfrom ai_editor.sessions.session_git import commit_buffer, create_buffer_branch, history_diagnostic\n\ndef _source_text(formatter: Any, tree: Any) -> str:\n    \"\"\"Full source bytes/text for buf write and upload (never skeleton).\"\"\"\n    if getattr(formatter, \"formatter_name\", \"\") == \"cst\":\n        module = getattr(tree, \"module\", None) or getattr(tree, \"document\", None)\n        if module is not None and hasattr(module, \"code\"):\n            return module.code\n    exported = formatter.export(tree)\n    if isinstance(exported, dict) and exported.get(\"content\"):\n        return str(exported[\"content\"])\n    return formatter.render(tree)\n\n\ndef create_new_buffer(\n    session_dir: Path,\n    session_key: str,\n    formatter_name: str,\n    initial_content: str,\n    display_name: str,\n    formatter_registry: FormatterRegistry,\n    repo: Any,\n) -> dict[str, Any]:\n    \"\"\"Create local unsaved buffer;\
  \ modified=True from start.\"\"\"\n    diagnostics: list[Diagnostic] = []\n    cls = formatter_registry.get_by_name(formatter_name)\n    if cls is None:\n        return {\n            \"success\": False,\n            \"error_code\": ErrorCode.FORMATTER_NOT_FOUND,\n            \"message\": formatter_name,\n        }\n    formatter = cls()\n    try:\n        tree = formatter.open_tree(initial_content)\n    except Exception as exc:\n        return {\n            \"success\": False,\n            \"error_code\": ErrorCode.FORMATTER_PARSE_ERROR,\n            \"message\": str(exc),\n        }\n    buffer_id = str(uuid.uuid4())\n    buf_path = session_dir / f\"{buffer_id}.txt\"\n    source = _source_text(formatter, tree)\n    save_sidecar(\n        session_sidecar_path(session_dir, buffer_id),\n        formatter.formatter_name,\n        source,\n        tree,\n    )\n    Writer().write_buf(source, buf_path)\n    create_buffer_branch(repo, buffer_id, buf_path)\n    try:\n        commit_buffer(repo,\
  \ buffer_id, buf_path, f\"new: {display_name or 'untitled'}\")\n    except Exception as exc:\n        diagnostics.append(history_diagnostic(exc))\n    buf_dict = {\n        \"buffer_id\": buffer_id,\n        \"relative_path\": None,\n        \"file_type\": \"local\",\n        \"lock_mode\": \"none\",\n        \"lock_session_id\": None,\n        \"file_id\": None,\n        \"modified\": True,\n        \"saved\": False,\n        \"readonly\": False,\n        \"formatter\": formatter.formatter_name,\n        \"buf_file_path\": str(buf_path),\n        \"project_id\": \"\",\n        \"filename\": display_name or \"untitled\",\n        \"redo_stack\": [],\n    }\n    add_buffer_to_settings(session_dir, buf_dict)\n    return {\n        \"buffer_id\": buffer_id,\n        \"view\": formatter.render_skeleton(),\n        \"diagnostics\": diagnostics,\n    }\n```\n"
