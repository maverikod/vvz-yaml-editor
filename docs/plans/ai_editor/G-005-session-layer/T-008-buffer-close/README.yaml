step_id: T-008
parent_global_step: G-005
name: Buffer close and session close
status: draft
description: 'Implement close_buffer and close_session. Destruction rules by file_type
  and saved flag: remote+saved=False+not force -> FILE_HAS_UNSENT_CHANGES; remote+saved=False+force
  -> advisory_unlock via lock_session_id then destroy; remote+saved=True -> lock already
  released, destroy freely; local -> destroy freely regardless of saved. close_buffer
  uses formatter.delete(buf_file_path) (NOT manual Path.unlink) then delete_buffer_branch,
  conditional advisory_unlock, then remove_buffer_from_settings. close_session without
  force: checks all buffers for modified=True (SESSION_HAS_UNSAVED_BUFFERS) and remote+saved=False
  (SESSION_HAS_UNSENT_FILES) before destroying. With force: release all advisory locks
  best-effort per buffer using buf_meta[''project_id''] (no global project_id parameter),
  then shutil.rmtree unconditionally. advisory_unlock called with lock_session_id
  (CA server lock ID), not session_key. Per-buffer project_id used in all advisory_unlock
  calls.

  '
concepts:
- C-038
- C-010
