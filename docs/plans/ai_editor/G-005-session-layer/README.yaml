name: Session layer — infrastructure, buffer lifecycle, clipboard, recovery, and public API
status: needs_review
description: 'Session infrastructure and full buffer lifecycle. SourceOfTruth rule applies to all formats: source file at open; tree Sidecar becomes authoritative once buffer.modified=True. AutoCreateTree builds tree on CA fetch and when preview finds no tree file. Sidecar session file written after every mutation. Operates under external CASession (ca_session_id); never calls session_create/delete. startup_sweep policy B for stale locks and orphaned dirs. Canonical id: session_key.'
