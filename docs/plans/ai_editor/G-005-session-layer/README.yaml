executor_brief:
  owns_paths:
  - ai_editor/sessions/
  - tests/sessions/
  source_of_truth:
    at_open: source file on CA server (or local buf for new buffers)
    after_first_mutation: tree Sidecar file becomes authoritative once buffer.modified=True
    applies_to: all formats uniformly (not CST-only)
  sidecar_for_all_formats:
    session_path: '<session_dir>/<buffer_id>.tree — written after every mutation'
    project_path: '<dir>/.tree/<stem>.tree — written on save next to source'
    cst_specialisation: '.cst session/project paths remain valid aliases for CSTFormatter'
    producer: AbstractFormatter base (C-021 produces C-032); session layer persists Sidecar on each mutation commit
  auto_create_tree:
    on_preview_missing_tree: formatter.open_tree/build tree, then preview from tree
    after_ca_fetch: build tree immediately after download_content in open flow (before returning skeleton)
  startup_sweep:
    policy: B — delete orphaned session dirs (missing/corrupt ses_settings.json); release stale session_close_file locks for valid dirs; no TTL
  ca_session:
    external: ca_session_id supplied at connect; stored in ses_settings.json; never session_create/delete
  buffer_lifecycle_ops:
  - open (remote CA fetch + lock + parse + buf write + git commit)
  - new (local unsaved, modified=True from start)
  - mutation (formatter op + buf write + modified=True + sidecar write + git commit)
  - save (validate + render + upload; lock kept unless close=True)
  - reload / close / close_session / write_all / undo / redo / clipboard
cascade_note: changed — source-of-truth + sidecar-for-all + auto-create; I1c source_ranges audited 2026-05-21; cycle_2 triple-autonomy 2026-05-21
