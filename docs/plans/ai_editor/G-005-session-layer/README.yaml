executor_brief:
  session_isolation:
  - directory name equals session_key (UUID); ses_settings.session_key must 
    match
  - resolve_session_dir validates session_key, directory, ses_settings match
  - buffer_id scoped to session; no cross-session artifact paths
  session_create_order:
  - session_connect mkdir <base>/<session_key>/ then ses_settings then init git/
  owns_paths:
  - ai_editor/sessions/
  - tests/sessions/
  source_of_truth:
    at_open: native source read once from CA server (or local buf for new 
      buffers)
    after_ingest: write_tree_file at open assigns stable_ids and persists tree; 
      tree Sidecar file is authoritative for all edit operations immediately
    modified_flag: tracks native export staleness only — True after tree 
      mutation, False after ingest or approved export; not the gate for tree 
      authority
    applies_to: all formats uniformly (not CST-only)
  sidecar_for_all_formats:
    session_path: <session_dir>/<buffer_id>.tree — written after every mutation
    project_path: <dir>/.tree/<stem>.tree — written on save next to source
    cst_specialisation: .cst session/project paths remain valid aliases for 
      CSTFormatter
    producer: AbstractFormatter base (C-021 produces C-032); session layer 
      persists Sidecar on each mutation commit
  auto_create_tree:
    status: deferred — C-067 hrs_binding_pending; do not assert behavior until 
      HRS binding completes
    on_preview_missing_tree: formatter.open_tree/build tree, then preview from 
      tree (pending HRS)
    after_ca_fetch: build tree immediately after download_content in open flow 
      (before returning skeleton) (pending HRS)
  startup_sweep:
    policy: B — delete orphaned session dirs (missing/corrupt 
      ses_settings.json); release stale session_close_file locks for valid dirs;
      no TTL
  ca_session:
    external: ca_session_id supplied at connect; stored in ses_settings.json; 
      never session_create/delete
  buffer_lifecycle_ops:
  - open (remote CA fetch + lock + parse + buf write + git commit)
  - new (local unsaved, modified=True from start)
  - mutation (formatter op + buf write + modified=True + sidecar write + git 
    commit)
  - 'write_export (NativeExport C-081): tree -> native session file via file_write;
    write_all batch export; approve flow (.pending / promote / reject); does NOT upload
    to CA or release lock'
  - 'file_send (FileRelay C-082): relay native session file bytes to CA by file_id;
    precondition modified=False; optional unlock; rejected when buffer.readonly or
    session.readonly'
  - 'close (BufferClose C-083): delete tree file and native session file; session_close_file
    if locked; remove git branch and buffer entry'
  - reload / close_session / undo / redo / clipboard
