step_id: G-005
name: Session layer — infrastructure, buffer lifecycle, clipboard, recovery, and
  public API
status: frozen
description: 'Session infrastructure and full buffer lifecycle. SourceOfTruth rule
  applies to all formats: native source read once at open; after ingest (write_tree_file
  at open) the tree Sidecar file is authoritative for all edit operations — not gated
  on buffer.modified=True. modified tracks native export staleness only. AutoCreateTree
  behavior deferred (C-067 hrs_binding_pending). Sidecar session file written after
  every mutation. Operates under external CASession (ca_session_id); never calls session_create/delete.
  startup_sweep policy B for stale locks and orphaned dirs. Canonical id: session_key.'
