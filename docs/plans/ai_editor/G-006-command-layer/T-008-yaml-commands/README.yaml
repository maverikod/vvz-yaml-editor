step_id: T-008
parent_global_step: G-006
name: YAML-specific commands
status: draft
description: 'Five YAML-specific convenience commands in three-file structure each.
  yaml_get_command(session_key, buffer_id, command_name): find via Search.find_one({kind:
  field_equals, field: name, value: command_name}); returns SearchMatch or SEARCH_NO_MATCH.
  yaml_update_command(session_key, buffer_id, command_name, patch): find command by
  name, apply mutate_set per patch field, write buf; destructive, has dry_run. yaml_get_verification(session_key,
  buffer_id): returns verification list from document root via get_unit at address
  "verification". yaml_append_verification(session_key, buffer_id, item, dedupe=True):
  appends item to verification list via mutate_append; destructive, has dry_run. yaml_validate_plan_task(session_key,
  buffer_id=None, file_path=None, project_id=None): runs plan_task_v1 semantic validation
  via formatter.validate_document(document, options={format: plan_task_v1}); if file_path
  given: project_id required, download with lock_mode=''none'', parse() then validate_document()
  (validate_content does NOT exist). validate_params calls super() first. All five
  registered in hooks_register.

  '
