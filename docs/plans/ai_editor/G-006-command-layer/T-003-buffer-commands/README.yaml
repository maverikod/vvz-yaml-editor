step_id: T-003
parent_global_step: G-006
name: File commands — file_open, file_close, file_get, file_send, file_create
status: draft
description: "Five file lifecycle commands in three-file structure each. file_open(session_key,
  project_id(required), file_path, formatter='auto', open_as_text=False, readonly=False):
  downloads from CA server with advisory lock (lock_mode='full' unless readonly);
  sets file_type='remote', saved=False; returns {buffer_id, document_view, formatter_name,
  status, file_type}. Delegates to open_buffer (NOT api.py directly). file_close(session_key,
  buffer_id, force=False): takes buffer_id (NOT file_path — buffer_id is the canonical
  identifier per AbstractBuffer contract). remote+unsaved -> FILE_HAS_UNSENT_CHANGES
  without force; delegates to close_buffer. Destructive (force=True discards changes
  and releases lock) - has dry_run. file_get(session_key, buffer_id, lock: bool =
  True): reads from local buf file (no server call); lock=True acquires advisory lock
  on the buffer file (default, current behaviour); lock=False reads without locking;
  returns {content, relative_path, file_type, modified}. file_send(session_key, buffer_id,
  dry_run=False, release_lock: bool = False): uploads to CA server; release_lock=False
  keeps lock after write (default, current behaviour); release_lock=True releases
  advisory lock after successful upload; local->remote on success; delegates to save_buffer.
  Destructive (uploads to CA server) - has dry_run. file_create(session_key, formatter='auto',
  content='', display_name=None): creates local buffer (file_type='local', lock_mode='none',
  saved=False, relative_path=None); delegates to create_new_buffer (NOT open_buffer).
  Returns buffer_id. All five registered in hooks_register.\n"
