prompt: "Project: ai_editor. Tactical step: T-003. File: ai_editor/commands/file_get_command.py. Operation: create_file.\n\nMRS C-045: extends Command from mcp_proxy_adapter.commands.base.\nvalidate_params calls super() first. async execute delegates to api.get_buffer_state only.\nNever import session layer directly.\n\napi.get_buffer_state signature (G-006/T-010 api.py):\n  synchronous; returns OperationResult or dataclass/dict.\n\nCreate with exact content:\n\n```python\n\"\"\"file_get MCP command — delegates to ai_editor.api.get_buffer_state.\"\"\"\nfrom __future__ import annotations\n\nfrom typing import Any\n\nfrom mcp_proxy_adapter.commands.base import Command\n\nfrom ai_editor.commands.file_get_metadata import get_file_get_metadata\nfrom ai_editor.commands.file_get_schema import get_file_get_schema\nfrom ai_editor import api\n\n\nclass FileGetCommand(Command):\n    \"\"\"MCP command: file_get.\"\"\"\n\n    name = \"file_get\"\n    version = \"1.0.0\"\n    descr = \"File Get\"\n    category = \"editor\"\n    author = \"Vasiliy Zdanovskiy\"\n    email = \"vasilyvz@gmail.com\"\n\n    @classmethod\n    def get_schema(cls) -> dict[str, Any]:\n        return get_file_get_schema()\n\n    def validate_params(self, params: dict[str, Any]) -> dict[str, Any]:\n        params = super().validate_params(params)\n        return params\n\n    async def execute(self, **params: Any) -> dict[str, Any]:\n        result = api.get_buffer_state(session_key=params['session_key'], buffer_id=params['buffer_id'])\n        if hasattr(result, \"__dataclass_fields__\"):\n            from dataclasses import asdict\n            payload = asdict(result)\n            if payload.get(\"error_code\") is not None:\n                payload[\"error_code\"] = str(payload[\"error_code\"])\n            return {\"success\": payload.get(\"success\", True), \"data\": payload}\n        if isinstance(result, dict):\n            return {\"success\": True, \"data\": result}\n        return {\"success\": True, \"data\": result}\n\n    @classmethod\n    def metadata(cls) -> dict[str, Any]:\n        return get_file_get_metadata(cls)\n```"
