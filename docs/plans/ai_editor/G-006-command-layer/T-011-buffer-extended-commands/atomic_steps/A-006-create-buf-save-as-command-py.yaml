\"data\": payload}\n        if isinstance(result, dict):\n            return {\"success\": True, \"data\": result}\n        return {\"success\": True, \"data\": result}\n\n    @classmethod\n    def metadata(cls) -> dict[str, Any]:\n        return get_buf_save_as_metadata(cls)\n```"
