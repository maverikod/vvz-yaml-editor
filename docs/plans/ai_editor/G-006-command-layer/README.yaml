step_id: G-006
name: Command layer and public interfaces
status: frozen
description: "Defines all EditorCommand units following metadatastd.md, the HooksRegister
  that wires commands and formatters at startup, the ApiFacade thin wrapper over the
  session layer, and the CLI diagnostic interface. ai_editor never implements HTTP
  routes or JSON-RPC handlers manually — mcp_proxy_adapter auto-generates the entire
  external API surface from command schemas and metadata.\n"
