prompt: "Project: ai_editor. Tactical step: T-004. File: ai_editor/commands/buf_undo_command.py. Operation: create_file.\n\nMRS C-045: extends Command from mcp_proxy_adapter.commands.base.\nvalidate_params calls super() first. async execute delegates to api.undo only.\nNever import session layer directly.\n\nRequires ai_editor.api.undo from G-006/T-010 (api.py facade).\napi.undo signature (G-006/T-010 api.py):\n  synchronous; returns OperationResult or dataclass/dict.\n\nCreate with exact content:\n\n```python\n\"\"\"buf_undo MCP command — delegates to ai_editor.api.undo.\"\"\"\nfrom __future__ import annotations\n\nfrom typing import Any\n\nfrom mcp_proxy_adapter.commands.base import Command\n\nfrom ai_editor.commands.buf_undo_metadata import get_buf_undo_metadata\nfrom ai_editor.commands.buf_undo_schema import get_buf_undo_schema\nfrom ai_editor import api\n\n\nclass BufUndoCommand(Command):\n    \"\"\"MCP command: buf_undo.\"\"\"\n\n    name = \"buf_undo\"\n    version = \"1.0.0\"\n    descr = \"Buf Undo\"\n    category = \"editor\"\n    author = \"Vasiliy Zdanovskiy\"\n    email = \"vasilyvz@gmail.com\"\n\n    @classmethod\n    def get_schema(cls) -> dict[str, Any]:\n        return get_buf_undo_schema()\n\n    def validate_params(self, params: dict[str, Any]) -> dict[str, Any]:\n        params = super().validate_params(params)\n        return params\n\n    async def execute(self, **params: Any) -> dict[str, Any]:\n        result = api.undo(session_key=params['session_key'], buffer_id=params['buffer_id'], steps=params.get('steps', 1))\n        if hasattr(result, \"__dataclass_fields__\"):\n            from dataclasses import asdict\n            payload = asdict(result)\n            if payload.get(\"error_code\") is not None:\n                payload[\"error_code\"] = str(payload[\"error_code\"])\n            return {\"success\": payload.get(\"success\", True), \"data\": payload}\n        if isinstance(result, dict):\n            return {\"success\": True, \"data\": result}\n        return {\"success\": True, \"data\": result}\n\n    @classmethod\n    def metadata(cls) -> dict[str, Any]:\n        return get_buf_undo_metadata(cls)\n```"
