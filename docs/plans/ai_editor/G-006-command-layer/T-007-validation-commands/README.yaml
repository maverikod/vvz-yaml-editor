- name: T-001 output
  type: ai_editor.hooks_register
  description: hooks_register._register() skeleton.
- name: G-002 output
  type: ai_editor.editor_core
  description: FormatterRegistry, CodeAnalysisClient.
- name: G-001 contracts
  type: ai_editor.contracts
  description: ValidationResult.
outputs:
