step_id: T-007
parent_global_step: G-006
name: Validation commands — validate, validate_file, formatter_commands
status: draft
description: 'Three validation/discovery commands in three-file structure each. buf_validate(session_key,
  buffer_id): formatter.validate_document on in-memory document; does not write files
  or change modified state. validate_file(session_key, file_path=None, buffer_id=None,
  project_id=None, formatter=''auto'', schema=None): if buffer_id given: validate
  in-memory document; if file_path given: project_id required, download with lock_mode=''none'',
  parse() then validate_document() (validate_content does NOT exist); formatter auto-resolved
  by extension (.yaml/.yml->yaml, .py->cst, .json->json, else->text). Never writes
  files. Returns ValidationResult + formatter_name. formatter_commands(buffer_id=None,
  formatter=None): returns formatter.list_commands() catalog as dict. validate_params
  calls super() first. All three registered in hooks_register.

  '
concepts:
- C-045
- C-047
