- description: ai_editor/commands/session_close_{command,schema,metadata}.py. name="session_close".
  name: session_close triplet
  type: three-file command
- description: ai_editor/commands/session_status_{command,schema,metadata}.py. name="session_status".
  name: session_status triplet
  type: three-file command
atomic_steps: []
