- concept_id: C-021
  name: AbstractFormatter
  definition: 'Base class for every format. Owns DocumentGraph (C-074), stable_id
    identity (C-031), structural mutation orchestration, build_preview navigation,
    and write_tree_file persistence. Subclasses implement Reader/Classifier/Exporter
    conversion hooks only; content/structure mutations delegate to FormatterMutationBackend
    (C-087). Invariant: formatters must not know about sessions, session_key, buf
    files, git, or buffer registry.'
  properties:
  - 'formatter_triad: Reader (C-076) + Classifier (C-073) + Exporter (C-078)'
  - 'base_owned_lifecycle: [ingest, mutate, export, build_preview]'
  - 'build_preview: build_preview(document, node_ref=None) -> PreviewEnvelope via
    PreviewNavigator (C-072)'
  - 'render_skeleton: legacy string overview only; delegates to or supplements build_preview
    for legacy callers'
  - 'base_owned_navigation: [normalize_address, get_unit, iter_units, match_unit,
    compare_units, diagnostics]'
  - 'base_owned_mutations: insert(parent, position, content); delete; move; replace_node
    (preserves stable_id); mutate_batch; multiple_replace'
  - 'insert_position: first | last | before:<addr> | after:<addr> | 0-based integer;
    <addr> resolved by format (JSON Pointer / UUID / key-name for tree-temp; node_ref
    slug for text/md)'
  - 'mutate_batch_rollback: all-or-nothing; on validation failure entire batch rolled
    back to pre-batch tree; returns MUTATION_ROLLBACK'
  - 'multiple_replace_rollback: same all-or-nothing rollback semantics as mutate_batch'
  - 'post_mutation_validation: after each single op base runs parse+tree-invariants;
    on failure rolls back that op only; returns MUTATION_ROLLBACK'
  - 'base_owned_fragments: [copy_fragment, cut_fragment, paste_fragment]'
  - 'base_owned_identity: stable_id assigned/preserved by base; subclasses forbidden'
  - 'subclass_forbidden: [assign/read stable_id, any structural mutation]'
  - 'subclass_hooks: [parse, render, node_from_source, node_to_source, linters]'
  - 'mutation_delegation: base.apply_op delegates content/structure change to FormatterMutationBackend
    (C-087) per formatter_name; Reader/Exporter/Classifier hooks never mutate graph'
  - 'base_owned_write: step-0 pre-write validation (PRE_WRITE_VALIDATION_FAILED on
    error); export -> diff preview -> temp file -> subclass linters -> atomic rename;
    abort on lint error'
  - 'list_commands: list_commands() -> FormatterCommandCatalog'
  - 'formatter_name: str'
  source_labels:
  - '{a00g}'
  - '{a00h}'
  - '{a00i}'
  - '{a00j}'
  - '{a00k}'
  - '{a00l}'
  - '{a00m}'
