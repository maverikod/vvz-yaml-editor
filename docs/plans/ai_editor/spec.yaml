    and CA-aligned PreviewEnvelope (corrective).\nC-087 FormatterMutationBackend:
    per-format mutation code delegated by AbstractFormatter.\nC-025 TextFormatter
    registered extensions updated: .md .markdown\nremoved (now owned by C-052 MarkdownFormatter).\n\
    \nNON-BINDING LINES (excluded from G-step coverage):\n  - 1-16:   HTML-comment
    header with plan standard notes (preamble).\n  - 155, 176-178, 380-381, 974-975,
    1041-1042, 1179-1181, 1218-1220, 1363-1364, 1399-1401, 1439-1440, 1725-1727, 1765-1766,
    2492-2570 (quirks appendix; HRS marks non-binding):\n            section dividers
    ('---' and blank lines between G-NNN sections).\nThese ranges are intentionally
    not covered by any G-step.\n\nNON-BINDING (additional): blank lines and '---'
    dividers between ### subsections;\n  line before quirks appendix (HTML non-binding
    marker).\n  quirks appendix (HRS explicit non-binding).\nGS-ONLY CONCEPTS (excluded
    from I1c HRS line union):\n  C-058 PortedCodeBase, C-059 StandaloneAdapter, C-060
    ImportRewrite, C-061 TextGroupReadiness\n  — defined in G-000 only; no binding
