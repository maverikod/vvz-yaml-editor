  - address: Any
  source_labels:
  - '{a002}'
  - '{a00g}'
- concept_id: C-010
  name: Buffer
  definition: "Binding of exactly one file (or unsaved content) to exactly one formatter\n\
    for the lifetime of an open buffer. Both formatter and buffer_id are\nimmutable
    after open.\n"
  properties:
  - buffer_id: UUID4 stable for lifetime
  - project_id: UUID4
  - file_id: UUID | None
  - filename: str
  - relative_path: str | None
  - formatter: str
  - modified: bool
  - locked: bool - CA file lock held under ca_session_id; True only on writable 
      remote open
  - readonly: bool - immutable after open; forced True when locked=False 
      (remote). Blocks write (NativeExport) and file_send (FileRelay) only; 
      local mutations allowed.
  - lock_readonly_invariant: 'remote: locked=False => readonly=True; writable requires
      lock'
  - buf_file_path: str
  source_labels:
  - '{a004}'
  - '{a006}'
  - '{a007}'
  - '{a008}'
  - '{a009}'
  - '{a00b}'
  - '{a00c}'
  - '{a00g}'
  - '{a00v}'
  - '{a00w}'
  - '{a00x}'
  - '{a00y}'
  - '{a00z}'
- concept_id: C-011
  name: BufferState
  definition: "Snapshot of buffer's current state returned by get_state, including
    a\nformatter-rendered skeleton preview.\n"
  properties:
  - buffer_id: str
  - formatter: str
  - preview: str
