- concept_id: C-029
  name: CSTFormatter
  definition: Specialisation of AbstractFormatter for Python (.py) using libcst.
    Provides CST-specific parse/render converters; tree ownership and structural
    ops remain in base class. Default view is declarative skeleton.
  properties:
  - 'document_model: CSTTree (extends generic Tree)'
  - 'migration_target: DocumentGraph (C-074); legacy CSTTree until G-009'
  - 'address: stable_id (UUID4)'
  - 'subclass_hooks: parse (libcst), render, node_from_source, node_to_source, linters'
  - 'storing_ids_in_source: forbidden'
  - 'registered_extensions: [.py]'
  source_labels:
  - '{a00o}'
  - '{a00u}'
  - '{a00v}'
- concept_id: C-030
  name: CSTTree
  definition: 'CST specialisation of Tree: in-memory Python CST with libcst.Module,
    metadata_map, node_map, and stable_id survival through mutations.'
  properties:
  - 'extends: Tree (generic model)'
  - 'tree_id: runtime UUID'
  - 'module: libcst.Module'
  - 'metadata_map: node_id -> TreeNodeMetadata'
  - 'node_map: node_id -> libcst.CSTNode'
  - 'parent_map: node_id -> parent_node_id'
  - 'node_id_aliases: previous_obj_to_id snapshot'
  - 'root_node_id: stable_id of module root'
  source_labels:
  - '{a00o}'
  - '{a00p}'
- concept_id: C-031
  name: StableId
  definition: 'UUID4 node identity assigned once at ingest via assign_stable_ids and
    persisted in tree file serialisation on disk and in-memory DocumentNode. IDs do
    not appear in native source on disk. Transient # @node-id markers for in-memory
    re-parse within one operation are governed by C-079 (StableIdTransfer); markers
    are stripped before native export/write, not before tree-file persist.'
  properties:
  - 'type: UUID4 str'
  - 'assigned_once_at: ingest via assign_stable_ids'
  - 'persisted_in: tree file serialised node map on disk (C-080 authority)'
  - 'absent_from: native source file on disk'
  - 'survives: replace_node, move/reparent; lost on structural delete of node'
  - 'insert_creates: new UUID4 only'
  - 'transient_markers: see C-079; in-memory re-parse aid only'
  - 'forbidden_for_subclass: assign, read, depend on stable_id'
  source_labels:
  - '{a01y}'
  - '{a01z}'
- concept_id: C-032
  name: Sidecar
  definition: Persisted tree file for every format. Session-side after every 
    mutation; project-side on save. Generic header TREE_V1 fmt=<formatter> 
    sha256=<source> tree_sha256=<tree>. CST uses .cst paths and CST_TREE_V1 as a
    specialisation.
  properties:
  - 'session_side_generic: <session_dir>/<buffer_id>.tree'
  - 'project_side_generic: <dir>/.tree/<stem>.tree'
  - 'header_generic: TREE_V1 fmt=<formatter_name> sha256=<source_sha256> tree_sha256=<tree_body_sha256>'
  - 'cst_session_side: <session_dir>/<buffer_id>.cst'
  - 'cst_project_side: <py_dir>/.cst/<py_stem>.tree'
  - 'cst_header: CST_TREE_V1 sha256=<source> tree_sha256=<tree>'
  - 'serialisation: JSON or format-specific DocumentGraph body including stable_id
    per node'
  - 'load_validation: checksum mismatch -> rebuild from source'
  - 'write: atomic via tempfile + os.replace'
  source_labels:
  - '{a00k}'
  - '{a00l}'
  - '{a00m}'
  - '{a00s}'
  - '{a00t}'
  - '{a01w}'
  - '{a01x}'
