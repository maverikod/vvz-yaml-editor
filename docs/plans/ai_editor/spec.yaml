  - 'export_separate: Exporter.render on file_send/save/write_all only'
  - 'native_source: no stable_id markers on disk'
  source_ranges:
  - start: 1847
    end: 1895
- concept_id: C-081
  name: NativeExport
  definition: Write command exports DocumentGraph to native session file via Exporter;
    gated by ExportDiff against baseline; identical skips write; changes require confirm.
  properties:
  - 'commands: file_write, buf_write_all'
  - 'approve_param: None=preview (.pending temp+diff); True=commit; False=reject delete temp'
  - 'reject: delete .pending; no baseline/modified/tree changes'
  - 'identical: no temp; skip write; modified=False'
  - 'does_not: file_send, tree mutation'
  source_ranges:
  - start: 351
    end: 378
  - start: 2239
    end: 2275
- concept_id: C-084
  name: ExportDiffResult
  definition: Structured comparison of baseline native bytes vs candidate export from tree;
    returned by file_export_diff and by file_write when confirm=False.
  properties:
  - 'identical: bool'
  - 'has_changes: bool'
  - 'unified_diff: str'
  - 'hunks: list of op/start_line/end_line/preview'
  - 'baseline_sha256, candidate_sha256: str'
  source_ranges:
  - start: 2239
    end: 2275
- concept_id: C-085
  name: ExportDiffPreview
  definition: Standalone API command computing export diff without write; allowed in RO.
  properties:
  - 'commands: file_export_diff, buf_export_diff'
  - 'no side effects on disk or modified flag'
  - 'uses: baseline_native + Exporter.render candidate'
  source_ranges:
  - start: 368
    end: 373
  - start: 2239
    end: 2275
- concept_id: C-082
  name: FileRelay
  definition: file_send relays native session file bytes to CA by file_id; no tree
    access; optional unlock; precondition modified=False.
  properties:
  - 'precondition: modified=False; native session file present'
  - 'action: read native session file; ca upload by file_id'
  - 'optional: unlock via session_close_file'
  - 'does_not: Exporter.render, write_tree_file, assign stable_id'
  source_ranges:
  - start: 2109
    end: 2185
- concept_id: C-083
  name: BufferClose
  definition: file_close deletes tree file and native session file; unlocks CA lock
    if held; removes git branch and buffer entry.
  properties:
  - 'deletes: <buffer_id>.tree, <buffer_id>.<ext>, git branch'
  - 'unlock: session_close_file when locked'
  - 'modified=True without force: FILE_HAS_UNSENT_CHANGES'
  source_ranges:
  - start: 2109
    end: 2185
