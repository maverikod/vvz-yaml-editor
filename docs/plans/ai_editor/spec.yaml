- concept_id: C-025
  name: TextFormatter
  definition: Converter-only subclass for plain text files. Document model is a 
    three-level document/paragraph/line tree (not list[str]). Structure, 
    navigation, mutation, and identity are owned by AbstractFormatter base.
  properties:
  - 'document_model: document -> paragraph -> line'
  - 'paragraph_rule: split by blank line(s); no blanks => whole file is one paragraph'
  - 'node_kinds: [document, paragraph, line]'
  - 'address: stable_id'
  - 'subclass_hooks: parse, render, node_from_source, node_to_source'
  - 'linters: none'
  - 'windowed_preview(offset, limit): returns lines [offset, offset+limit) with 1-based
    numbers; always available including InvalidOnOpen mode'
  - 'registered_extensions: [.txt, .log, .rst, .ini, .cfg, .toml]'
  - 'note: .md and .markdown owned by MarkdownFormatter (C-052)'
  source_labels:
  - '{a00m}'
- concept_id: C-026
  name: YamlFormatter
  definition: Converter-only subclass for YAML using ruamel.yaml round-trip. 
    Structure, navigation, mutation, and identity owned by base class.
  properties:
  - 'document_model: mapping | sequence | scalar tree nodes'
  - 'node_kinds: [mapping, sequence, scalar, mappingItem]'
  - 'address: stable_id'
  - 'subclass_hooks: parse (ruamel round-trip), render, node_from_source, node_to_source'
  - 'linters: [yaml_parse, jsonschema_optional, plan_task_v1_semantic]'
  - 'roundtrip_invariant: render(parse(x)) preserves comments, key order, formatting'
  - 'registered_extensions: [.yaml, .yml]'
  source_labels:
  - '{a00m}'
  - '{a00n}'
- concept_id: C-027
  name: PlanTaskV1
  definition: "Semantic validation schema for plan task YAML files. Validates format,\n\
