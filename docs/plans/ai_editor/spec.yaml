  properties:
  - render(tree) -> raw_content
  - node_to_source(node) -> raw_block
  - no persistent stable_id markers in committed output
  source_labels:
  - '{a01v}'
  - '{a01w}'
- concept_id: C-079
  name: StableIdTransfer
  definition: In-memory embed-extract aid for re-parse mutations within one 
    operation; ids authoritative in tree file on disk, never in native source 
    export.
  properties:
  - 'embed: graph stable_id -> transient parse string markers'
  - 'mutate: backend on transient string only'
  - 'extract: reconcile into graph before write_tree_file'
  - 'python_transient_marker: # @node-id: <uuid4> in memory only'
  - 'tree_file_persistence: stable_id in serialised tree body on disk'
  - 'native_export: never contains markers'
  source_labels:
  - '{a01z}'
- concept_id: C-080
  name: TreeFileAuthority
  definition: Session tree file is working copy during edit; stable_ids live in 
    tree file on disk; native file read at ingest, written only on export; undo 
    via git snapshots of tree file.
  properties:
  - 'tree_file: session_dir/<buffer_id>.tree or .cst'
  - 'assign_ids_once: at ingest/reload only'
  - 'mutation_persist: write_tree_file + git commit after every change'
  - 'export_separate: Exporter.render on file_write / write_all only; file_send is
    relay'
  - 'native_source: no stable_id markers on disk'
  source_labels:
  - '{a01w}'
  - '{a01x}'
- concept_id: C-081
  name: NativeExport
  definition: Write command exports DocumentGraph to native session file via 
    Exporter; gated by ExportDiff against baseline; identical skips write; 
    changes require confirm.
  properties:
  - 'commands: file_write, buf_write_all'
  - 'approve_param: None=preview (.pending temp+diff); True=commit; False=reject delete
    temp'
  - 'reject: delete .pending; no baseline/modified/tree changes'
  - 'identical: no temp; skip write; modified=False'
  - 'does_not: file_send, tree mutation'
  source_labels:
  - '{a025}'
- concept_id: C-084
  name: ExportDiffResult
  definition: Structured comparison of baseline native bytes vs candidate export
    from tree; returned by file_export_diff and by file_write when 
    confirm=False.
  properties:
  - 'identical: bool'
  - 'has_changes: bool'
  - 'unified_diff: str'
  - 'hunks: list of op/start_line/end_line/preview'
  - 'baseline_sha256, candidate_sha256: str'
  - 'baseline_line_count: int'
  - 'candidate_line_count: int'
  source_labels:
  - '{a026}'
- concept_id: C-085
  name: ExportDiffPreview
  definition: Standalone API command computing export diff without write; 
    allowed in RO.
  properties:
  - 'commands: file_export_diff, buf_export_diff'
  - no side effects on disk or modified flag
  - 'uses: baseline_native + Exporter.render candidate'
  source_labels:
  - '{a026}'
- concept_id: C-082
  name: FileRelay
  definition: file_send relays native session file bytes to CA by file_id; no 
    tree access; optional unlock; precondition modified=False.
  properties:
  - 'precondition: modified=False; native session file present'
  - 'action: read native session file; ca upload by file_id'
  - 'optional: unlock via session_close_file'
  - 'does_not: Exporter.render, write_tree_file, assign stable_id'
  source_labels:
  - '{a025}'
- concept_id: C-083
  name: BufferClose
  definition: file_close deletes tree file and native session file; unlocks CA 
    lock if held; removes git branch and buffer entry.
  properties:
  - 'deletes: <buffer_id>.tree, <buffer_id>.<ext>, git branch'
  - 'unlock: session_close_file when locked'
  - 'modified=True without force: FILE_HAS_UNSENT_CHANGES'
  source_labels:
  - '{a025}'
- concept_id: C-087
  name: FormatterMutationBackend
  definition: Format-owned code that applies structural and content changes on 
    the native document model for one formatter; invoked by 
    AbstractFormatter.apply_op; distinct from Reader/Exporter/Classifier hooks.
  properties:
  - 'one_per_formatter: exactly one backend per formatter_name'
  - 'python: libcst tree_modifier sequential/batch; StableIdTransfer on re-parse'
  - 'yaml: ruamel structural path mutations'
  - 'json: dict/list JQ-style path mutations'
  - 'text: line-array insert and replace_range'
  - 'markdown: block/heading tree ops when G-008 backend present'
  - 'forbidden: assign stable_id; called from Reader/Exporter/Classifier hooks'
  - 'base_orchestrates: graph link, validation, write_tree_file, git commit'
  source_labels:
  - '{a01v}'
  - '{a01w}'
  - '{a00v}'
