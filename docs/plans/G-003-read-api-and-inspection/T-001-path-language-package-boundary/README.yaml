tactical_step_name: path_language_package_boundary
title: Path language package boundary and ownership rules
status: draft
source_documents:
- docs/tech_spec.md
- docs/plans/create_pip_package_for_mcp.yaml
- docs/plans/G-003-read-api-and-inspection/README.yaml
intent: Define the path_language package boundary, module layout, import-safety rules,
  and ownership constraints before grammar parsing, tokenization, resolution, or downstream
  read/mutation behavior is implemented.
owned_code_paths:
- ai_editor/path_language/__init__.py
owned_test_paths:
- tests/path_language/test_package_boundary.py
owned_docs_paths: []
forbidden_paths:
- pyproject.toml
- README.md
- ai_editor/contracts/
- ai_editor/document_io/
- ai_editor/reader/
- ai_editor/mutations/
- ai_editor/validation/
- ai_editor/transaction_writer/
- ai_editor/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - G-001-package-contracts-and-distribution
  - G-002-document-io
  may_be_used_by:
  - T-002-path-token-model
  - T-003-path-parser
  - T-004-path-normalization
  - T-005-path-resolution
  - T-006-parent-resolution-for-mutation
  - T-007-path-diagnostics
  - T-008-path-language-docs-and-verification
  - future_reader_subsystem
  - future_mutation_subsystem
  - future_transaction_writer_subsystem
public_contracts_provided:
- ai_editor.path_language package namespace
package_boundary_policy:
  initial_namespace_state:
    allowed:
    - package imports without filesystem side effects
    - explicit empty or minimal __all__
    - module docstring describing path_language scope
    forbidden:
    - parsing path strings during package import
    - resolving document nodes during package import
    - importing reader, mutation, validation, transaction writer, CLI, or MCP wrapper
      modules
    - reading files or environment state during package import
  future_export_policy:
  - Concrete path_language APIs are owned by later tactical steps.
  - Package-root re-exports are not required until a dedicated index owner or this
    plan explicitly allows them.
  - Later tactical steps must not silently edit ai_editor/path_language/__init__.py
    without ownership change.
responsibilities:
- Define the public namespace boundary for path_language.
- Keep path_language independent from read API helpers, mutations, validation, transaction
  writing, CLI, and MCP wrappers.
- Allow later path_language modules to be discovered by module path without exporting
  unstable internals.
implementation_notes:
- This step owns package boundary only; it must not implement grammar, tokens, parser,
  resolver, diagnostics, or normalization behavior.
- Path language code may later consume YamlDocument from G-002, but package import
  must not import document_io behavior eagerly.
- The package index should start empty or minimal.
verification:
  scope: tactical_completion_gate
  commands:
  - python -m pytest tests/path_language/test_package_boundary.py
  expected:
  - path_language package imports without importing forbidden subsystems.
  - Public namespace is explicit and minimal.
  - Package import does not parse paths, resolve nodes, read files, write files, or
    initialize CLI/MCP behavior.
acceptance_criteria:
- path_language package boundary is explicit.
- No reader, mutation, validation, writer, CLI, or MCP behavior is imported by package
  initialization.
- This tactical step edits only its owned package-boundary file and test.
model_assignment_spec:
  performer: coding_agent
  instruction: Work only on the path_language package boundary and its tests. Do not
    implement grammar, tokenization, parsing, normalization, resolution, diagnostics,
    reader APIs, mutations, validation, transaction writer, CLI, or MCP wrappers.
    Keep ai_editor.path_language imports side-effect free and minimal. Do not edit
    .venv, venv, site-packages, or installed dependencies.
