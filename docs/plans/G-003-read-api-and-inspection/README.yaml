format: global_package_step_v2
plan_id: ai_editor_pip_package_for_mcp
step_id: G-003
step_name: path_language
title: Structural YAML path language and node addressing subsystem
status: draft
source_plan: docs/plans/create_pip_package_for_mcp.yaml
global_intent: Own the YAML structural path language used by all higher-level read
  and write flows. This subsystem parses, normalizes, resolves, and reports diagnostics
  for paths such as commands[name=buf_diff].metadata without owning read APIs or mutation
  behavior.
why_this_block_exists: Every lower-level model working on path syntax must understand
  the whole path-language task without reading compat wrappers, mutation, validation,
  or writer plans. This block defines the grammar, resolver behavior, error semantics,
  and integration contract.
owned_code_paths:
- ai_editor/path_language/
- tests/path_language/
owned_docs_paths:
- docs/path_language.md
forbidden_code_paths:
- ai_editor/contracts/
- ai_editor/formatters/yaml/compat/
- ai_editor/formatters/yaml/document_io/
- ai_editor/editor_core/
- ai_editor/sessions/
- ai_editor/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_be_used_by:
  - G-010 YAMLFormatter (primary consumer — YAML mutations use path_language internally)
  - G-007 writer (ai_editor/writer.py uses path_language for changed_path verification)
  - G-008 interfaces_release
  may_depend_on:
  - G-001-package-contracts-and-distribution
  - G-002 document_io (at ai_editor/formatters/yaml/document_io/)
public_contracts_provided:
- YamlPath
- PathToken
- ResolvedNode
- PathDiagnostic
- parse_yaml_path(path_text)
- normalize_yaml_path(path)
- resolve_yaml_path(document, path)
- resolve_parent_for_mutation(document, path)
core_responsibilities:
- Define path grammar for mapping keys, list indexes, and list filters.
- Parse path strings into typed path tokens.
- Resolve paths against YamlDocument instances from document_io.
- Return typed errors for malformed, missing, ambiguous, and type-incompatible paths.
- Produce canonical normalized paths for changed_paths and diagnostics.
supported_path_syntax:
- top_level_key
- dotted.path.to.key
- list[0]
- commands[name=buf_diff]
- commands[name=buf_diff].metadata.best_practices[1]
error_codes_owned:
- PATH_PARSE_FAILED
- PATH_NOT_FOUND
- PATH_NOT_UNIQUE
- TARGET_TYPE_MISMATCH
subsystem_independence_rules:
- This subsystem must not read files directly; it receives YamlDocument from document_io.
- This subsystem must not implement yaml_get, yaml_set, or yaml_write_checked as standalone
  operations.
- This subsystem must not apply mutations or validate schemas.
- G-010 YAMLFormatter and G-004 compat wrappers must call this subsystem instead of
  parsing paths themselves.
implementation_outline:
- Implement tokenizer and parser for supported path syntax.
- Implement resolver over mapping/list structures from ruamel.yaml documents.
- Implement canonical path rendering.
- Add exhaustive tests for valid paths, malformed paths, missing nodes, ambiguous
  filters, and type mismatches.
verification:
  commands:
  - python -m pytest tests/path_language
  expected:
  - Parser resolves commands[name=buf_diff].metadata.
  - Parser rejects malformed paths with PATH_PARSE_FAILED.
  - Resolver returns PATH_NOT_FOUND for absent keys or indexes.
  - Resolver returns PATH_NOT_UNIQUE for duplicate filter matches.
acceptance_criteria:
- Path grammar is documented and test-covered.
- Path resolver is the only implementation of structural node addressing.
- Downstream subsystems can depend on stable path contracts without editing path_language
  code.
model_assignment_spec:
  performer: coding_agent
  instruction: Implement only structural YAML path parsing and resolution. Do not
    implement read API helpers, mutations, validation, transaction writing, CLI, or
    MCP wrappers. Lower detailed steps under this block should treat path_language
    as a standalone subsystem.
