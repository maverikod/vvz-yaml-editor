format: global_package_step_v2
plan_id: ai_editor_pip_package_for_mcp
step_id: G-013
step_name: cst_formatter
title: Built-in CST formatter backend for Python files
status: draft
source_plan: docs/plans/create_pip_package_for_mcp.yaml
source_documents:
- docs/tech_spec.md
- cst-code/README.md
global_intent: Own the built-in CST formatter for .py files. Adapts the existing cst-code
  subsystem into an AbstractFormatter implementation. The document in buffer is a
  CSTTree. The formatter owns parse/render/mutate/query semantics for Python source
  via LibCST. It does not open, save, or close files.
why_this_block_exists: Python files require structural editing at the AST/CST level,
  not line ranges. The cst-code subsystem already implements tree loading, stable
  node identity, mutation operations, sidecar caching, and XPath-like query. This
  block formalizes that code as a first-class AbstractFormatter so editor core, search,
  and public interfaces treat .py files uniformly with other formats.
owned_code_paths:
- ai_editor/formatters/cst/
- tests/formatters/cst/
owned_docs_paths:
- docs/cst_formatter.md
source_code_origin:
  path: cst-code/
  policy: adapt-not-rewrite
  take:
  - code_analysis/core/cst_tree/models.py
  - code_analysis/core/cst_tree/tree_builder.py
  - code_analysis/core/cst_tree/tree_modifier.py
  - code_analysis/core/cst_tree/tree_modifier_ops.py
  - code_analysis/core/cst_tree/tree_modifier_ops_find.py
  - code_analysis/core/cst_tree/tree_modifier_ops_insert.py
  - code_analysis/core/cst_tree/tree_modifier_ops_parse.py
  - code_analysis/core/cst_tree/tree_modifier_ops_replace.py
  - code_analysis/core/cst_tree/tree_modifier_validate.py
  - code_analysis/core/cst_tree/tree_saver.py
  - code_analysis/core/cst_tree/tree_sidecar.py
  - code_analysis/core/cst_tree/tree_metadata.py
  - code_analysis/core/cst_tree/node_stable_id.py
  - code_analysis/core/cst_tree/node_type_utils.py
  - code_analysis/core/cst_tree/skeleton.py
  - code_analysis/core/cst_module/patcher.py
  - code_analysis/core/cst_module/patcher_insert.py
  - code_analysis/core/cst_module/patcher_create.py
  - code_analysis/core/cst_module/blocks.py
  - code_analysis/core/cst_module/validation.py
  - code_analysis/core/cst_module/docstring_validator.py
  - code_analysis/core/cst_module/models.py
  - code_analysis/core/cst_module/utils.py
  - code_analysis/core/mutable_cst/
  - code_analysis/cst_query/
  do_not_take:
  - code_analysis/core/cst_tree/node_id_markers.py
  - code_analysis/commands/
  - code_analysis/core/database/
  - code_analysis/core/database_client/
  - code_analysis/core/database_driver_pkg/
  - code_analysis/core/file_handlers/
  - code_analysis/cli/
  forbidden_patterns:
  - write_side_marker_functions_forbidden: 'append_persisted_node_ids, render_marker_block
      must not be called anywhere in adapted code. These write trailing # cst-node-ids
      blocks to .py files.'
  - inline_marker_transport_forbidden: set_stable_id, get_stable_id from node_stable_id.py
      must not be called as part of mutation flow. stable_id survives via previous_metadata_map
      in _build_tree_index.
  - read_side_strip_helpers_allowed: strip_persisted_node_ids and strip_inline_node_id_lines_from_source
      are allowed as defensive read-time cleaners only. They must not write files.
  - in_memory_registry_forbidden: _trees dict, get_tree, remove_tree, start_cst_tree_ttl_cleanup,
      load_file_to_tree belong to the server session layer, not CSTFormatter. CSTFormatter
      is stateless; tree lifetime managed by editor core buffer registry.
  - file_reading_forbidden_in_formatter: 'load_file_to_tree reads from disk. CSTFormatter.parse
      receives raw_content: str from editor core, not a file path.'
  - sidecar_write_forbidden_in_parse: write_sidecar_atomic must not be called from
      CSTFormatter.parse. Sidecar is written only from save orchestration.
forbidden_code_paths:
- ai_editor/editor_core/
- ai_editor/search/
- ai_editor/interfaces/
- ai_editor/transaction_writer/
- ai_editor/formatters/text/
- ai_editor/formatters/ai/
- ai_editor/formatters/foreign.py
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - G-010 AbstractFormatter contract
  - libcst >= 1.1
  - lark (cst_query XPath parser)
  may_be_used_by:
  - G-009 editor core and buffer registry (opens .py via CSTFormatter)
  - G-011 universal search layer (iter_units via CSTFormatter)
  - G-008 public interfaces (validate_file for .py)
public_contracts_provided:
- CSTFormatter (implements AbstractFormatter)
- CSTTree (document model, opaque to editor core)
- stable_id (durable node address surviving mutations)
- skeleton view (declarative read mode)
- cst_query specific command (XPath-like search)
formatter_registration:
  extension: .py
  formatter_name: cst
document_model:
  type: CSTTree
  description: 'In-memory LibCST tree with node index. Opaque to editor core. address
    is stable_id: a UUID assigned once at first parse, never changed.'
  key_fields:
  - tree_id: runtime session UUID
  - module: libcst.Module object
  - metadata_map: node_id -> TreeNodeMetadata (carries stable_id)
  - node_map: node_id -> libcst.CSTNode
  - node_id_aliases: old_node_id -> current_node_id (transitive, updated after each
      mutation)
  - root_node_id: stable_id of module root
stable_id_contract:
  address_for_callers: stable_id only. node_id is internal. All public operations
    — insert, delete, replace, move, get_unit, skeleton, cst_query — accept and return
    stable_id.
  no_inline_markers: The @node-id leading_lines comment mechanism (node_stable_id.py
    set_stable_id/get_stable_id) is NOT used as mutation transport. It is legacy.
    Do not call set_stable_id or get_stable_id as part of mutation flow.
  node_stable_id_py_usage: node_stable_id.py is kept only for strip_inline_node_id_lines_from_source
    — a defensive read-time cleaner for files that may contain legacy @node-id comments.
    It does NOT write any comments to source.
  resolution: find_by_stable_id(stable_id) -> TreeNodeMetadata -> node_id -> libcst
    object
  rule: stable_id is a field in TreeNodeMetadata. Assigned once at first _build_tree_index
    (equals node_id on first assignment). Never changes across any number of mutations
    or tree rebuilds.
  storage: stable_id is stored in TreeNodeMetadata.stable_id and persisted in sidecar
    metadata_map.
  survival_across_mutations: 'After any mutation _build_tree_index is called with
    previous_metadata_map. For each rebuilt node: stable_id is copied from previous_metadata_map
    by exact_key (start_line, start_col, end_line, end_col, type) matching. For nodes
    that moved position, previous_obj_to_id (id(libcst_object) -> node_id) is used
    as secondary lookup. New nodes get stable_id = node_id (fresh UUID). No inline
    comment transport.'
sidecar_contract:
  path_pattern: '{py_dir}/.cst/{py_stem}.tree'
  purpose: Persist node identity (stable_id, metadata_map) and checksums so the tree
    can be reloaded without re-parsing when the source has not changed.
  two_checksums:
    source_sha256: SHA-256 of UTF-8 bytes of logical Python source (tree.module.code
      at write time). Validated on load against SHA-256 of fresh .py content stripped
      of any legacy trailing marker block.
    tree_sha256: SHA-256 of the JSON body bytes of the sidecar file. Written into
      the header line. Validated on load to detect sidecar corruption or partial write.
  format: 'Line 1: CST_TREE_V1 sha256=<source_sha256_hex> tree_sha256=<tree_body_sha256_hex>

    Line 2+: JSON body'
  json_body_fields:
  - format_version
  - source_sha256
  - tree_sha256
  - root_node_id
  - path_to_node_id (path_indices string -> node_id)
  - metadata_map (node_id -> TreeNodeMetadata.to_dict with stable_id)
  - metadata_node_order
  - parent_map
  - node_id_aliases
  validation_on_load:
  - 1. Read sidecar. If missing or unreadable -> skip sidecar, build from scratch.
  - 2. Parse header. Extract source_sha256 and tree_sha256.
  - '3. Validate tree_sha256: SHA-256(json_body_bytes) must equal tree_sha256. Mismatch
    -> sidecar corrupt, build from scratch.'
  - 4. Compute SHA-256(logical_source) from .py file content (strip legacy trailing
    marker block first). Must equal source_sha256. Mismatch -> source changed, build
    from scratch.
  - 5. Load metadata_map from sidecar. Call sidecar_matches_built_tree to confirm
    path->node_id layout. Mismatch -> build from scratch.
  - '6. All checks pass: use sidecar metadata_map directly, skip libcst re-parse.
    module still parsed from logical_source so libcst object graph is live.'
  written_at: After editor_core writes .py to disk (buffer.save / buffer.save_as).
    CSTFormatter.write_sidecar(py_path, tree) called by save orchestration. NOT written
    during parse.
  atomic_write: Write to .tmp file in .cst/ dir then os.replace to final path.
parse_contract:
  error_contract: libcst.ParserSyntaxError -> CSTFormatter re-raises as FORMAT_VALIDATION_FAILED
    with CST_PARSE_FAILED diagnostic. Editor core catches and falls back to text formatter
    (G-009 formatter_fallback_policy). Empty file -> return empty CSTTree with empty
    module body, no error. No auto-fix of syntax errors inside CSTFormatter.
  lifecycle_open_without_sidecar:
  - '1. Receive raw_content: str from editor core.'
  - '2. Strip legacy trailing marker block: strip_persisted_node_ids(raw_content)
    -> logical_source. (Defensive: new files will have no markers.)'
  - '3. Strip legacy inline @node-id comment lines: strip_inline_node_id_lines_from_source(logical_source).
    (Defensive: new files will have none.)'
  - 4. Compute source_sha256 = SHA-256(logical_source.encode('utf-8')).
  - '5. If file_path given: attempt sidecar load per sidecar_contract.validation_on_load.
    Both checksums must pass. If valid -> load metadata_map from sidecar, go to step
    9.'
  - '6. Parse: module = libcst.parse_module(logical_source). If ParserSyntaxError
    -> raise FORMAT_VALIDATION_FAILED + CST_PARSE_FAILED. Do not attempt auto-fix.'
  - '7. Build index: _build_tree_index(tree, previous_metadata_map=None). Each node:
    stable_id = node_id (new UUID). stable_id stored in TreeNodeMetadata.'
  - 8. Return CSTTree. Sidecar NOT written here.
  - 9. Return CSTTree. module parsed from logical_source so libcst graph is live.
    metadata_map from sidecar if step 5 succeeded.
  lifecycle_open_with_valid_sidecar: source_sha256 matches AND tree_sha256 matches
    AND sidecar_matches_built_tree passes -> metadata_map loaded from sidecar, module
    parsed from source, _build_tree_index skipped. Fast path.
  method: 'parse(raw_content: str, file_path: str | None = None) -> CSTTree'
  note: CSTFormatter.parse receives content as string from editor core. Editor core
    owns file I/O. file_path is optional metadata used only to locate the sidecar.
render_contract:
  method: render(document) -> str
  output: tree.module.code
  guarantee: clean Python source, no markers of any kind
save_orchestration:
  owner: editor core (buffer.save / buffer.save_as)
  steps:
  - 1. validate_document(document) -> ValidationResult. Failure -> abort, return error.
  - 2. render(document) -> python_source string.
  - 3. Editor core writes .py file atomically.
  - '4. CSTFormatter.write_sidecar(py_path, tree): compute source_sha256 = SHA-256(tree.module.code);
    serialise metadata_map to JSON body; compute tree_sha256 = SHA-256(json_body_bytes);
    write ''CST_TREE_V1 sha256=<source_sha256> tree_sha256=<tree_sha256>'' as header
    line, then JSON body, atomically to .cst/<stem>.tree.'
  - 5. tree.disk_source_sha256_hex = source_sha256.
mutation_operations:
  note: all operations receive and return stable_id as address; node_id is internal
  operations:
  - op: insert
    params:
    - parent_stable_id
    - position
    - code
    position_values:
    - first
    - last
    - after:<stable_id>
    special_cases:
    - empty file: create Module with docstring + first node
    - SimpleStatementSuite parent: auto-expand to IndentedBlock before insert
    - Match node as parent: reject with hint to use MatchCase
  - op: delete
    params:
    - node_stable_id
    note: descendants deleted automatically by LibCST
  - op: move
    params:
    - node_stable_id
    - parent_stable_id
    - position
    note: atomic delete + insert preserving node code
  - op: replace
    params:
    - node_stable_id
    - code
    note: full node replacement; header-only replace for ClassDef/FunctionDef preserves
      body
  - op: replace_docstring
    params:
    - node_stable_id
    - text
    note: specialized replace for file/class/method docstring; targets Expr(SimpleString)
      at position 0 of node body; inserts if absent, replaces if present
libcst_constraints_and_workarounds:
- constraint: SimpleStatementSuite cannot accept inserted children
  workaround: auto-expand one-liner to IndentedBlock before insert
- constraint: Match node body is not directly insertable
  workaround: require MatchCase as parent_stable_id; reject Match with clear error
- constraint: all nodes recreated after any transformation (immutable tree)
  workaround: stable_id transport via leading_lines comments before/after mutation
- constraint: docstring is not a named child but positional Expr at body[0]
  workaround: replace_docstring operation detects and handles this pattern explicitly
- constraint: CSTTransformer matches by object identity (is), not by position
  workaround: node_map holds pre-mutation objects; find_parent_in_module_by_position
    resolves post-mutation
read_operations:
  default_buffer_format: declarative. When editor core opens a .py file via CSTFormatter
    the view returned to the caller is the declarative overview, not full source.
    Full source available on demand via get_unit(stable_id).
  declarative:
    alias_function: build_declarative_overview(tree) -> (text, outline_nodes)
    default: true
    description: Declarative view of file structure without implementation bodies.
      Every element carries its stable_id prefixed as [stable_id] in the signature
      line.
    hides:
    - method bodies
    - function bodies
    - complex initializers
    method: 'skeleton(document: CSTTree) -> str'
    placeholder: 'Function and method bodies show: # Implementation hidden; request
      node by node_id for full code'
    shows:
    - file docstring
    - import statements with stable_id
    - class definition header with stable_id
    - class docstring
    - class properties (Assign / AnnAssign) with stable_id and first line
    - method signatures with stable_id
    - method docstrings
    - function signatures with stable_id
    - function docstrings
    stable_id_in_output: Every visible element prefixed with [stable_id] so caller
      can address nodes directly for get_unit or mutation.
  get_unit:
    description: Returns full source code of the node identified by stable_id, including
      implementation body.
    method: 'get_unit(document: CSTTree, stable_id: str) -> unit'
  iter_units:
    description: Iterates over visible units for search layer (G-011). Each unit carries
      stable_id and declarative metadata.
    method: 'iter_units(document: CSTTree, scope: str | None) -> Iterator[unit]'
  list_units:
    description: Returns flat list of all nodes with stable_id, type, kind, name,
      qualname, start_line, end_line. No source bodies included. Used for navigation
      and as cst_query result metadata.
    method: 'list_units(document: CSTTree) -> List[unit]'
specific_commands:
  cst_query:
    description: XPath-like search over document nodes using Lark-based selector parser.
    implementation: cst_query package (existing Lark grammar, parser, executor)
    result_format: declarative. Each matched node is presented as declarative overview
      (signature + docstring + children signatures, no bodies). Same rules as skeleton().
      Full body available via get_unit(stable_id).
    returns: 'List of nodes. Each entry: stable_id, type, name, qualname, start_line,
      end_line. Implementation body not included by default.'
    selector_examples:
    - //FunctionDef[@name='foo']
    - class > method:first
    - Def:*[start_line>=100]
    - function[@name^='_']:not([name^='__'])
validation:
  validate_content:
    input: raw Python source string
    behavior: parse via libcst; return syntax errors as diagnostics
    used_by: validate_file for .py in G-008
  validate_document:
    input: CSTTree
    behavior: compile tree.module.code; return compile errors as diagnostics
verification:
  scope: global_completion_gate
  commands:
  - python -m pytest tests/formatters/cst
  expected:
  - parse round-trips without loss (render(parse(src)) == src for valid Python)
  - stable_id survives insert, delete, replace, move operations
  - no node-id comments appear in render() output
  - no marker block appears in .py file after buffer.save
  - sidecar written after save; reloaded correctly on next parse if sha256 matches
  - skeleton returns only declarative elements with stable_id
  - cst_query returns correct nodes for XPath selectors
  - replace_docstring inserts docstring when absent, replaces when present
  - SimpleStatementSuite parent is auto-expanded before insert
  - delete removes node and all descendants
  - move is atomic (no partial state on failure)
acceptance_criteria:
- CSTFormatter implements AbstractFormatter contract in full
- document model is CSTTree; address is stable_id; both are opaque to editor core
- stable_id never changes across any number of mutations
- no persistence markers of any kind appear in .py files or render() output
- sidecar is the only persistence mechanism for node identity
- all five mutation operations work correctly with stable_id addressing
- skeleton view is the default read mode for models consuming .py files
- cst_query XPath search is available as a specific_command
- validate_content returns LibCST syntax diagnostics usable by validate_file
- node_id_markers.py and all trailing marker block code is absent from this subsystem
model_assignment_spec:
  performer: coding_agent
  instruction: Implement CSTFormatter under ai_editor/formatters/cst/ by adapting
    cst-code as specified in source_code_origin. Do not rewrite from scratch. Do not
    use node_id_markers.py or any trailing marker block mechanism. stable_id transport
    between mutation steps uses only set_stable_id/get_stable_id (inline leading_lines
    comments, FunctionDef and ClassDef only). For all other node types, stable_id
    is transferred via previous_metadata_map in _build_tree_index using exact_key
    position matching. Do not edit editor_core, search, interfaces, transaction_writer,
    text formatter, ai formatter, foreign formatter, .venv, venv, or site-packages.
observations_template:
- command: ''
  expected: ''
  actual: ''
  error: ''
  root_cause: ''
  fix: ''
  post_fix_verification: ''
  status: ''
formatter_contract_extensions:
  parse_exception_contract:
    behavior: libcst.parse_module raises cst.ParserSyntaxError; CSTFormatter.parse
      catches it and re-raises as FORMAT_VALIDATION_FAILED with CST_PARSE_FAILED diagnostic
    caller_behavior: editor core catches FORMAT_VALIDATION_FAILED and falls back to
      text formatter (see G-009 formatter_fallback_policy)
    must_raise_on:
    - any Python source that libcst.parse_module cannot parse
    - structurally corrupt .py file
    must_not_raise_on:
    - syntactically valid Python regardless of style
    - 'empty file: return empty CSTTree with empty module body'
  validate_document_contract:
    behavior: compile tree.module.code via compile() built-in; return ValidationResult
      with syntax diagnostics on failure
    called_by: editor core as first stage of save/save_as pipeline and by validate(buffer_id)
    must_not:
    - write files
    - modify document
    - re-parse from disk
