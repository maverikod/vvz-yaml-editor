allowed_dependencies:
  may_depend_on:
  - G-010 AbstractFormatter contract
  - libcst >= 1.1
  - lark (cst_query XPath parser)
  may_be_used_by:
  - G-009 editor core and buffer registry (opens .py via CSTFormatter)
  - G-011 universal search layer (iter_units via CSTFormatter)
  - G-008 public interfaces (validate_file for .py)
public_contracts_provided:
- CSTFormatter (implements AbstractFormatter)
- CSTTree (document model, opaque to editor core)
- stable_id (durable node address surviving mutations)
- skeleton view (declarative read mode)
- cst_query specific command (XPath-like search)
formatter_registration:
  extension: .py
  formatter_name: cst
document_model:
  type: CSTTree
  description: 'In-memory LibCST tree with node index. Opaque to editor core. address
    is stable_id: a UUID assigned once at first parse, never changed.'
  key_fields:
  - tree_id: runtime session UUID
  - module: libcst.Module object
  - metadata_map: node_id -> TreeNodeMetadata (carries stable_id)
  - node_map: node_id -> libcst.CSTNode
  - node_id_aliases: old_node_id -> current_node_id (transitive, updated after each
      mutation)
  - root_node_id: stable_id of module root
stable_id_contract:
  address_for_callers: stable_id only. node_id is internal. All public operations
    accept and return stable_id.
  assignment_rule: 'stable_id is assigned EXACTLY ONCE per node: at the moment the
    node first appears in _build_tree_index. Value = node_id at first assignment (UUID4).
    It is stored in TreeNodeMetadata.stable_id and in sidecar metadata_map. It is
    NEVER reassigned.'
  node_stable_id_py_role: node_stable_id.py provides set_stable_id(node, stable_id)
    and get_stable_id(node) for transient in-memory embedding of stable_id into FunctionDef/ClassDef
    node data (leading_lines EmptyLine comment) during INSERT/DELETE/MOVE mutations
    ONLY. This is not persistence — it is a mutation transport mechanism within a
    single mutation step. strip_inline_node_id_lines_from_source() is used at parse
    time (defensive cleaner for legacy files) and after mutation recovery to clean
    the module source before re-indexing.
  persistence: stable_id persists in sidecar metadata_map. Loaded on next parse when
    both checksums match. Never written into .py source files.
  resolution: find_by_stable_id(stable_id) -> TreeNodeMetadata -> node_id -> libcst
    object. Linear scan over metadata_map.values().
  rule: stable_id is assigned once. Never changes. Stored in node metadata and sidecar.
    Transiently embedded in node data (leading_lines) during INSERT/DELETE/MOVE only,
    removed immediately after recovery.
  survival_across_mutations:
    for_replace_replace_docstring: previous_metadata_map exact_key (start_line, start_col,
      end_line, end_col, type) is sufficient. No position shift for replaced nodes.
      No inline comment needed.
    for_structural_mutations_insert_delete_move: '1. Before mutation: embed stable_id
      into each FunctionDef/ClassDef node data via set_stable_id(node, stable_id)
      -> inserts leading_lines comment ''# @node-id: <uuid>'' into node object in
      memory. 2. Run LibCST transformation. The comment travels with the node through
      the transformation because it is part of the node object. 3. After mutation:
      call get_stable_id(node) on each FunctionDef/ClassDef in the new tree to recover
      stable_ids. Call strip_inline_node_id_lines_from_source(module.code) to remove
      all @node-id lines from module source. 4. Call _build_tree_index(previous_metadata_map=recovered_map).
      For non-FunctionDef/ClassDef nodes: use exact_key + previous_obj_to_id.'
    new_nodes: 'If a node cannot be matched by any mechanism: it is new, gets stable_id
      = new UUID4.'
    primary_all_ops: 'Snapshot previous_metadata_map before mutation. Build previous_obj_to_id
      = {id(libcst_node): node_id for node in node_map}. After mutation call _build_tree_index(previous_metadata_map,
      previous_obj_to_id).'
sidecar_contract:
  atomic_write: Write to .tmp file then os.replace to final path. Used for both session-side
    and project-side sidecars.
  existing_mechanism: tree_sidecar.py in cst-code implements write_sidecar_atomic,
    read_sidecar_payload, parse_sidecar_file, tree_to_sidecar_payload. Adapt, do not
    rewrite.
  format: 'Line 1: CST_TREE_V1 sha256=<source_sha256> tree_sha256=<tree_body_sha256_hex>

    Line 2+: JSON body'
  json_body_fields:
  - format_version
  - source_sha256
  - tree_sha256
  - root_node_id
  - path_to_node_id
  - metadata_map (node_id -> TreeNodeMetadata.to_dict with stable_id)
  - metadata_node_order
  - parent_map
  - node_id_aliases
  path_patterns:
    project_side: '{py_dir}/.cst/{py_stem}.tree  — written on save/save_as and when
      auto_write=True'
    session_side: <session_dir>/<buffer_id>.cst  — written after every mutation
  purpose: Persist node identity (stable_id in metadata_map) and checksums. Session-side
    sidecar tracks current in-session tree state. Project-side sidecar is the stable
    on-disk cache.
  two_checksums:
    source_sha256: SHA-256 of UTF-8 bytes of logical Python source. Computed as SHA-256(tree.module.code.encode('utf-8')).
    tree_sha256: SHA-256 of the JSON body text of the sidecar file.
  validation_on_load:
  - 1. Check session-side sidecar first (<session_dir>/<buffer_id>.cst). If valid
    (both checksums pass) -> use it. Fast path.
  - '2. If session-side missing or invalid: check project-side sidecar (.cst/<stem>.tree).
    If valid -> use it.'
  - '3. If neither valid: build tree from scratch via _build_tree_index. All stable_ids
    are new UUID4.'
  - '4. Validation: parse header, check tree_sha256 = SHA-256(json_body), check source_sha256
    = SHA-256(file_content).'
  - 5. Load metadata_map. Call sidecar_matches_built_tree. Mismatch -> build from
    scratch.
  written_at: 'Session-side: after every mutation (always). Project-side: on save/save_as
    and when auto_write=True.'
parse_contract:
  error_contract: libcst.ParserSyntaxError -> CSTFormatter re-raises as FORMAT_VALIDATION_FAILED
    with CST_PARSE_FAILED diagnostic. Editor core catches and falls back to text formatter
    (G-009 formatter_fallback_policy). Empty file -> return empty CSTTree with empty
    module body, no error. No auto-fix of syntax errors inside CSTFormatter.
  lifecycle_open_without_sidecar:
  - '1. Receive raw_content: str from editor core.'
  - '2. Strip legacy trailing marker block: strip_persisted_node_ids(raw_content)
    -> logical_source. (Defensive: new files will have no markers.)'
  - '3. Strip legacy inline @node-id comment lines: strip_inline_node_id_lines_from_source(logical_source).
    (Defensive: new files will have none.)'
  - 4. Compute source_sha256 = SHA-256(logical_source.encode('utf-8')).
  - '5. If file_path given: attempt sidecar load per sidecar_contract.validation_on_load.
    Both checksums must pass. If valid -> load metadata_map from sidecar, go to step
    9.'
  - '6. Parse: module = libcst.parse_module(logical_source). If ParserSyntaxError
    -> raise FORMAT_VALIDATION_FAILED + CST_PARSE_FAILED. Do not attempt auto-fix.'
  - '7. Build index: _build_tree_index(tree, previous_metadata_map=None). Each node:
    stable_id = node_id (new UUID). stable_id stored in TreeNodeMetadata.'
  - 8. Return CSTTree. Sidecar NOT written here.
  - 9. Return CSTTree. module parsed from logical_source so libcst graph is live.
    metadata_map from sidecar if step 5 succeeded.
  lifecycle_open_with_valid_sidecar: source_sha256 matches AND tree_sha256 matches
    AND sidecar_matches_built_tree passes -> metadata_map loaded from sidecar, module
    parsed from source, _build_tree_index skipped. Fast path.
  method: 'parse(raw_content: str, file_path: str | None = None) -> CSTTree'
  note: CSTFormatter.parse receives content as string from editor core. Editor core
    owns file I/O. file_path is optional metadata used only to locate the sidecar.
render_contract:
  method: render(document) -> str
  output: tree.module.code
  guarantee: clean Python source, no markers of any kind
save_orchestration:
  owner: CSTFormatter (called by session layer after every mutation and on save/save_as)
  steps:
  - 1. validate_document(document) -> ValidationResult. Failure -> abort, return error.
  - 2. render(document) -> python_source string.
  - '3. Write sidecar to session dir: compute source_sha256 = SHA-256(tree.module.code);
    serialise metadata_map to JSON body; compute tree_sha256 = SHA-256(json_body_bytes);
    write ''CST_TREE_V1 sha256=<source_sha256> tree_sha256=<tree_sha256>'' as header
    line, then JSON body, atomically to <session_dir>/<buffer_id>.cst. This happens
    after EVERY mutation (buf write path).'
  - '4. If session.auto_write=True (result write path): formatter.write(python_source,
    real_file_path) via ai_editor/writer.py (backup + atomic write + read-back). Then
    also write sidecar to .cst/<stem>.tree alongside the real .py file.'
  - '5. If session.auto_write=False: real file and project-side sidecar are NOT written.
    Only session-side sidecar (<buffer_id>.cst) is written.'
  - '6. On explicit save/save_as (not auto_write): step 4 always executes — write
    real file and project-side sidecar.'
  sidecar_locations:
    project_side: .cst/<stem>.tree alongside the real .py file. Written on save/save_as
      and on auto_write=True mutations.
    session_side: <session_dir>/<buffer_id>.cst. Written after every mutation (always).
      Contains current in-session tree state.
mutation_operations:
  inline_comment_transport:
    invariant: THIS MECHANISM IS NOT USED IN THE ADAPTED CSTFORMATTER. set_stable_id/get_stable_id
      inline comment transport violated the single-assignment rule. Legacy reference
      only — do not implement.
    legacy_note: cst-code tree_builder.py used @node-id leading_lines comments in
      FunctionDef/ClassDef as a mutation transport. This is superseded by previous_metadata_map
      + previous_obj_to_id approach.
    status: REMOVED
  libcst_constraints_requiring_workarounds:
    Match_node_rejection: Match node body is not directly insertable. Require MatchCase
      as parent_stable_id; reject Match with clear error.
    SimpleStatementSuite_expansion: SimpleStatementSuite cannot accept inserted children.
      Auto-expand one-liner to IndentedBlock before insert.
    docstring_positional: Docstring is positional Expr at body[0]. replace_docstring
      detects and handles this explicitly.
    immutable_tree_recreation: 'All nodes recreated after any transformation. Stable_id
      survival: previous_metadata_map exact_key matching + previous_obj_to_id (id(obj)->node_id).
      No inline comment transport.'
    transformer_object_identity: CSTTransformer matches by object identity. node_map
      holds pre-mutation objects; previous_obj_to_id maps post-mutation recovery.
  note: All operations accept and return stable_id as address. node_id is internal.
  operations:
  - op: insert
    params:
    - parent_stable_id
    - position
    - code
    position_values:
    - first
    - last
    - after:<stable_id>
    special_cases:
    - empty file: create Module with docstring + first node
    - SimpleStatementSuite parent: auto-expand to IndentedBlock before insert
    - Match node as parent: reject with hint to use MatchCase
    stable_id_survival: previous_metadata_map exact_key + previous_obj_to_id in _build_tree_index
      after mutation
  - note: descendants deleted automatically by LibCST
    op: delete
    params:
    - node_stable_id
    stable_id_survival: previous_metadata_map exact_key + previous_obj_to_id
  - note: atomic delete + insert preserving node code
    op: move
    params:
    - node_stable_id
    - parent_stable_id
    - position
    stable_id_survival: previous_metadata_map exact_key + previous_obj_to_id
  - note: full node replacement; header-only replace for ClassDef/FunctionDef preserves
      body
    op: replace
    params:
    - node_stable_id
    - code
    stable_id_survival: previous_metadata_map exact_key
  - note: specialized replace for file/class/method docstring; inserts if absent,
      replaces if present
    op: replace_docstring
    params:
    - node_stable_id
    - text
    stable_id_survival: previous_metadata_map exact_key
  stable_id_survival_mechanism: 'Before mutation: snapshot tree.metadata_map as previous_metadata_map
    and build previous_obj_to_id = {id(libcst_node): node_id for each node in node_map}.
    Run mutation. After mutation: call _build_tree_index(previous_metadata_map=previous_metadata_map,
    previous_obj_to_id=previous_obj_to_id). For each rebuilt node: try exact_key (start_line,
    start_col, end_line, end_col, type) -> get stable_id from prev_meta; if not found
    try previous_obj_to_id; if not found: new node, new UUID4. No inline comments.'
libcst_constraints_and_workarounds:
  constraint_1_immutable_nodes:
    constraint: LibCST tree is immutable. Any `with_changes()` or `visit()` creates
      entirely new node objects throughout the ancestor chain. After mutation, `node_map`
      (id(obj)->node_id) is stale for all affected nodes.
    workarounds:
    - 'stable_id survival: snapshot `previous_metadata_map` before mutation, build
      `previous_obj_to_id = {id(v): k for k, v in tree.node_map.items()}` before mutation.
      After mutation call `_build_tree_index(previous_metadata_map=..., previous_obj_to_id=...)`.
      For each rebuilt node: try exact_key (start_line, start_col, end_line, end_col,
      type) to get previous stable_id; fallback to previous_obj_to_id for object identity
      match; fallback to new UUID4.'
    - 'node_map goes stale in batch: partial `_remove_operation_nodes_from_index`
      after each sequential operation removes only the targeted nodes so remaining
      valid node_ids stay addressable for the next operation in the batch.'
  constraint_2_transformer_object_identity:
    constraint: CSTTransformer.on_leave matches nodes by Python object identity (`original_node
      is target`). After any prior transformation in a batch, `node_map` may hold
      pre-mutation object references that no longer exist in the current module tree.
    workarounds:
    - 'For compound statements (FunctionDef, ClassDef, If, For, While, Try, With):
      `resolve_replace_target_to_current_module(module, node, metadata)` re-resolves
      by type+name+start_position scan via MetadataWrapper+PositionProvider. Used
      before every replace and delete.'
    - 'For inserts: `find_parent_in_module_by_position(module, start_line, start_col)`
      scans current module for the container by exact start position; if not found
      (positions shifted after prior inserts) falls back to smallest span containing
      the target position.'
    - 'For fine-grained nodes (Name, Param, Annotation): `find_leaf_node_in_module_by_position()`
      with exact 4-coordinate match + preferred_type disambiguation by depth.'
  constraint_3_simple_statement_suite:
    constraint: '`SimpleStatementSuite` (one-liner body, e.g. `def f(): pass`) has
      no insertable children collection. `insert_node_at_position` raises ValueError
      when parent is SimpleStatementSuite.'
    workaround: 'Detect parent type before insert. If `isinstance(parent_node, cst.SimpleStatementSuite)`:
      raise with message ''Expand the block to IndentedBlock first, then insert.''
      The caller (or a pre-insert step) must rewrite the function/class to use IndentedBlock
      body before inserting into it.'
  constraint_4_match_node:
    constraint: '`Match` node body is a sequence of `MatchCase` nodes, not `BaseStatement`.
      Direct insertion into Match is not supported by the insert logic.'
    workaround: 'Detect `isinstance(parent_node, cst.Match)` and raise ValueError:
      ''Use MatchCase node as parent_node_id instead.'' Callers must pass a MatchCase
      stable_id as parent.'
  constraint_5_codegen_compat:
    constraint: libcst 1.8.x codegen passes `default_semicolon=` kwarg to `SimpleStatementLine._codegen_impl(self,
      state)` which does not accept it, causing TypeError.
    workaround: 'Monkey-patch at module load: wrap `SimpleStatementLine._codegen_impl`
      to accept `**kwargs` and ignore them. Applied once via `_apply_libcst_codegen_compat()`
      at import time.'
  constraint_6_insert_target_normalization:
    constraint: Callers may pass a stable_id pointing to any node (e.g. an Import
      inside SimpleStatementLine, or a Name inside FunctionDef). The insert logic
      needs a statement-level ancestor that is a direct child of the body list.
    workaround: '`insert_node_relative()` walks up the `parent_id` chain in `metadata_map`
      from the target node until it finds an ancestor whose `(start_line, start_col)`
      matches a direct element of the parent body (resolved via PositionProvider scan).
      This means callers never need to manually pick the right statement level — any
      node_id from anywhere in the subtree works.'
  constraint_7_batch_mutable_path:
    constraint: 'Sequential single-op LibCST transformations for multi-op batches
      are slow and fragile: each op re-parses, positions shift, object identity is
      lost for subsequent ops.'
    workaround: 'For batches of (>1 replace or >1 insert or any delete) without REPLACE_RANGE
      or MOVE: use `mutable_cst` layer (`build_from_libcst` -> `apply_operations`
      -> `serialize_to_source` -> `cst.parse_module`). This converts the immutable
      LibCST tree to a mutable representation, applies all ops at once, then re-parses
      the result. Falls back to sequential if `mutable_cst` is unavailable or if fine-grained
      node types (Name, Param) are targeted. For sequential multi-op: sort DELETE
      bottom-to-top, then REPLACE bottom-to-top, then INSERT bottom-to-top by parent
      position to prevent position shift from invalidating subsequent targets.'
  stable_id_in_node_data_during_mutation:
    invariant: After mutation completes, `@node-id` blocks do NOT exist anywhere.
      They are transient in the source text only between `set_stable_id()` call and
      the subsequent `strip_inline_node_id_lines_from_source()` call within the same
      mutation step.
    lifecycle: '1. Before structural mutation: for each FunctionDef/ClassDef in tree.module,
      call `set_stable_id(node, stable_id)` — embeds `# @node-id: <uuid>` as a leading_lines
      EmptyLine comment directly in the node data (in memory, not on disk). 2. Run
      LibCST transformation (insert/delete/move). FunctionDef/ClassDef nodes carry
      their stable_id through the transformation because the comment travels with
      the node object. 3. After mutation: walk new tree, call `get_stable_id(node)`
      on each FunctionDef/ClassDef — recover stable_id from leading_lines. Strip all
      @node-id comments from module.code via `strip_inline_node_id_lines_from_source()`.
      4. Call `_build_tree_index` with recovered stable_ids in `previous_metadata_map`.
      The stable_id is now back in metadata only — never in source.'
    why_inline: For INSERT/DELETE/MOVE operations, node positions shift throughout
      the tree. exact_key matching (start_line, start_col, end_line, end_col, type)
      fails for nodes that moved. previous_obj_to_id also fails because LibCST recreates
      all ancestor nodes. Embedding stable_id in the node data (leading_lines comment)
      makes it travel with the node object through the transformation, regardless
      of position shift.
    why_only_funcdef_classdef: 'LibCST only supports `leading_lines` (EmptyLine with
      Comment) on FunctionDef and ClassDef nodes. Other node types do not have this
      attribute. For all other node types: exact_key + previous_obj_to_id is sufficient
      because they either do not shift (replace) or their stable_id is recoverable
      through parent chain.'
read_operations:
  default_buffer_format: declarative. When editor core opens a .py file via CSTFormatter
    the view returned to the caller is the declarative overview, not full source.
    Full source available on demand via get_unit(stable_id).
  declarative:
    alias_function: build_declarative_overview(tree) -> (text, outline_nodes)
    default: true
    description: Declarative view of file structure without implementation bodies.
      Every element carries its stable_id prefixed as [stable_id] in the signature
      line.
    hides:
    - method bodies
    - function bodies
    - complex initializers
    method: 'skeleton(document: CSTTree) -> str'
    placeholder: 'Function and method bodies show: # Implementation hidden; request
      node by node_id for full code'
    shows:
    - file docstring
    - import statements with stable_id
    - class definition header with stable_id
    - class docstring
    - class properties (Assign / AnnAssign) with stable_id and first line
    - method signatures with stable_id
    - method docstrings
    - function signatures with stable_id
    - function docstrings
    stable_id_in_output: Every visible element prefixed with [stable_id] so caller
      can address nodes directly for get_unit or mutation.
  get_unit:
    description: Returns full source code of the node identified by stable_id, including
      implementation body.
    method: 'get_unit(document: CSTTree, stable_id: str) -> unit'
  iter_units:
    description: Iterates over visible units for search layer (G-011). Each unit carries
      stable_id and declarative metadata.
    method: 'iter_units(document: CSTTree, scope: str | None) -> Iterator[unit]'
  list_units:
    description: Returns flat list of all nodes with stable_id, type, kind, name,
      qualname, start_line, end_line. No source bodies included. Used for navigation
      and as cst_query result metadata.
    method: 'list_units(document: CSTTree) -> List[unit]'
specific_commands:
  cst_query:
    description: XPath-like search over document nodes using Lark-based selector parser.
    implementation: cst_query package (existing Lark grammar, parser, executor)
    result_format: declarative. Each matched node is presented as declarative overview
      (signature + docstring + children signatures, no bodies). Same rules as skeleton().
      Full body available via get_unit(stable_id).
    returns: 'List of nodes. Each entry: stable_id, type, name, qualname, start_line,
      end_line. Implementation body not included by default.'
    selector_examples:
    - //FunctionDef[@name='foo']
    - class > method:first
    - Def:*[start_line>=100]
    - function[@name^='_']:not([name^='__'])
validation:
  validate_content:
    input: raw Python source string
    behavior: parse via libcst; return syntax errors as diagnostics
    used_by: validate_file for .py in G-008
  validate_document:
    input: CSTTree
    behavior: compile tree.module.code; return compile errors as diagnostics
verification:
  scope: global_completion_gate
  commands:
  - python -m pytest tests/formatters/cst
  expected:
  - 'parse round-trips without loss: render(parse(src)) == src for valid Python.'
  - stable_id survives insert, delete, replace, move operations via previous_metadata_map.
  - 'stable_id not in source: no @node-id comments and no # cst-node-ids blocks in
    .py after any operation.'
  - 'sidecar written after save with two checksums: source_sha256 and tree_sha256.'
  - 'sidecar fast path: if both checksums match on reload tree is not re-parsed via
    _build_tree_index.'
  - 'sidecar corrupted (tree_sha256 mismatch): tree rebuilt from scratch.'
  - 'source changed (source_sha256 mismatch): tree rebuilt from scratch.'
  - skeleton returns only declarative elements with stable_id; method bodies replaced
    by placeholder comment.
  - 'skeleton shows: file docstring, imports, class headers+docstrings+properties,
    method signatures+docstrings, function signatures+docstrings. All prefixed with
    [stable_id].'
  - get_unit(stable_id) returns full source code of single node including body.
  - list_units() returns flat list with stable_id and no bodies.
  - cst_query returns matching nodes in declarative format; full body via get_unit.
  - replace_docstring inserts docstring when absent, replaces when present.
  - SimpleStatementSuite parent auto-expanded to IndentedBlock before insert.
  - delete removes node and all descendants.
  - move is atomic (no partial state on failure).
  - CSTFormatter.parse raises FORMAT_VALIDATION_FAILED on libcst.ParserSyntaxError;
    editor core applies text fallback.
  - validate_document uses compile() not libcst.parse_module and does not write files.
acceptance_criteria:
- CSTFormatter implements AbstractFormatter contract in full.
- document model is CSTTree; public address is stable_id; node_id is internal only.
- stable_id is assigned EXACTLY ONCE per node at first _build_tree_index. Value =
  UUID4. Never reassigned, never changed, never re-embedded in source.
- stable_id is stored in TreeNodeMetadata.stable_id and persisted in sidecar metadata_map.
- stable_id survives mutations via previous_metadata_map exact_key + previous_obj_to_id
  ONLY. No inline @node-id comment transport. No set_stable_id. No get_stable_id in
  mutation flow.
- node_stable_id.py is used ONLY for strip_inline_node_id_lines_from_source at parse
  time (defensive cleaner for legacy files).
- 'Sidecar has two checksums: source_sha256 and tree_sha256. Both validated on load.'
- 'If either checksum fails or sidecar is missing: tree built from scratch via _build_tree_index,
  all stable_ids are new UUID4.'
- Sidecar is written only from save orchestration, not from parse.
- parse(raw_content) receives string from editor core. file_path optional for sidecar
  lookup only.
- 'render(document) produces clean Python. No @node-id comments. No # cst-node-ids
  blocks. No markers of any kind.'
- 'Default read format is declarative: skeleton(). Full source via get_unit(stable_id).'
- skeleton() shows structure with [stable_id] prefix on every element. No bodies.
- get_unit(stable_id) returns full source including body.
- 'list_units() returns flat list: stable_id, type, kind, name, qualname, start_line,
  end_line. No bodies.'
- cst_query results in declarative format. Full body via get_unit(stable_id).
- CSTFormatter has no global state. Tree lifetime managed by editor core.
- append_persisted_node_ids, render_marker_block, set_stable_id (in mutation), get_stable_id
  (in mutation) absent from adapted code.
- All five mutation operations work with stable_id. SimpleStatementSuite auto-expanded.
  Match rejected with clear error.
model_assignment_spec:
  performer: coding_agent
  instruction: 'Implement CSTFormatter under ai_editor/formatters/cst/ by adapting
    cst-code. Do not rewrite from scratch. Adapt tree_builder: remove _trees registry,
    TTL loop, load_file_to_tree. CSTFormatter.parse(raw_content: str, file_path=None)
    receives string from editor core. STABLE_ID RULE: assigned exactly once per node
    at first _build_tree_index, never changed after. Survival across mutations: snapshot
    previous_metadata_map + previous_obj_to_id before mutation; after mutation call
    _build_tree_index with both; match by exact_key (position+type) then by object
    identity; unmatched nodes get new UUID4. DO NOT use set_stable_id or get_stable_id
    in mutation flow — they violate the single-assignment rule. node_stable_id.py
    is allowed ONLY for strip_inline_node_id_lines_from_source at parse time. Sidecar
    header: ''CST_TREE_V1 sha256=<source_sha256> tree_sha256=<tree_sha256>''. Validate
    both on load. Write sidecar only from save orchestration. Default read format:
    declarative (skeleton). get_unit(stable_id) full source. list_units() metadata
    only. cst_query declarative. render() produces clean Python, no markers. Do not
    call append_persisted_node_ids or render_marker_block. Do not edit editor_core,
    search, interfaces, transaction_writer, text formatter, ai formatter, foreign
    formatter, .venv, venv, site-packages.'
