format: global_package_step_v2
plan_id: ai_editor_pip_package_for_mcp
step_id: G-007
step_name: transaction_writer
title: Atomic transaction writer and checked write orchestration subsystem
status: draft
source_plan: docs/plans/create_pip_package_for_mcp.yaml
global_intent: 'Own the checked write helper (ai_editor/writer.py). This module provides
  atomic file write with backup and read-back verification. It is used for two distinct
  write paths that share the same mechanism: (1) buffer write — session layer writes
  .buf file to <session_dir>/<filename>.buf after every mutation; (2) result write
  — editor core writes the real file to disk on save/save_as. Both paths call the
  same writer with different target paths. AbstractFormatter provides an abstract
  write method that receives rendered content as string and a target path; the formatter
  may override serialization but delegates atomic persistence to ai_editor/writer.py.'
why_this_block_exists: 'Lower-level writer tasks must understand the entire persistence
  task from this global block: all writes are transactions, every write is checked,
  failed operations leave files unchanged, and successful writes must report hashes,
  backups, changed paths, and validation results.'
owned_code_paths:
- ai_editor/writer.py
- tests/test_writer.py
owned_docs_paths:
- docs/transaction_writer.md
forbidden_code_paths:
- ai_editor/contracts/
- ai_editor/formatters/yaml/document_io/
- ai_editor/formatters/yaml/compat/
- ai_editor/mutations/
- ai_editor/validation/
- ai_editor/interfaces/
- ai_editor/sessions/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - G-001-package-contracts-and-distribution
  - G-002-document-io
  - G-005-mutation-operations
  - G-006-validation-rules
  may_be_used_by:
  - G-008-interfaces-and-release
public_contracts_provided:
- yaml_write_checked(file_path, operations, validate_schema, dry_run)
- CheckedWriteRequest
- CheckedWriteResult
- BackupRecord
- FileHashPair
core_responsibilities:
- Implement read -> parse -> patch in memory -> validate -> render -> validate rendered
  YAML -> write.
- Provide dry_run behavior that never changes file bytes or creates backups.
- Create backups before real writes.
- Write atomically and verify written bytes.
- Return old_hash, new_hash, backup_uuid, changed_paths, validation_result, and diagnostics.
- Ensure failed validation, mutation, render, backup, or write stages return success=false.
write_pipeline:
- read_file_bytes
- compute_old_hash
- load_document_with_document_io
- apply_operations_with_mutations
- validate_changed_paths_against_expected_operations
- validate_document_with_validation
- render_with_document_io
- validate_rendered_output_with_validation
- create_backup_if_not_dry_run
- atomic_replace_if_not_dry_run
- reread_and_compute_new_hash
- return_checked_write_result
safety_rules:
- dry_run=true must never write, backup, or change file bytes.
- Mutation failure must prevent write.
- Validation failure must prevent write.
- Render failure must prevent write.
- Backup failure must prevent write.
- Atomic replace failure must return success=false.
- success=true is allowed only after all requested stages complete.
subsystem_independence_rules:
- This subsystem must not implement YAML parser configuration; use document_io.
- This subsystem must not implement mutation internals; use mutations.
- This subsystem must not implement schema or semantic validation internals; use validation.
- This subsystem must not implement CLI or MCP wrappers; interfaces layer owns those.
- This subsystem may orchestrate other subsystems only through public contracts.
implementation_outline:
- Create transaction_writer package with request, backup, hashing, atomic_write, and
  orchestration modules.
- Add tests for dry-run no-op behavior, successful writes, failed validation, failed
  mutation, backup failure, and read-back verification.
- Ensure checked write result is JSON-serializable through G-001 contracts.
verification:
  commands:
  - python -m pytest tests/transaction_writer
  expected:
  - dry_run=true reports would_change without byte changes.
  - successful write changes only expected paths.
  - failed validation leaves original file byte-for-byte unchanged.
  - failed mutation leaves original file byte-for-byte unchanged.
  - separate read after successful write confirms expected document state.
acceptance_criteria:
- transaction_writer is the only normal persistence subsystem.
- It contains orchestration, not duplicated parser, mutation, or validation internals.
- Every write result is truthful and machine-readable.
- Lower-level writer tasks can be decomposed without editing other subsystem directories.
