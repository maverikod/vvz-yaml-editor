- Technical Specification -> this G-007 README.yaml -> any one T-YYY README.yaml under
  this directory must give an implementer the full picture for that tactical branch.
- Tactical README files under G-007 must repeat the relevant parent context and must
  not require reading sibling T branches.
- Maximizing tactical steps means maximizing independent steps inside G-007 only;
  no T step under G-007 may include work from parser internals, mutation internals,
  validation internals, interfaces, CLI, MCP wrappers, or unrelated branches.
persistence_safety_policy:
  detection: Not applicable. transaction_writer never checks for project git.
  editor_git_note: Editor-internal git (sessions_dir/git/) is owned by G-015, not
    by transaction_writer. transaction_writer is called by G-015 session layer as
    part of save/save_as, after the mutation has already been committed to the buffer
    branch.
  git_available:
    before_write: Create file backup only. No git commit on project repo.
    on_failure: Restore from backup.
    rationale: Project git is not the editor's responsibility. Backup is always the
      safety mechanism for save/save_as.
  git_not_available:
    before_write: Create file backup.
    on_failure: Restore from backup.
    rationale: Same behavior regardless of project git presence.
  invariant: transaction_writer always uses file backup as safety before write. Never
    touches project git. Editor git is G-015's responsibility.
git_policy:
  editor_git:
    applies_to: Every buffer mutation (any operation that changes buffer content).
    description: Each session has its own bare git repo at <session_dir>/git/ (owned
      by G-015). Every mutation on a buffer is committed to branch buf/<buffer_id>
      in that repo via gitpython. This is the undo/redo history mechanism. Has no
      connection to any project git repo.
    invariant: Editor git is always active. No fallback needed. If gitpython fails,
      the mutation still proceeds and HISTORY_UNAVAILABLE diagnostic is attached.
  project_git:
    applies_to: save and save_as operations only — when the real file is written to
      disk.
    description: Writing the real file to disk is a plain file write. The project
      git repository (if any) is not touched by the transaction_writer directly. If
      the project uses git, the calling user or MCP client may choose to commit the
      result — that is outside the scope of ai_editor.
    invariant: transaction_writer never calls git on the project repo. It only writes
      bytes to disk, creates a backup, and verifies hashes.
  summary: Two separate git contexts exist. Editor git (G-015) tracks every mutation
    for undo/redo. Project git is never touched by the editor — only the real file
    bytes are written on save.
write_paths:
  buffer_write:
    caller: Session layer (G-015) after every mutation.
    backup: No backup for .buf files. If write fails the in-memory buffer is still
      valid; next mutation will retry.
    path: <session_dir>/<filename>.buf
    purpose: Persist current buffer content to disk so state survives server restart.
    verify: No read-back needed — .buf is a cache, not authoritative.
  result_write:
    caller: Editor core (G-009) on save/save_as.
    backup: Backup created before write. On failure backup is restored.
    path: Real file path on disk (e.g. docs/plans/G-007.../README.yaml).
    purpose: Persist the final edited content as the real file.
    verify: Read-back after write to confirm bytes match rendered content.
  shared_mechanism: 'Both write paths use atomic write from ai_editor/writer.py: render
    content -> write to .tmp -> os.replace. Buffer write skips backup and read-back.
    Result write includes backup and read-back.'
  abstract_write_method: 'AbstractFormatter.write(content: str, path: str) -> None.
    Abstract method. Default implementation calls ai_editor/writer.py atomic write.
    Formatters may override to handle encoding or binary formats. Must not be called
    directly by session or editor core — they call the appropriate helper (write_buf
    or write_result) which in turn calls formatter.write.'
