branch_self_containment_policy:
- Technical Specification -> this G-007 README.yaml -> any one T-YYY README.yaml under
  this directory must give an implementer the full picture for that tactical branch.
- Tactical README files under G-007 must repeat the relevant parent context and must
  not require reading sibling T branches.
- Maximizing tactical steps means maximizing independent steps inside G-007 only;
  no T step under G-007 may include work from parser internals, mutation internals,
  validation internals, interfaces, CLI, MCP wrappers, or unrelated branches.
persistence_safety_policy:
  detection: check git rev-parse --is-inside-work-tree in file directory at write
    time
  git_available:
    before_write: create git commit with pre-write snapshot; tag optional per caller
      policy
    on_failure: git state is not rolled back by transaction_writer; caller (e.g. G-014)
      owns rollback via git checkout
    rationale: git is the canonical versioning mechanism; backups are a fallback only
  git_not_available:
    before_write: create file backup per existing backup_stage policy
    on_failure: restore from backup
    rationale: backup is the fallback when git is not available
  invariant: Exactly one safety mechanism is active per write. Transaction writer
    never runs a real write without either a git snapshot or a file backup preceding
    it.
