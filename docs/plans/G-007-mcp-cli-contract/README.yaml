format: global_package_step_v2
plan_id: ai_editor_pip_package_for_mcp
step_id: G-007
step_name: transaction_writer
title: Atomic transaction writer and checked write orchestration subsystem
status: draft
source_plan: docs/plans/create_pip_package_for_mcp.yaml
global_intent: 'Own the checked write helper (ai_editor/writer.py). This module provides
  atomic file write with backup and read-back verification. It is used for two distinct
  write paths that share the same mechanism: (1) buffer write — session layer writes
  .buf file to <session_dir>/<filename>.buf after every mutation; (2) result write
  — editor core writes the real file to disk on save/save_as. Both paths call the
  same writer with different target paths. AbstractFormatter provides an abstract
  write method that receives rendered content as string and a target path; the formatter
  may override serialization but delegates atomic persistence to ai_editor/writer.py.'
why_this_block_exists: 'Lower-level writer tasks must understand the entire persistence
  task from this global block: all writes are transactions, every write is checked,
  failed operations leave files unchanged, and successful writes must report hashes,
  backups, changed paths, and validation results.'
owned_code_paths:
- ai_editor/writer.py
- tests/test_writer.py
owned_docs_paths:
- docs/transaction_writer.md
forbidden_code_paths:
- ai_editor/contracts/
- ai_editor/formatters/yaml/document_io/
- ai_editor/formatters/yaml/compat/
- ai_editor/editor_core/
- ai_editor/sessions/
- ai_editor/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_be_used_by:
  - G-009 editor core (calls write_result on save/save_as)
  - G-015 session layer (calls write_buf after every mutation)
  may_depend_on:
  - G-001-package-contracts-and-distribution
  - gitpython (for project git commit after result write)
public_contracts_provided:
- 'write_buf(content: str, buf_path: str) -> None — atomic write: write to .tmp then
  os.replace. No backup, no read-back, no git.'
- 'write_result(content: str, real_path: str, formatter_name: str, relative_path:
  str) -> WriteResultRecord — backup + atomic write + read-back + project git commit
  (best-effort).'
- 'WriteResultRecord — dataclass: success (bool), old_hash (str | None), new_hash
  (str), backup (BackupRecord | None), diagnostics (list).'
- 'BackupRecord — dataclass: original_path (str), backup_path (str), created_at (str).
  Backup stored alongside original with .bak suffix.'
- 'FileHashPair — dataclass: old_hash (str | None), new_hash (str). SHA-256 hex of
  file bytes before and after write.'
core_responsibilities:
- 'Implement write_buf(content, buf_path): atomic write to .tmp then os.replace. No
  backup, no read-back, no git.'
- 'Implement write_result(content, real_path): backup -> atomic write -> read-back
  -> project git commit (best-effort).'
- Formatter.write(content, path) is the abstract method; writer.py is the default
  implementation.
- Return old_hash, new_hash, backup_record on result write.
- Return GIT_COMMIT_FAILED diagnostic if project git commit fails; write still succeeds.
write_pipeline:
- 'write_buf: atomic write, no backup, no read-back.'
- 'write_result: backup_before_write -> atomic_write -> read_back_verify -> project_git_commit.'
safety_rules:
- 'write_buf: atomic write only. No backup, no read-back. If write fails the in-memory
  buffer remains valid.'
- 'write_result: backup before write. If backup fails: abort. If write fails: restore
  from backup. If read-back fails: log but do not rollback (bytes are on disk).'
- 'Project git commit after write_result: best-effort. If fails: attach GIT_COMMIT_FAILED
  diagnostic, write is still success=true.'
- success=true is allowed only after atomic write completes and read-back confirms
  bytes.
subsystem_independence_rules:
- writer.py must not implement formatter internals (parsing, mutation, validation).
- writer.py must not implement CLI or MCP wrappers.
- writer.py must not own session logic or buffer registry.
- Caller (G-009 or G-015) calls formatter.validate_document and formatter.render before
  invoking writer.py.
implementation_outline:
- Implement write_buf(content, buf_path) and write_result(content, real_path, formatter_name,
  relative_path) in ai_editor/writer.py.
- 'write_buf: atomic write via .tmp + os.replace. No backup, no read-back, no git.'
- 'write_result: backup + atomic write + read-back + project git commit (best-effort).'
- Add tests in tests/test_writer.py covering all safety_rules scenarios.
verification:
  commands:
  - python -m pytest tests/test_writer.py
  expected:
  - 'Buffer write (.buf): written atomically, no backup, no read-back.'
  - 'Result write (real file): backup created before write, atomic write, read-back
    confirms bytes.'
  - Failed formatter validate_document leaves real file unchanged.
  - Stale buffer detected before result write returns BUFFER_STALE.
  - Successful result write returns old_hash and new_hash.
  - save_as with overwrite=False returns SAVE_TARGET_EXISTS.
  - Project git commit created after successful result write.
  - GIT_COMMIT_FAILED diagnostic attached when project git commit fails; write still
    returns success.
acceptance_criteria:
- ai_editor/writer.py is the only module that performs physical file writes (both
  buf and result paths).
- writer.py contains only write mechanics — no formatter internals, no mutation logic,
  no validation.
- 'Every result write result is truthful and machine-readable: old_hash, new_hash,
  backup_record.'
- 'Buffer writes (.buf) are fast and simple: atomic, no backup, no read-back.'
model_assignment_spec:
  performer: coding_agent
  instruction: Implement only ai_editor/writer.py and tests/test_writer.py. Do not
    edit formatter internals, editor_core, sessions, interfaces, .venv, venv, or site-packages.
    Caller (G-009 or G-015) is responsible for calling formatter.validate_document
    and formatter.render before invoking writer.py. writer.py only handles the physical
    write path.
