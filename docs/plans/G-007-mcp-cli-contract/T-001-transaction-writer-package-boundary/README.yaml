format: tactical_step_v1
parent_step_id: G-007
parent_step_name: transaction_writer
tactical_step_id: T-001
tactical_step_name: transaction_writer_package_boundary
title: Transaction writer package boundary and public surface
status: draft
source_documents:
- docs/tech_spec.md
- docs/plans/create_pip_package_for_mcp.yaml
- docs/plans/G-007-mcp-cli-contract/README.yaml
intent: Own the package boundary for the checked transaction writer subsystem. This
  tactical step defines public exports and forbidden imports so the writer can orchestrate
  document_io, mutations, and validation through public contracts without owning their
  internals or exposing CLI/MCP wrappers.
self_contained_context:
  global_goal: G-007 owns checked write transaction orchestration from read through
    parse, in-memory patch, validation, render, rendered YAML validation, and write.
  required_public_contracts:
  - yaml_write_checked(file_path, operations, validate_schema, dry_run)
  - CheckedWriteRequest
  - CheckedWriteResult
  - BackupRecord
  - FileHashPair
  boundaries:
  - Writer must not implement parser configuration; use document_io.
  - Writer must not implement mutation internals; use mutations.
  - Writer must not implement schema or semantic validation internals; use validation.
  - Writer must not implement CLI or MCP wrappers.
  - Writer may orchestrate only through public contracts.
owned_code_paths:
- yaml_editor/transaction_writer/__init__.py
- yaml_editor/transaction_writer/package_boundary.py
owned_test_paths:
- tests/transaction_writer/test_package_boundary.py
owned_docs_paths: []
forbidden_paths:
- pyproject.toml
- README.md
- yaml_editor/document_io/
- yaml_editor/path_language/
- yaml_editor/reader/
- yaml_editor/mutations/
- yaml_editor/validation/
- yaml_editor/interfaces/
- yaml_editor/transaction_writer/contracts.py
- yaml_editor/transaction_writer/hashing.py
- yaml_editor/transaction_writer/backup.py
- yaml_editor/transaction_writer/atomic_write.py
- yaml_editor/transaction_writer/orchestrator.py
- tests/document_io/
- tests/path_language/
- tests/reader/
- tests/mutations/
- tests/validation/
- tests/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - G-001 public contracts and error envelope concepts
  - G-002 document_io public contracts
  - G-005 mutation operations public contracts
  - G-006 validation rules public contracts
  may_be_used_by:
  - G-008 interfaces and release
public_contracts_provided:
- yaml_editor.transaction_writer package import boundary
- public transaction writer exports list
responsibilities:
- Define writer package exports for all parent G-007 public contracts.
- Keep package import side-effect free.
- Guard against parser, mutation, validation, interface, CLI, and MCP boundary leaks.
verification:
  scope: tactical_completion_gate
  commands:
  - python -m pytest tests/transaction_writer/test_package_boundary.py
  expected:
  - yaml_editor.transaction_writer imports without reading or writing files.
  - Public exports include G-007 checked writer contract names.
  - No forbidden downstream or sibling subsystem internals are imported.
acceptance_criteria:
- Transaction writer package boundary is limited to orchestration ownership.
- Importing yaml_editor.transaction_writer has no file, backup, write, CLI, or MCP
  side effects.
- Later G-007 steps can implement contracts behind a stable package surface.
model_assignment_spec:
  performer: coding_agent
  instruction: Work only on yaml_editor/transaction_writer/__init__.py, yaml_editor/transaction_writer/package_boundary.py,
    and tests/transaction_writer/test_package_boundary.py. Implement only the transaction
    writer package boundary and public exports. Do not implement writer algorithms,
    hashing, backup, atomic replace, parser, mutations, validation, CLI, or MCP wrappers.
    Do not edit .venv, venv, site-packages, or installed dependencies.
