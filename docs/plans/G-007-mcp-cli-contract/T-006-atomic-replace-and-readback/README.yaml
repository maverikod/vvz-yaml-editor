format: tactical_step_v1
parent_step_id: G-007
parent_step_name: transaction_writer
tactical_step_id: T-006
tactical_step_name: atomic_replace_and_readback
title: Atomic replace and post-write read-back verification
status: draft
source_documents:
- docs/tech_spec.md
- docs/plans/create_pip_package_for_mcp.yaml
- docs/plans/G-007-mcp-cli-contract/README.yaml
intent: Own the atomic byte replacement stage and post-write read-back verification
  for real checked writes. This tactical step writes only after backup and all earlier
  gates have succeeded, rereads written bytes, computes new_hash, and reports write
  failure truthfully without owning parser, mutation, validation, rendering, backup
  creation, CLI, or MCP wrappers.
self_contained_context:
  global_goal: G-007 owns checked write transaction orchestration where successful
    writes must be atomic, verified, and machine-readable.
  atomic_write_rules:
  - Atomic replace runs only when dry_run=false.
  - Atomic replace runs only after mutation, validation, render, rendered validation,
    and backup stages have succeeded.
  - Atomic replace failure must return success=false.
  - Written bytes must be reread and hashed after replace.
  - success=true requires post-write read-back verification.
  boundaries:
  - Do not create backups here.
  - Do not apply mutations or validations here.
  - Do not render YAML here.
  - Do not expose CLI or MCP wrappers.
owned_code_paths:
- yaml_editor/transaction_writer/atomic_write.py
owned_test_paths:
- tests/transaction_writer/test_atomic_replace_and_readback.py
owned_docs_paths: []
forbidden_paths:
- yaml_editor/document_io/
- yaml_editor/mutations/
- yaml_editor/validation/
- yaml_editor/interfaces/
- yaml_editor/transaction_writer/backup.py
- yaml_editor/transaction_writer/orchestrator.py
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - G-007/T-002 checked write contracts
  - G-007/T-003 read and hashing stage
  - G-007/T-005 backup stage
  may_be_used_by:
  - G-007 orchestration
public_contracts_provided:
- atomic_replace(file_path, rendered_bytes)
- post_write_readback_verification policy
- atomic replace failure diagnostics policy
responsibilities:
- Replace target file bytes atomically for real writes.
- Reread written bytes and support new_hash calculation.
- Return typed failure diagnostics for replace or read-back failures.
verification:
  scope: tactical_completion_gate
  commands:
  - python -m pytest tests/transaction_writer/test_atomic_replace_and_readback.py
  expected:
  - Atomic replace changes file bytes only after the stage is called.
  - Post-write read-back confirms written bytes and computes new_hash through hashing
    helpers.
  - Atomic replace failure returns success=false diagnostics.
  - dry_run=true never reaches atomic replace.
acceptance_criteria:
- Atomic replace is independent from backup creation and orchestration policy.
- success=true is impossible without read-back verification.
- This step edits only its owned code and test paths during implementation.
model_assignment_spec:
  performer: coding_agent
  instruction: Work only on yaml_editor/transaction_writer/atomic_write.py and tests/transaction_writer/test_atomic_replace_and_readback.py.
    Implement atomic byte replacement and post-write read-back verification helpers
    for real checked writes. Do not implement backup creation, orchestration, parser
    internals, mutations, validation, rendering, CLI, or MCP wrappers. Never perform
    atomic replace during dry_run. Do not edit .venv, venv, site-packages, or installed
    dependencies.
