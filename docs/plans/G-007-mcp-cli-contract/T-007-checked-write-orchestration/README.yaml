format: tactical_step_v1
parent_step_id: G-007
parent_step_name: transaction_writer
tactical_step_id: T-007
tactical_step_name: checked_write_orchestration
title: Checked write orchestration and truthful failure semantics
status: draft
source_documents:
- docs/tech_spec.md
- docs/plans/create_pip_package_for_mcp.yaml
- docs/plans/G-007-mcp-cli-contract/README.yaml
intent: Own the full yaml_write_checked orchestration pipeline over public subsystem
  contracts. This tactical step coordinates file byte reads, document_io parsing and
  rendering, mutation application, validation gates, dry-run behavior, backup creation,
  atomic replace, post-write read-back, hashing, changed_paths, and truthful CheckedWriteResult
  assembly without owning parser, mutation, validation, backup, hashing, or atomic-write
  internals.
self_contained_context:
  global_goal: G-007 owns safe checked persistence for structural YAML edits.
  pipeline_order:
  - read_file_bytes
  - compute_old_hash
  - load_document_with_document_io
  - apply_operations_with_mutations
  - validate_document_with_validation
  - render_with_document_io
  - validate_rendered_output_with_validation
  - create_backup_if_not_dry_run
  - atomic_replace_if_not_dry_run
  - reread_and_compute_new_hash
  - return_checked_write_result
  truthfulness_rules:
  - success=true is allowed only after all requested stages complete.
  - dry_run=true must never write, backup, or change file bytes.
  - mutation failure must prevent write.
  - validation failure must prevent write.
  - render failure must prevent write.
  - backup failure must prevent write.
  - atomic replace or read-back failure must return success=false.
  boundaries:
  - Do not implement parser, mutation, validation, backup, hash, or atomic-write internals.
  - Do not expose CLI or MCP wrappers.
owned_code_paths:
- yaml_editor/transaction_writer/orchestrator.py
owned_test_paths:
- tests/transaction_writer/test_checked_write_orchestration.py
owned_docs_paths: []
forbidden_paths:
- yaml_editor/document_io/
- yaml_editor/path_language/
- yaml_editor/reader/
- yaml_editor/mutations/
- yaml_editor/validation/
- yaml_editor/interfaces/
- yaml_editor/transaction_writer/hashing.py
- yaml_editor/transaction_writer/backup.py
- yaml_editor/transaction_writer/atomic_write.py
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - G-001 public contracts and error envelope concepts
  - G-002 document_io public contracts
  - G-005 mutation operations public contracts
  - G-006 validation rules public contracts
  - G-007/T-002 checked write contracts
  - G-007/T-003 read and hashing stage
  - G-007/T-004 dry-run semantics
  - G-007/T-005 backup stage
  - G-007/T-006 atomic replace and read-back
  may_be_used_by:
  - G-008 interfaces and release
public_contracts_provided:
- yaml_write_checked(file_path, operations, validate_schema, dry_run)
- checked write pipeline orchestration
- truthful stage failure policy
responsibilities:
- Compose all checked write stages in the parent G-007 pipeline order.
- Return CheckedWriteResult with old_hash, new_hash, backup_uuid, changed_paths, validation_result,
  render_preview, diagnostics, and truthful success.
- Ensure any failed stage prevents later unsafe stages.
- Ensure dry-run never performs backup or atomic replace.
verification:
  scope: tactical_completion_gate
  commands:
  - python -m pytest tests/transaction_writer/test_checked_write_orchestration.py
  expected:
  - dry_run=true reports would_change without byte changes.
  - Successful real write changes only after mutation, validation, render validation,
    backup, atomic replace, and read-back succeed.
  - Failed mutation leaves original file byte-for-byte unchanged.
  - Failed validation leaves original file byte-for-byte unchanged.
  - Backup, write, or read-back failure returns success=false.
  - Separate read after successful write confirms expected document state.
acceptance_criteria:
- Orchestration uses public subsystem contracts without duplicating internals.
- Every failed stage returns truthful success=false result.
- success=true is impossible without post-write read-back verification for real writes.
- This step edits only its owned code and test paths during implementation.
model_assignment_spec:
  performer: coding_agent
  instruction: Work only on yaml_editor/transaction_writer/orchestrator.py and tests/transaction_writer/test_checked_write_orchestration.py.
    Implement yaml_write_checked orchestration by composing public document_io, mutations,
    validation, dry-run, backup, hashing, and atomic write contracts. Do not duplicate
    parser, mutation, validation, backup, hash, or atomic-write internals. Do not
    implement CLI or MCP wrappers. Do not edit .venv, venv, site-packages, or installed
    dependencies.
