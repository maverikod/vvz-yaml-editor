format: tactical_step_v1
parent_step_id: G-006
parent_step_name: validation_rules
tactical_step_id: T-002
tactical_step_name: validation_report_contract
title: Validation report and diagnostics contract
status: draft
source_documents:
- docs/tech_spec.md
- docs/plans/create_pip_package_for_mcp.yaml
- docs/plans/G-006-checked-write-pipeline/README.yaml
intent: Own the ValidationReport, validation issue, diagnostics, and error-code contract
  shared by all G-006 validation checks. This step defines result shapes only and
  must not implement schema, semantic, rendered YAML, or determinism validation algorithms.
self_contained_context:
  global_goal: G-006 owns validation logic and must return detailed machine-readable
    validation diagnostics.
  error_codes_owned:
  - VALIDATION_FAILED
  - SCHEMA_VALIDATION_FAILED
  - SEMANTIC_VALIDATION_FAILED
  - RENDER_NOT_DETERMINISTIC
  required_report_topics:
  - success boolean
  - validation scope
  - issue list
  - error_code
  - message
  - diagnostics object
  - JSON-compatible serialization for MCP-facing callers
  boundaries:
  - Do not parse YAML paths.
  - Do not apply mutations.
  - Do not load schemas or run semantic checks here.
  - Do not read or write files.
owned_code_paths:
- yaml_editor/validation/report.py
owned_test_paths:
- tests/validation/test_validation_report.py
owned_docs_paths: []
forbidden_paths:
- yaml_editor/document_io/
- yaml_editor/path_language/
- yaml_editor/reader/
- yaml_editor/mutations/
- yaml_editor/transaction_writer/
- yaml_editor/interfaces/
- yaml_editor/validation/schema.py
- yaml_editor/validation/semantic.py
- yaml_editor/validation/render_check.py
- yaml_editor/validation/determinism.py
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - G-001 public result and error envelope concepts
  may_be_used_by:
  - all later G-006 validation tactical steps
  - G-007 checked write pipeline
public_contracts_provided:
- ValidationReport
- ValidationIssue
- validation diagnostic payload shape
responsibilities:
- Define the common validation report contract.
- Define typed validation issue and diagnostic fields.
- Keep report payloads JSON-compatible.
verification:
  scope: tactical_completion_gate
  commands:
  - python -m pytest tests/validation/test_validation_report.py
  expected:
  - ValidationReport can represent success and failure.
  - Error codes owned by G-006 are representable.
  - Report payloads are JSON-compatible.
acceptance_criteria:
- Report contracts are sufficient for schema, semantic, render, and determinism checks.
- No validation algorithm is implemented here.
- No forbidden subsystem is imported.
model_assignment_spec:
  performer: coding_agent
  instruction: Work only on yaml_editor/validation/report.py and tests/validation/test_validation_report.py.
    Define validation report, issue, diagnostics, and error-code contracts for G-006.
    Do not implement schema, semantic, rendered YAML, determinism checks, mutations,
    writer, CLI, or MCP wrappers. Do not edit .venv, venv, site-packages, or installed
    dependencies.
observations_template:
- command: ''
  expected: ''
  actual: ''
  error: ''
  status: ''
