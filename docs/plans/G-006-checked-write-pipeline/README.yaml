format: global_package_step_v2
plan_id: ai_editor_pip_package_for_mcp
step_id: G-006
step_name: validation_rules
title: Validation rules — ABSORBED into G-010 and G-013
status: obsolete_absorbed
source_plan: docs/plans/create_pip_package_for_mcp.yaml
global_intent: 'G-006 is ABSORBED into G-010 (AbstractFormatter) and G-013 (CSTFormatter).
  Validation is formatter-internal. AbstractFormatter defines abstract methods validate_content
  and validate_document that each formatter implements. plan_task_v1 semantic rules
  live inside the YAML formatter. No standalone ai_editor/validation/ module exists.

  '
why_this_block_exists: 'This step is kept for historical reference only. Its content
  is fully absorbed into G-010 (AbstractFormatter abstract validation contract + YAML/text
  implementations) and G-013 (CST validation via compile()). Do not implement any
  code under ai_editor/validation/. Read G-010 for the abstract validation interface
  definition. Read G-013 for CST-specific validation details.

  '
owned_code_paths:
- ai_editor/formatters/yaml/  (YAML validation code, owned by G-010)
- ai_editor/formatters/cst/   (CST validation code, owned by G-013)
- ai_editor/formatters/text/  (text validation code, owned by G-010)
- tests/formatters/            (validation tests alongside formatter tests)
- ai_editor/schemas/           (plan_task_v1.schema.json, owned by G-010)
forbidden_code_paths:
- ai_editor/validation/
- ai_editor/contracts/
- ai_editor/editor_core/
- ai_editor/sessions/
- ai_editor/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - G-001-package-contracts-and-distribution
  may_be_used_by:
  - G-010 YAMLFormatter (owns YAML and text validation implementations)
  - G-013 CSTFormatter (owns CST validation via compile())
  - G-009 editor core (calls formatter.validate_document before save/save_as)
  - G-008 public interfaces (expose validate and validate_file commands)
public_contracts_provided:
- 'AbstractFormatter abstract validation methods: validate_content [abstract], validate_document
  [abstract] (defined in G-010 ai_editor/formatters/base.py)'
- 'YAML formatter: validate_content (parse+schema+semantic+render check), validate_document,
  plan_task_v1 rules (G-010)'
- 'CST formatter: validate_document via compile() (G-013)'
- 'Text formatter: validate_content and validate_document always return success=True
  (G-010)'
plan_task_v1_rules:
- format must equal plan_task_v1.
- node_id must match file-level conventions used by the plans repository.
- kind must be one of spec, global, tactical, atomic.
- depends_on must be a list of strings.
- commands must be a list of objects.
- commands[].name values must be unique.
- commands[].schema.required must reference only existing properties.
- verification must be a non-empty list.
- status must be one of draft, ready_for_review, ready_for_implementation, blocked.
error_codes_owned:
- VALIDATION_FAILED
- SCHEMA_VALIDATION_FAILED
- SEMANTIC_VALIDATION_FAILED
- RENDER_NOT_DETERMINISTIC
core_responsibilities:
- Validation must live inside the formatter that owns it. Do not create ai_editor/validation/.
- AbstractFormatter defines abstract validate_content and validate_document. Each
  formatter implements them.
- YAML formatter owns plan_task_v1 rules, schema validation, and render determinism
  check.
- CST formatter validates via compile().
- Text formatter always returns success=True.
- Editor core (G-009) calls formatter.validate_document as first stage of save/save_as.
subsystem_independence_rules:
- Validation must live inside the formatter that owns it. Do not create a standalone
  validation module.
- Formatters must not parse structural YAML paths in validation methods.
- Formatters must not apply mutations inside validation methods.
- Formatters must not perform file backups or atomic writes.
- Formatters must not implement CLI or MCP wrappers.
- Editor core (G-009) calls formatter.validate_document before every save/save_as.
implementation_outline:
- Read G-010 for AbstractFormatter abstract validation method contracts.
- Read G-013 for CST-specific validation (compile()) implementation details.
- Validation tests live under tests/formatters/ alongside the formatter they belong
  to.
- Do not create ai_editor/validation/ or any standalone validation module.
- plan_task_v1.schema.json lives under ai_editor/schemas/ and is owned by G-010.
verification:
  scope: internal_g010_g013_validation
  commands:
  - python -m pytest tests/formatters/yaml/ -k validate
  - python -m pytest tests/formatters/cst/ -k validate
  - python -m pytest tests/formatters/text/ -k validate
  expected:
  - YAML formatter validate_content returns YAML_PARSE_FAILED for invalid YAML.
  - YAML formatter validate_document checks plan_task_v1 semantic rules.
  - YAML formatter validate_document returns RENDER_NOT_DETERMINISTIC when applicable.
  - CST formatter validate_document uses compile() and returns syntax diagnostics.
  - Text formatter validate_content and validate_document always return success=True.
  - Validation never writes files or modifies buffer state.
acceptance_criteria:
- No standalone ai_editor/validation/ module exists.
- All validation code lives inside the formatter that owns it (G-010 for YAML/text,
  G-013 for CST).
- AbstractFormatter abstract validation methods are defined in G-010 ai_editor/formatters/base.py.
- Editor core (G-009) calls formatter.validate_document before every save/save_as.
model_assignment_spec:
  performer: coding_agent
  instruction: 'Implement validation inside each formatter. AbstractFormatter (G-010)
    defines abstract methods: validate_content(raw_content) -> ValidationResult and
    validate_document(document) -> ValidationResult. Each formatter implements these.
    YAML formatter owns plan_task_v1 semantic rules, schema validation, and render
    determinism check. CST formatter owns Python compile() validation. Text formatter
    always returns success=True. Do NOT create ai_editor/validation/ as a standalone
    module. Validation tests live under tests/formatters/. Read G-010 for abstract
    contract. Read G-013 for CST details.

    '
observations_template:
- command: ''
  expected: ''
  actual: ''
  error: ''
  status: ''
