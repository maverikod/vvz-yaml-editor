format: global_package_step_v2
plan_id: ai_editor_pip_package_for_mcp
step_id: G-006
step_name: validation_rules
title: Validation, schema, semantic rules, and render checks subsystem
status: draft
source_plan: docs/plans/create_pip_package_for_mcp.yaml
global_intent: G-006 is ABSORBED into G-010 (AbstractFormatter). Validation is formatter-internal.
  AbstractFormatter defines abstract methods validate_content and validate_document
  that each formatter implements. plan_task_v1 semantic rules live inside the YAML
  formatter validation. No standalone ai_editor/validation/ module exists — all validation
  code lives inside the formatter that owns it (ai_editor/formatters/yaml/, ai_editor/formatters/cst/,
  ai_editor/formatters/text/). G-010 owns the abstract validation contract on AbstractFormatter.
why_this_block_exists: Validation is formatter-internal. This step's work is absorbed
  into G-010 AbstractFormatter. validate_content and validate_document are abstract
  methods on AbstractFormatter implemented by each formatter. plan_task_v1 semantic
  rules are owned by the YAML formatter. No standalone ai_editor/validation/ module
  exists.
owned_code_paths:
- ai_editor/formatters/yaml/ (YAML validation code lives here, owned by G-010)
- ai_editor/formatters/cst/ (CST validation code lives here, owned by G-013)
- ai_editor/formatters/text/ (text validation code lives here, owned by G-010)
- tests/formatters/ (validation tests live alongside formatter tests)
owned_docs_paths:
- docs/validation_rules.md
forbidden_code_paths:
- ai_editor/contracts/
- ai_editor/formatters/yaml/document_io/
- ai_editor/formatters/yaml/compat/
- ai_editor/mutations/
- ai_editor/transaction_writer/
- ai_editor/interfaces/
- ai_editor/sessions/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - G-001-package-contracts-and-distribution
  - G-002-document-io
  may_be_used_by:
  - G-007-transaction-writer
  - G-008-interfaces-and-release
public_contracts_provided:
- validate_yaml_document(document)
- validate_rendered_yaml(text)
- validate_schema(document, schema_name)
- validate_plan_task_v1(document)
- validate_render_determinism(document)
- ValidationReport
core_responsibilities:
- Validate YAML document structure after parsing.
- Validate rendered YAML can be parsed back to an equivalent structure.
- Validate deterministic rendering for supported documents.
- Own JSON Schema files and schema loading.
- Own plan_task_v1 semantic checks.
- Return detailed machine-readable validation diagnostics.
plan_task_v1_rules:
- format must equal plan_task_v1.
- node_id must match file-level conventions used by the plans repository.
- kind must be one of spec, global, tactical, atomic.
- depends_on must be a list of strings.
- commands must be a list of objects.
- commands[].name values must be unique.
- commands[].schema.required must reference only existing properties.
- read_model.sees_live_tmpfs_worktree must be false for read-only plan_* disk commands.
- buf_flush semantics must not contradict root README semantics: commit to buf/<uuid>,
    no merge, lock retained.
- verification must be a non-empty list.
- status must be one of draft, ready_for_review, ready_for_implementation, blocked.
error_codes_owned:
- VALIDATION_FAILED
- SCHEMA_VALIDATION_FAILED
- SEMANTIC_VALIDATION_FAILED
- RENDER_NOT_DETERMINISTIC
subsystem_independence_rules:
- This subsystem must not parse structural YAML paths.
- This subsystem must not apply mutations.
- This subsystem must not perform file backups or atomic writes.
- This subsystem must not implement CLI or MCP wrappers.
- Transaction writer and interfaces must call validation public contracts instead
  of duplicating validation rules.
implementation_outline:
- Create validation package with schema, semantic, render_check, and report modules.
- Store plan_task_v1.schema.json under validation-owned package data.
- Implement positive and negative validation fixtures.
- Implement per-check validation diagnostics suitable for MCP responses.
verification:
  commands:
  - python -m pytest tests/formatters/yaml/ -k validate
  - python -m pytest tests/formatters/cst/ -k validate
  - python -m pytest tests/formatters/text/ -k validate
  expected:
  - YAML formatter validate_content returns YAML_PARSE_FAILED for invalid YAML.
  - YAML formatter validate_document checks plan_task_v1 semantic rules.
  - YAML formatter validate_document returns RENDER_NOT_DETERMINISTIC when applicable.
  - CST formatter validate_document uses compile() and returns syntax diagnostics.
  - Text formatter validate_content and validate_document always return success=True.
  - Validation never writes files or modifies buffer state.
  scope: internal_g010_g013_validation
acceptance_criteria:
- Validation subsystem owns all schema and semantic rules.
- Writer can use validation as a gate without containing validation logic.
- Interfaces can expose validation without duplicating implementation.
- Lower-level validation tasks can be decomposed independently from writer and mutation
  tasks.
model_assignment_spec:
  performer: coding_agent
  instruction: 'Implement validation inside each formatter. AbstractFormatter (G-010)
    defines abstract methods: validate_content(raw_content) -> ValidationResult and
    validate_document(document) -> ValidationResult. Each formatter implements these.
    YAML formatter owns plan_task_v1 semantic rules, schema validation, and render
    determinism check. CST formatter owns Python compile() validation. Text formatter
    always returns success=true. Do not create ai_editor/validation/ as a standalone
    module. Validation tests live under tests/formatters/.'
observations_template:
- command: ''
  expected: ''
  actual: ''
  error: ''
  status: ''
