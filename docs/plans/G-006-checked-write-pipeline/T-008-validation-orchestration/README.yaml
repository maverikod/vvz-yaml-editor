format: tactical_step_v1
parent_step_id: G-006
parent_step_name: validation_rules
tactical_step_id: T-008
tactical_step_name: validation_orchestration
title: Validation orchestration entry points
status: draft
source_documents:
- docs/tech_spec.md
- docs/plans/create_pip_package_for_mcp.yaml
- docs/plans/G-006-checked-write-pipeline/README.yaml
intent: Own the high-level validation entry points that compose G-006 validation checks
  in a deterministic order. This tactical step coordinates generic YAML document validation,
  optional schema validation, plan_task_v1 semantic validation, rendered YAML validation,
  and render determinism validation without owning the individual check algorithms.
self_contained_context:
  global_goal: G-006 owns validation logic and must provide public contracts usable
    by the checked write pipeline and interfaces without duplicating validation rules.
  validation_sequence:
  - validate_yaml_document(document)
  - validate_schema(document, schema_name) when requested
  - validate_plan_task_v1(document) when schema_name or caller intent requires plan_task_v1
    semantics
  - validate_rendered_yaml(text) or rendered equivalence when rendered text is provided
  - validate_render_determinism(document) when determinism validation is requested
  boundaries:
  - Do not implement individual schema, semantic, render, or determinism algorithms
    here.
  - Do not apply mutations or parse structural YAML paths.
  - Do not read or write files.
  - Do not create backups or implement transaction writer behavior.
  - Do not expose CLI or MCP wrappers.
owned_code_paths:
- yaml_editor/validation/orchestrator.py
owned_test_paths:
- tests/validation/test_validation_orchestration.py
owned_docs_paths: []
forbidden_paths:
- yaml_editor/document_io/
- yaml_editor/path_language/
- yaml_editor/reader/
- yaml_editor/mutations/
- yaml_editor/transaction_writer/
- yaml_editor/interfaces/
- yaml_editor/validation/schema.py
- yaml_editor/validation/semantic.py
- yaml_editor/validation/render_check.py
- yaml_editor/validation/determinism.py
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - G-006/T-002 validation report contract
  - G-006/T-003 generic YAML document validation
  - G-006/T-004 schema validation
  - G-006/T-005 plan_task_v1 semantic validation
  - G-006/T-006 rendered YAML validation
  - G-006/T-007 render determinism validation
  may_be_used_by:
  - G-007 checked write pipeline
  - G-008 interfaces and release
public_contracts_provided:
- validate_yaml_document(document)
- validate_rendered_yaml(text)
- validate_schema(document, schema_name)
- validate_plan_task_v1(document)
- validate_render_determinism(document)
- combined validation orchestration policy
orchestration_policy:
  order: Run cheap in-memory structure checks before schema, semantic, rendered YAML,
    and determinism checks.
  failure_policy: Return truthful ValidationReport results and do not report success
    when any requested validation gate fails.
  aggregation_policy: Preserve per-check diagnostics in deterministic order.
  non_goals:
  - no mutation application
  - no transaction write
  - no CLI or MCP wrapper behavior
responsibilities:
- Compose existing G-006 validation contracts without duplicating their internals.
- Define deterministic validation ordering and report aggregation.
- Expose high-level validation entry points for downstream writer and interface layers.
verification:
  scope: tactical_completion_gate
  commands:
  - python -m pytest tests/validation/test_validation_orchestration.py
  expected:
  - Orchestration calls requested validation checks in deterministic order.
  - Any failing requested gate produces an overall failed report.
  - Diagnostics from multiple checks are aggregated without losing error codes.
  - No mutation, writer, CLI, or MCP behavior is introduced.
acceptance_criteria:
- Orchestration depends on G-006 validation checks but does not own their internals.
- Combined validation results are truthful and deterministic.
- This step edits only its owned code and test paths during implementation.
model_assignment_spec:
  performer: coding_agent
  instruction: Work only on yaml_editor/validation/orchestrator.py and tests/validation/test_validation_orchestration.py.
    Implement validation orchestration by composing the G-006 validation contracts
    and aggregating ValidationReport diagnostics. Do not implement individual schema,
    semantic, render, or determinism algorithms here. Do not implement mutations,
    transaction writing, backups, CLI, or MCP wrappers. Do not edit .venv, venv, site-packages,
    or installed dependencies.
