format: tactical_step_v1
parent_step_id: G-006
parent_step_name: validation_rules
tactical_step_id: T-003
tactical_step_name: yaml_document_structure_validation
title: Parsed YAML document structure validation
status: draft
source_documents:
- docs/tech_spec.md
- docs/plans/create_pip_package_for_mcp.yaml
- docs/plans/G-006-checked-write-pipeline/README.yaml
intent: Own validation of already parsed YAML document structure. This tactical step
  checks that a loaded or mutated in-memory document is structurally acceptable as
  YAML data before schema, semantic, rendered YAML, or determinism checks are run.
self_contained_context:
  global_goal: G-006 owns validation logic for YAML documents and must not mutate,
    read files directly, or write files.
  technical_basis:
  - YAML must parse before any operation is applied.
  - Patched in-memory tree must remain valid YAML.
  - Validation returns machine-readable diagnostics through ValidationReport.
  boundaries:
  - Do not read YAML files from disk.
  - Do not render YAML text.
  - Do not run JSON Schema validation.
  - Do not run plan_task_v1 semantic validation.
  - Do not apply mutations or parse structural paths.
owned_code_paths:
- yaml_editor/validation/document.py
owned_test_paths:
- tests/validation/test_yaml_document_structure.py
owned_docs_paths: []
forbidden_paths:
- yaml_editor/document_io/
- yaml_editor/path_language/
- yaml_editor/reader/
- yaml_editor/mutations/
- yaml_editor/transaction_writer/
- yaml_editor/interfaces/
- yaml_editor/validation/schema.py
- yaml_editor/validation/semantic.py
- yaml_editor/validation/render_check.py
- yaml_editor/validation/determinism.py
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - G-001 public result and error envelope concepts
  - G-002 in-memory YAML document model concepts
  - G-006/T-002 validation report contract
  may_be_used_by:
  - G-006 schema, semantic, render, and determinism checks
  - G-007 checked write pipeline
public_contracts_provided:
- validate_yaml_document(document)
validation_policy:
  accepted_inputs:
  - already parsed in-memory YAML document objects
  - scalar, mapping, sequence, null, boolean, number, and string YAML-compatible values
  rejected_inputs:
  - unsupported runtime objects that cannot be represented as YAML data
  - parser error placeholders that indicate YAML_PARSE_FAILED upstream
  diagnostics:
  - report exact validation scope
  - report unsupported value types with typed issues
  - do not produce line-range diagnostics as the primary model-facing result
responsibilities:
- Validate generic YAML-compatible in-memory data structure.
- Return ValidationReport without throwing internal exceptions to callers.
- Provide positive and negative tests over parsed document objects.
verification:
  scope: tactical_completion_gate
  commands:
  - python -m pytest tests/validation/test_yaml_document_structure.py
  expected:
  - YAML-compatible scalar, mapping, and sequence values pass.
  - Unsupported runtime objects fail with typed diagnostics.
  - No schema, semantic, render, mutation, writer, CLI, or MCP behavior is introduced.
acceptance_criteria:
- Generic in-memory YAML document validation is independent from schema and semantic
  validation.
- Validation results use the shared ValidationReport contract.
- This step edits only its owned code and test paths during implementation.
model_assignment_spec:
  performer: coding_agent
  instruction: Work only on yaml_editor/validation/document.py and tests/validation/test_yaml_document_structure.py.
    Implement generic validation for already parsed YAML-compatible in-memory document
    objects using the G-006 ValidationReport contract. Do not read files, render YAML,
    validate JSON Schema, run plan_task_v1 semantic checks, apply mutations, write
    files, or implement CLI/MCP wrappers. Do not edit .venv, venv, site-packages,
    or installed dependencies.
observations_template:
- command: ''
  expected: ''
  actual: ''
  error: ''
  status: ''
