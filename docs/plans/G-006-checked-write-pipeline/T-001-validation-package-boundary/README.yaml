format: tactical_step_v1
parent_step_id: G-006
parent_step_name: validation_rules
tactical_step_id: T-001
tactical_step_name: validation_package_boundary
title: Validation package boundary and public surface
status: draft
source_documents:
- docs/tech_spec.md
- docs/plans/create_pip_package_for_mcp.yaml
- docs/plans/G-006-checked-write-pipeline/README.yaml
intent: Own the package boundary for the validation subsystem. This tactical step
  defines the public validation surface and forbidden imports so validation can be
  used by writer and interface layers without duplicating schema, semantic, render-check,
  or diagnostics logic.
self_contained_context:
  global_goal: G-006 owns validation logic for YAML documents, rendered YAML, schemas,
    plan_task_v1 semantics, render determinism, and machine-readable validation diagnostics.
  required_public_contracts:
  - validate_yaml_document(document)
  - validate_rendered_yaml(text)
  - validate_schema(document, schema_name)
  - validate_plan_task_v1(document)
  - validate_render_determinism(document)
  - ValidationReport
  boundaries:
  - Validation must not parse structural YAML paths.
  - Validation must not apply mutations.
  - Validation must not perform backups or atomic writes.
  - Validation must not expose CLI or MCP wrappers.
  - Validation may use public document_io rendering contracts when rendered YAML checks
    are needed.
owned_code_paths:
- yaml_editor/validation/__init__.py
- yaml_editor/validation/package_boundary.py
owned_test_paths:
- tests/validation/test_package_boundary.py
owned_docs_paths: []
forbidden_paths:
- pyproject.toml
- README.md
- yaml_editor/contracts/
- yaml_editor/document_io/
- yaml_editor/path_language/
- yaml_editor/reader/
- yaml_editor/mutations/
- yaml_editor/transaction_writer/
- yaml_editor/interfaces/
- yaml_editor/validation/report.py
- yaml_editor/validation/schema.py
- yaml_editor/validation/semantic.py
- yaml_editor/validation/render_check.py
- yaml_editor/validation/determinism.py
- tests/document_io/
- tests/path_language/
- tests/reader/
- tests/mutations/
- tests/transaction_writer/
- tests/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - G-001 public result and error envelope concepts
  - G-002 document model and renderer public contracts
  may_be_used_by:
  - later G-006 validation tactical steps
  - G-007 checked write pipeline
public_contracts_provided:
- yaml_editor.validation package import boundary
- public validation exports list
responsibilities:
- Define validation package exports for all parent G-006 public contracts.
- Guard against imports from mutations, transaction_writer, interfaces, CLI, or MCP
  layers.
- Keep validation import side-effect free.
verification:
  scope: tactical_completion_gate
  commands:
  - python -m pytest tests/validation/test_package_boundary.py
  expected:
  - yaml_editor.validation imports without reading or writing files.
  - Public exports include the G-006 validation contract names.
  - No forbidden downstream subsystem imports are introduced.
acceptance_criteria:
- Validation package boundary is limited to validation ownership.
- Importing yaml_editor.validation has no mutation, write, CLI, or MCP side effects.
- Later validation steps can implement contracts behind the stable package surface.
model_assignment_spec:
  performer: coding_agent
  instruction: Work only on yaml_editor/validation/__init__.py, yaml_editor/validation/package_boundary.py,
    and tests/validation/test_package_boundary.py. Implement only the validation package
    boundary and public exports. Do not implement validation algorithms, schema loading,
    render checks, mutations, transaction writing, CLI, MCP wrappers, or sibling-owned
    validation modules. Do not edit .venv, venv, site-packages, or installed dependencies.
