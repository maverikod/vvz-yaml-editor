  - site-packages
  instruction: 'Implement rename_pipeline.py with validate_new_name(new_name) and
    execute_rename (target, new_name, update_references, dry_run, project_root) ->
    RenameJobResult. Pipeline steps as described in intent and implementation_notes.
    Call T-002 safety_checkpoint functions for checkpoint creation and rollback. Call
    T-003 find_references for reference discovery. Call CSTFormatter directly (no
    session). On any exception after checkpoint wrap in try/except, call rollback,
    set rollback_performed=True, return RenameJobResult with success=False. Write
    tests in tests/project_refactor/test_rename_pipeline.py. Do not implement MCP
    command, session layer, or editor core.

    '
  non_goals:
  - RenameCommand MCP class (T-005)
  - Session layer involvement
  - Editor core buffer operations
  - Text-based reference matching
