format: tactical_step_v2
plan_id: ai_editor_pip_package_for_mcp
parent_step_id: G-014
parent_step_name: project_refactor
step_id: G-014/T-003
step_name: reference_search_engine
title: Reference search engine - sidecar validation and CST structural matching
status: draft
source_plan: docs/plans/create_pip_package_for_mcp.yaml
source_documents:
- docs/tech_spec.md
- docs/plans/G-014-project-refactor/README.yaml
parent_global_context: 'G-014 owns project-wide rename refactoring. After the safety
  checkpoint is created, the reference search engine scans all project files to find
  nodes that reference the old_name. T-003 owns this search engine in isolation from
  the checkpoint (T-002) and the execution pipeline that applies the renames (T-004).

  '
intent: 'Implement find_references(target: RenameTarget, project_root: str, scope:
  list[str] | None) -> ReferenceSearchResult. For each file in scope (or project_root):
  check sidecar validity by source_sha256; if valid load metadata_map from sidecar
  and search by node name; if stale re-parse via CSTFormatter and rebuild sidecar;
  if parse error skip file and record in skipped_files. Use CST structural node matching,
  not text substring.

  '
why_this_step_exists: 'Reference search is independently testable without the safety
  checkpoint or the rename application step. Sidecar validity check, CSTFormatter
  re-parse, and CST node matching are owned here and not duplicated in T-004. T-004
  calls this module to get the reference list, then applies the renames.

  '
owned_code_paths:
- ai_editor/project_refactor/reference_search.py
- tests/project_refactor/test_reference_search.py
owned_docs_paths: []
forbidden_paths:
- ai_editor/editor_core/
- ai_editor/formatters/yaml/
- ai_editor/formatters/text/
- ai_editor/search/
- ai_editor/sessions/
- ai_editor/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  consumes_from:
  - G-014/T-001 contracts (RenameTarget)
  - G-013 CSTFormatter (parse file, search by node name, build sidecar, sidecar validity
    check)
  provides_to:
  - G-014/T-004 rename_pipeline (calls find_references to get list of references)
public_contracts_provided:
- 'FileReference — dataclass: file_path (str), stable_id (str), node_kind (str), line
  (int), column (int). Represents one reference node to be renamed.

  '
- 'ReferenceSearchResult — dataclass: references (list[FileReference]), skipped_files
  (list[str]). skipped_files always present even when empty.

  '
- 'find_references(target: RenameTarget, project_root: str, scope: list[str] | None)
  -> ReferenceSearchResult: scans all Python files in scope (or project_root when
  scope is None). Per file: check sidecar validity via CSTFormatter sidecar_is_valid(file_path);
  if valid search sidecar metadata_map; if not valid re-parse via CSTFormatter.parse
  and rebuild sidecar; if parse raises skip file and add to skipped_files. Match nodes
  by kind and old_name per reference_matching rules in G-014 global README. Returns
  ReferenceSearchResult.

  '
implementation_notes: 'Method rename matching: Name nodes with value=old_name within
  Call and Attribute contexts. Class rename matching: ClassDef name, base class references,
  isinstance calls, type annotations, imports. Package rename matching: import statements,
  from-import statements, module string references. All matching uses CSTFormatter
  tree traversal; not text substring search. sidecar_is_valid(file_path) checks whether
  .cst/<stem>.tree exists and source_sha256 matches current file SHA256. This check
  is performed by G-013 CSTFormatter sidecar API.

  '
verification:
  commands:
  - python -m pytest tests/project_refactor/test_reference_search.py -v
  expected:
  - find_references with valid sidecar does not re-parse file.
  - find_references with stale sidecar re-parses and rebuilds sidecar.
  - find_references with parse error adds file to skipped_files and continues.
  - Method reference matching finds Call and Attribute nodes with old_name.
  - Class reference matching finds ClassDef, base classes, isinstance, type annotations,
    imports.
  - skipped_files is always a list even when empty.
  - find_references uses structural CST matching not text substring.
  - scope=None scans entire project_root.
  - scope=['src/'] restricts scan to that subtree.
acceptance_criteria:
- find_references uses sidecar when valid and re-parses when stale.
- Parse errors are non-fatal and recorded in skipped_files.
- Reference matching is CST structural not text substring.
- ReferenceSearchResult.skipped_files is always a list.
- No file is modified by find_references.
model_assignment_spec:
  performer: coding_agent
  title: Implement reference search engine for rename
  owned_paths:
