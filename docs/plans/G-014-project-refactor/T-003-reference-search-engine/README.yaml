  - .venv
  - venv
  - site-packages
  instruction: 'Implement reference_search.py with FileReference and ReferenceSearchResult
    dataclasses and find_references(target, project_root, scope) -> ReferenceSearchResult.
    For each Python file in scope: check sidecar validity via CSTFormatter sidecar
    API; if valid search metadata_map; if stale re-parse via CSTFormatter.parse and
    rebuild sidecar; if parse error add to skipped_files and continue. Match nodes
    by kind and name using CST structural traversal per matching rules in G-014/README.yaml.
    Write tests in tests/project_refactor/test_reference_search.py. Do not implement
    safety checkpoint, rename application, or MCP command.

    '
  non_goals:
  - Safety checkpoint (T-002)
  - Rename application pipeline (T-004)
  - MCP command class (T-005)
  - Text substring matching
  - Modifying any file
