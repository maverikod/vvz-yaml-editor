  - G-013 CSTFormatter (used via rename pipeline)
  provides_to:
  - G-008 public interfaces implementer (docs/project_refactor.md as reference)
public_contracts_provided:
- docs/project_refactor.md documenting rename API, safety guarantees, dry_run usage,
  rollback behavior.
implementation_notes: "Integration tests require a small Python fixture project with\
  \ at least one method, class, and import reference to rename. Tests must be run\
  \ in a temp directory to avoid modifying the real codebase. Key scenarios to test:\n\
  \  full rename of method across multiple files in a real temp git repo\n  full rename\
  \ without git available (backup fallback)\n  dry_run preview shows changed_files\
  \ without writing\n  automatic rollback on simulated failure after checkpoint\n\
  \  RENAME_INVALID_IDENTIFIER rejection before any file modification\n  parse-error\
  \ file skipped and recorded in skipped_files\ndocs/project_refactor.md must include:\
  \ purpose, API reference (execute_rename parameters and return fields), safety model\
  \ (git checkpoint vs backup), dry_run workflow, rollback guarantee, and at least\
  \ two usage examples.\n"
verification:
  commands:
  - python -m pytest tests/project_refactor/ -v
  - test -f docs/project_refactor.md
  expected:
  - All G-014 acceptance criteria pass in integration.
  - rename returns job_id immediately without blocking caller.
  - git tag pre-rename/<uuid> is created before first file modification.
  - All discovered references are renamed in changed_files.
  - dry_run=True returns preview without modifying files or creating git tag.
  - Any failure triggers automatic rollback and rollback_performed=True.
  - git unavailable falls back to file backups and operation proceeds normally.
  - RenameJobResult is JSON-serialisable.
  - docs/project_refactor.md exists and covers public API and safety model.
acceptance_criteria:
- Integration test suite passes for all G-014 acceptance criteria.
- docs/project_refactor.md documents the rename API and safety guarantees.
- No new production code is introduced in this step.
- Integration tests run in temp directories; they do not modify the real project.
