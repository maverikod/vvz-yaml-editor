  - ai_editor/formatters/
  - ai_editor/sessions/
  - .venv
  - venv
  - site-packages
  instruction: 'Define RenameTarget and RenameJobResult as Python dataclasses with
    typed fields as listed in public_contracts_provided. Add error code constants
    (RENAME_TARGET_NOT_FOUND, RENAME_INVALID_IDENTIFIER, RENAME_GIT_CHECKPOINT_FAILED,
    RENAME_ROLLBACK_FAILED, GIT_NOT_AVAILABLE) to G-001 ErrorCode or as string constants
    in contracts.py. Export all from ai_editor/project_refactor/__init__.py. Write
    tests in tests/project_refactor/test_contracts.py verifying instantiation, JSON
    serialisability, and importability. Do not implement pipeline, checkpoint, reference
    search, or MCP.

    '
  non_goals:
  - Safety checkpoint (T-002)
  - Reference search (T-003)
  - Rename execution pipeline (T-004)
  - MCP command class (T-005)
