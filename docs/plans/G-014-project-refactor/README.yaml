format: global_package_step_v2
plan_id: ai_editor_pip_package_for_mcp
step_id: G-014
step_name: project_refactor
title: Project-wide rename and refactor subsystem
status: draft
source_plan: docs/plans/create_pip_package_for_mcp.yaml
source_documents:
- docs/tech_spec.md
- docs/plans/G-007-mcp-cli-contract/README.yaml
- docs/plans/G-009-editor-core-buffer-registry/README.yaml
- docs/plans/G-013-cst-formatter/README.yaml
global_intent: 'Own project-wide rename refactoring: rename a method, class, or package
  name across all files in project_root, updating all references. Always executed
  through the mcp-proxy-adapter job queue. Always preceded by a git tag + commit (or
  file backups when git is unavailable). Any failure triggers automatic full rollback
  via git checkout or backup restore before returning an error.'
why_this_block_exists: Rename is a multi-file, long-running, dangerous operation that
  cannot safely run inline. It requires a safety checkpoint before execution, cross-file
  reference discovery, atomic commit of results, and guaranteed rollback on any failure.
  These requirements cannot be satisfied by editor core, search, or formatter layers
  individually.
owned_code_paths:
- ai_editor/project_refactor/
- tests/project_refactor/
owned_docs_paths:
- docs/project_refactor.md
forbidden_code_paths:
- ai_editor/editor_core/
- ai_editor/formatters/
- ai_editor/search/
- ai_editor/document_io/
- ai_editor/path_language/
- ai_editor/reader/
- ai_editor/mutations/
- ai_editor/validation/
- ai_editor/transaction_writer/
- ai_editor/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - G-001 contracts (ResultEnvelope, ErrorCode, Diagnostic)
  - G-009 editor core buffer access (open/save/close)
  - G-013 CSTFormatter (tree-based reference search)
  - G-010 text formatter (fallback reference search)
  - G-007 transaction_writer persistence policy (git vs backup)
  may_be_used_by:
  - G-008 public interfaces and CLI adapter
  - external MCP wrappers via mcp-proxy-adapter job queue only
public_contracts_provided:
- rename(target, new_name, update_references=True, dry_run=False, scope=null) -> job_id
- rename_status(job_id) -> RenameJobResult
- RenameJobResult
- RenameTarget
queue_contract:
  required: true
  reason: Rename is always long-running (scans all project files) and must not block
    the MCP caller. Every rename call registers a job in the mcp-proxy-adapter queue
    and returns job_id immediately. Progress and result are retrieved via queue_get_job_status(job_id).
  caller_flow:
  - call rename(...) -> returns job_id string immediately
  - poll queue_get_job_status(job_id) until status is complete or failed
  - retrieve RenameJobResult from job result payload
  invariants:
  - rename never blocks the caller; it always returns job_id immediately
  - MCP wrapper must not treat job enqueue success as rename success
  - job result nested success=false must be surfaced as operation failure
rename_target_contract:
  class_name: RenameTarget
  required_fields:
  - 'kind: method | class | package'
  - file_path: absolute path to the file containing the definition
  - stable_id: CST stable_id of the definition node (from cst_query or skeleton)
  - old_name: current name string
  optional_fields:
  - 'scope: list of paths to restrict reference search (default: entire project_root)'
rename_operation_contract:
  method: rename(target, new_name, update_references=True, dry_run=False, scope=null)
    -> job_id
  params:
    target: RenameTarget
    new_name: new identifier string
    update_references:
      default: true
      meaning: search all project files for references and rename them
    dry_run:
      default: false
      meaning: discover references and report changes without writing any file or
        creating git tag or backup
    scope:
      default: null (entire project_root)
      meaning: restrict reference search to this list of paths
  returns: job_id string (mcp-proxy-adapter queue job)
safety_checkpoint_policy:
  git_available:
    before_rename:
    - 'create git tag: pre-rename/<job_uuid>'
    - 'create git commit: pre-rename checkpoint <old_name> -> <new_name>'
    after_success:
    - 'create git commit: rename <old_name> -> <new_name> (N files changed)'
    on_any_failure:
    - execute git checkout to pre-rename tag
    - restore working tree to pre-rename state
    - return RenameJobResult with success=false and rollback_performed=true
  git_not_available:
    before_rename:
    - create file backup for every file that will be modified
    - backup policy same as G-007 transaction_writer backup stage
    after_success:
    - backups retained until explicitly cleared
    on_any_failure:
    - restore all modified files from backups
    - return RenameJobResult with success=false and rollback_performed=true
  invariants:
  - dry_run=true never creates git tags, commits, or backups
  - safety checkpoint is always created before the first file is modified
  - rollback is always automatic on any failure; no manual rollback command required
  - GIT_NOT_AVAILABLE is not an error when backup fallback is active
git_vs_backup_policy:
  detection: check git rev-parse in project_root at job start
  git_available: use safety_checkpoint_policy.git_available path
  git_not_available: use safety_checkpoint_policy.git_not_available path
  invariant: Exactly one safety mechanism is always active before the first file modification.
    There is no mode where rename runs without either a git checkpoint or file backups.
reference_search_policy:
  scope: entire project_root unless scope param restricts it
  per_file_strategy:
    sidecar_valid:
      condition: .cst/<stem>.tree exists AND source_sha256 matches current file SHA256
      action: load metadata_map from sidecar; search by node name in metadata_map
      rationale: fast, no re-parse needed
    sidecar_missing_or_stale:
      condition: no valid sidecar
      action: parse file via CSTFormatter; build tree; search by node name; write
        sidecar
      rationale: sidecar is always rebuilt as a side effect so future searches are
        fast
    parse_error:
      condition: CSTFormatter.parse raises FORMAT_VALIDATION_FAILED
      action: skip file; record in skipped_files list in RenameJobResult
      rationale: corrupt file cannot be safely renamed; do not abort entire operation
  reference_matching:
    method_rename: match Name nodes with value=old_name within Call and Attribute
      contexts
    class_rename: match ClassDef name, base class references, isinstance calls, type
      annotations, imports
    package_rename: match import statements, from-import statements, module string
      references
  note: Reference matching uses CST structural node search, not text substring matching.
    Only semantically valid references are renamed.
rename_execution_pipeline:
  steps:
  - validate new_name is a valid Python identifier
  - create safety checkpoint (git tag+commit or file backups)
  - open definition file; find node by stable_id via CSTFormatter
  - rename definition node header via replace operation
  - scan all project files per reference_search_policy
  - apply replace operations to all discovered references
  - save all modified buffers (validate before each save)
  - create result git commit or retain backups
  - return RenameJobResult
  failure_handling:
    trigger: any exception or validation failure in any step after checkpoint
    action: automatic rollback; set rollback_performed=true
    invariant: no partial state left on disk after failure
rename_job_result_contract:
  class_name: RenameJobResult
  required_fields:
  - success: bool
  - job_id: str
  - old_name: str
  - new_name: str
  - dry_run: bool
  - changed_files: list of file paths where changes were applied
  - skipped_files: list of file paths skipped due to parse error
  - reference_count: total renamed references across all files
  - rollback_performed: bool
  - git_tag: str or null
  - diagnostics: list of Diagnostic
  invariants:
  - success=true requires rollback_performed=false
  - success=false requires rollback_performed=true
  - dry_run=true means changed_files is a preview list; no files were written
  - skipped_files is always present as a list even when empty
error_codes_owned:
- RENAME_TARGET_NOT_FOUND
- RENAME_INVALID_IDENTIFIER
- RENAME_GIT_CHECKPOINT_FAILED
- RENAME_ROLLBACK_FAILED
- GIT_NOT_AVAILABLE
verification:
  scope: global_completion_gate
  commands:
  - python -m pytest tests/project_refactor
  expected:
  - rename returns job_id immediately without blocking caller
  - git tag pre-rename/<uuid> is created before first file modification
  - definition node is renamed by stable_id
  - valid-sidecar files are searched without re-parsing
  - stale-sidecar files are re-parsed and sidecar is rebuilt
  - parse-error files are skipped and recorded in skipped_files
  - all discovered references are renamed in changed_files
  - dry_run=True returns preview without modifying files or creating git tag
  - any failure triggers automatic rollback and rollback_performed=true in result
  - git unavailable falls back to file backups; operation proceeds normally
  - RenameJobResult is JSON-serializable
acceptance_criteria:
- rename is always enqueued in mcp-proxy-adapter queue; never runs inline
- safety checkpoint (git tag+commit or file backup) always precedes first file write
- automatic rollback on any failure; no manual rollback command required
- reference search uses sidecar when valid, re-parses when stale, skips on parse error
- CST structural node matching; not text substring matching
- git and backup are mutually exclusive safety mechanisms; exactly one is always active
- dry_run=True is a safe preview with no side effects
- RenameJobResult reports changed_files, skipped_files, reference_count, rollback_performed
- new_name is validated as a valid Python identifier before any file is touched
model_assignment_spec:
  performer: coding_agent
  instruction: 'Implement only project-wide rename refactoring under ai_editor/project_refactor/
    and tests/project_refactor/. rename() must always enqueue a job in mcp-proxy-adapter
    queue and return job_id immediately without blocking. Before any file is modified:
    if git is available create tag pre-rename/<job_uuid> and a checkpoint commit;
    if git is not available create file backups per G-007 backup policy. On any failure
    after checkpoint automatically rollback via git checkout <tag> or backup restore;
    set rollback_performed=true in result. Reference search: for each file in project_root
    check sidecar validity by source_sha256; if valid load from sidecar; if stale
    re-parse via CSTFormatter and rebuild sidecar; if parse error skip and record
    in skipped_files. Use CST structural node matching not text search. dry_run=True
    discovers references and builds preview RenameJobResult without writing files,
    creating git tags, or creating backups. Do not implement editor core, formatter
    internals, search layer, document_io, path_language, validation, transaction_writer,
    interfaces, CLI, MCP wrappers, .venv, venv, or site-packages.'
