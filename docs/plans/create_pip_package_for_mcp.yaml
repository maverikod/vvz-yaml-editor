format: implementation_plan_v1
plan_id: yaml_editor_pip_package_for_mcp
project: yaml_editor
source_documents:
- docs/tech_spec.md
created_for: mcp_server_usage
status: draft
language_policy:
  documentation_language: English
  code_logs_commands_prompts_and_specs: English
summary:
  goal: Create a production-ready Python pip package that provides a small, familiar
    editor interface for MCP servers and AI models. The package must separate file/buffer
    lifecycle, formatter-specific editing, and universal search. YAML is the first
    structured formatter and text is the first plain formatter; JSON and Markdown
    must be possible later without redesigning AbstractBuffer, AbstractFormatter,
    or AbstractSearch.
  main_principle: open/new buffer -> search/select addresses -> copy/cut/paste in
    buffers -> formatter.validate -> formatter.render -> checked save/save_as
  non_goals:
  - Do not expose many technical buffer, session, or clipboard internals as normal
    model-facing commands.
  - Do not let formatter implementations open, save, or close files.
  - Do not let buffer lifecycle logic know YAML paths or text line ranges.
  - Do not put search/query semantics inside file save/open logic.
  - Do not implement regular editing through unsafe line ranges for structured formats.
  - Do not patch .venv, site-packages, or installed dependency code.
  - Do not allow save/save_as to persist invalid content for the active formatter.
  - Do not make YAML-specific assumptions part of the editor core.
package_target:
  distribution_name: yaml-editor-mcp
  import_package: yaml_editor
  python_requires: '>=3.10'
  license: TBD
  build_backend: hatchling
  runtime_dependencies:
  - ruamel.yaml
  - jsonschema
  - jsonpath-ng
  optional_dependencies:
    dev:
    - pytest
    - pytest-cov
    - mypy
    - ruff
    - build
    - twine
  public_entry_points:
    console_scripts:
    - yaml-editor=yaml_editor.interfaces.cli:main
  repository_constraints:
    forbidden_paths:
    - .venv
    - venv
    - site-packages
    editable_scope:
    - pyproject.toml
    - README.md
    - yaml_editor
    - tests
    - docs
module_architecture:
  package_layout:
  - path: yaml_editor/__init__.py
    purpose: Public package exports and version.
  - path: yaml_editor/editor_core/
    purpose: 'AbstractBuffer and buffer registry: file-backed/unsaved buffers, dirty
      state, revision/hash state, open/save/save_as/close/reload lifecycle, stale
      checks, and atomic persistence orchestration.'
  - path: yaml_editor/formatters/base.py
    purpose: 'AbstractFormatter contract: parse, render, validate, normalize_address,
      copy_fragment, cut_fragment, paste_fragment, get_unit, iter_units, diagnostics,
      and unit comparison hooks.'
  - path: yaml_editor/formatters/text/
    purpose: Text formatter backend. Represents documents as arrays of lines and owns
      text address, text unit, and text copy/cut/paste semantics.
  - path: yaml_editor/formatters/yaml/
    purpose: YAML formatter backend. Represents documents as YAML trees and owns YAML
      address, YAML unit, structural path, parse, render, validation, and YAML copy/cut/paste
      semantics.
  - path: yaml_editor/search/
    purpose: 'AbstractSearch and universal search engine over formatter units: find,
      find_one, list_units, select, match_unit, and formatter-driven compare_units.'
  - path: yaml_editor/api.py
    purpose: High-level model-facing API for buffer lifecycle, copy/cut/paste, search,
      validation, and YAML compatibility wrappers intended for MCP command handlers.
  - path: yaml_editor/models.py
    purpose: Typed request and response dataclasses or pydantic-free DTOs, including
      BufferAddress, buffer, formatter, search, clipboard, and compatibility request/response
      contracts.
  - path: yaml_editor/path_parser.py
    purpose: YAML structural address parser for keys, indexes, and list filters such
      as commands[name=buf_diff], owned by the YAML formatter path layer.
  - path: yaml_editor/loader.py
    purpose: YAML raw-content parse, tree summary, and parse diagnostics, used by
      the YAML formatter backend rather than by buffer lifecycle.
  - path: yaml_editor/operations.py
    purpose: 'YAML in-memory formatter operations: set, replace_block, append, delete,
      move, and paste modes.'
  - path: yaml_editor/clipboard.py
    purpose: Format-aware clipboard payloads for editor copy/cut/paste operations,
      including source_formatter, source_address, source_revision, payload_kind, and
      payload.
  - path: yaml_editor/validator.py
    purpose: YAML syntax validation, rendered YAML validation, schema validation,
      and semantic validation, used by the YAML formatter backend.
  - path: yaml_editor/renderer.py
    purpose: Deterministic ruamel.yaml rendering with formatting preservation, used
      by the YAML formatter backend.
  - path: yaml_editor/writer.py
    purpose: 'Checked persistence helper used by AbstractBuffer save/save_as: backups,
      hashes, atomic write, and read-back diagnostics.'
  - path: yaml_editor/schemas/plan_task_v1.schema.json
    purpose: JSON Schema for plan_task_v1 structural checks.
  - path: yaml_editor/interfaces/cli.py
    purpose: Small CLI wrapper for manual testing and MCP diagnostics; console script
      target is yaml_editor.interfaces.cli:main.
  - path: tests/
    purpose: Unit and integration tests over buffer lifecycle, search, text formatter,
      YAML formatter, and real fixtures.
public_api:
  core_commands:
  - name: open
    layer: buffer
    purpose: Open a file-backed buffer or return the existing buffer_id when the file
      is already open.
    request:
      file_path: string
      formatter: auto|text|yaml
    response_fields:
    - success
    - buffer_id
    - file_path
    - formatter
    - dirty
    - revision
    - diagnostics
  - name: new
    layer: buffer
    purpose: Create a new unsaved buffer with an explicit formatter.
    request:
      formatter: text|yaml
      display_name: optional string
    response_fields:
    - success
    - buffer_id
    - formatter
    - dirty
    - revision
    - diagnostics
  - name: save
    layer: buffer
    purpose: Validate, render, stale-check, back up, and atomically write a file-backed
      buffer.
    request:
      buffer_id: string
    response_fields:
    - success
    - buffer_id
    - file_path
    - old_hash
    - new_hash
    - dirty
    - diagnostics
  - name: save_as
    layer: buffer
    purpose: Validate, render, and atomically write a buffer to a target file_path,
      then bind the buffer to that file.
    request:
      buffer_id: string
      file_path: string
      overwrite: boolean
    response_fields:
    - success
    - buffer_id
    - file_path
    - old_hash
    - new_hash
    - dirty
    - diagnostics
  - name: close
    layer: buffer
    purpose: Close a buffer using an explicit unsaved-changes policy.
    request:
      buffer_id: string
      save: boolean
      policy: discard|save|error_if_dirty
    response_fields:
    - success
    - buffer_id
    - closed
    - diagnostics
  - name: copy
    layer: edit
    purpose: Copy a formatter-defined fragment from a source BufferAddress into the
      format-aware clipboard.
    request:
      source:
        buffer_id: string
        address: formatter-specific value
      clipboard_item_id: optional string
    response_fields:
    - success
    - clipboard_item_id
    - source_buffer_id
    - source_formatter
    - source_address
    - payload_kind
    - diagnostics
  - name: cut
    layer: edit
    purpose: Cut a formatter-defined fragment from a source BufferAddress into the
      format-aware clipboard and mark the source buffer dirty.
    request:
      source:
        buffer_id: string
        address: formatter-specific value
      clipboard_item_id: optional string
    response_fields:
    - success
    - clipboard_item_id
    - source_buffer_id
    - source_formatter
    - source_address
    - changed_addresses
    - dirty
    - diagnostics
  - name: paste
    layer: edit
    purpose: Paste a clipboard fragment into a target BufferAddress using formatter-defined
      paste semantics and mark the target buffer dirty.
    request:
      target:
        buffer_id: string
        address: formatter-specific value
      mode: formatter-specific string
      clipboard_item_id: optional string
    response_fields:
    - success
    - target_buffer_id
    - target_formatter
    - target_address
    - changed_addresses
    - dirty
    - diagnostics
  - name: find
    layer: search
    purpose: Find formatter units in a buffer using AbstractSearch over formatter-provided
      units.
    request:
      buffer_id: string
      query: formatter/search query object
      scope: optional formatter-specific scope
    response_fields:
    - success
    - matches
    - diagnostics
  - name: find_one
    layer: search
    purpose: Return exactly one matching formatter unit or a typed search error.
    request:
      buffer_id: string
      query: formatter/search query object
      scope: optional formatter-specific scope
    response_fields:
    - success
    - match
    - address
    - diagnostics
  - name: list_units
    layer: search
    purpose: List formatter-provided units for a buffer and optional scope.
    request:
      buffer_id: string
      scope: optional formatter-specific scope
    response_fields:
    - success
    - units
    - diagnostics
  - name: validate
    layer: formatter
    purpose: Run formatter validation for a buffer without writing it.
    request:
      buffer_id: string
      schema: optional string
    response_fields:
    - success
    - validation
    - errors
    - diagnostics
  compatibility_commands:
    yaml_compatibility:
    - yaml_load -> open(file_path, formatter=yaml) plus yaml formatter summary
    - yaml_write_checked -> open/apply formatter operations/save compatibility flow
    - yaml_validate -> validate(buffer_id) through yaml formatter
    - yaml_get -> find_one/get_unit through yaml formatter address
    - yaml_get_command -> find_one with YAML query over units
    - yaml_set -> paste(mode=set) on YAML formatter
    - yaml_replace_block -> paste(mode=replace_block) on YAML formatter
    - yaml_append -> paste(mode=append) on YAML formatter
    - yaml_delete -> cut and discard clipboard fragment on YAML formatter
    - yaml_move -> cut + paste on YAML formatter
    - yaml_clipboard_* -> editor copy/cut/paste plus clipboard internals
  buffer_address_contract:
    name: BufferAddress
    required_fields:
    - buffer_id
    - address
    rules:
    - address is opaque to editor core
    - address is interpreted only by the buffer formatter
    - YAML formatter treats address as structural YAML path
    - Text formatter treats address as line range, insertion point, or whole document
  fallback_unsafe_commands:
  - name: yaml_read_lines
    allowed_usage: Emergency diagnostics only.
  - name: yaml_write_lines_unsafe
    allowed_usage: Emergency low-level repair only; must be visibly marked unsafe
      and must not be part of normal editor workflows.
yaml_path_requirements:
  supported_syntax:
  - top_level_key
  - dotted.path.to.key
  - list[0]
  - commands[name=buf_diff]
  - commands[name=buf_diff].metadata.best_practices[1]
  parser_rules:
  - Reject empty paths for replace operations unless the command explicitly supports
    full-document replacement.
  - Return a typed error for no match.
  - Return a typed error for non-unique list filter matches.
  - Preserve mapping order and comments where ruamel.yaml can preserve them.
  - Report changed_paths exactly as normalized structural paths.
validation_requirements:
  generic:
  - YAML must parse before any operation is applied.
  - Patched in-memory tree must remain valid YAML.
  - Rendered YAML must parse back to an equivalent tree.
  - Rendering must be deterministic for the same input tree.
  - Write must be rejected if changed paths differ from expected operation paths.
  plan_task_v1:
  - format must equal plan_task_v1.
  - node_id must match the file level conventions used by the plans repository.
  - kind must be one of spec, global, tactical, atomic.
  - depends_on must be a list of strings.
  - commands must be a list of objects.
  - commands[].name values must be unique.
  - commands[].schema.required must reference only existing properties.
  - read_model.sees_live_tmpfs_worktree must be false for read-only plan_* disk commands.
  - buf_flush semantics must not contradict root README semantics: commit to buf/<uuid>,
      no merge, lock retained.
  - verification must be a non-empty list.
  - status must be one of draft, ready_for_review, ready_for_implementation, blocked.
error_model:
  typed_errors:
  - YAML_PARSE_FAILED
  - PATH_PARSE_FAILED
  - PATH_NOT_FOUND
  - PATH_NOT_UNIQUE
  - TARGET_TYPE_MISMATCH
  - VALIDATION_FAILED
  - SCHEMA_VALIDATION_FAILED
  - SEMANTIC_VALIDATION_FAILED
  - RENDER_NOT_DETERMINISTIC
  - CHANGED_PATH_MISMATCH
  - WRITE_FAILED
  - BACKUP_FAILED
  - CLIPBOARD_ITEM_NOT_FOUND
  - CLIPBOARD_ITEM_EXISTS
  - CLIPBOARD_INVALID_MODE
  - SOURCE_PATH_NOT_FOUND
  - TARGET_PATH_NOT_FOUND
  response_contract:
    success: boolean
    error_code: optional string
    message: string
    details: object
    diagnostics: object
implementation_steps:
- id: step_01
  title: Initialize package skeleton
  actions:
  - Create pyproject.toml with hatchling build backend.
  - Create yaml_editor package and tests directory.
  - Define package metadata, runtime dependencies, and dev optional dependencies.
  deliverables:
  - pyproject.toml
  - yaml_editor/__init__.py
  - tests/conftest.py
  verification:
  - python -m build succeeds locally.
  - pip install -e . installs yaml_editor from the repository source.
- id: step_02
  title: Implement YAML loading and summary
  actions:
  - Implement ruamel.yaml based loader.
  - Preserve comments, order, quotes, and block styles where possible.
  - Return top-level keys, format, node_id, command names, valid_yaml, and diagnostics.
  deliverables:
  - yaml_editor/loader.py
  - tests/test_loader.py
  verification:
  - yaml_load returns expected summary for plan_task_v1 fixtures.
  - Invalid YAML returns YAML_PARSE_FAILED without writing files.
- id: step_03
  title: Implement structural YAML path parser
  actions:
  - Parse dotted keys, list indexes, and list filters.
  - Support commands[name=...] lookup.
  - Normalize paths for diagnostics and changed_paths.
  deliverables:
  - yaml_editor/path_parser.py
  - tests/test_path_parser.py
  verification:
  - Parser resolves commands[name=buf_diff].metadata.
  - Parser rejects ambiguous or malformed paths with typed errors.
- id: step_04
  title: Implement read-only tree access
  actions:
  - Implement yaml_get.
  - Implement yaml_get_command and yaml_get_verification helpers.
  - Ensure returned fragments are exact structural fragments, not line ranges.
  deliverables:
  - yaml_editor/api.py
  - tests/test_get_api.py
  verification:
  - yaml_get returns only the selected block.
  - Missing path returns PATH_NOT_FOUND.
- id: step_05
  title: Implement in-memory mutation operations
  actions:
  - Implement set, replace_block, append, delete, and move operations.
  - Add dedupe handling for append.
  - Track changed paths for every operation.
  deliverables:
  - yaml_editor/operations.py
  - tests/test_operations.py
  verification:
  - Operations mutate only intended nodes.
  - Append with dedupe=true is idempotent.
  - Move changes list order only at the requested path.
- id: step_06
  title: Implement workflow clipboard
  actions:
  - Implement runtime clipboard storage for YAML nodes, YAML blocks, and text fragments.
  - Support memory and project-local persistent cache storage modes.
  - Implement yaml_clipboard_copy, yaml_clipboard_get, yaml_clipboard_list, yaml_clipboard_clear,
    and yaml_clipboard_paste.
  - Validate source files, source paths, target files, target paths, clipboard item
    existence, and paste compatibility before mutation.
  - Ensure paste delegates to the checked write pipeline and supports dry_run=true.
  deliverables:
  - yaml_editor/clipboard.py
  - tests/test_clipboard.py
  - docs/mcp_integration.md
  verification:
  - Copying a missing source path returns SOURCE_PATH_NOT_FOUND or PATH_NOT_FOUND
    without creating a clipboard item.
  - Pasting a missing clipboard item returns CLIPBOARD_ITEM_NOT_FOUND without changing
    the target file.
  - Dry-run paste returns would_change without modifying the file.
  - Real paste is verified through a separate yaml_get or yaml_load call.
- id: step_07
  title: Implement schema and semantic validation
  actions:
  - Add plan_task_v1 JSON Schema.
  - Implement generic YAML validation.
  - Implement semantic checks from docs/tech_spec.md.
  deliverables:
  - yaml_editor/validator.py
  - yaml_editor/schemas/plan_task_v1.schema.json
  - tests/test_validator.py
  verification:
  - Invalid required references are rejected.
  - Empty verification is rejected.
  - Invalid status is rejected.
- id: step_08
  title: Implement deterministic rendering
  actions:
  - Render YAML through ruamel.yaml.
  - Reparse rendered YAML and compare structural equivalence.
  - Detect non-deterministic rendering by rendering twice.
  deliverables:
  - yaml_editor/renderer.py
  - tests/test_renderer.py
  verification:
  - Rendered YAML parses successfully.
  - Two renders of the same tree are identical.
- id: step_09
  title: Implement atomic checked writer
  actions:
  - Implement read-parse-patch-validate-render-validate-write pipeline.
  - Add dry_run mode.
  - Add backup creation before real write.
  - Compute old_hash and new_hash.
  - Return backup_uuid, changed_paths, validation_result, and render_preview.
  deliverables:
  - yaml_editor/writer.py
  - tests/test_writer.py
  verification:
  - Dry run returns would_change without modifying the file.
  - Failed validation leaves the file byte-for-byte unchanged.
  - Successful write returns old_hash and new_hash.
- id: step_10
  title: Implement public API wrappers
  actions:
  - Expose yaml_load, yaml_validate, yaml_get, yaml_set, yaml_replace_block, yaml_append,
    yaml_delete, yaml_move, yaml_clipboard_copy, yaml_clipboard_get, yaml_clipboard_list,
    yaml_clipboard_clear, yaml_clipboard_paste, and yaml_write_checked.
  - Expose model-friendly helper functions.
  - Ensure API responses are JSON-serializable for MCP servers.
  deliverables:
  - yaml_editor/api.py
  - tests/test_public_api.py
  verification:
  - Every public function has success and error response contracts.
  - API responses can be serialized with json.dumps.
- id: step_11
  title: Add CLI for diagnostics
  actions:
  - Implement yaml-editor load, validate, get, clipboard-copy, clipboard-get, clipboard-list,
    clipboard-clear, clipboard-paste, and write-checked commands.
  - Keep CLI thin and delegate to public API.
  deliverables:
  - yaml_editor/interfaces/cli.py
  - tests/test_cli.py
  verification:
  - yaml-editor --help exits with code 0.
  - yaml-editor validate fixture.yaml reports validation result.
  - yaml-editor clipboard-copy followed by clipboard-paste dry-run reports expected
    changed_paths.
- id: step_12
  title: Add MCP integration guide
  actions:
  - Document how an MCP server imports yaml_editor.api functions.
  - Document request and response JSON examples.
  - Document clipboard copy/paste workflow for splitting one step into two checked
    edits.
  - Document that MCP command handlers must never use yaml_write_lines_unsafe for
    normal operation.
  deliverables:
  - docs/mcp_integration.md
  verification:
  - Guide includes examples for yaml_write_checked, yaml_get_command, yaml_clipboard_copy,
    and yaml_clipboard_paste.
- id: step_13
  title: Add packaging and release checks
  actions:
  - Run ruff, mypy, pytest, build, and twine check.
  - Confirm wheel contains schemas.
  - Confirm import works from installed wheel in a clean virtual environment.
  deliverables:
  - dist/*.whl
  - dist/*.tar.gz
  - release checklist in docs/release_checklist.md
  verification:
  - python -m build succeeds.
  - twine check dist/* succeeds.
  - python -c "import yaml_editor; print(yaml_editor.__version__)" succeeds after
    wheel install.
model_assignment_spec:
  title: Implement yaml-editor-mcp pip package from docs/tech_spec.md
  role: coding_agent
  scope: Work only inside the yaml_editor source repository. Do not edit .venv, venv,
    site-packages, or installed packages. Build a reusable pip package that MCP servers
    can import to perform structural YAML edits safely.
  required_behavior:
  - Prefer structural YAML tree operations over line-based edits.
  - Preserve formatting and comments using ruamel.yaml where feasible.
  - Make every write operation checked and atomic.
  - Return truthful, typed errors instead of partial success.
  - Provide JSON-serializable responses suitable for MCP command handlers.
  - Validate behavior with actual commands and tests, not only code inspection.
  implementation_order:
  - package_skeleton
  - editor_core_buffer_registry
  - text_yaml_formatters
  - universal_search
  - loader
  - path_parser
  - read_api
  - operations
  - workflow_clipboard
  - validator
  - renderer
  - writer
  - public_api
  - cli
  - mcp_integration_docs
  - packaging_release_checks
  acceptance_criteria:
  - The package can be installed as a wheel.
  - The package can be imported by an MCP server without side effects.
  - yaml_write_checked never writes invalid YAML.
  - dry_run mode never changes files.
  - Failed schema or semantic validation leaves files unchanged.
  - plan_task_v1 validation covers all checks listed in docs/tech_spec.md.
  - Workflow clipboard state is not written into plan_task_v1 documents.
  - Clipboard copy validates source file, source path, uniqueness, and payload serializability
    before storing an item.
  - Clipboard paste validates target file, target path, clipboard item existence,
    and paste compatibility before using the checked write pipeline.
  - Tests cover success, failure, dry-run, dedupe, ambiguous path, invalid YAML, missing
    clipboard item, and split-step clipboard cases.
  - CLI diagnostics work for load, validate, get, clipboard-copy, clipboard-get, clipboard-list,
    clipboard-clear, clipboard-paste, and write-checked flows.
  prohibited_actions:
  - Do not edit .venv, venv, site-packages, or dependency internals.
  - Do not implement normal model workflows through yaml_write_lines_unsafe.
  - Do not silently coerce invalid operation targets.
  - Do not return completed or success when validation failed.
regression_commands:
  local:
  - python -m pytest
  - python -m ruff check .
  - python -m mypy yaml_editor
  - python -m build
  - python -m twine check dist/*
  mcp_level:
  - Import yaml_editor.api in the target MCP server.
  - Register wrapper commands for yaml_load, yaml_get, yaml_write_checked, yaml_validate_plan_task,
    yaml_clipboard_copy, yaml_clipboard_get, yaml_clipboard_list, yaml_clipboard_clear,
    and yaml_clipboard_paste.
  - Execute yaml_load against a real plan YAML fixture.
  - Execute yaml_write_checked with dry_run=true and verify no file change.
  - Execute yaml_clipboard_copy against an existing YAML path and verify the item
    through yaml_clipboard_get.
  - Execute yaml_clipboard_list and verify the copied item appears without reading
    or mutating a plan YAML document.
  - Execute yaml_clipboard_paste with dry_run=true and verify no file change.
  - Execute yaml_clipboard_paste with dry_run=false and verify the result through
    a separate yaml_get or yaml_load call.
  - Execute yaml_clipboard_clear and verify yaml_clipboard_get returns CLIPBOARD_ITEM_NOT_FOUND
    for the cleared item.
  - Execute yaml_write_checked with dry_run=false and verify the result through a
    separate yaml_get or yaml_load call.
observations_template:
- command: ''
  expected: ''
  actual: ''
  error: ''
  root_cause: ''
  fix: ''
  post_fix_verification: ''
  status: ''
coverage_gap_closures:
- gap: unsafe_line_fallback_owner
  resolution: G-008/T-008 owns yaml_read_lines and yaml_write_lines_unsafe as emergency-only
    fallback APIs.
- gap: changed_path_mismatch_gate
  resolution: G-007/T-009 owns expected-vs-actual changed path comparison and CHANGED_PATH_MISMATCH
    rejection before persistence.
- gap: model_friendly_write_helpers
  resolution: G-008/T-009 owns YAML-specific helper compatibility semantics such as
    yaml_update_command, yaml_append_verification, and yaml_validate_plan_task over
    the generic editor/search/formatter architecture.
- gap: console_entry_point_alignment
  resolution: Root console script target is yaml-editor=yaml_editor.interfaces.cli:main
    and G-008/T-010 owns alignment verification with G-001 metadata coordination.
- gap: buffer_file_lifecycle_separated_from_formatter
  resolution: G-009 owns AbstractBuffer, dynamic buffer registry, file-backed/unsaved
    buffers, dirty state, stale checks, and open/new/save/save_as/close/reload lifecycle.
    Formatters must not open, save, or close files.
- gap: formatter_editing_separated_from_buffer_and_search
  resolution: G-010 owns AbstractFormatter, initial text/yaml formatters, formatter-specific
    address semantics, copy/cut/paste fragment operations, unit contracts, compare_units,
    and formatter clipboard compatibility.
- gap: universal_search_separated_from_file_and_formatter_lifecycle
  resolution: 'G-011 owns AbstractSearch over formatter-provided units: find, find_one,
    list_units, select, match_unit use, compare_units use, search result policy, and
    search typed errors.'
- gap: copy_cut_paste_address_contract
  resolution: Root public API and G-009 require copy/cut to provide source BufferAddress
    and paste to provide target BufferAddress; address is opaque to editor core and
    interpreted only by formatter.
workflow_clipboard:
  purpose: Runtime workflow property for copying YAML nodes, YAML blocks, and text
    fragments between checked editing steps without adding clipboard data to plan_task_v1
    documents.
  storage_modes:
  - memory
  - persistent_project_local_cache
  default_storage_mode: persistent_project_local_cache
  persistent_storage_path: .yaml_editor_clipboard/
  git_policy: Clipboard storage is workflow/cache state and must not be committed.
  supported_payload_kinds:
  - yaml_node
  - yaml_block
  - text
  required_source_checks:
  - source file exists
  - source YAML parses for YAML payloads
  - source path exists
  - source path resolves uniquely
  - selected payload can be serialized
  required_target_checks:
  - target file exists
  - target YAML parses for YAML paste operations
  - clipboard item exists
  - target path exists
  - target path resolves uniquely
  - paste mode is compatible with target node type
  write_policy: Paste operations must use the checked write pipeline and support dry_run=true.
  commands:
  - yaml_clipboard_copy
  - yaml_clipboard_get
  - yaml_clipboard_list
  - yaml_clipboard_clear
  - yaml_clipboard_paste
  typed_errors:
  - CLIPBOARD_ITEM_NOT_FOUND
  - CLIPBOARD_ITEM_EXISTS
  - CLIPBOARD_INVALID_MODE
  - SOURCE_PATH_NOT_FOUND
  - TARGET_PATH_NOT_FOUND
