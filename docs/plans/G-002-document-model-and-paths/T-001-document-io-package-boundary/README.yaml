format: tactical_step_v1
parent_step_id: G-002
parent_step_name: document_io
tactical_step_id: T-001
tactical_step_name: document_io_package_boundary
title: Document IO package boundary and module layout
status: draft
source_documents:
- docs/tech_spec.md
- docs/plans/create_pip_package_for_mcp.yaml
- docs/plans/G-002-document-model-and-paths/README.yaml
intent: Define the document_io subsystem package boundary, internal module layout,
  and dependency rules before any YAML parsing behavior is implemented.
owned_code_paths:
- ai_editor/document_io/__init__.py
owned_test_paths:
- tests/document_io/test_package_boundary.py
owned_docs_paths: []
forbidden_paths:
- pyproject.toml
- README.md
- ai_editor/contracts/
- ai_editor/editor_core/
- ai_editor/formatters/
- ai_editor/search/
- ai_editor/path_language/
- ai_editor/reader/
- ai_editor/mutations/
- ai_editor/validation/
- ai_editor/transaction_writer/
- ai_editor/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - G-001-package-contracts-and-distribution
  may_be_used_by:
  - T-002-document-model
  - T-003-ai-parser-loader
  - T-004-deterministic-renderer
  - T-005-document-summary
  - T-006-parse-diagnostics
  - T-007-document-io-verification
public_contracts_provided:
- ai_editor.document_io package namespace
package_boundary_policy:
  initial_namespace_state:
    allowed:
    - package imports without side effects
    - explicit empty or minimal __all__
    - module docstring describing document_io scope
    forbidden:
    - importing loader, renderer, summary, diagnostics, path language, reader, mutation,
      validation, writer, CLI, or MCP wrapper modules
    - configuring ruamel.yaml parser state
    - reading files or environment state during package import
  future_export_policy:
  - Public document_io APIs may be imported from their owning modules directly.
  - Package-root re-exports from ai_editor.document_io are not required by T-002 through
    T-006.
  - If later re-exports are desired, they must be added by a dedicated package-index
    owner step or by revising this T-001 plan, not by ad hoc edits from other tactical
    steps.
  import_safety_boundary:
  - ai_editor.document_io package import must not import future subsystem packages.
  - ai_editor.document_io package import must not initialize parser, renderer, summary,
    or diagnostics behavior.
responsibilities:
- Define the public namespace boundary for document_io.
- Keep document_io independent from path parsing, reading, mutation, validation, transaction
  writing, CLI, and MCP wrappers.
- Make later document_io modules discoverable by module path without exporting unstable
  internals.
implementation_notes:
- This step owns package boundary only; it must not implement parser, renderer, diagnostics,
  or summary behavior.
- Future document_io modules must not configure global mutable YAML parser state.
- The package index should start empty or minimal and must not re-export future modules
  before their owning steps exist.
- Re-export policy changes require an explicit plan owner; later module implementation
  steps must not silently edit this package index.
verification:
  scope: tactical_completion_gate
  commands:
  - python -m pytest tests/document_io/test_package_boundary.py
  expected:
  - document_io package imports without importing forbidden subsystems.
  - Public namespace is explicit and minimal.
  - document_io package import does not configure parser, renderer, summary, diagnostics,
    filesystem, CLI, or MCP behavior.
acceptance_criteria:
- document_io package boundary is explicit.
- No future subsystem package is imported by document_io package initialization.
- No parser, renderer, summary, diagnostics, filesystem, CLI, or MCP behavior is initialized
  by package import.
- This tactical step edits only its owned package-boundary file and test.
model_assignment_spec:
  performer: coding_agent
  instruction: Work only on the document_io package boundary and its tests. Do not
    implement parser, renderer, summary, diagnostics, path language, reader, mutation,
    validation, transaction writer, interface, CLI, or MCP wrapper behavior. Keep
    ai_editor.document_io imports side-effect free and minimal. Do not edit .venv,
    venv, site-packages, or installed dependencies.
observations_template:
