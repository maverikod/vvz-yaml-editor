global_intent: G-010-yaml-formatter internal module. Owned by G-010. Provides ruamel.yaml
  round-trip parser configuration, YamlDocument wrapper, DocumentSummary, ParseDiagnostic,
  deterministic renderer. Used internally by YAMLFormatter — not a public subsystem.
  Implementer reads G-010 for context.
why_this_block_exists: Internal submodule of G-010 YAMLFormatter. Provides ruamel.yaml
  round-trip parser, YamlDocument wrapper, DocumentSummary, ParseDiagnostic, and deterministic
  renderer. Lives under ai_editor/formatters/yaml/document_io/. Used exclusively by
  YAMLFormatter internals. Not a public subsystem.
owned_code_paths:
- ai_editor/formatters/yaml/document_io/
- tests/formatters/yaml/document_io/
owned_docs_paths:
- docs/document_io.md
forbidden_code_paths:
- ai_editor/contracts/
- ai_editor/formatters/yaml/compat/
- ai_editor/mutations/
- ai_editor/validation/
- ai_editor/transaction_writer/
- ai_editor/interfaces/
