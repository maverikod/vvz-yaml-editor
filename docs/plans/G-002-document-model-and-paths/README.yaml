allowed_dependencies:
  may_be_used_by:
  - G-010 YAMLFormatter (owns this module)
  may_depend_on:
  - G-001-package-contracts-and-distribution
public_contracts_provided:
- YamlDocument
- DocumentSummary
- ParseDiagnostic
- load_yaml_document(file_path)
- parse_yaml_text(text)
- render_yaml_document(document)
- summarize_yaml_document(document)
core_responsibilities:
- Configure ruamel.yaml for round-trip parsing.
- Preserve mapping order, comments, quotes, and block style where feasible.
- Produce a YamlDocument object consumed by other subsystems.
- Produce compact document summaries: format, node_id, commands, top_level_keys, valid_yaml.
- Render documents deterministically enough for validation and writer subsystems to
  check.
subsystem_independence_rules:
- This subsystem must not parse structural path strings.
- This subsystem must not apply mutations.
- This subsystem must not validate plan_task_v1 semantics.
- This subsystem must not write files atomically or create backups.
- Other subsystems must use document_io APIs instead of configuring ruamel.yaml themselves.
tactical_scope_rule:
- Tactical steps T-001..T-007 are internal to G-010 and live under docs/plans/G-010-text-ai-formatters/.
- Each tactical step edits only ai_editor/formatters/yaml/document_io/ and tests/formatters/yaml/document_io/.
- Do not create standalone tests/document_io/ — all tests live under tests/formatters/yaml/.
implementation_outline:
- Create document_io package with loader, renderer, and summary modules.
- Define document representation wrappers without exposing mutable global state.
- Implement parse diagnostics for invalid YAML.
- Implement summary extraction without importing reader or path_language modules.
implementation_notes:
- Public contract names in this README are subsystem-level; tactical steps own the
  concrete modules listed in their README.yaml files.
- Implement T-006 before T-003 when coding manually so ParseDiagnostic types exist
  before loader wiring, even though tactical ids are numeric.
verification:
  commands:
  - python -m pytest tests/formatters/yaml/document_io/
  expected:
  - Valid YAML fixtures parse successfully.
  - Invalid YAML returns YAML_PARSE_FAILED diagnostics.
  - Summary contains expected top-level keys and command names.
  - Rendering reparses into an equivalent basic structure.
  scope: internal_g010_submodule
acceptance_criteria:
- All YAML parser configuration is centralized in document_io.
- Other subsystems can consume YamlDocument without owning parser details.
- No path, mutation, validation, or writer behavior is implemented here.
model_assignment_spec:
  performer: coding_agent
  instruction: Internal YAML document IO module belonging to G-010 YAMLFormatter.
    Provides ruamel.yaml round-trip parser, YamlDocument in-memory wrapper, DocumentSummary,
    ParseDiagnostic, and deterministic renderer. All code lives under ai_editor/formatters/yaml/document_io/
    and is used exclusively by YAMLFormatter internals. Do not use from editor_core,
    sessions, or any subsystem outside G-010.
