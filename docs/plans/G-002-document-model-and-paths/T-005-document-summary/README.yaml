allowed_dependencies:
  may_depend_on:
  - G-001-package-contracts-and-distribution
  - T-001-document-io-package-boundary
  - T-002-document-model
  - T-003-ai-parser-loader
  may_be_used_by:
  - T-007-document-io-verification
  - future_reader_subsystem
public_contracts_provided:
- DocumentSummary
- summarize_yaml_document(document)
document_summary_contract:
  required_fields:
  - format
  - node_id
  - commands
  - top_level_keys
  - valid_yaml
  optional_fields:
  - source_path
  - diagnostics_count
  field_semantics:
    format: Value of top-level format key when the YAML root is a mapping; null otherwise.
    node_id: Value of top-level node_id key when present; null otherwise.
    commands: Ordered list of command names when a top-level commands sequence contains
      mappings with name fields.
    top_level_keys: Ordered list of top-level mapping keys for mapping roots; empty
      list for non-mapping roots.
    valid_yaml: True when the input is a successfully parsed YamlDocument; this step
      does not parse invalid YAML.
    diagnostics_count: Optional count of diagnostic-like attachments already present
      on the document model; this step does not produce diagnostics.
  invariants:
  - summarize_yaml_document reads only the in-memory YamlDocument root and metadata.
  - summarize_yaml_document must not parse structural paths or perform yaml_get behavior.
  - summarize_yaml_document must not open files, render YAML, validate semantics,
    mutate data, or write files.
  - commands extraction is a shallow summary only, not a query language.
responsibilities:
- Extract format, node_id, commands, top_level_keys, valid_yaml, and related summary
  fields from parsed YAML content.
- Keep summary logic free of structural path string parsing.
- Keep summary extraction separate from future reader APIs and validation semantics.
implementation_notes:
- Summary extraction reads the in-memory tree only; it must not open files or write
  paths.
- Field names and semantics must stay aligned with docs/tech_spec.md yaml_load response
  shape.
- valid_yaml reflects that the document exists as a parsed YamlDocument; invalid YAML
  failure details are owned by T-006 and loader integration.
- Do not import path_language, reader, mutations, validation, transaction_writer,
  CLI, or MCP wrappers.
verification:
  scope: tactical_completion_gate
  commands:
  - python -m pytest tests/document_io/test_summary.py
  expected:
  - Summary contains expected top-level keys and command names for representative
    fixtures.
  - DocumentSummary fields and semantics are explicit and JSON-safe.
  - summarize_yaml_document performs no filesystem reads or writes.
  - Summary imports no forbidden subsystem modules.
acceptance_criteria:
- DocumentSummary contract is stable for downstream read APIs.
- summarize_yaml_document contract is explicit and limited to shallow document summary
  extraction.
- No path_language, reader, mutation, validation, writer, CLI, or MCP wrapper imports.
- This tactical step edits only its owned summary module and test.
model_assignment_spec:
  performer: coding_agent
  instruction: Work only on document summary extraction and its tests. Define DocumentSummary
    and summarize_yaml_document only. Do not implement loader configuration, renderer,
    diagnostics production, structural path parsing, reader APIs, mutation, validation,
    writer, CLI, or MCP wrappers. Do not edit document model, loader, renderer, diagnostics,
    package index, .venv, venv, site-packages, or installed dependencies.
observations_template:
