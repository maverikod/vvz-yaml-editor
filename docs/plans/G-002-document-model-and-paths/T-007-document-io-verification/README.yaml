allowed_dependencies:
  may_depend_on:
  - G-001-package-contracts-and-distribution
  - T-001-document-io-package-boundary
  - T-002-document-model
  - T-003-ai-parser-loader
  - T-004-deterministic-renderer
  - T-005-document-summary
  - T-006-parse-diagnostics
  may_be_used_by:
  - G-002-final-review
public_contracts_provided:
- tests/document_io/test_document_io_integration.py
document_io_integration_policy:
  required_coverage:
  - ai_editor.document_io package import is side-effect free and minimal according
    to T-001
  - YamlDocument and DocumentMetadata from T-002 are usable by loader, renderer, and
    summary flows
  - load_yaml_document and parse_yaml_text from T-003 produce or route results according
    to their contracts
  - render_yaml_document from T-004 is deterministic for controlled fixtures
  - summarize_yaml_document and DocumentSummary from T-005 expose the required summary
    fields
  - ParseDiagnostic from T-006 is JSON-safe and compatible with loader failure routing
  - document_io imports no forbidden future subsystem packages
  non_goals:
  - Do not implement or test structural path language behavior.
  - Do not implement or test reader/query APIs.
  - Do not implement or test mutation behavior.
  - Do not implement or test validation subsystem behavior beyond document_io parse
    failure compatibility.
  - Do not implement or test transaction writer, CLI, or MCP wrapper behavior.
  failure_routing_policy:
  - This step may add integration tests that reveal defects in T-001 through T-006
    outputs.
  - This step must not modify production modules or sibling-owned unit tests.
  - If an integration defect is found, document the owning tactical step in observations
    and route the fix to that step.
  - Do not patch another tactical step's owned file from this step.
responsibilities:
- Provide end-to-end document_io scenarios that other tactical tests do not duplicate.
- Guard against forbidden cross-subsystem imports from document_io public entry points.
- Verify that all G-002 tactical outputs compose as a document_io layer.
implementation_notes:
- This step must not change production modules owned by T-001 through T-006; file
  issues back to those steps if integration tests reveal defects.
- Global G-002 verification may still run full tests/document_io; this step owns only
  the dedicated integration test file listed above.
- Integration tests should use public or documented entry points from earlier T-steps,
  not private implementation details.
verification:
  scope: tactical_completion_gate
  commands:
  - python -m pytest tests/document_io/test_document_io_integration.py
  optional_cross_step_commands:
  - python -m pytest tests/document_io
  expected:
  - Integration scenarios pass using only document_io public or documented APIs.
  - Integration coverage includes T-001 through T-006 outputs.
  - Forbidden packages are not imported by document_io integration scenarios.
  - Any failure is routed to the owning tactical step rather than patched here.
acceptance_criteria:
- Integration test file exists and is owned solely by this step.
- Integration tests cover package boundary, document model, loader, renderer, summary,
  diagnostics, and forbidden imports.
- No edits to production modules or sibling-owned test files unless the plan ownership
  is explicitly changed.
model_assignment_spec:
  performer: coding_agent
  instruction: Work only on the integration test file listed in owned_test_paths.
    Do not modify production modules owned by T-001 through T-006 or sibling-owned
    test files. Do not implement path_language, reader, mutations, validation, writer,
    CLI, or MCP behavior. If an integration scenario reveals a defect, document the
    owning tactical step instead of patching it here. Do not edit .venv, venv, site-packages,
    or installed dependencies.
observations_template:
- actual: ''
  command: ''
  error: ''
  expected: ''
  fix: ''
  post_fix_verification: ''
  root_cause: ''
  status: ''
quality_loop_observations:
- iteration: 1
  point: G-002/T-007
  problem: integration step did not explicitly require coverage of all T-001 through
    T-006 outputs
  action: added document_io_integration_policy.required_coverage for every prior G-002
    tactical output
  status: fixed
- iteration: 1
  point: G-002/T-007
