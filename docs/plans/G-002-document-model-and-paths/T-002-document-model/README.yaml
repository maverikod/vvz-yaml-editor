format: tactical_step_v1
parent_step_id: G-002
parent_step_name: document_io
tactical_step_id: T-002
tactical_step_name: document_model
title: YAML document in-memory representation
status: draft
source_documents:
- docs/tech_spec.md
- docs/plans/create_pip_package_for_mcp.yaml
- docs/plans/G-002-document-model-and-paths/README.yaml
intent: Define the in-memory YAML document representation and metadata object used
  by later document_io tasks and later subsystems, without loading, rendering, summarizing,
  validating, or mutating YAML.
owned_code_paths:
- ai_editor/document_io/document.py
owned_test_paths:
- tests/document_io/test_document_model.py
owned_docs_paths: []
forbidden_paths:
- pyproject.toml
- README.md
- ai_editor/contracts/
- ai_editor/document_io/__init__.py
- ai_editor/document_io/loader.py
- ai_editor/document_io/renderer.py
- ai_editor/document_io/summary.py
- ai_editor/document_io/diagnostics.py
- ai_editor/path_language/
- ai_editor/reader/
- ai_editor/mutations/
- ai_editor/validation/
- ai_editor/transaction_writer/
- ai_editor/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - G-001-package-contracts-and-distribution
  - T-001-document-io-package-boundary
  may_be_used_by:
  - T-003-ai-parser-loader
  - T-004-deterministic-renderer
  - T-005-document-summary
  - T-006-parse-diagnostics
  - T-007-document-io-verification
  - future_subsystems
public_contracts_provided:
- YamlDocument
- DocumentMetadata
document_model_contract:
  yaml_document_fields:
  - root
  - metadata
  - parser_state
  document_metadata_fields:
  - source_path
  - source_hash
  - encoding
  - format
  - node_id
  field_semantics:
    root: Parsed YAML object handle owned by document_io callers; null is allowed
      only for parse-failed placeholder policies owned by later loader steps.
    metadata: DocumentMetadata object with source and summary-adjacent metadata that
      does not require path parsing.
    parser_state: Optional implementation-private parser state handle; must not expose
      global mutable parser configuration.
  invariants:
  - YamlDocument must not read files, render YAML, parse paths, mutate data, validate
    semantics, or write files.
  - DocumentMetadata is JSON-safe or convertible to JSON-safe data.
  - source_hash is metadata only; this step does not compute hashes from filesystem
    content.
  - parser_state must not require importing loader, renderer, diagnostics, summary,
    or future subsystem modules.
  diagnostic_attachment_policy:
  - T-002 may reserve a generic diagnostics or parse_diagnostics slot only as JSON-safe
    data.
  - T-002 must not import T-006 parse diagnostic classes because T-006 is defined
    later.
  - T-006 may refine diagnostic attachment semantics without changing YamlDocument
    core field names.
responsibilities:
- Define a stable document wrapper and metadata shape.
- Represent source path, source hash, parsed content handle, optional diagnostic slots,
  and formatting hints.
- Keep path parsing, mutation, validation, rendering, summary extraction, and write
  behavior out of the model.
implementation_notes:
- This step does not load files, render YAML, summarize commands, produce diagnostics,
  or apply operations.
- Use primitive or forward-compatible diagnostic attachment slots only; do not import
  later T-006 diagnostics.
- The model must remain independent from reader, path_language, mutations, validation,
  transaction_writer, CLI, and MCP wrappers.
verification:
  scope: tactical_completion_gate
  commands:
  - python -m pytest tests/document_io/test_document_model.py
  expected:
  - YamlDocument can represent parsed YAML content and metadata.
  - DocumentMetadata fields are explicit and stable.
  - Diagnostic attachment policy does not require importing T-006.
  - The model imports no forbidden subsystem modules.
acceptance_criteria:
- YamlDocument and DocumentMetadata are explicit public contracts for document_io.
- YamlDocument is independent from loader, renderer, summary, and diagnostics behavior.
- Future subsystems have a stable document object to consume.
- This tactical step edits only its owned model and test.
model_assignment_spec:
  performer: coding_agent
  instruction: Work only on the YAML document model and its tests. Define YamlDocument
    and DocumentMetadata shapes only. Do not implement file loading, parser configuration,
    rendering, summaries, diagnostics production, path parsing, mutation, validation,
    writing, CLI, or MCP wrappers. Do not import later T-006 diagnostics from this
    step. Do not edit .venv, venv, site-packages, or installed dependencies.
observations_template:
- actual: ''
  command: ''
  error: ''
  expected: ''
  fix: ''
  post_fix_verification: ''
  root_cause: ''
  status: ''
quality_loop_observations:
- iteration: 1
  point: G-002/T-002
  problem: metadata shape was described but DocumentMetadata was missing from public_contracts_provided
  action: added DocumentMetadata and explicit document_model_contract fields and invariants
  status: fixed
- iteration: 1
  point: G-002/T-002
  problem: diagnostic attachment wording could create a dependency from T-002 to later
    T-006 diagnostics
  action: added forward-compatible diagnostic_attachment_policy that forbids importing
    T-006 from T-002
  status: fixed
