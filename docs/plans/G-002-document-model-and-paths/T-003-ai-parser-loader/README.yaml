format: tactical_step_v1
parent_step_id: G-002
parent_step_name: document_io
tactical_step_id: T-003
tactical_step_name: yaml_parser_loader
title: Round-trip YAML parsing and load entry points
status: draft
source_documents:
- docs/tech_spec.md
- docs/plans/create_pip_package_for_mcp.yaml
- docs/plans/G-002-document-model-and-paths/README.yaml
intent: Centralize ruamel.yaml round-trip configuration and define load_yaml_document
  and parse_yaml_text entry points that produce YamlDocument instances without path
  resolution, mutation, validation, rendering, atomic writing, CLI, or MCP wrapper
  behavior.
owned_code_paths:
- ai_editor/document_io/loader.py
owned_test_paths:
- tests/document_io/test_loader.py
owned_docs_paths: []
forbidden_paths:
- pyproject.toml
- README.md
- ai_editor/contracts/
- ai_editor/document_io/__init__.py
- ai_editor/document_io/document.py
- ai_editor/document_io/renderer.py
- ai_editor/document_io/summary.py
- ai_editor/document_io/diagnostics.py
- ai_editor/path_language/
- ai_editor/reader/
- ai_editor/mutations/
- ai_editor/validation/
- ai_editor/transaction_writer/
- ai_editor/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - G-001-package-contracts-and-distribution
  - T-001-document-io-package-boundary
  - T-002-document-model
  - T-006-parse-diagnostics
  implementation_order_note: Although this is T-003 numerically, coding this step
    should wait for T-006 or use only the diagnostic-compatible protocol explicitly
    defined here. The loader must not edit T-006-owned files.
  may_be_used_by:
  - T-004-deterministic-renderer
  - T-005-document-summary
  - T-007-document-io-verification
  - future_subsystems
public_contracts_provided:
- load_yaml_document(file_path)
- parse_yaml_text(text)
loader_contract:
  entry_points:
    load_yaml_document:
      input: file_path string or PathLike accepted by the implementation policy
      output: YamlDocument on successful parse or diagnostic-compatible failure result
        by T-006 policy
      side_effects_allowed:
      - read the target YAML file
      side_effects_forbidden:
      - write files
      - create backups
      - mutate global parser configuration after import
      - inspect unrelated repository files
    parse_yaml_text:
      input: YAML text string
      output: YamlDocument on successful parse or diagnostic-compatible failure result
        by T-006 policy
      side_effects_allowed: []
      side_effects_forbidden:
      - read files
      - write files
      - create backups
      - mutate global parser configuration after import
  parser_configuration_policy:
  - Use ruamel.yaml round-trip parsing for comments, ordering, quotes, and block-style
    preservation where feasible.
  - Parser construction must be local to document_io loader behavior and must not
    rely on mutable global singleton state.
  - Loader must not configure parser behavior in ai_editor.document_io package import.
  metadata_policy:
  - load_yaml_document populates source_path and source_hash when source bytes are
    read.
  - parse_yaml_text may leave source_path null and may compute only text-derived metadata
    that does not read files.
  - Loader must populate DocumentMetadata without performing summary extraction owned
    by T-005.
  invalid_yaml_policy:
  - Invalid YAML must not raise untyped raw parser exceptions across the public entry
    point.
  - Invalid YAML must be represented through the T-006 diagnostic-compatible failure
    path.
  - Loader must not implement new diagnostic shapes outside T-006 ownership.
responsibilities:
- Configure ruamel.yaml for round-trip parsing per subsystem rules.
- Preserve mapping order, comments, quotes, and block style where feasible.
- Populate YamlDocument from file path or raw text without reading other subsystems.
- Keep parser/load behavior separate from diagnostics shape ownership.
implementation_notes:
- Loader must not parse structural path strings or import path_language, reader, mutations,
  validation, or transaction_writer.
- Invalid YAML surfaces through diagnostics hooks owned by T-006; loader focuses on
  parse wiring and diagnostic-compatible failure routing.
- Loader must not render YAML, summarize commands, validate semantics, apply operations,
  write files, or create backups.
verification:
  scope: tactical_completion_gate
  commands:
  - python -m pytest tests/document_io/test_loader.py
  expected:
  - Valid fixtures load into YamlDocument with stable DocumentMetadata fields.
  - parse_yaml_text works without filesystem reads.
  - load_yaml_document reads only the target file and never writes files.
  - Invalid YAML yields a structured failure path compatible with T-006 contracts.
  - Loader imports no forbidden subsystem modules.
acceptance_criteria:
- All YAML parser construction for document_io lives in loader-owned modules.
- load_yaml_document and parse_yaml_text contracts are explicit.
- No path, mutation, validation, render, summary, or writer behavior is implemented
  here.
- This tactical step edits only its owned loader module and test.
model_assignment_spec:
  performer: coding_agent
  instruction: Work only on document_io loader and its tests. Do not implement renderer,
    summary extraction, path parsing, reader APIs, mutations, validation, atomic writes,
    CLI, or MCP wrappers. Do not edit document model, diagnostics, package index,
    or installed dependency files. Use the T-006 diagnostic-compatible failure path
    for invalid YAML; do not invent a second parse diagnostic shape in loader.py.
