format: tactical_step_v1
parent_step_id: G-001
parent_step_name: package_contracts_and_distribution
tactical_step_id: T-005
tactical_step_name: diagnostics_contract
title: Shared Diagnostic contract
status: draft
source_documents:
- docs/tech_spec.md
- docs/plans/G-001-package-foundation/README.yaml
intent: Define the shared diagnostic data shape used by future parser, path, validation,
  mutation, writer, and interface subsystems. Diagnostics explain what happened without
  owning subsystem behavior.
owned_code_paths:
- ai_editor/contracts/diagnostics.py
owned_test_paths:
- tests/contracts/test_diagnostics_contract.py
owned_docs_paths: []
forbidden_paths:
- pyproject.toml
- ai_editor/__init__.py
- ai_editor/contracts/result.py
- ai_editor/contracts/errors.py
- ai_editor/contracts/validation.py
- ai_editor/contracts/operations.py
- ai_editor/contracts/__init__.py
- ai_editor/editor_core/
- ai_editor/formatters/
- ai_editor/search/
- ai_editor/document_io/
- ai_editor/path_language/
- ai_editor/reader/
- ai_editor/mutations/
- ai_editor/validation/
- ai_editor/transaction_writer/
- ai_editor/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - T-004-error-codes
  may_be_used_by:
  - T-003-result-envelope
  - T-006-validation-result-contract
  - T-007-operation-result-contract
  - T-008-contracts-public-index
  - future_subsystems
public_contracts_provided:
- Diagnostic
- DiagnosticSeverity
diagnostic_contract:
  required_fields:
  - severity
  - code
  - message
  - location
  - details
  field_semantics:
    severity: One of the stable DiagnosticSeverity string values.
    code: ErrorCode string from T-004 or null for non-error informational diagnostics.
    message: Human-readable diagnostic summary; must be non-empty.
    location: JSON-safe object or null describing where the issue applies.
    details: JSON-safe object for structured context; empty object is allowed.
  severity_values:
  - info
  - warning
  - error
  location_shape_policy:
    allowed_keys:
    - file_path
    - yaml_path
    - json_pointer
    - operation_index
    - line
    - column
    invariants:
    - location may be null when no precise location is available.
    - if line or column are present, they must be positive integers.
    - location must not require reading source files to be interpreted.
  invariants:
  - severity is always present and one of info, warning, error.
  - severity=error requires code to be a non-empty ErrorCode string.
  - message is always a non-empty string.
  - details is always present as a JSON-safe object, even when empty.
  - Diagnostic must not import parser, path, reader, mutation, validation, writer,
    CLI, MCP wrapper, or filesystem behavior.
required_fields:
- severity
- code
- message
- location
- details
severity_values:
- info
- warning
- error
responsibilities:
- Define a common diagnostic item with severity, code, message, location, and details.
- Keep diagnostics JSON-safe for MCP responses.
- Allow future subsystems to attach contextual details without changing the base contract.
- Avoid importing YAML implementation modules.
- Tie diagnostic error codes to the T-004 ErrorCode string namespace without owning
  the error-code values.
implementation_notes:
- location should be generic enough for file_path, yaml_path, json_pointer, or operation
  index.
- details should be optional for callers but represented as an empty JSON-safe object
  when absent.
- This step does not decide validation, parsing, mutation, or write behavior.
- Do not introduce new error-code values from this step; use the T-004 namespace.
verification:
  commands:
  - python -m pytest tests/contracts/test_diagnostics_contract.py
  expected:
  - Diagnostic can be converted to a JSON-safe dict.
  - Severity values are stable strings.
  - severity=error requires a non-empty code.
  - message is always non-empty.
  - location and details are JSON-safe.
  - Diagnostic contract does not import forbidden subsystem modules.
acceptance_criteria:
- Diagnostic contract is implementation-neutral.
- Diagnostic fields, severity values, location policy, and invariants are explicit.
- Future subsystems can report parse, path, validation, render, and write diagnostics
  using it.
- This step edits only its owned code and test files.
model_assignment_spec:
  performer: coding_agent
  instruction: Implement only the Diagnostic contract and tests. Do not edit result,
    errors, validation, operation, package metadata, public index, or subsystem files.
    The task is diagnostic shape, not parser, path, mutation, validation, rendering,
    writer, CLI, or MCP behavior. Use the T-004 ErrorCode string namespace for error
    diagnostics without adding new error-code values here.
observations_template:
- command: ''
  expected: ''
  actual: ''
  error: ''
  status: ''
