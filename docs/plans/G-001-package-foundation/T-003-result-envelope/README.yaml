public_contracts_provided:
- ResultEnvelope
result_envelope_contract:
  required_fields:
  - success
  - data
  - error_code
  - message
  - diagnostics
  field_semantics:
    success: Overall command success flag. Must be false when the represented operation
      failed.
    data: JSON-safe payload for successful or partial informational results; null
      is allowed.
    error_code: Machine-readable string or null. Later ErrorCode contract may narrow
      values.
    message: Human-readable summary string. Empty string is allowed only for successful
      empty-result operations.
    diagnostics: JSON-safe list of diagnostic-like objects. Later Diagnostic contract
      may narrow item shape.
  invariants:
  - success=true requires error_code=null.
  - success=false requires a non-empty error_code and non-empty message.
  - diagnostics must always be present as a list, even when empty.
  - data must be JSON-safe or convertible to a JSON-safe value.
  - wrapper, queue, or transport completion must not be represented as success=true
    when the nested command result failed.
  dependency_policy:
  - This step must not import T-004 ErrorCode or T-005 Diagnostic because they are
    defined later.
  - This step may use primitive string/list/dict shapes that later contracts refine
    without changing the envelope field names.
responsibilities:
- Define common success/failure response shape.
- Ensure the envelope can carry data, error_code, message, and diagnostics.
- Ensure envelope instances are JSON-serializable or easily convertible to JSON-safe
  dicts.
- Keep the contract independent from concrete YAML parser, validator, writer, CLI,
  or MCP code.
- Define truthful success semantics so nested operation failure is not masked by wrapper
  completion.
requirements_from_tech_spec:
- Write and dry-run responses must truthfully expose success, changed paths, validation
  result, hashes, and diagnostics.
- Queue or wrapper success must not mask nested operation failure.
implementation_notes:
- Prefer dataclasses or TypedDict-style contracts with no runtime dependency on pydantic
  unless explicitly chosen later.
- Include helper constructors for success and failure only if they do not import future
  subsystems.
- Keep field names stable for MCP server responses.
- Use primitive error_code and diagnostic-like shapes in this step; later contract
  steps may refine the allowed values and item structure.
verification:
  commands:
  - python -m pytest tests/contracts/test_result_envelope.py
  expected:
  - Success envelope can be converted to a JSON-safe dict.
  - Failure envelope preserves error_code and message.
  - success=true cannot carry a non-null error_code.
  - success=false requires a non-empty error_code and message.
  - diagnostics is always present as a list.
  - Envelope does not import forbidden subsystem modules or later contract modules.
acceptance_criteria:
- ResultEnvelope is defined in its own file.
- It defines stable field names and success/failure invariants.
- It is generic enough for read, validate, mutation, and write results.
- It does not implement any YAML behavior.
- It does not depend on later T-004 through T-007 contract implementations.
model_assignment_spec:
  performer: coding_agent
  instruction: Implement only the shared ResultEnvelope contract and tests. Do not
    edit other contract files or any YAML subsystem. The goal is a stable response
    shape and truthful success semantics for later work. Do not import later ErrorCode,
    Diagnostic, ValidationResult, or OperationResult contracts from this step; use
    primitive JSON-safe shapes that later steps can refine.
