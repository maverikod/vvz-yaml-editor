format: tactical_step_v1
parent_step_id: G-001
parent_step_name: package_contracts_and_distribution
tactical_step_id: T-001
tactical_step_name: package_configuration
title: Package metadata and build configuration
status: draft
source_documents:
- docs/tech_spec.md
- docs/plans/G-001-package-foundation/README.yaml
intent: Define the installable pip package shell in pyproject.toml only. This step
  owns package metadata, build backend, dependency declarations, package-data policy,
  and metadata tests. It must not implement YAML behavior, CLI, MCP wrappers, version
  code, typed marker files, README content, package root files, or contract DTO internals.
absolute_scope:
  owns:
  - pyproject.toml
  - tests/contracts/test_package_metadata.py
  must_define:
  - package_identity
  - build_system
  - version_policy
  - runtime_dependencies
  - dependency_inclusion_policy
  - dev_dependencies
  - dependency_version_policy
  - package_data_policy
  - readme_policy
  - wheel_target_policy
  - expected_pyproject_shape
  - tooling_minimums
  - metadata_test_scope
  must_not_define:
  - YAML command implementations
  - CLI implementation or console entry points
  - MCP wrapper implementation
  - contract DTO implementations
  - version export code
  - typed marker file
  - README content
  - package root files
owned_code_paths:
- pyproject.toml
owned_test_paths:
- tests/contracts/test_package_metadata.py
owned_docs_paths: []
forbidden_paths:
- ai_editor/editor_core/
- ai_editor/formatters/
- ai_editor/search/
- README.md
- ai_editor/contracts/result.py
- ai_editor/contracts/errors.py
- ai_editor/contracts/diagnostics.py
- ai_editor/contracts/validation.py
- ai_editor/contracts/operations.py
- ai_editor/contracts/__init__.py
- ai_editor/__init__.py
- ai_editor/py.typed
- ai_editor/document_io/
- ai_editor/path_language/
- ai_editor/reader/
- ai_editor/mutations/
- ai_editor/validation/
- ai_editor/transaction_writer/
- ai_editor/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on: []
  may_be_used_by:
  - T-002 version_export
  - T-008 contracts_public_index
  - T-009 typed_package_marker
public_contracts_provided:
- build-system.requires
- build-system.build-backend
- project.name
- project.version
- project.requires-python
- project.dependencies
- project.optional-dependencies.dev
- project.optional-dependencies.experimental
- tool.hatch.build.targets.wheel
package_identity:
  distribution_name: ai-editor-mcp
  import_package: ai_editor
  python_requires: '>=3.10'
build_system:
  requires:
  - hatchling>=1.25
  build_backend: hatchling.build
version_policy:
  current_step: static_in_pyproject
  initial_version: 0.1.0
  reason: T-001 must not edit ai_editor/__init__.py or any version export code.
console_entry_points_policy:
  current_step: do_not_declare
  forbidden_pyproject_section: project.scripts
  reason: CLI belongs to a later subsystem; declaring a console script now would require
    files outside T-001 ownership.
runtime_dependencies:
  required:
  - ruamel.yaml>=0.18
  - jsonschema>=4
  - jsonpath-ng>=1.6
  - libcst>=1.1
  - lark>=1.1
  experimental_optional: []
  notes:
  - ruamel.yaml is required for formatting preservation.
  - jsonschema is required for yaml_validate and schema validation.
  - jsonpath-ng is required for structural list filters such as commands[name=...].
  - libcst>=1.1 is required for the built-in CSTFormatter (G-013); it is a first-class
    runtime dependency, not optional.
  - lark>=1.1 is required for the CSTFormatter XPath-like cst_query selector parser
    (G-013).
dependency_inclusion_policy:
  project_dependencies:
  - ruamel.yaml>=0.18
  - jsonschema>=4
  - jsonpath-ng>=1.6
  - libcst>=1.1
  - lark>=1.1
  project_optional_dependencies_experimental: []
  reason: Put ruamel.yaml, jsonschema, jsonpath-ng, libcst>=1.1, and lark>=1.1 in
    project.dependencies as mandatory runtime dependencies with lower bounds.
dev_dependencies:
  group_name: dev
  required_packages:
  - pytest>=8
  - pytest-cov>=5
  - ruff>=0.6
  - mypy>=1.11
  - build>=1.2
  - twine>=5
  - tomli>=2; python_version < '3.11'
dependency_version_policy:
  runtime: explicit_lower_bounds_only_unless_known_incompatibility_requires_upper_bound
  dev: explicit_lower_bounds_required
  strict_pins_without_reason: forbidden
metadata_test_toml_parser:
  python_3_11_plus: tomllib
  python_3_10: tomli
  tomli_location: project.optional-dependencies.dev
package_data_policy:
  py_typed_marker:
    marker_file_owner: future typed marker owner
    packaging_rule_owned_by: T-001-package-configuration
    requirement: pyproject.toml must contain a wheel inclusion rule for ai_editor/py.typed
      without requiring the file to exist during T-001 tests.
metadata_test_for_py_typed:
  allowed: verify pyproject.toml contains the py.typed inclusion rule
  forbidden: require ai_editor/py.typed to exist during T-001 tests
hatch_wheel_policy:
  package_root: ai_editor
  packages:
  - ai_editor
  force_include:
    ai_editor/py.typed: ai_editor/py.typed
  force_include_is_allowed_to_reference_future_file: true
  build_may_fail_until_future_file_exists: true
  metadata_test_only: verify TOML package and force-include rules, not source file
    existence
wheel_target_policy:
  configure_src_layout: false
  package_source_precondition: package root file exists if build verification is executed
  metadata_test_must_not_require_source_package_exists: true
readme_policy:
  pyproject_may_reference: README.md
  file_owner: future package README owner
  metadata_test_must_not_require_readme_exists: true
  build_precondition: README.md exists if build verification is executed
  build_may_fail_until_readme_exists: true
metadata_fields_deferred_policy:
  omit_from_pyproject_in_t001: true
  deferred_fields:
  - license
  - authors
  - classifiers
  project_metadata_list_is_documentation_only: true
  must_not_appear_in_pyproject_in_t001: true
pyproject_sections:
  required:
  - build-system
  - project
  - project.optional-dependencies
  - tool.pytest.ini_options
  - tool.ruff
  - tool.mypy
  - tool.hatch.build.targets.wheel
  forbidden_in_this_step:
  - project.scripts
project_metadata:
  name: ai-editor-mcp
  version: 0.1.0
  description: Structural YAML editing package shell and contracts for MCP usage
  readme: README.md
  requires-python: '>=3.10'
  dependencies:
  - ruamel.yaml>=0.18
  - jsonschema>=4
  - jsonpath-ng>=1.6
  - libcst>=1.1
  - lark>=1.1
  optional_dependencies:
    experimental: []
    dev:
    - pytest>=8
    - pytest-cov>=5
    - ruff>=0.6
    - mypy>=1.11
    - build>=1.2
    - twine>=5
    - tomli>=2; python_version < '3.11'
  metadata_fields_deferred:
    meaning: documentation_only
    must_not_appear_in_pyproject: true
    fields:
    - license
    - authors
    - classifiers
tooling_minimums:
  pytest:
    section: tool.pytest.ini_options
    values:
      testpaths:
      - tests
  ruff:
    section: tool.ruff
    values:
      target-version: py310
  mypy:
    section: tool.mypy
    values:
      python_version: '3.10'
      packages:
      - ai_editor
    execution_required_in_t001: false
expected_pyproject_shape:
  build-system:
    requires:
    - hatchling>=1.25
    build-backend: hatchling.build
  project:
    name: ai-editor-mcp
    version: 0.1.0
    description: Structural YAML editing package shell and contracts for MCP usage
    readme: README.md
    requires-python: '>=3.10'
    dependencies:
    - ruamel.yaml>=0.18
    - jsonschema>=4
    - jsonpath-ng>=1.6
    - libcst>=1.1
    - lark>=1.1
  project.optional-dependencies:
    experimental: []
    dev:
    - pytest>=8
    - pytest-cov>=5
    - ruff>=0.6
    - mypy>=1.11
    - build>=1.2
    - twine>=5
    - tomli>=2; python_version < '3.11'
  tool.pytest.ini_options:
    testpaths:
    - tests
  tool.ruff:
    target-version: py310
  tool.mypy:
    python_version: '3.10'
    packages:
    - ai_editor
  tool.hatch.build.targets.wheel:
    packages:
    - ai_editor
  tool.hatch.build.targets.wheel.force-include:
    ai_editor/py.typed: ai_editor/py.typed
  forbidden_sections:
  - project.scripts
  omitted_project_fields_in_t001:
  - license
  - authors
  - classifiers
metadata_test_target:
  file: pyproject.toml
  mode: read_repository_file
  must_not_generate_replacement_pyproject: true
metadata_test_import_policy:
  forbidden_imports:
  - ai_editor
  enforcement: test file must not contain import ai_editor or from ai_editor imports
metadata_test_scope:
  allowed:
  - parse pyproject.toml without importing ai_editor
  - validate build-system.requires contains hatchling>=1.25
  - validate build-system.build-backend equals hatchling.build
  - validate project.name equals ai-editor-mcp
  - validate static project.version equals 0.1.0
  - validate project.requires-python equals >=3.10
  - validate project.dependencies contains ruamel.yaml>=0.18, jsonschema>=4, and jsonpath-ng>=1.6
  - validate project.optional-dependencies.experimental is absent or empty
  - validate project.optional-dependencies.dev contains tomli for Python < 3.11
  - validate README.md may be referenced but is not required to exist for metadata-only
    tests
  - validate py.typed package-data inclusion rule without requiring py.typed to exist
  - validate tooling minimums for pytest, ruff, and mypy sections
  - validate forbidden project fields are omitted
  - validate tests do not import ai_editor
  forbidden:
  - import ai_editor
  - call YAML commands
  - run python -m build as a T-001 completion gate
  - require CLI modules to exist
  - require README.md to exist
  - require ai_editor/__init__.py to exist
  - require ai_editor/py.typed to exist
responsibilities:
- Set distribution metadata for the pip package.
- Configure hatchling as build backend using hatchling.build.
- Declare runtime dependencies with explicit lower bounds.
- Put required runtime dependencies in project.dependencies.
- Put jsonpath-ng in project.dependencies as a mandatory runtime dependency for structural
  filter support.
- Declare development dependencies for tests, lint, typing, build, package checks,
  and Python 3.10 TOML parsing.
- Define package-data policy needed by future typed marker packaging.
- Define readme policy without creating or editing README.md.
- Define minimal pytest, ruff, and mypy tool sections.
- Avoid declaring console scripts in this step.
requirements_from_tech_spec:
  package_goal: Structural YAML editing package for MCP server usage.
  structural_yaml_principle: Future YAML behavior edits by tree paths, not line ranges.
  runtime_dependencies:
    required:
    - ruamel.yaml>=0.18
    - jsonschema>=4
    - jsonpath-ng>=1.6
    - libcst>=1.1
    - lark>=1.1
    experimental_optional: []
must_not_implement_commands:
- yaml_load
- yaml_validate
- yaml_get
- yaml_set
- yaml_replace_block
- yaml_append
- yaml_delete
- yaml_move
- yaml_write_checked
- yaml_get_command
- yaml_update_command
- yaml_get_verification
- yaml_append_verification
- yaml_validate_plan_task
implementation_notes:
- Do not import or implement any YAML command in this step.
- Do not create CLI implementation files.
- Do not declare project.scripts until the interface or CLI owner subsystem exists.
- Keep tests metadata-only; tests in this tactical step must not import ai_editor.
- Do not create README.md, ai_editor/__init__.py, or ai_editor/py.typed in this step.
verification:
  metadata_only_commands:
  - python -m pytest tests/contracts/test_package_metadata.py
  optional_build_commands:
    policy: do_not_run_until_build_preconditions_are_met
    commands:
    - python -m build
  build_preconditions:
  - package root file exists if build verification is executed
  - README.md exists if build verification is executed
  - typed marker file exists if typed marker inclusion is verified through wheel contents
  expected:
  - Metadata test validates pyproject.toml without importing ai_editor.
  - build-system.build-backend is hatchling.build.
  - 'Required runtime dependencies are in project.dependencies: ruamel.yaml>=0.18,
    jsonschema>=4, jsonpath-ng>=1.6, libcst>=1.1, lark>=1.1.'
  - libcst>=1.1 and lark>=1.1 are in project.dependencies as mandatory runtime dependencies
    for the built-in CSTFormatter (G-013).
  - jsonpath-ng is in project.dependencies as a mandatory runtime dependency, not
    in project.optional-dependencies.experimental.
  - Metadata-only tests do not require README.md, package root, or py.typed to exist.
  - Tooling minimum sections are present for pytest, ruff, and mypy.
  - No forbidden subsystem files are modified.
completion_gate:
  t001_complete_when:
  - metadata-only tests pass
  - pyproject.toml satisfies this README
  not_required_for_t001_completion:
  - python -m build
  - import ai_editor
  - wheel contains py.typed
acceptance_criteria:
- pyproject.toml is the only production file edited by this tactical step.
- tests/contracts/test_package_metadata.py validates metadata without importing ai_editor.
- Package identity is explicit.
- build-system.build-backend is hatchling.build.
- project.version is statically defined as 0.1.0.
- ruamel.yaml and jsonschema are mandatory runtime dependencies with lower bounds.
- libcst>=1.1 and lark>=1.1 are mandatory runtime dependencies in project.dependencies
  because CSTFormatter is a built-in formatter (G-013), not an optional plugin.
- No console script is declared in T-001.
- Package-data policy accounts for future py.typed inclusion without creating py.typed.
- README.md may be referenced but is not required to exist for T-001 completion.
- T-001 completion does not require package import or wheel build.
- Expected pyproject shape is explicit enough that the executor does not need to infer
  TOML structure.
- This step does not implement YAML loading, path parsing, validation, writing, CLI,
  or MCP wrappers.
model_assignment_spec:
  performer: coding_agent
  instruction: Work only on pyproject.toml and tests/contracts/test_package_metadata.py.
    Do not import ai_editor in the metadata test. Do not declare CLI entry points.
    Do not edit README.md, source modules, contracts, typed marker, package root,
    or future subsystem files. Use static project.version = 0.1.0 and build-system.build-backend
    = hatchling.build. Put ruamel.yaml>=0.18, jsonschema>=4, jsonpath-ng>=1.6, libcst>=1.1,
    and lark>=1.1 in project.dependencies as mandatory runtime dependencies with lower
    bounds. libcst and lark are required because CSTFormatter is a built-in formatter
    (G-013), not an optional plugin. Treat python -m build as cross-step verification,
    not the T-001 completion gate. Do not edit ai_editor/editor_core/, ai_editor/formatters/,
    ai_editor/search/, or any other subsystem directory.
observations_template:
- command: ''
  expected: ''
  actual: ''
  error: ''
  root_cause: ''
  fix: ''
  post_fix_verification: ''
  status: ''
