format: tactical_step_v1
parent_step_id: G-001
parent_step_name: package_contracts_and_distribution
tactical_step_id: T-011
tactical_step_name: package_boundary_docs
title: Package contracts and subsystem boundary documentation
status: draft
source_documents:
- docs/tech_spec.md
- docs/plans/G-001-package-foundation/README.yaml
intent: Create the detailed package boundary document that tells future lower-level
  agents which files belong to which subsystem, how shared contracts are used, and
  why cross-subsystem edits are forbidden.
owned_code_paths: []
owned_test_paths:
- tests/contracts/test_package_contracts_doc.py
owned_docs_paths:
- docs/package_contracts.md
forbidden_paths:
- pyproject.toml
- README.md
- ai_editor/__init__.py
- ai_editor/contracts/
- ai_editor/py.typed
- docs/release_checklist.md
- ai_editor/document_io/
- ai_editor/path_language/
- ai_editor/reader/
- ai_editor/mutations/
- ai_editor/validation/
- ai_editor/transaction_writer/
- ai_editor/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - T-001-package-configuration
  - T-002-version-export
  - T-003-result-envelope
  - T-004-error-codes
  - T-005-diagnostics-contract
  - T-006-validation-result-contract
  - T-007-operation-result-contract
  - T-008-contracts-public-index
  - T-009-typed-package-marker
  - T-010-package-readme
  may_be_used_by:
  - T-012-release-checklist-foundation
  - T-013-contract-layer-verification
  - future_subsystems
public_contracts_provided:
- docs/package_contracts.md
package_contracts_doc_policy:
  required_sections:
  - G-001 foundation scope and non-goals
  - tactical ownership matrix for T-001 through T-013
  - public contract inventory
  - forbidden cross-subsystem edit rules
  - future subsystem boundary map
  - agent checklist for deciding whether a file belongs to the current task
  public_contract_inventory_must_include:
  - ai_editor.__version__
  - ResultEnvelope
  - ErrorCode
  - Diagnostic
  - DiagnosticSeverity
  - ValidationResult
  - ValidationCheckResult
  - OperationResult
  - RenderPreview
  - FileHashPair
  - PEP 561 typed package marker
  ownership_matrix_rules:
  - Each T-001 through T-013 step must have owned files listed.
  - Each row must distinguish production code, tests, and docs.
  - Files owned by another tactical step must be described as forbidden for the current
    task.
  - Future subsystem directories must remain out of G-001 implementation scope.
  truthfulness_rules:
  - The document must state that G-001 does not implement YAML loading, path parsing,
    reading, mutation, validation, writing, CLI, or MCP wrappers.
  - The document must not claim future YAML commands are implemented.
  - The document must identify later subsystem directories as future owners, not files
    to edit in G-001.
responsibilities:
- Document G-001 owned files and forbidden files.
- Document tactical ownership boundaries for T-001 through T-013.
- Document that future subsystems may use contracts but must not edit contract files.
- Document that .venv, venv, site-packages, and installed dependencies are never editable.
- Document that YAML behavior is not implemented in G-001.
- Provide a checklist for determining whether a file belongs to the current task.
implementation_notes:
- This is a documentation-only tactical step, except for its doc-specific test.
- Do not change contract definitions while writing the documentation.
- Keep the document practical for agents working on later detailed layers.
- Reflect the exact public contracts exported by T-008, including secondary contracts.
verification:
  commands:
  - python -m pytest tests/contracts/test_package_contracts_doc.py
  expected:
  - docs/package_contracts.md exists.
  - The document lists owned and forbidden paths.
  - The document states that cross-subsystem edits are forbidden.
  - The document states that G-001 does not implement YAML behavior.
  - The document includes every public contract exported by T-008.
  - The document includes a tactical ownership matrix for T-001 through T-013.
acceptance_criteria:
- Future detailed tasks can determine file ownership from the document.
- The document does not contradict G-001 README.yaml or T-001 through T-010 plan outputs.
- The document includes the full G-001 public contract inventory.
- This step edits only its owned documentation and test files.
model_assignment_spec:
  performer: coding_agent
  instruction: Work only on docs/package_contracts.md and its documentation test.
    Do not edit contracts, metadata, README, typed marker, release checklist, or any
    future subsystem directories. The task is boundary documentation only. The document
    must include the tactical ownership matrix for T-001 through T-013 and the full
    public contract inventory exported by T-008.
observations_template:
- actual: ''
  command: ''
  error: ''
  expected: ''
  fix: ''
  post_fix_verification: ''
  root_cause: ''
  status: ''
quality_loop_observations:
- iteration: 1
  point: G-001/T-011
  problem: boundary document requirements did not require the full public contract
    inventory introduced by T-003 through T-008
  action: added package_contracts_doc_policy.public_contract_inventory_must_include
  status: fixed
- iteration: 1
  point: G-001/T-011
  problem: ownership checklist was too general and did not require a tactical ownership
    matrix for all G-001 tactical steps
  action: added required ownership matrix rules for T-001 through T-013
  status: fixed
