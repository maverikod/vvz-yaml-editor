step_name: text_formatter
title: Text formatter backend - array-of-lines document model
status: draft
source_plan: docs/plans/create_pip_package_for_mcp.yaml
source_documents:
- docs/tech_spec.md
- docs/plans/G-010-text-ai-formatters/README.yaml
parent_global_context: 'G-010 owns AbstractFormatter and the initial formatter backends.
  T-003 owns the text formatter: an AbstractFormatter implementation representing
  documents as arrays of lines. Address model: line range, insertion point, or whole
  document. validate_content and validate_document always return success=True for
  text documents.

  '
intent: 'Implement TextFormatter implementing AbstractFormatter with: document_model=array_of_lines,
  address=line_range_or_insertion_point_or_whole_document, all mutate_* methods operating
  on line arrays, validate_content and validate_document always returning success=True,
  copy/cut/paste over line ranges, iter_units/match_unit/compare_units for text units,
  and list_commands returning the text formatter command catalog.

  '
why_this_step_exists: 'Text formatter is the simplest formatter and the fallback used
  by editor core when parse fails or file is below threshold. It must be independently
  testable from YAML formatter (T-004..T-006). G-009 and G-015 depend on it as the
  fallback formatter.

  '
