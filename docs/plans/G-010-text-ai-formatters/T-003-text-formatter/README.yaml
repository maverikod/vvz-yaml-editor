allowed_dependencies:
  consumes_from:
  - G-010/T-001 AbstractFormatter, FormatterUnit
  - G-010/T-002 FormatterRegistry (to register itself)
  - G-001 contracts (ValidationResult, ADDRESS_INVALID, ADDRESS_NOT_FOUND)
  provides_to:
  - G-010/T-007 (integration verification)
  - G-009 editor core (formatter fallback)
  - G-015 session layer (render after mutation)
public_contracts_provided:
- 'TextFormatter — concrete AbstractFormatter. formatter_name=''text''. parse(raw_content)
  -> list[str] (lines). render(document) -> str (joined lines). validate_content and
  validate_document always return success=True. Address: int (line index), tuple[int,int]
  (line range inclusive), None (whole document). mutate_set(doc, addr, value) replaces
  line or range. mutate_append(doc, addr, value) appends line(s). mutate_delete(doc,
  addr) removes line or range. mutate_replace_block(doc, addr, value) replaces block.
  mutate_move(doc, addr, target_addr) moves line(s). copy_fragment / cut_fragment
  / paste_fragment over line ranges. iter_units, match_unit, compare_units for text
  line units. list_commands returns FormatterCommandCatalog for text formatter.

  '
implementation_notes: 'Document model is list[str]. Lines are stored without trailing
  newlines; render joins with os.linesep or ''\n''. Address None means whole document.
  Address int is single line. Address tuple[int,int] is inclusive range. validate_content
  and validate_document return ValidationResult(success=True, diagnostics=[]) always.
  Text formatter registers itself in default_registry with extensions: .txt, .md,
  .log, .rst, .ini, .cfg, .toml, .json (fallback for non-YAML structured files), and
  as the ''text'' name.

  '
verification:
  commands:
  - python -m pytest tests/formatters/text/ -v
  expected:
  - parse splits raw content into lines.
  - render joins lines back to string.
  - validate_content returns success=True for any content.
  - validate_document returns success=True for any document.
  - mutate_set replaces a single line by index.
  - mutate_append adds lines to end or at insertion point.
  - mutate_delete removes line or range.
  - copy_fragment returns text lines payload.
  - cut_fragment removes lines and returns payload.
  - paste_fragment inserts lines at target address.
  - iter_units yields one FormatterUnit per line.
  - match_unit matches by exact text and by regex.
  - compare_units detects exact and normalized text equality.
  - list_commands returns FormatterCommandCatalog with text-specific commands.
acceptance_criteria:
- TextFormatter implements all AbstractFormatter abstract methods.
- validate_content and validate_document always return success=True.
- copy requires source_address; paste requires target_address.
- Document is always a list of str; parse never returns None.
- TextFormatter registered in default_registry under 'text' name and text extensions.
