allowed_dependencies:
  consumes_from:
  - G-010/T-001 AbstractFormatter, FormatterUnit
  - ruamel.yaml (CommentedMap, CommentedSeq, round-trip load/dump)
  - G-001 contracts (YAML_PARSE_FAILED, PATH_PARSE_FAILED, PATH_NOT_FOUND, PATH_NOT_UNIQUE,
    TARGET_TYPE_MISMATCH)
  provides_to:
  - G-010/T-005 (validator uses parsed document and address)
  - G-010/T-006 (unit layer uses parsed document and address)
  - G-010/T-007 (integration verification)
public_contracts_provided:
- 'YamlParser: parse(raw_content) -> CommentedMap. Raises YAML_PARSE_FAILED on invalid
  YAML. parse of empty string returns empty CommentedMap.

  '
- 'YamlRenderer: render(document) -> str. Deterministic output preserving order and
  comments.

  '
- 'YamlAddress: parse_address(address: str) -> list[AddressSegment]. normalize_address(address:
  str) -> str. resolve(document, address) -> (parent, key). Supports: top_level_key,
  dotted.path, list[N], list[key=value] filter. Returns PATH_NOT_FOUND when path does
  not exist. Returns PATH_NOT_UNIQUE when list filter matches multiple nodes.

  '
- 'YamlMutations: mutate_set, mutate_replace_block, mutate_append, mutate_delete,
  mutate_move. Each returns mutated document and changed_paths list.

  '
implementation_notes: 'Use ruamel.yaml YAML(typ=''rt'') for round-trip parse/dump
  to preserve comments and order. render uses StringIO to capture ruamel dump output.
  YAML address grammar: segment separator is ''.''; list index is [N]; list filter
  is [key=value]. An empty path (whole document replace) is supported only for mutate_replace_block.
  mutate_append with dedupe=True skips insertion if identical value already present.
  changed_paths must match exactly the normalised addresses of the mutated locations.
  Render must be deterministic: render(parse(render(doc))) == render(doc).

  '
verification:
  commands:
  - python -m pytest tests/formatters/yaml/test_parse_render.py tests/formatters/yaml/test_address.py
    tests/formatters/yaml/test_mutations.py -v
  expected:
  - parse returns CommentedMap preserving comments.
  - render is deterministic for the same document.
  - parse(render(doc)) == doc (round-trip identity).
  - address parser handles dotted path, list index, list filter.
  - resolve returns PATH_NOT_FOUND for missing path.
  - resolve returns PATH_NOT_UNIQUE for non-unique filter match.
  - mutate_set replaces scalar or mapping at address.
  - mutate_append adds item to sequence or mapping.
  - mutate_delete removes key or list item at address.
  - mutate_move moves subtree from source to target address.
  - changed_paths returned matches the mutated addresses exactly.
  - YAML_PARSE_FAILED raised for invalid YAML input.
acceptance_criteria:
- parse uses ruamel.yaml round-trip mode preserving comments and order.
- render is deterministic for the same input document.
- YAML address parser supports dotted path, list index, and list key=value filter.
- All mutation methods return (document, changed_paths).
- YAML_PARSE_FAILED raised on invalid YAML; PATH_NOT_FOUND on missing address.
