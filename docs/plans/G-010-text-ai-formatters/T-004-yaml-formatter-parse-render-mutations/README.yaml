parent_global_context: 'G-010 owns AbstractFormatter and the initial formatter backends.
  The YAML formatter is split across T-004, T-005, and T-006. T-004 owns: parse (ruamel.yaml
  round-trip), render (deterministic), structural YAML address parser, normalize_address,
  and all five mutation operations (set, replace_block, append, delete, move).

  '
intent: 'Implement the YAML formatter parse/render/mutation layer: parse(raw_content)
  -> CommentedMap/CommentedSeq (ruamel.yaml round-trip load). render(document) ->
  str (deterministic, preserving comments and order). Structural YAML address parser
  supporting: top_level_key, dotted.path.to.key, list[0], commands[name=buf_diff],
  commands[name=buf_diff].metadata. normalize_address: normalise to canonical form.
  mutate_set, mutate_replace_block, mutate_append, mutate_delete, mutate_move.

  '
why_this_step_exists: 'Parse, render, address parsing, and mutations are the core
  YAML editing operations and are independently testable from validation (T-005) and
  unit/search semantics (T-006). Isolating them here lets T-005 and T-006 build on
  a working parse/mutate foundation.

  '
