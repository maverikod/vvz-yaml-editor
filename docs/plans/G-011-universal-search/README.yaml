format: global_package_step_v2
plan_id: ai_editor_pip_package_for_mcp
step_id: G-011
step_name: universal_search
title: AbstractSearch and universal formatter-unit search subsystem
status: draft
source_plan: docs/plans/create_pip_package_for_mcp.yaml
source_documents:
- docs/tech_spec.md
- docs/plans/create_pip_package_for_mcp.yaml
global_intent: 'Own AbstractSearch: a format-independent search/query layer over formatter-provided
  units. Search must not open/save files and must not know YAML path syntax or text
  line range internals. It asks the buffer for the document and formatter, asks the
  formatter for units, and applies formatter-provided match_unit and compare_units
  semantics.'
why_this_block_exists: The technical specification separates search/query from both
  file/buffer lifecycle and formatter editing. Old YAML helpers such as yaml_get and
  yaml_get_command are search concerns, not file operations and not buffer lifecycle.
  Search must be universal enough to work for text now, YAML now, and future JSON/Markdown
  formatters later.
owned_code_paths:
- ai_editor/search/
- tests/search/
owned_docs_paths:
- docs/search.md
forbidden_code_paths:
- ai_editor/editor_core/
- ai_editor/sessions/
- ai_editor/interfaces/
- ai_editor/writer.py
- .venv
- venv
- site-packages
allowed_dependencies:
  may_be_used_by:
  - ai_editor/api.py and ai_editor/interfaces/cli.py public API and CLI
  - YAML compatibility wrappers (yaml_get_command, yaml_get_verification) internal
    to G-010
  may_depend_on:
  - G-009 AbstractBuffer public contracts (resolves buffer via session_key + buffer_id)
  - G-010 formatter unit, match, and compare contracts
public_contracts_provided:
- AbstractSearch
- formatter-unit search API
- find/find_one/list_units/select commands
- search result uniqueness policy
- search error model
abstract_search_contract:
  methods:
  - find(session_key, buffer_id, query, scope=null) -> matches
  - find_one(session_key, buffer_id, query, scope=null) -> match | error
  - list_units(session_key, buffer_id, scope=null) -> units
  - select(session_key, buffer_id, query, policy) -> address | addresses | error
  responsibilities:
  - Resolve buffer state via session_key + buffer_id through G-009 public buffer access
    contracts.
  - Ask formatter.iter_units(document, scope) for candidate units.
  - Ask formatter.match_unit(unit, query) to evaluate matches.
  - Ask formatter.compare_units(left_unit, right_unit, options) for ranking or equality.
  - Return formatter addresses suitable for BufferAddress in copy/cut/paste.
  - Enforce find_one uniqueness and typed errors.
  - Keep query policy independent from save/open/close lifecycle.
query_model:
  base_fields:
  - kind
  - value
  - options
  formatter_specific_query_allowed: true
  examples:
    text:
    - kind: contains_text
      value: buf_diff
    - kind: regex
      value: '^## '
    yaml:
    - kind: field_equals
      field: name
      value: buf_diff
    - kind: node_type
      value: mapping
result_model:
  match:
    required_fields:
    - buffer_id
    - formatter
    - address
    - unit_kind
    - display_text
    - metadata
  policies:
    find: return zero or more matches
    find_one: return exactly one match or typed error
    select: return addresses according to policy
error_model:
  typed_errors:
  - SEARCH_QUERY_INVALID
  - SEARCH_NO_MATCH
  - SEARCH_NOT_UNIQUE
  - SEARCH_SCOPE_INVALID
  - FORMATTER_SEARCH_UNSUPPORTED
  - ADDRESS_INVALID
verification:
  scope: global_completion_gate
  commands:
  - python -m pytest tests/search
  expected:
  - find(session_key, buffer_id, query) lists text units through text formatter iter_units.
  - find(session_key, buffer_id, query) lists YAML units through YAML formatter iter_units.
  - find returns all matches for a valid query.
  - find_one returns SEARCH_NO_MATCH for zero matches.
  - find_one returns SEARCH_NOT_UNIQUE for multiple matches.
  - Search returns formatter-provided addresses suitable for copy/cut/paste.
  - Search uses formatter.compare_units for ranking, dedupe, or equality checks.
acceptance_criteria:
- AbstractSearch has no file open/save/close responsibility.
- AbstractSearch has no YAML path parser or text line-range parser internals.
- Search works over formatter units provided by AbstractFormatter.
- Search returns addresses that can be passed directly to copy/cut/paste BufferAddress.
- Old yaml_get and yaml_get_command behavior can be implemented as compatibility wrappers
  over AbstractSearch.
model_assignment_spec:
  performer: coding_agent
  instruction: Implement only AbstractSearch and tests/search. Search must operate
    over formatter-provided units using iter_units, match_unit, and compare_units.
    It must return formatter addresses suitable for BufferAddress in copy/cut/paste.
    Do not implement file/buffer lifecycle, formatter parsing/editing internals, public
    CLI, MCP wrappers, .venv, venv, site-packages, or installed dependencies.
observations_template:
- command: ''
  expected: ''
  actual: ''
  error: ''
  root_cause: ''
  fix: ''
  post_fix_verification: ''
  status: ''
