step_name: mutation_commit_pipeline
title: Mutation commit pipeline - git commit on buffer branch after each mutation
status: draft
source_plan: docs/plans/create_pip_package_for_mcp.yaml
source_documents:
- docs/tech_spec.md
- docs/plans/G-015-session-layer/README.yaml
parent_global_context: 'G-015 owns the session layer. After every successful buffer
  mutation the session must: render the buffer, commit rendered content to the buf/<buffer_id>
  branch in session_dir/git/, and write updated content to <buffer_id>.buf via write_buf.
  T-003 owns this mutation commit pipeline in isolation from undo/redo (T-004).

  '
intent: 'Implement commit_mutation(session, buffer_id, operation_name, params_summary)
  that renders the buffer, commits rendered content to buf/<buffer_id> in session_dir/git/
  with message ''<operation_name>: <params_summary>'', writes .buf file via write_buf.
  If gitpython fails the mutation still succeeds and HISTORY_UNAVAILABLE diagnostic
  is attached to the response.

  '
why_this_step_exists: 'The mutation commit is independently testable without undo/redo
  (T-004). Undo/redo depends on the commit history created by this step. Isolating
  commit_mutation here lets T-004 assume commits exist without re-implementing the
  commit logic.

  '
