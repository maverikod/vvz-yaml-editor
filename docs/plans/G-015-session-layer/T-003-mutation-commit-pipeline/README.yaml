  instruction: 'Implement mutation_commit.py with MutationCommitResult dataclass and
    commit_mutation (session, buffer, operation_name, params_summary) -> MutationCommitResult.
    Render buffer via formatter.render. Commit to buf/<buffer_id> branch in session_dir/git/
    via gitpython. Write .buf via G-007 write_buf. On git failure: set commit_sha=None,
    append HISTORY_UNAVAILABLE, return success=True. Write tests in tests/sessions/test_mutation_commit.py.
    Do not implement undo/redo, clipboard, write_all, or mutation application.

    '
  non_goals:
  - Applying mutations to buffer content
  - undo/redo (T-004)
  - Session clipboard (T-005)
  - write_all (T-006)
