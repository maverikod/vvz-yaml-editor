allowed_dependencies:
  consumes_from:
  - G-015/T-002 session_buffer (buffer exists in session; .buf path)
  - G-009/T-003 ConcreteBuffer (document field; formatter.render)
  - G-007 writer.py write_buf (atomic .buf write after commit)
  - gitpython (commit to buf/<buffer_id> branch in session_dir/git/)
  - G-001 contracts (HISTORY_UNAVAILABLE diagnostic)
  provides_to:
  - G-015/T-004 undo_redo (reads commit history created here)
  - G-015/T-006 write_all (mutation pipeline path)
public_contracts_provided:
- 'commit_mutation(session, buffer, operation_name: str, params_summary: str) -> MutationCommitResult:
  renders buffer via formatter.render; commits to buf/<buffer_id> branch in session_dir/git/
  with message ''<operation_name>: <params_summary>''; writes .buf via write_buf.
  Returns MutationCommitResult with success, commit_sha (or None on git failure),
  and diagnostics (HISTORY_UNAVAILABLE if git failed).

  '
- 'MutationCommitResult — dataclass: success (bool), commit_sha (str | None), diagnostics
  (list).

  '
implementation_notes: 'commit_mutation is called by the session layer after every
  operation that sets modified=True on the buffer. The caller (session operation handler)
  is responsible for applying the mutation to the buffer first; commit_mutation only
  reads the already-mutated buffer state. Git failure handling: wrap gitpython calls
  in try/except; on any exception set commit_sha=None and append HISTORY_UNAVAILABLE
  diagnostic. The mutation result returned to the MCP caller must still have success=True;
  only the diagnostic indicates history is unavailable. write_buf writes <session_dir>/<buffer_id>.buf
  atomically.

  '
verification:
  commands:
  - python -m pytest tests/sessions/test_mutation_commit.py -v
  expected:
  - commit_mutation creates a commit on buf/<buffer_id> branch in session_dir/git/.
  - Commit message is '<operation_name>: <params_summary>'.
  - .buf file is updated after commit.
  - git failure attaches HISTORY_UNAVAILABLE diagnostic without failing mutation.
  - commit_sha is None when git fails.
  - Commit content matches formatted buffer content.
acceptance_criteria:
- commit_mutation commits rendered content to buffer branch after every mutation.
- Commit message format is '<operation_name>: <params_summary>'.
- git failure is non-fatal and produces HISTORY_UNAVAILABLE diagnostic.
- .buf file is always updated even when git fails.
- commit_mutation does not apply the mutation itself; it only commits the already-changed
  buffer.
model_assignment_spec:
  performer: coding_agent
  title: Implement mutation commit pipeline for session-local git
  owned_paths:
