  instruction: 'Implement session_clipboard.py with clipboard_copy, clipboard_cut,
    clipboard_paste. Store ClipboardItem in in-memory dict and persist to <session_dir>/clipboard.json
    on each copy/cut. clipboard_paste looks up item by clipboard_item_id, checks session
    scoping, calls G-009 copy_cut_paste.paste, marks buffer modified, calls commit_mutation.
    Clear clipboard on session close. Restore from clipboard.json on reconnect. Write
    tests in tests/sessions/test_session_clipboard.py. Do not re-implement copy/cut/paste
    fragment logic from G-009/T-005.

    '
  non_goals:
  - Copy/cut/paste fragment logic (owned by G-009/T-005)
  - undo/redo (T-004)
  - write_all (T-006)
