parent_step_name: session_layer
step_id: G-015/T-005
step_name: session_clipboard
title: Session-scoped clipboard for copy, cut, and paste between session buffers
status: draft
source_plan: docs/plans/create_pip_package_for_mcp.yaml
source_documents:
- docs/tech_spec.md
- docs/plans/G-015-session-layer/README.yaml
parent_global_context: 'G-015 owns the session layer. The session clipboard allows
  copy/cut/paste between buffers within the same session. Cross-session clipboard
  access is rejected with SESSION_LOCK_CONFLICT. T-005 owns clipboard storage: in-memory
  during session, persisted to session_dir/clipboard.json for recovery on reconnect.
  It integrates with G-009 copy/cut/paste orchestration (T-005 of G-009) by storing
  the ClipboardItem produced by editor core and passing it back on paste.

  '
intent: 'Implement session-scoped clipboard: clipboard_copy(session, buffer, address),
  clipboard_cut(session, buffer, address), clipboard_paste(session, buffer, address,
  clipboard_item_id, mode). Clipboard items are stored in session_dir/clipboard.json
  (persisted) and in-memory. Cross-session paste is rejected with SESSION_LOCK_CONFLICT.
  Clipboard cleared on session close.

  '
why_this_step_exists: 'Clipboard storage and session scoping are independently testable
  from mutation commits (T-003), undo/redo (T-004), and write_all (T-006). Editor
  core (G-009/T-005) produces and consumes ClipboardItem values; G-015/T-005 owns
  where those items are stored.

  '
owned_code_paths:
- ai_editor/sessions/session_clipboard.py
- tests/sessions/test_session_clipboard.py
owned_docs_paths: []
forbidden_paths:
- ai_editor/editor_core/copy_cut_paste.py
- ai_editor/editor_core/
- ai_editor/formatters/
- ai_editor/search/
- ai_editor/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  consumes_from:
  - G-015/T-001 session_lifecycle (session directory path)
  - G-015/T-002 session_buffer (buffer routing within session)
  - G-009/T-005 copy_cut_paste (ClipboardItem produced/consumed by editor core)
  - G-001 contracts (SESSION_LOCK_CONFLICT, CLIPBOARD_ITEM_NOT_FOUND, CLIPBOARD_FORMAT_MISMATCH)
  provides_to:
  - G-015/T-007 integration verification
  - G-008 public interfaces (copy/cut/paste commands)
public_contracts_provided:
- 'clipboard_copy(session, buffer, source_address) -> ClipboardCopyResult: calls G-009
  copy_cut_paste.copy; stores resulting ClipboardItem in session clipboard (in-memory
  and clipboard.json). Returns clipboard_item_id. Does not mark buffer modified.

  '
- 'clipboard_cut(session, buffer, source_address) -> ClipboardCutResult: calls G-009
  copy_cut_paste.cut; stores ClipboardItem; marks buffer modified; calls commit_mutation
  (T-003). Returns clipboard_item_id.

  '
- 'clipboard_paste(session, target_buffer, target_address, clipboard_item_id, mode)
  -> ClipboardPasteResult: looks up clipboard_item_id in session clipboard; CLIPBOARD_ITEM_NOT_FOUND
  if missing; validates same session_key ownership; SESSION_LOCK_CONFLICT if different
  session; calls G-009 copy_cut_paste.paste; marks target buffer modified; calls commit_mutation
  (T-003).

  '
- 'Session clipboard storage: dict[clipboard_item_id -> ClipboardItem] in memory.
  Persisted to <session_dir>/clipboard.json on every copy/cut. Cleared on session
  close.

  '
implementation_notes: 'clipboard_item_id: UUID4 generated at copy/cut time. clipboard.json
  format: JSON object mapping clipboard_item_id to serialised ClipboardItem. Cross-session
  check: clipboard item carries source session_key; if target session_key != source
  session_key -> SESSION_LOCK_CONFLICT. Clipboard cleared on session close by deleting
  clipboard.json and clearing in-memory dict. On reconnect: read clipboard.json to
  restore clipboard items.

  '
verification:
  commands:
  - python -m pytest tests/sessions/test_session_clipboard.py -v
  expected:
  - clipboard_copy stores ClipboardItem in session clipboard and clipboard.json.
  - clipboard_copy does not mark source buffer modified.
  - clipboard_cut marks source buffer modified and calls commit_mutation.
  - clipboard_paste marks target buffer modified and calls commit_mutation.
  - clipboard_paste from session A into session B returns SESSION_LOCK_CONFLICT.
  - Clipboard cleared on session close.
  - Clipboard restored from clipboard.json on reconnect.
  - CLIPBOARD_ITEM_NOT_FOUND when clipboard_item_id unknown.
  - CLIPBOARD_FORMAT_MISMATCH for incompatible formatter combination.
acceptance_criteria:
- Clipboard is session-scoped; cross-session paste returns SESSION_LOCK_CONFLICT.
- clipboard.json persists clipboard across restarts.
- Clipboard cleared on session close.
- clipboard_copy does not mark buffer modified.
- clipboard_cut and clipboard_paste mark buffers modified and commit.
- CLIPBOARD_ITEM_NOT_FOUND returned for unknown item id.
model_assignment_spec:
  performer: coding_agent
  title: Implement session-scoped clipboard with persistence
  owned_paths:
