parent_global_context: 'G-015 owns the session layer. T-006 owns three related session-wide
  batch/sweep operations: write_all (batch save all eligible buffers), auto_write
  (after each mutation if session.auto_write=True), and startup_sweep (clears stale
  session directories and locks on server start). These are independently testable
  from session lifecycle (T-001), buffer open/close (T-002), mutation commits (T-003),
  undo/redo (T-004), and clipboard (T-005).

  '
intent: 'Implement write_all(session_key, force=False) -> WriteAllResult that batch-saves
  all eligible buffers via G-009 save_pipeline and creates one project git commit
  per file. Implement auto_write(session, buffer) called after each mutation when
  session.auto_write=True. Implement startup_sweep(sessions_base_dir) that scans session
  directories, identifies expired/corrupt sessions, releases stale write locks, and
  deletes stale session directories.

  '
why_this_step_exists: 'write_all, auto_write, and startup_sweep share the same ownership
  (session-wide batch operations) without overlapping with any single-buffer or lifecycle
  step. Grouping them here allows T-001..T-005 to be implemented without write_all
  or startup_sweep complexity.

  '
