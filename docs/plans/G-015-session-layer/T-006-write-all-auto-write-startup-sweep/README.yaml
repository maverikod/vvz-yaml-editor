allowed_dependencies:
  consumes_from:
  - G-015/T-001 ses_settings.py (read session list and expiry check)
  - G-015/T-003 mutation_commit (commit_mutation called by auto_write)
  - G-009/T-004 save_pipeline (save per buffer)
  - G-007 writer.py write_result (backup + atomic write + read-back per buffer)
  - G-001 contracts (WriteAllResult, GIT_COMMIT_FAILED diagnostic)
  - gitpython (project git commit per saved file)
  provides_to:
  - G-015/T-007 integration verification
  - G-008 public interfaces (write_all command)
public_contracts_provided:
- 'write_all_session(session_key, force=False) -> WriteAllResult: for each non-readonly
  buffer in session: if force=False skip unmodified buffers; call formatter.validate_document;
  if fails add to failed_buffers; call write_result; on success create one project
  git commit per file (best-effort; GIT_COMMIT_FAILED diagnostic on failure); add
  to written_buffers. Unsaved buffers (real_file_path=None) add to skipped_buffers.
  WriteAllResult: success (True only if all eligible succeed), written_buffers, failed_buffers,
  skipped_buffers.

  '
- 'auto_write_on_mutation(session, buffer) -> None: called when session.auto_write=True
  and buffer has a real_file_path. Calls write_result; on success creates project
  git commit. New unsaved buffers (real_file_path=None) silently skipped.

  '
- 'startup_sweep(sessions_base_dir: str) -> SweepResult: scans all session directories;
  reads ses_settings.json; identifies expired or corrupt sessions; releases write
  locks in files table; deletes stale directories. Returns SweepResult with cleaned_sessions
  and errors.

  '
- 'SweepResult — dataclass: cleaned_sessions (list[str]), errors (list[str]).

  '
implementation_notes: 'write_all_session iterates buffer_ids from ses_settings. Per
  buffer: validate then write. Project git commit message: ''<formatter_name>: save
  <relative_file_path>''. Git commit is best-effort; write still succeeds even when
  git commit fails. auto_write_on_mutation is called by the mutation handler in G-015
  session operations AFTER commit_mutation. Skips real_file_path=None buffers silently.
  startup_sweep: scan sessions_base_dir for directories whose names are valid UUID4.
  For each: read ses_settings.json; if missing/corrupt or expired (now - last_active_at
  > idle_timeout_seconds): release write locks via UPDATE files SET editing_pid=NULL
  session_key=NULL WHERE session_key=<stale_key>; delete directory atomically.

  '
verification:
  commands:
  - python -m pytest tests/sessions/test_write_all_session.py tests/sessions/test_startup_sweep.py
    -v
  expected:
  - write_all with force=False writes only modified non-readonly buffers.
  - write_all with force=True writes all non-readonly buffers.
  - write_all validation failure records buffer in failed_buffers; others continue.
  - Unsaved buffers (real_file_path=None) appear in skipped_buffers.
  - write_all success=False when any eligible buffer fails.
  - Project git commit created per written file (best-effort).
  - GIT_COMMIT_FAILED diagnostic attached when git commit fails without failing write.
  - auto_write_on_mutation calls write_result for real-file buffers.
  - auto_write_on_mutation skips buffers with real_file_path=None.
  - startup_sweep releases write locks for expired sessions.
  - startup_sweep deletes expired session directories atomically.
  - startup_sweep handles corrupt ses_settings.json without crashing.
acceptance_criteria:
- write_all result is always partial-write-safe and session remains open on failure.
- failed_buffers contains buffer_id, error_code, and message.
- Project git commit is best-effort and GIT_COMMIT_FAILED is non-fatal.
- auto_write skips new unsaved buffers silently.
- startup_sweep never crashes on corrupt or missing ses_settings.json.
- startup_sweep releases stale locks before deleting directories.
