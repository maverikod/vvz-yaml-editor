  instruction: 'Implement session_buffer.py with session_open(session, file_path,
    formatter, readonly) -> BufferDescriptor and session_close(session, buffer_id).
    session_open: check write-lock via files table; if same file already open return
    existing buffer_id; call G-009.open; create buf/<buffer_id> branch in session_dir/git/
