  - G-009 AbstractBuffer open and close
  - G-007 writer.py write_buf (atomic .buf file write)
  - G-001 contracts (BUFFER_LOCKED, BUFFER_NOT_FOUND)
  - gitpython (create branch buf/<buffer_id> in session_dir/git/)
  provides_to:
  - G-015/T-003 mutation_commit (calls after every mutation)
  - G-015/T-004 undo_redo
  - G-015/T-006 write_all
public_contracts_provided:
- 'session_open(session, file_path, formatter, readonly) -> BufferDescriptor: checks
  write-lock (same file readwrite in two sessions -> BUFFER_LOCKED); if same file
  already open in this session returns existing buffer_id; calls G-009.open; creates
  branch buf/<buffer_id> in session_dir/git/ with initial commit (content= rendered
  buffer, message=''open: <file_path> [may be modified]''); writes <buffer_id>.buf
  via write_buf; updates ses_settings.json buffer_ids.

  '
- 'session_close(session, buffer_id) -> None: deletes branch buf/<buffer_id> from
  session_dir/git/; deletes <buffer_id>.buf; calls G-009.close to release write lock;
  removes buffer_id from ses_settings.json.

  '
implementation_notes: 'Write-lock rule: same real file may not be open readwrite in
  two different sessions. Check via files table: SELECT editing_pid, session_key WHERE
  path=file_path; if live session_key != current session_key -> BUFFER_LOCKED. Same
  file already open in this session: look up existing buffer_id from ses_settings
  buffer_ids and return it without re-opening. Branch creation: gitpython repo.create_head(''buf/<buffer_id>'');
  make initial commit with rendered buffer content. .buf file path: <session_dir>/<buffer_id>.buf
  (not bare filename to avoid collisions). session_close: delete branch in finally
  block; always release even on error.

  '
verification:
  commands:
  - python -m pytest tests/sessions/test_session_buffer.py -v
  expected:
  - session_open creates .buf file in session directory.
  - session_open creates buf/<buffer_id> branch in session_dir/git/.
  - session_open updates ses_settings.json buffer_ids.
  - Opening same file twice in same session returns existing buffer_id.
  - Opening same file readwrite in two sessions returns BUFFER_LOCKED.
  - session_close deletes buf/<buffer_id> branch.
  - session_close deletes .buf file.
  - session_close updates ses_settings.json buffer_ids.
  - session_close releases write lock in finally block.
acceptance_criteria:
- Write-lock enforced via files.editing_pid and files.session_key.
- Same file opened twice in same session returns existing buffer_id.
- .buf file created on open and deleted on close.
- buf/<buffer_id> branch created on open and deleted on close.
- ses_settings.json buffer_ids updated after open and close.
- Write lock released in finally block even on exception.
