parent_global_context: 'G-015 owns the session layer. T-002 owns the buffer open and
  close operations within a session: write-lock enforcement across sessions via files.editing_pid
  and files.session_key, .buf file creation/deletion, buffer branch creation in session-local
  git, and ses_settings.json buffer_ids update. It does not own the mutation commit
  pipeline (T-003), undo/redo (T-004), or clipboard (T-005).

  '
intent: 'Implement session-level open(session_key, file_path, formatter, readonly)
  and close(session_key, buffer_id) that wrap G-009 AbstractBuffer.open/close with
  session context: write-lock check using files.editing_pid + session_key; .buf file
  write after open; buf/<buffer_id> branch creation in session_dir/git/ with initial
  commit; ses_settings.json buffer_ids update.

  '
why_this_step_exists: 'Buffer open/close within a session is independently testable
  from mutation commits (T-003), undo/redo (T-004), clipboard (T-005), and write_all
  (T-006). Isolating it here allows T-003 and T-004 to build on a stable buffer-within-session
  foundation.

  '
