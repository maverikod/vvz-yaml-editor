format: global_package_step_v2
plan_id: ai_editor_pip_package_for_mcp
step_id: G-004
step_name: reader_queries
title: Read/query subsystem and model-friendly inspection API
status: draft
source_plan: docs/plans/create_pip_package_for_mcp.yaml
global_intent: YAML compatibility wrappers internal to G-008/G-010. yaml_load, yaml_get,
  yaml_get_command, yaml_get_verification are thin compatibility functions implemented
  in ai_editor/formatters/yaml/compat/ using AbstractSearch (G-011) and YAMLFormatter
  (G-010). Not a public subsystem — these are legacy-name wrappers over the generic
  open/find/find_one/list_units API.
why_this_block_exists: 'Lower-level compat tasks must understand the entire read/query
  job: provide precise, minimal, JSON-serializable YAML fragments to MCP callers.
  This block must not be mixed with path grammar, mutation logic, validation internals,
  or file write logic.'
owned_code_paths:
- ai_editor/formatters/yaml/compat/
- tests/formatters/yaml/compat/
owned_docs_paths:
- docs/reader_api.md
forbidden_code_paths:
- ai_editor/contracts/
- ai_editor/formatters/yaml/document_io/
- ai_editor/path_language/
- ai_editor/editor_core/
- ai_editor/sessions/
- ai_editor/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_be_used_by:
  - G-008 public API (re-exports as compatibility surface)
  - G-010 YAMLFormatter (owns this compat layer)
  may_depend_on:
  - G-001-package-contracts-and-distribution
  - G-010 YAMLFormatter
  - G-011 AbstractSearch
public_contracts_provided:
- yaml_load(session_key, file_path) -> DocumentSummary
- yaml_get(session_key, buffer_id, path) -> subtree dict
- yaml_get_command(session_key, buffer_id, command_name) -> command dict
- yaml_get_verification(session_key, buffer_id) -> list
core_responsibilities:
- Delegate YAML loading entirely to G-010 YAMLFormatter (which internally uses document_io).
- Delegate path resolution entirely to G-011 AbstractSearch (which internally uses
  path_language).
- Return exact structural fragments as JSON-serializable values.
- Provide named compat helpers (yaml_load, yaml_get, yaml_get_command, yaml_get_verification)
  as thin wrappers.
- Preserve typed errors from G-010/G-011 in compat responses without re-interpreting
  them.
public_read_operations:
- name: yaml_load
  responsibility: Open file in session, return document summary and diagnostics. Delegates
    to session.open + formatter summary.
  signature: yaml_load(session_key, file_path) -> DocumentSummary
- name: yaml_get
  responsibility: Return exact subtree by structural path from open buffer. Delegates
    to find_one.
  signature: yaml_get(session_key, buffer_id, path) -> subtree dict
- name: yaml_get_command
  responsibility: Return one command object selected by command_name from open buffer.
  signature: yaml_get_command(session_key, buffer_id, command_name) -> command dict
- name: yaml_get_verification
  responsibility: Return the verification list from a plan task buffer.
  signature: yaml_get_verification(session_key, buffer_id) -> list
subsystem_independence_rules:
- This subsystem must not parse path strings or configure ruamel.yaml directly — delegate
  to G-010 YAMLFormatter.
- This subsystem must not create ai_editor/reader/.
- This subsystem must not apply mutations.
- This subsystem must not write files, create backups, or implement CLI/MCP wrappers.
- All YAML loading and path resolution must go through G-010/G-011 public contracts.
implementation_outline:
- Implement thin compat wrappers in ai_editor/formatters/yaml/compat/.
- Delegate yaml_load/yaml_get/yaml_get_command/yaml_get_verification entirely to G-010
  YAMLFormatter and G-011 AbstractSearch.
- Convert formatter results to JSON-compatible values.
- Preserve typed errors from formatter and search layers in compat responses.
- Add tests under tests/formatters/yaml/compat/.
verification:
  commands:
  - python -m pytest tests/formatters/yaml/compat/
  expected:
  - yaml_load returns summary for valid fixtures.
  - yaml_get returns only the selected subtree.
  - yaml_get_command returns exactly one command object.
  - Missing command returns a typed not-found result.
  - All responses are json.dumps compatible.
  scope: internal_g010_compat
acceptance_criteria:
- Compat wrappers delegate entirely to G-010 YAMLFormatter and G-011 AbstractSearch.
- Compat wrappers do not call document_io or path_language directly.
- All responses are json.dumps compatible.
- Implementer can understand the compat goal from this README alone without reading
  G-010 or G-011 internals.
model_assignment_spec:
  performer: coding_agent
  instruction: Implement yaml_load, yaml_get, yaml_get_command, yaml_get_verification
    as thin compatibility wrappers in ai_editor/formatters/yaml/compat/ using G-011
    AbstractSearch and G-010 YAMLFormatter internals. These are not independent functions
    — they delegate entirely to open/find_one/list_units with YAML formatter. Do not
    create ai_editor/reader/. Do not duplicate YAML parsing or path resolution.
observations_template:
- command: ''
  expected: ''
  actual: ''
  error: ''
  status: ''
