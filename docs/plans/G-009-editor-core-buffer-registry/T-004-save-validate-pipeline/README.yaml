parent_global_context: 'G-009 owns the format-independent editor core: AbstractBuffer,
  BufferRegistry, buffer lifecycle, formatter fallback policy, file edit lock, save/validate
  pipeline, copy/cut/paste orchestration, and config integration. T-004 owns save,
  save_as, and the validate method that is called both explicitly and as the first
  stage of save.

  '
intent: 'Implement buffer.save, buffer.save_as, and buffer.validate -> ValidationResult.
  validate calls formatter.validate_document without writing files or changing buffer
  state. save and save_as call validate as the first pipeline stage and abort on failure.
  After validation: render, stale-check, backup, atomic write via writer.py write_result,
  reset modified=False.

  '
why_this_step_exists: 'save/validate is a distinct ownership seam from open/close
  (T-003) and copy/cut/paste (T-005). Isolating it here means each step can be implemented
  and tested independently. The stale-check and atomic write protocol is concentrated
  in one place.

  '
