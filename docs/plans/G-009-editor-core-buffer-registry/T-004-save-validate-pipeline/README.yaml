  instruction: 'Implement save_pipeline.py with three functions: validate(buffer)
    -> ValidationResult delegating to formatter.validate_document; save(buffer) executing
    validate then render then stale-check (editing_pid equals os.getpid()) then write_result
    from ai_editor/writer.py then reset modified=False then update current_hash; save_as(buffer,
    file_path, overwrite) checking overwrite flag and rebinding buffer.file_path after
