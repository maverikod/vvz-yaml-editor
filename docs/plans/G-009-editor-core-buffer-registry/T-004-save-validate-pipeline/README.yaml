allowed_dependencies:
  consumes_from:
  - G-009/T-002 BufferRegistry and BufferAddress
  - G-009/T-003 ConcreteBuffer buffer fields (document, formatter, modified, original_hash,
    current_hash, file_path, editing_pid)
  - ai_editor/writer.py write_result (backup plus atomic write plus read-back; owned
    by ai_editor package, not a separate global step)
  - G-010 AbstractFormatter validate_document and render methods
  - G-001 contracts (ValidationResult, OperationResult, VALIDATION_FAILED, BUFFER_STALE,
    BUFFER_NOT_FOUND, SAVE_TARGET_EXISTS)
  provides_to:
  - G-009/T-006 (write_all calls save per buffer)
  - G-015 session layer (calls save/save_as after mutations)
public_contracts_provided:
- 'validate(session_key, buffer_id) -> ValidationResult: calls formatter.validate_document
  on the current in-memory document. Does not write any file. Does not change modified.

  '
- 'save(session_key, buffer_id) -> OperationResult: validate then render then stale-check
  (editing_pid equals os.getpid()) then backup then atomic write via write_result
  then reset modified=False then update current_hash. Returns old_hash and new_hash.

  '
- 'save_as(session_key, buffer_id, file_path, overwrite=False) -> OperationResult:
  same pipeline as save but writes to target file_path. Checks overwrite flag and
  returns SAVE_TARGET_EXISTS if file exists and overwrite=False. Binds buffer to new
  file_path after successful write.

  '
implementation_notes: 'validate delegates to formatter.validate_document(document).
  text formatter validate_document always returns success=True. save pipeline order:
  (1) validate and abort if fails; (2) render via formatter.render; (3) stale check
  via SELECT editing_pid from files table and compare to os.getpid(); return BUFFER_STALE
  if mismatch; (4) write_result from ai_editor/writer.py; (5) reset modified=False;
  (6) update current_hash. save_as: before step 1 check if target exists with overwrite=False
  and return SAVE_TARGET_EXISTS. After successful write rebind buffer.file_path and
  buffer.relative_path to new path. save and save_as never write when validation fails.
  Disk state is unchanged on any pipeline failure before the actual write.

  '
verification:
  commands:
  - python -m pytest tests/editor_core/test_save_pipeline.py -v
  expected:
  - validate returns ValidationResult without writing file or changing modified.
  - save calls formatter.validate_document before render and aborts on failure.
  - Failed validation leaves disk unchanged.
  - Stale buffer (editing_pid mismatch) returns BUFFER_STALE without writing.
  - Successful save returns old_hash and new_hash and sets modified=False.
  - save_as respects overwrite=False and returns SAVE_TARGET_EXISTS.
  - save_as rebinds buffer to new file_path after success.
  - text formatter always passes validate so save proceeds for text buffers.
acceptance_criteria:
- validate does not write any file and does not change buffer modified state.
- save pipeline order is validate then render then stale-check then write_result.
- save never writes when validate returns success=False.
- save_as checks overwrite flag before write.
- save_as rebinds buffer file_path on success.
- Stale lock check compares editing_pid to os.getpid().
