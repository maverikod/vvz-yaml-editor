format: tactical_step_v2
plan_id: ai_editor_pip_package_for_mcp
parent_step_id: G-009
parent_step_name: editor_core_buffer_registry
step_id: G-009/T-005
step_name: copy_cut_paste_orchestration
title: Format-independent copy, cut, and paste orchestration over BufferAddress
status: draft
source_plan: docs/plans/create_pip_package_for_mcp.yaml
source_documents:
- docs/tech_spec.md
- docs/plans/G-009-editor-core-buffer-registry/README.yaml
parent_global_context: 'G-009 owns the format-independent editor core. T-005 owns
  the copy/cut/paste orchestration layer that delegates all fragment semantics to
  the formatter while keeping the editor core address-agnostic. This step does not
  implement any formatter, does not manage session clipboard storage, and does not
  implement save logic.

  '
intent: 'Implement the format-independent copy/cut/paste orchestration in editor core:
  copy(session_key, buffer_id, source: BufferAddress) delegates to formatter.copy_fragment;
  cut(session_key, buffer_id, source: BufferAddress) delegates to formatter.cut_fragment
  and marks buffer modified; paste(session_key, target_buffer_id, target: BufferAddress,
  clipboard_item, mode) delegates to formatter.paste_fragment and marks target modified.
  Editor core does not own the clipboard store; it receives and returns clipboard
  items as opaque dicts provided by the caller (G-015 session layer owns clipboard
  storage).

  '
why_this_step_exists: 'copy/cut/paste is a distinct ownership seam from open/close
  (T-003) and save (T-004). Isolating it here allows the formatter contract for copy_fragment/cut_fragment/paste_fragment
  to be tested against the editor orchestration without save or open logic. G-015
  owns the clipboard storage; editor core owns only the delegation protocol.

  '
owned_code_paths:
- ai_editor/editor_core/copy_cut_paste.py
- tests/editor_core/test_copy_cut_paste.py
owned_docs_paths: []
forbidden_paths:
- ai_editor/editor_core/buffer.py
- ai_editor/editor_core/save_pipeline.py
- ai_editor/formatters/
- ai_editor/search/
- ai_editor/sessions/
- ai_editor/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  consumes_from:
  - G-009/T-002 BufferRegistry and BufferAddress
  - G-009/T-003 ConcreteBuffer (document, formatter, modified fields)
  - G-010 AbstractFormatter (copy_fragment, cut_fragment, paste_fragment methods)
  - G-001 contracts (OperationResult, CLIPBOARD_FORMAT_MISMATCH, BUFFER_NOT_FOUND,
    ADDRESS_NOT_FOUND)
  provides_to:
  - G-015 session layer (calls copy/cut/paste passing clipboard item)
public_contracts_provided:
- 'copy(source_buffer: ConcreteBuffer, source: BufferAddress) -> ClipboardItem: delegates
  to formatter.copy_fragment(document, source.address). Does not mark buffer modified.
  Returns ClipboardItem with source_buffer_id, source_formatter, source_address, source_revision,
  payload_kind, payload.

  '
- 'cut(source_buffer: ConcreteBuffer, source: BufferAddress) -> (ClipboardItem, document):
  delegates to formatter.cut_fragment(document, source.address). Replaces buffer document
  with returned document. Sets modified=True. Returns ClipboardItem and updated document.

  '
- 'paste(target_buffer: ConcreteBuffer, target: BufferAddress, clipboard_item: ClipboardItem,
  mode: str) -> document: checks source_formatter compatibility with target formatter.
  Returns CLIPBOARD_FORMAT_MISMATCH for incompatible combinations. Delegates to formatter.paste_fragment(document,
  target.address, fragment, mode). Sets modified=True. Returns updated document.

  '
- 'ClipboardItem — dataclass: source_buffer_id, source_formatter, source_address,
  source_revision, payload_kind, payload. Defined in this module.

  '
implementation_notes: "Clipboard item is a dataclass defined in copy_cut_paste.py.\
  \ It is opaque to editor core beyond the source_formatter field used for compatibility\
  \ check. Compatibility rules (checked in paste):\n  text -> text: allowed.\n  yaml\
  \ -> yaml: allowed.\n  yaml -> text: allowed only when mode explicitly requests\
  \ rendered_text.\n  text -> yaml: rejected unless mode explicitly requests parse_as_yaml.\n\
  \  other combinations: CLIPBOARD_FORMAT_MISMATCH.\nEditor core does NOT own the\
  \ clipboard dict/list/store. G-015 passes clipboard items as arguments and stores\
  \ them. Editor core only produces and consumes ClipboardItem values per call.\n"
verification:
  commands:
  - python -m pytest tests/editor_core/test_copy_cut_paste.py -v
  expected:
  - copy does not mark source buffer modified.
  - copy returns ClipboardItem with correct source_formatter and source_address.
  - cut marks source buffer modified.
  - cut returns updated document with fragment removed.
  - paste marks target buffer modified.
  - Incompatible formatter paste returns CLIPBOARD_FORMAT_MISMATCH.
  - Compatible paste returns updated document via formatter.paste_fragment.
  - Editor core never inspects or transforms address value.
acceptance_criteria:
- copy does not change buffer modified state.
- cut and paste set modified=True on the appropriate buffer.
- Clipboard compatibility check is enforced before formatter call.
- Address value is passed through opaquely to formatter; never inspected by editor
  core.
- ClipboardItem fields: source_buffer_id, source_formatter, source_address, source_revision,
    payload_kind, payload.
model_assignment_spec:
  performer: coding_agent
  title: Implement copy, cut, paste orchestration and ClipboardItem
  owned_paths:
  - ai_editor/editor_core/copy_cut_paste.py
  - tests/editor_core/test_copy_cut_paste.py
  forbidden_paths:
  - ai_editor/editor_core/buffer.py
  - ai_editor/editor_core/save_pipeline.py
  - ai_editor/formatters/
  - ai_editor/sessions/
  - .venv
  - venv
  - site-packages
  instruction: 'Implement copy_cut_paste.py with three functions: copy(source_buffer,
    source_address) delegates to formatter.copy_fragment(document, source_address.address)
    and returns ClipboardItem without modifying buffer; cut(source_buffer, source_address)
    delegates to formatter.cut_fragment, replaces buffer.document, sets modified=True;
    paste (target_buffer, target_address, clipboard_item, mode) checks formatter compatibility
    (CLIPBOARD_FORMAT_MISMATCH for incompatible), delegates to formatter.paste_fragment,
    sets modified=True. Define ClipboardItem dataclass with fields: source_buffer_id,
    source_formatter, source_address, source_revision, payload_kind, payload. Write
    tests in tests/editor_core/test_copy_cut_paste.py covering all acceptance criteria.
    Do not implement open/close, save/validate, write_all, formatter internals, or
    clipboard storage.

    '
  non_goals:
  - open and close and reload (T-003)
  - save and validate (T-004)
  - write_all (T-006)
  - Clipboard storage (owned by G-015)
  - AbstractFormatter implementation
