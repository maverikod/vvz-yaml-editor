parent_global_context: 'G-009 owns the format-independent editor core: AbstractBuffer,
  BufferRegistry, buffer lifecycle, formatter fallback policy, file edit lock, save/validate
  pipeline, copy/cut/paste orchestration, and config integration. T-003 provides the
  concrete implementation of open/new/close/reload and all the pre-open logic (file
  edit lock, formatter selection, fallback policy). It does NOT implement save/save_as
  or copy/cut/paste.

  '
intent: 'Implement the concrete buffer lifecycle operations: open (file-backed), new
  (unsaved), close, and reload. Implement file edit lock acquire/release logic using
  files.editing_pid and files.session_key columns. Implement formatter selection precedence:
  open_as_text=True > small_file_threshold > parse_error_fallback > structural auto-detect.
  Track buffer fields: filename, relative_path, formatter, modified, readonly, buffer_status.

  '
why_this_step_exists: 'open/new/close/reload are conceptually separate from save/validate
  (T-004) and copy/cut/paste (T-005). The file edit lock and formatter fallback policy
  belong here because they gate the open() operation before any save or mutation can
  occur. Isolating this step means T-004 and T-005 can be implemented and tested without
  re-implementing the lock and fallback logic.

  '
