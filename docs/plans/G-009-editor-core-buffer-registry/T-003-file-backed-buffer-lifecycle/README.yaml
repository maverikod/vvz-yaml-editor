  instruction: 'Implement ConcreteBuffer in buffer.py implementing AbstractBuffer
    from T-002. Implement file_edit_lock.py adapting code_analysis/core/database/file_edit_lock.py:
    try_acquire_file_edit_lock(session_key, file_path) -> bool; release_file_edit_lock;
    editing_lock_holder_is_alive(pid) using os.kill(pid, 0). In open(): (1) check
    write-lock via FileEditLock; if live session holds lock return BUFFER_LOCKED;
    (2) apply formatter selection precedence: open_as_text=True > small_file_threshold
    > parse_error_fallback > auto; (3) parse and register buffer. In close(): release
    lock in finally block. new() creates unsaved buffer with relative_path=None, modified=False.
    reload() re-reads from disk and reapplies formatter selection. Do not implement
    save, save_as, validate, copy, cut, paste, or write_all.

    '
  non_goals:
