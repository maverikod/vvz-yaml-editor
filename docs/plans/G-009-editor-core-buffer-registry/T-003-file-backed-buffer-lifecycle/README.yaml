public_contracts_provided:
- 'ConcreteBuffer — implements AbstractBuffer. Fields: buffer_id, session_key, filename,
  relative_path, formatter (AbstractFormatter instance), modified, readonly, buffer_status,
  original_hash, current_hash, revision, document (in-memory parsed representation).
  Stores original formatter name for fallback diagnostics.

  '
- 'FileEditLock — wrapper around code_analysis.core.database.file_edit_lock: try_acquire(session_key,
  file_path) -> bool; release(session_key, file_path); is_locked_by_other(file_path,
  session_key) -> bool.

  '
implementation_notes: "Formatter selection precedence for open(formatter=auto, open_as_text=False):\n\
  \  1. open_as_text=True -> text formatter, no threshold, no fallback.\n  2. len(raw_content)\
  \ < threshold -> text formatter, buffer_status=small_file.\n  3. formatter.parse\
  \ raises -> fallback text formatter, buffer_status=format_fallback,\n     emit FORMAT_VALIDATION_FAILED\
  \ diagnostic (non-fatal).\n  4. else -> structural formatter auto-detected by extension.\n\
  open(formatter=explicit): no threshold, no fallback; FORMAT_VALIDATION_FAILED on\
  \ parse error.\nfile_edit_lock.py adapts code_analysis/core/database/file_edit_lock.py:\n\
  \  - try_acquire_file_edit_lock: SELECT editing_pid; if alive -> BUFFER_LOCKED;\n\
  \    if stale -> clear then UPDATE. 0 rows -> BUFFER_LOCKED.\n  - release_file_edit_lock:\
  \ UPDATE SET editing_pid=NULL, session_key=NULL in finally.\n  - Must use os.getpid()\
  \ for pid and session_key for session column.\n\nnew() creates unsaved buffer: relative_path=None,\
  \ modified=False, file_path=None. close() calls release_file_edit_lock in finally\
  \ block guaranteed. reload() re-reads file from disk; applies same formatter selection\
  \ as open(). modified is set by G-009/T-004 (save resets it) and by G-009/T-005\
  \ (mutation sets it); T-003 only sets it at open (always False) and reload (reset\
  \ to False).\n"
verification:
  commands:
  - python -m pytest tests/editor_core/test_buffer_open_close.py -v
  expected:
  - open(session_key, file_path) acquires editing_pid + session_key in files table.
  - Opening same file twice in same session returns existing buffer_id (no duplicate).
  - Opening same file readwrite in two sessions returns BUFFER_LOCKED on second.
  - open with open_as_text=True always uses text formatter regardless of file size.
  - open with formatter=auto and small file uses text formatter, buffer_status=small_file.
  - open with formatter=auto and parse error uses text fallback, buffer_status=format_fallback.
  - open with formatter=explicit and parse error returns FORMAT_VALIDATION_FAILED
    without opening.
  - new() creates buffer with relative_path=None and modified=False.
  - close() releases editing_pid lock in finally block even when exception raised.
  - reload() re-reads file and resets modified=False.
  - Stale lock (dead pid) is cleared atomically and re-acquired.
acceptance_criteria:
- open acquires file edit lock before parse; returns BUFFER_LOCKED if live lock held.
- Formatter selection follows open_as_text > threshold > parse fallback > auto precedence.
- new() creates unsaved buffer with file_path=null and modified=False.
- close() releases lock in finally block; guaranteed even on exception.
- reload() re-applies formatter selection and resets modified.
- ConcreteBuffer stores original_hash, current_hash, revision, document fields.
- Buffer fields: filename, relative_path, formatter, modified, readonly, buffer_status.
