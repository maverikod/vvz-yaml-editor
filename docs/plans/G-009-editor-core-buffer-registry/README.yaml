formatter_fallback_policy:
  small_file_threshold:
    trigger: formatter=auto AND open_as_text=False AND len(raw_content) < small_file_threshold
      from config
    behavior: use text formatter immediately without attempting structural parse
    buffer_status: small_file
    rationale: small files fit entirely in model context window without structural
      overhead; no need to build CST or YAML tree. For larger files, structural formatter
      + skeleton view reduces VRAM pressure by sending only declarative structure
      to the model context instead of full implementation.
  open_as_text_option:
    param: open_as_text=True on buffer.open
    behavior: bypass formatter auto-detection and size threshold; always use text
      formatter
    use_cases:
    - user explicitly wants raw text editing of a structured file
    - recover from a damaged file that no structural formatter can parse
    - inspect file content without structural interpretation
  auto_fallback_on_parse_error:
    trigger: formatter=auto AND open_as_text=False AND len(raw_content) >= small_file_threshold
      AND formatter.parse raises
    behavior: editor core catches exception, emits FORMAT_VALIDATION_FAILED diagnostic,
      reopens using text formatter
    buffer_status: format_fallback
    invariants:
    - 'fallback is transparent to caller: buffer_id is returned normally'
    - original formatter name is stored in buffer state for diagnostics
    - fallback does not occur when open_as_text=True
  no_fallback_cases:
  - 'formatter=explicit (caller named a specific formatter): no threshold check, no
    fallback; return FORMAT_VALIDATION_FAILED error without opening buffer'
  open_precedence: open_as_text=True > small_file_threshold > parse_error_fallback
    > structural formatter auto-detect
pre_save_validation:
  method: validate(buffer_id) -> ValidationResult
  when_called:
  - explicitly by caller before save
  - automatically by editor core as first stage of save and save_as pipeline
  behavior:
  - call formatter.validate_document(document) on the current in-memory document
  - return ValidationResult with diagnostics
  - if validation fails, save/save_as is aborted and ValidationResult is returned
    as the operation result
  - validate does not write any file and does not change buffer state
  invariants:
  - save never writes a file when validate returns success=false
  - validate can be called independently of save to inspect buffer state without committing
  - text formatter validate_document always returns success=true (structural constraints
    are not checked for plain text)
  - fallback buffers (format_fallback status) are validated by text formatter, not
    original formatter
  error_code: VALIDATION_FAILED
config_policy:
  adapter_integration:
    pattern: add ai_editor section to mcp_proxy_adapter SimpleConfigModel; follow
      the same pattern as server/auth/queue_manager sections
    reader: mcp_proxy_adapter SimpleConfig.load() already reads JSON; ai_editor section
      is loaded as part of the same file
    steps:
    - add AiEditorConfig dataclass to ai_editor/config/config_section.py
    - add ai_editor field to SimpleConfigModel (done by extending adapter model or
      via plugin pattern)
    - add AiEditorConfigGenerator to ai_editor/config/config_generator.py (extends
      SimpleConfigGenerator pattern)
    - add AiEditorConfigValidator to ai_editor/config/config_validator.py (extends
      BaseValidator)
  config_file_location: same config.json used by mcp_proxy_adapter; ai_editor adds
    its own top-level section
  format: JSON (same as mcp_proxy_adapter)
  no_separate_file: ai_editor does NOT use a separate ai_editor/config/editor.json;
    it extends the adapter config
  owned_files:
  - ai_editor/config/config_section.py
  - ai_editor/config/config_generator.py
  - ai_editor/config/config_validator.py
  - ai_editor/config/__init__.py
  ai_editor_section_schema:
    section_key: ai_editor
    fields:
      formatter:
        small_file_threshold:
          default: 1k
          description: Files smaller than this threshold use text formatter without
            structural parse
          type: string
          units: bare integer = chars; k = thousands; m = millions; 0 = disabled
        small_file_formatter:
          default: text
          description: Formatter to use for files below threshold
          type: string
      sessions:
        base_dir:
          default: .ai_editor_sessions
          description: Base directory for session directories. Resolved relative to
            project root if not absolute.
          type: string
          note: This config key is read by G-015 session layer. Defined here because
            G-009 owns config_section.py and the ai_editor config schema.
    example_config_snippet:
      ai_editor:
        formatter:
          small_file_threshold: 1k
          small_file_formatter: text
        sessions:
          base_dir: .ai_editor_sessions
    rationale: target deployment has 128GB RAM; RAM is not a constraint. The real
      constraint is VRAM (GPU memory for language models). Large files sent in full
      consume excessive tokens in the model context window. The small_file_threshold
      determines when it is reasonable to use text formatter directly instead of building
      a structural tree; for small files the full content fits in model context without
      skeleton or CST overhead. For larger files, the structural formatter and skeleton
      view reduce VRAM pressure by giving the model only the declarative structure.
      Default 1k is a conservative lower bound; files under 1k are trivially small
      for both model context and structural parsing.
file_edit_lock_policy:
  acquire_on_open: 'When editor core opens a file (buffer.open): 1. Query files table:
    SELECT editing_pid FROM files WHERE project_id = ? AND path = ? LIMIT 1. 2. If
    editing_pid IS NOT NULL and editing_lock_holder_is_alive(editing_pid) is True
    -> return error BUFFER_LOCKED with holder pid. Do NOT open buffer. 3. If editing_pid
    IS NULL or holder is dead (stale lock): UPDATE files SET editing_pid = os.getpid()
    WHERE path = ? AND project_id = ? AND (editing_pid IS NULL OR editing_pid = <dead_pid>).
    If 0 rows affected -> race condition, return BUFFER_LOCKED. 4. Lock acquired:
    proceed with parse, return buffer_id.'
  code_reference: 'Adapt from code_analysis/core/database/file_edit_lock.py: try_acquire_file_edit_lock,
    release_file_edit_lock, editing_lock_holder_is_alive. Logic is already implemented
    and tested in the server codebase.'
  db_column: files table has editing_pid INTEGER NULL and session_key VARCHAR NULL
    columns. Both set atomically on open, both released on close. Lock acquired via
    UPDATE files SET editing_pid = os.getpid(), session_key = <session_key> WHERE
    path = ? AND (editing_pid IS NULL OR editing_pid = <dead_pid>). 0 rows affected
    -> BUFFER_LOCKED. Released via UPDATE files SET editing_pid = NULL, session_key
    = NULL WHERE editing_pid = os.getpid() AND session_key = <session_key> in finally
    block.
  error_code: 'BUFFER_LOCKED (add to ErrorCode in G-001 T-004 if not already present).
    Message: ''File is locked by process {pid}. Another editor has this file open.'''
  purpose: Prevent concurrent writes to the same file by different editor processes.
    Reuses the same mechanism used by the code_analysis server to coordinate between
    file watcher, indexer, vectorizer, and CST write operations.
  release_on_close: 'When buffer.close() is called: UPDATE files SET editing_pid =
    NULL WHERE path = ? AND project_id = ? AND editing_pid = os.getpid(). Called in
    finally block to guarantee release even on error. Safe if already NULL (no-op).'
  stale_lock_handling: 'editing_lock_holder_is_alive(pid) uses os.kill(pid, 0): ProcessLookupError
    -> dead, PermissionError -> alive, OSError with ESRCH -> dead. Stale locks are
    cleared atomically before re-acquire using conditional UPDATE.'
  worker_behavior: File watcher, indexer, and vectorizer in code_analysis server already
    check editing_lock_holder_is_alive(row.editing_pid) and skip locked files. Editor
    lock is therefore automatically respected by the entire server ecosystem.
  write_path_lock: 'save and save_as must verify lock is still held by current process
    before writing: SELECT editing_pid FROM files WHERE path = ? → must equal os.getpid().
    If not (e.g. process crash and restart) → return BUFFER_STALE.'
