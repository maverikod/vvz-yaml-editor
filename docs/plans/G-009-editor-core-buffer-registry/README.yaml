format: global_package_step_v2
plan_id: yaml_editor_pip_package_for_mcp
step_id: G-009
step_name: editor_core_buffer_registry
title: Editor core and buffer registry subsystem
status: draft
source_plan: docs/plans/create_pip_package_for_mcp.yaml
source_documents:
- docs/tech_spec.md
global_intent: 'Own the format-independent editor core: dynamic buffer registry, file-backed
  and unsaved buffers, dirty/revision/hash state, open/save/save_as/close lifecycle,
  and editor-level copy/cut/paste orchestration. This subsystem must not contain YAML
  path logic or text range logic; it delegates format-specific behavior to buffer
  formatter backends.'
why_this_block_exists: 'The technical specification now separates the editor object
  from YAML. The editor must feel like a normal editor for users and models: open,
  save, save_as, close, copy, cut, paste. YAML is only one formatter attached to a
  buffer, not the editor core itself.'
owned_code_paths:
- yaml_editor/editor_core/
- tests/editor_core/
owned_docs_paths:
- docs/editor_core.md
forbidden_code_paths:
- yaml_editor/formatters/yaml/
- yaml_editor/formatters/text/
- yaml_editor/path_language/
- yaml_editor/mutations/
- yaml_editor/validation/
- yaml_editor/transaction_writer/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - G-010 formatter backends public contracts
  may_be_used_by:
  - G-008 public interfaces and CLI adapter
  - external MCP wrappers
public_contracts_provided:
- editor buffer registry
- editor buffer lifecycle API
- format-independent copy/cut/paste orchestration
- editor-level dirty/stale/unsaved state model
core_commands:
  buffer_level:
  - open
  - save
  - save_as
  - close
  node_or_fragment_level:
  - copy
  - cut
  - paste
buffer_model:
  file_backed_buffer:
    required_fields:
    - buffer_id
    - file_path
    - formatter
    - original_hash
    - current_hash
    - dirty
    - revision
    - status
  unsaved_buffer:
    required_fields:
    - buffer_id
    - file_path: null
    - display_name
    - formatter
    - original_hash: null
    - current_hash
    - dirty: true
    - revision
    - status
  invariants:
  - One file_path must not have two open buffers.
  - Reopening an already open file returns the existing buffer_id.
  - Copy does not change any buffer.
  - Cut changes the source buffer and sets dirty=true.
  - Paste changes the target buffer and sets dirty=true.
  - Save and save_as are the only editor operations that write files.
  - Save rejects stale file-backed buffers when disk_hash differs from original_hash.
clipboard_policy:
  purpose: Store copied or cut fragments as formatter-aware snapshots that can be
    pasted only when the source formatter and target formatter are compatible.
  required_fields:
  - item_id
  - source_buffer_id
  - source_formatter
  - payload_kind
  - payload
  - source_path
  - source_revision
  compatibility_rules:
  - text -> text paste is allowed.
  - yaml -> yaml paste is allowed.
  - yaml -> text paste is allowed only as rendered text when explicitly requested.
  - text -> yaml paste is rejected by default unless explicit parse_as_yaml mode is
    requested.
  - Incompatible paste returns CLIPBOARD_FORMAT_MISMATCH.
responsibilities:
- Implement buffer registry and buffer identity rules.
- Implement file-backed and unsaved buffer lifecycle.
- Implement dirty, revision, hash, stale, and invalid state transitions.
- Implement editor-level open, save, save_as, close, copy, cut, and paste semantics.
- Delegate parse/render/validate/path/copy_fragment/cut_fragment/paste_fragment to
  formatter backends.
- Keep public model-facing commands small and familiar.
verification:
  scope: global_completion_gate
  commands:
  - python -m pytest tests/editor_core
  expected:
  - Opening the same file twice returns the same buffer_id.
  - New unsaved buffers are dirty and have no file_path until save_as.
  - Copy does not mark buffers dirty.
  - Cut and paste mark the correct buffers dirty.
  - Save/save_as delegate validation and rendering to the attached formatter.
  - Stale file-backed buffers are rejected before disk write.
acceptance_criteria:
- Editor core has no YAML-specific path or mutation logic.
- Every buffer has exactly one formatter.
- Buffer registry enforces one open buffer per file_path.
- Save/save_as are the only operations that write files.
- Clipboard items record source formatter and enforce compatibility on paste.
- The model-facing editor API is limited to open, save, save_as, close, copy, cut,
  and paste for normal workflows.
model_assignment_spec:
  performer: coding_agent
  instruction: Implement only the format-independent editor core under yaml_editor/editor_core
    and tests/editor_core. Provide buffer registry, file-backed and unsaved buffer
    lifecycle, dirty/revision/hash state, open/save/save_as/close, and copy/cut/paste
    orchestration that delegates all format-specific behavior to formatter backends.
    Do not implement YAML path logic, text range internals, formatter parsing, CLI,
    MCP wrappers, .venv, venv, site-packages, or installed dependencies.
observations_template:
- command: ''
  expected: ''
  actual: ''
  error: ''
  root_cause: ''
  fix: ''
  post_fix_verification: ''
  status: ''
