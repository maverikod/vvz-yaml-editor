format: global_package_step_v2
plan_id: ai_editor_pip_package_for_mcp
step_id: G-009
step_name: editor_core_buffer_registry
title: AbstractBuffer, editor core, and buffer registry subsystem
status: draft
source_plan: docs/plans/create_pip_package_for_mcp.yaml
source_documents:
- docs/tech_spec.md
global_intent: 'Own AbstractBuffer and the format-independent editor core: dynamic
  buffer registry, file-backed and unsaved buffers, dirty/revision/hash state, open/new/save/save_as/close/reload
  lifecycle, stale checks, and atomic persistence orchestration. This subsystem must
  not know YAML paths, text line ranges, search query semantics, or formatter internals.'
why_this_block_exists: The technical specification separates file/buffer lifecycle
  from formatter editing and universal search. File open/save/close behavior is not
  a formatter responsibility. The editor core must provide familiar user/model commands
  while delegating all address, fragment, validation, and unit semantics to the attached
  formatter and search layer.
owned_code_paths:
- ai_editor/editor_core/
- tests/editor_core/
owned_docs_paths:
- docs/editor_core.md
forbidden_code_paths:
- ai_editor/formatters/
- ai_editor/search/
- ai_editor/path_language/
- ai_editor/mutations/
- ai_editor/validation/
- ai_editor/transaction_writer/
- ai_editor/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - G-010 formatter backends public contracts
  may_be_used_by:
  - G-011 universal search layer
  - G-008 public interfaces and CLI adapter
  - external MCP wrappers
public_contracts_provided:
- AbstractBuffer
- editor buffer registry
- file-backed and unsaved buffer lifecycle
- checked save/save_as orchestration
- format-independent copy/cut/paste orchestration over BufferAddress
abstract_buffer_contract:
  methods:
  - open(file_path, formatter=auto, open_as_text=False) -> buffer_id
  - new(formatter, display_name=New file) -> buffer_id
  - save(buffer_id)
  - save_as(buffer_id, file_path, overwrite=false)
  - close(buffer_id, save=false|true|error_if_dirty)
  - reload(buffer_id)
  - get_state(buffer_id)
  - get_formatter(buffer_id)
  - validate(buffer_id) -> ValidationResult
  responsibilities:
  - Own file_path binding and one-open-buffer-per-file rule.
  - Own unsaved/New file buffers.
  - Own original_hash, current_hash, dirty, revision, and status.
  - Own stale disk checks before save/save_as.
  - Own backup and atomic write orchestration through persistence helpers.
  - Own formatter fallback from structural formatter to text formatter on parse failure.
  - Own open_as_text option that bypasses formatter auto-detection and forces text
    formatter.
  - Own pre-save validation by calling formatter.validate_document(document) before
    render and write.
  - Delegate parse/render to the buffer formatter.
  - Delegate address interpretation and fragment editing to the buffer formatter.
  - Delegate search/query behavior to AbstractSearch.
buffer_model:
  file_backed_buffer:
    required_fields:
    - buffer_id
    - file_path
    - formatter
    - document
    - original_hash
    - current_hash
    - dirty
    - revision
    - status
  unsaved_buffer:
    required_fields:
    - buffer_id
    - file_path: null
    - display_name
    - formatter
    - document
    - original_hash: null
    - current_hash
    - dirty: true
    - revision
    - status
  invariants:
  - One file_path must not have two open buffers.
  - Reopening an already open file returns the existing buffer_id.
  - Formatter is stored on the buffer and determines address semantics.
  - Copy does not change any buffer.
  - Cut changes the source buffer and sets dirty=true.
  - Paste changes the target buffer and sets dirty=true.
  - Save and save_as are the only editor operations that write files.
  - Save rejects stale file-backed buffers when disk_hash differs from original_hash.
buffer_address_contract:
  required_fields:
  - buffer_id
  - address
  rules:
  - address is opaque to editor core.
  - address is interpreted only by the buffer formatter.
  - copy and cut require source BufferAddress.
  - paste requires target BufferAddress.
copy_cut_paste_orchestration:
  copy:
    required_input:
      source: BufferAddress
    behavior:
    - Resolve source buffer.
    - Ask source formatter to copy_fragment(document, source.address).
    - Store formatter-aware clipboard item without changing buffer dirty state.
  cut:
    required_input:
      source: BufferAddress
    behavior:
    - Resolve source buffer.
    - Ask source formatter to cut_fragment(document, source.address).
    - Store formatter-aware clipboard item.
    - Replace buffer document with returned document and set dirty=true.
  paste:
    required_input:
      target: BufferAddress
      mode: formatter-specific string
    behavior:
    - Resolve target buffer.
    - Check clipboard item source_formatter against target formatter compatibility.
    - Ask target formatter to paste_fragment(document, target.address, fragment, mode).
    - Replace buffer document with returned document and set dirty=true.
verification:
  scope: global_completion_gate
  commands:
  - python -m pytest tests/editor_core
  expected:
  - Opening the same file twice returns the same buffer_id.
  - New unsaved buffers are dirty and have no file_path until save_as.
  - Copy does not mark buffers dirty.
  - Cut and paste mark the correct buffers dirty.
  - Save/save_as delegate validation and rendering to the attached formatter.
  - Stale file-backed buffers are rejected before disk write.
  - Editor core never parses YAML addresses or text line ranges directly.
acceptance_criteria:
- AbstractBuffer owns file/buffer lifecycle and does not implement formatter semantics.
- Editor core has no YAML-specific path, text range, or search query logic.
- Every buffer has exactly one formatter.
- Buffer registry enforces one open buffer per file_path.
- Save/save_as are the only operations that write files.
- Copy/cut require source BufferAddress and paste requires target BufferAddress.
- Search behavior is delegated to G-011, not implemented inside buffer lifecycle.
model_assignment_spec:
  performer: coding_agent
  instruction: Implement only AbstractBuffer and the format-independent editor core
    under ai_editor/editor_core and tests/editor_core. Provide buffer registry, file-backed
    and unsaved buffer lifecycle, dirty/revision/hash state, open/new/save/save_as/close/reload,
    and copy/cut/paste orchestration over BufferAddress. Do not implement YAML path
    logic, text range internals, formatter parsing, search/query semantics, CLI, MCP
    wrappers, .venv, venv, site-packages, or installed dependencies.
observations_template:
- command: ''
  expected: ''
  actual: ''
  error: ''
  root_cause: ''
  fix: ''
  post_fix_verification: ''
  status: ''
formatter_fallback_policy:
  trigger: formatter.parse(raw_content) raises an exception (FORMAT_VALIDATION_FAILED,
    CST_PARSE_FAILED, YAML_PARSE_FAILED, or any unhandled parse error)
  open_as_text_option:
    param: open_as_text=True on buffer.open
    behavior: bypass formatter auto-detection entirely; always use text formatter
      regardless of file extension
    use_cases:
    - user explicitly wants raw text editing of a structured file
    - recover from a damaged file that no structural formatter can parse
    - inspect file content without structural interpretation
  auto_fallback_on_parse_error:
    behavior: when formatter.parse raises and open_as_text is False, editor core catches
      the exception, emits FORMAT_VALIDATION_FAILED diagnostic, and reopens the file
      using text formatter
    invariants:
    - 'fallback is transparent to the caller: buffer_id is returned normally'
    - buffer status field is set to format_fallback to signal that text formatter
      was used instead of auto-detected formatter
    - original formatter name is stored in buffer state for diagnostics
    - fallback does not occur when open_as_text=True because text formatter was explicitly
      requested
  no_fallback_cases:
  - 'formatter raised on a file that was previously successfully opened with that
    formatter and is now structurally corrupt: fallback still applies but buffer status
    is format_fallback_on_corrupt'
  - 'formatter=explicit (caller named a specific formatter): no fallback; return FORMAT_VALIDATION_FAILED
    error without opening buffer'
