plan_id: ai_editor_pip_package_for_mcp
step_id: G-009
step_name: editor_core_buffer_registry
title: AbstractBuffer, editor core, and buffer registry subsystem
status: draft
source_plan: docs/plans/create_pip_package_for_mcp.yaml
source_documents:
- docs/tech_spec.md
- docs/metadatastd.md
global_intent: 'Own AbstractBuffer and the format-independent editor core: dynamic
  buffer registry, file-backed and unsaved buffers, dirty/revision/hash state, open/new/save/save_as/close/reload
  lifecycle, stale checks, and atomic persistence orchestration. This subsystem must
  not know YAML paths, text line ranges, search query semantics, or formatter internals.'
why_this_block_exists: The technical specification separates file/buffer lifecycle
  from formatter editing and universal search. File open/save/close behavior is not
  a formatter responsibility. The editor core must provide familiar user/model commands
  while delegating all address, fragment, validation, and unit semantics to the attached
  formatter and search layer.
owned_code_paths:
- ai_editor/editor_core/
- ai_editor/config/config_section.py
- ai_editor/config/config_generator.py
- ai_editor/config/config_validator.py
- ai_editor/config/__init__.py
- tests/editor_core/
owned_docs_paths:
- docs/editor_core.md
forbidden_code_paths:
- ai_editor/formatters/
- ai_editor/search/
- ai_editor/sessions/
- ai_editor/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_be_used_by:
  - G-015 session layer (aggregates AbstractBuffer instances per session)
  - G-011 universal search layer
  - G-008 public API (ai_editor/api.py, ai_editor/interfaces/cli.py — owned by G-008/G-009
    integration step)
  may_depend_on:
  - G-010 formatter backends public contracts
  - mcp_proxy_adapter SimpleConfig/SimpleConfigModel/BaseValidator for config integration
public_contracts_provided:
- AbstractBuffer — class with methods listed in /abstract_buffer_contract/methods.
  Owns file-backed and unsaved buffer lifecycle. Does not know YAML paths or text
  line ranges.
- BufferRegistry — maps (session_key, file_path) -> buffer_id. Enforces one open buffer
  per file per session.
- 'BufferState — the result of get_state(): filename, relative_path, formatter, modified,
  readonly, buffer_status (normal | small_file | format_fallback).'
- 'BufferAddress — dataclass: buffer_id (str), address (Any). address is opaque to
  editor core; interpreted only by the formatter.'
- Checked save/save_as orchestration — validate -> render -> stale-check -> write_result
  via writer.py.
- Format-independent copy/cut/paste orchestration over BufferAddress — delegates fragment
  operations to formatter.
abstract_buffer_contract:
  methods:
  - open(session_key, file_path, formatter=auto, open_as_text=False, readonly=False)
    -> buffer_id
  - new(session_key, formatter, display_name=New file) -> buffer_id
  - save(session_key, buffer_id)
  - save_as(session_key, buffer_id, file_path, overwrite=false)
  - close(session_key, buffer_id, save=false|true|error_if_dirty)
  - reload(session_key, buffer_id)
  - get_state(session_key, buffer_id)
  - get_formatter(session_key, buffer_id)
  - validate(session_key, buffer_id) -> ValidationResult
  - write_all(session_key, force=False) -> WriteAllResult
  responsibilities:
  - session_key is required for every buffer operation. AbstractBuffer does not work
    without a session.
  - Own file_path binding and one-open-buffer-per-file-per-session rule.
  - Own unsaved/New file buffers.
  - Own filename, relative_path, formatter, modified, readonly buffer fields.
  - Own stale disk checks before save/save_as.
  - Own backup and atomic write orchestration through persistence helpers.
  - Own formatter fallback from structural formatter to text formatter on parse failure.
  - Own open_as_text option that bypasses formatter auto-detection and forces text
    formatter.
  - 'Own file edit lock: on open acquire editing_pid + session_key in files table;
    on close release both. Return BUFFER_LOCKED if another live process/session holds
    the lock.'
  - Delegate parse/render to the buffer formatter.
  - Delegate address interpretation and fragment editing to the buffer formatter.
  - Delegate search/query behavior to AbstractSearch.
  - Delegate write orchestration to formatter.write() which uses ai_editor/writer.py.
buffer_model:
  buffer_fields:
    filename: Bare file name without path (e.g. README.yaml). Set at open time, never
      changes.
    formatter: Formatter name assigned at open time. Never changes.
    modified: Boolean. True if any mutation applied since open or last save. Always
      False when readonly=True.
    readonly: 'Boolean. Set at open time, never changes. If True: mutations rejected,
      .buf not written, no write-lock, modified always False.'
    relative_path: Path relative to project root. Null for new unsaved buffers. Set
      at open time, never changes.
  note: AbstractBuffer accepts session_key as a parameter in every method but does
    not own session file structure (.buf, .cst, session git). Those belong to G-015.
    Editor core uses session_key for file edit lock (files.session_key column) and
    for routing buffers within a session.
buffer_address_contract:
  required_fields:
  - buffer_id
  - address
  rules:
  - address is opaque to editor core.
  - address is interpreted only by the buffer formatter.
  - copy and cut require source BufferAddress.
  - paste requires target BufferAddress.
copy_cut_paste_orchestration:
  copy:
    required_input:
      source: BufferAddress
    behavior:
    - Resolve source buffer.
    - Ask source formatter to copy_fragment(document, source.address).
    - Store formatter-aware clipboard item without changing buffer dirty state.
  cut:
    required_input:
      source: BufferAddress
    behavior:
    - Resolve source buffer.
    - Ask source formatter to cut_fragment(document, source.address).
    - Store formatter-aware clipboard item.
    - Replace buffer document with returned document and set dirty=true.
  paste:
    required_input:
      target: BufferAddress
      mode: formatter-specific string
    behavior:
    - Resolve target buffer.
    - Check clipboard item source_formatter against target formatter compatibility.
    - Ask target formatter to paste_fragment(document, target.address, fragment, mode).
    - Replace buffer document with returned document and set dirty=true.
verification:
  scope: global_completion_gate
  commands:
  - python -m pytest tests/editor_core
  expected:
  - open(session_key, file_path) acquires editing_pid + session_key lock in files
    table.
  - Opening the same file in two sessions readwrite returns BUFFER_LOCKED on second.
  - open with readonly=True sets buffer.readonly=True; mutations return BUFFER_READONLY.
  - New unsaved buffers are modified=False and have relative_path=null until save_as.
  - Copy does not mark buffers modified.
  - Cut and paste mark the correct buffers modified.
  - save/save_as call formatter.validate_document before render and abort on failure.
  - Stale file-backed buffers are rejected before disk write.
  - Editor core never parses YAML addresses or text line ranges directly.
  - validate(session_key, buffer_id) returns ValidationResult without writing file
    or changing modified.
  - Config loaded from mcp_proxy_adapter config.json ai_editor section; missing section
    or key uses defaults.
  - close() releases editing_pid and session_key lock in finally block.
  - write_all(session_key, force=False) writes only modified non-readonly buffers.
  - write_all returns written_buffers, failed_buffers, skipped_buffers.
acceptance_criteria:
- AbstractBuffer owns file/buffer lifecycle and does not implement formatter semantics.
- Editor core has no YAML-specific path, text range, or search query logic.
- Every buffer has exactly one active formatter.
- Buffer registry enforces one open buffer per file_path.
- Save/save_as are the only operations that write files.
- Copy/cut require source BufferAddress and paste requires target BufferAddress.
- Search behavior is delegated to G-011, not implemented inside buffer lifecycle.
- 'open(file_path, formatter=auto, open_as_text=False): open_as_text=True forces text
  formatter unconditionally without threshold check.'
- When formatter=auto and len(raw_content) < threshold from config, text formatter
  is used without structural parse; buffer status is small_file.
- Parse exception from structural formatter triggers automatic fallback to text formatter;
  buffer status is format_fallback.
- validate(buffer_id) exposes in-buffer structure check without writing files.
- save and save_as call validate as first pipeline stage and abort on failure.
- Config is read from mcp_proxy_adapter config.json ai_editor section; missing section
  or key uses defaults.
- 'Threshold units: bare integer = characters; k suffix = thousands; m suffix = millions;
  0 = disabled.'
- 'Precedence: open_as_text=True (unconditional) > small_file_threshold > parse_error_fallback
  > structural auto-detect.'
- ai_editor owns config_section.py, config_generator.py, config_validator.py; does
  NOT own a separate config.json file.
- open() acquires files.editing_pid lock before parse. BUFFER_LOCKED returned if live
  process holds lock.
- close() releases editing_pid in finally block. Guaranteed even on exception.
- save/save_as verify editing_pid = os.getpid() before write. BUFFER_STALE if mismatch.
- Stale locks (dead process PID) are cleared atomically and re-acquired. editing_lock_holder_is_alive()
  used for liveness check (os.kill(pid, 0)).
model_assignment_spec:
  performer: coding_agent
  instruction: 'Implement only AbstractBuffer and the format-independent editor core
    under ai_editor/editor_core/ and tests/editor_core/. Config is loaded from the
    mcp_proxy_adapter config.json ai_editor section via AiEditorConfig dataclass (ai_editor/config/config_section.py);
    missing section or key uses defaults. Config key formatter.small_file_threshold
    defaults to 1k; parse value as: bare integer = characters, k suffix = thousands,
    m suffix = millions, 0 = disabled. open(file_path, formatter=auto, open_as_text=False)
    selection precedence: (1) open_as_text=True -> always text formatter unconditionally,
    no threshold check; (2) formatter=auto and len(raw_content) < threshold -> text
    formatter, buffer status small_file; (3) formatter=auto and structural formatter
    raises on parse -> fallback to text formatter, buffer status format_fallback;
    (4) structural formatter auto-detected by extension. formatter=explicit: no threshold
    check, no fallback; return FORMAT_VALIDATION_FAILED on parse error. FILE EDIT
    LOCK: on open(), before parse: check files.editing_pid via SELECT; if editing_lock_holder_is_alive(pid)
    -> return BUFFER_LOCKED, do not create buffer; if stale (dead pid) clear atomically
    then acquire; acquire via UPDATE files SET editing_pid = os.getpid() WHERE (editing_pid
    IS NULL OR editing_pid = <dead>); 0 affected rows -> BUFFER_LOCKED. on close():
    UPDATE files SET editing_pid = NULL WHERE editing_pid = os.getpid() in finally
    block. save/save_as: verify editing_pid = os.getpid() before write; mismatch ->
    BUFFER_STALE. Adapt logic from code_analysis/core/database/file_edit_lock.py (editing_lock_holder_is_alive,
    try_acquire_file_edit_lock, release_file_edit_lock). validate(buffer_id) calls
    formatter.validate_document(document) and returns ValidationResult without writing
    files; save and save_as call validate as the first pipeline stage and abort when
    success=false. Provide buffer registry, file-backed and unsaved buffer lifecycle,
    dirty/revision/hash state, open/new/save/save_as/close/reload, copy/cut/paste
    orchestration over BufferAddress. Config classes (AiEditorConfig, AiEditorConfigGenerator,
    AiEditorConfigValidator) must extend mcp_proxy_adapter SimpleConfig/SimpleConfigGenerator/BaseValidator;
    do not create a separate config file. Commands exposed through mcp_proxy_adapter
    must follow docs/metadatastd.md: each command in ai_editor/commands/ has _command.py,
    _schema.py, _metadata.py; registered via ai_editor/hooks_register.py using reg.register(...,
    ''custom''). Do not implement YAML path logic, text range internals, formatter
    parsing internals, search/query semantics, CLI, MCP wrappers, .venv, venv, site-packages,
    or installed dependencies.'
