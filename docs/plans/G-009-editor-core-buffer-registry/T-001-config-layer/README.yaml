format: tactical_step_v2
plan_id: ai_editor_pip_package_for_mcp
parent_step_id: G-009
parent_step_name: editor_core_buffer_registry
step_id: G-009/T-001
step_name: config_layer
title: AiEditorConfig dataclass and config integration with mcp_proxy_adapter
status: draft
source_plan: docs/plans/create_pip_package_for_mcp.yaml
source_documents:
- docs/tech_spec.md
- docs/plans/G-009-editor-core-buffer-registry/README.yaml
parent_global_context: 'G-009 owns the format-independent editor core: AbstractBuffer,
  BufferRegistry, buffer lifecycle, formatter fallback policy, file edit lock, save/validate
  pipeline, copy/cut/paste orchestration, and config integration. The config layer
  (T-001) is the foundation that all other G-009 tactical steps depend on because
  it defines AiEditorConfig and the ai_editor section in the shared mcp_proxy_adapter
  config.json.

  '
intent: 'Implement the AiEditorConfig dataclass and integrate it as the ai_editor
  section in the mcp_proxy_adapter config.json. Provide AiEditorConfigGenerator and
  AiEditorConfigValidator following the mcp_proxy_adapter SimpleConfig/SimpleConfigGenerator/
  BaseValidator pattern. Define the formatter.small_file_threshold and sessions.base_dir
  config keys with their defaults and parsing rules.

  '
why_this_step_exists: 'All other G-009 tactical steps need to read small_file_threshold
  to determine formatter selection and sessions.base_dir (used by G-015). The config
  integration must exist and be tested before any buffer lifecycle code can use it.
  Isolating the config layer here prevents other T steps from reimplementing config
  loading independently.

  '
owned_code_paths:
- ai_editor/config/config_section.py
- ai_editor/config/config_generator.py
- ai_editor/config/config_validator.py
- ai_editor/config/__init__.py
- tests/editor_core/test_config.py
owned_docs_paths: []
forbidden_paths:
- ai_editor/editor_core/
- ai_editor/formatters/
- ai_editor/search/
- ai_editor/sessions/
- ai_editor/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  consumes_from:
  - mcp_proxy_adapter SimpleConfig / SimpleConfigModel / SimpleConfigGenerator / BaseValidator
  provides_to:
  - G-009/T-002 (AbstractBuffer uses AiEditorConfig)
  - G-009/T-003 (open() reads small_file_threshold)
  - G-015 session layer (reads sessions.base_dir)
public_contracts_provided:
- 'AiEditorConfig — dataclass in ai_editor/config/config_section.py with fields: formatter.small_file_threshold
  (str, default ''1k''), formatter.small_file_formatter (str, default ''text''), sessions.base_dir
  (str, default ''.ai_editor_sessions'').

  '
- 'AiEditorConfigGenerator — extends mcp_proxy_adapter SimpleConfigGenerator; generates
  default ai_editor section in config.json.

  '
- 'AiEditorConfigValidator — extends mcp_proxy_adapter BaseValidator; validates ai_editor
  section keys and values.

  '
- 'parse_threshold(value: str) -> int — converts threshold string to bytes: bare integer
  = characters, k suffix = thousands, m suffix = millions, 0 = disabled (returns 0).
  Raises ValueError on unrecognised suffix.

  '
implementation_notes: "1. ai_editor/config/config_section.py: define AiEditorConfig\
  \ as a dataclass or Pydantic\n   model following the pattern used by other adapter\
  \ sections (e.g. auth, queue_manager).\n   Add ai_editor field to the shared SimpleConfigModel\
  \ by extending or patching it per\n   the pattern used in the existing codebase.\
  \ The field must be Optional with default\n   factory returning AiEditorConfig().\n\
  2. parse_threshold is a pure utility function; put it in config_section.py and export\n\
  \   from ai_editor/config/__init__.py.\n3. ai_editor does NOT create a separate\
  \ config.json. It adds its section to the adapter\n   config.json that already exists.\n\
  4. If mcp_proxy_adapter does not support a plugin pattern, the ai_editor section\
  \ may\n   be injected by monkey-patching SimpleConfigModel before the adapter server\
  \ starts,\n   following whatever pattern the existing codebase uses for custom sections.\n\
  5. Missing section or key uses default value — never raises.\n"
verification:
  commands:
  - python -m pytest tests/editor_core/test_config.py -v
  expected:
  - AiEditorConfig loaded from config.json with ai_editor section returns correct
    values.
  - Missing ai_editor section returns all defaults without raising.
  - Missing individual key returns its default without raising.
  - parse_threshold('1k') == 1000.
  - parse_threshold('2m') == 2000000.
  - parse_threshold('512') == 512.
  - parse_threshold('0') == 0.
  - parse_threshold('bad') raises ValueError.
  - AiEditorConfigValidator accepts valid section and rejects invalid types.
acceptance_criteria:
- AiEditorConfig dataclass defines all config keys with correct defaults.
- parse_threshold correctly converts bare integer, k, and m suffix strings.
- Missing section or key never raises — defaults are always returned.
- AiEditorConfigGenerator and AiEditorConfigValidator follow mcp_proxy_adapter patterns.
- ai_editor does not own a separate config file.
- All exported symbols are importable from ai_editor.config.
model_assignment_spec:
  performer: coding_agent
  title: Implement AiEditorConfig and config integration for ai_editor
  owned_paths:
  - ai_editor/config/config_section.py
  - ai_editor/config/config_generator.py
  - ai_editor/config/config_validator.py
  - ai_editor/config/__init__.py
  - tests/editor_core/test_config.py
  forbidden_paths:
  - ai_editor/editor_core/
  - ai_editor/formatters/
  - ai_editor/sessions/
  - .venv
  - venv
  - site-packages
  instruction: 'Implement AiEditorConfig as a dataclass with fields: formatter.small_file_threshold
    (default ''1k''), formatter.small_file_formatter (default ''text''), sessions.base_dir
    (default ''.ai_editor_sessions''). Implement parse_threshold(value: str) -> int:
    bare integer = characters, k suffix = *1000, m suffix = *1000000, 0 = disabled.
    Implement AiEditorConfigGenerator and AiEditorConfigValidator extending the mcp_proxy_adapter
    SimpleConfigGenerator and BaseValidator patterns respectively. Integrate ai_editor
    section into SimpleConfigModel without creating a separate config file. Missing
    section or key must return defaults, never raise. Export AiEditorConfig and parse_threshold
    from ai_editor/config/__init__.py. Write tests in tests/editor_core/test_config.py
    covering all acceptance criteria. Do not implement buffer lifecycle, formatter
    internals, or session logic.

    '
  non_goals:
  - AbstractBuffer or BufferRegistry
  - formatter parsing or rendering
  - session directory management
  - file edit locks
