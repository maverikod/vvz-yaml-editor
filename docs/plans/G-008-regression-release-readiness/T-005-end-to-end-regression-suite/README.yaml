format: tactical_step_v1
parent_step_id: G-008
parent_step_name: interfaces_release
tactical_step_id: T-005
tactical_step_name: end_to_end_regression_suite
title: End-to-end regression suite and observations
status: draft
source_documents:
- docs/tech_spec.md
- docs/plans/create_pip_package_for_mcp.yaml
- docs/plans/G-008-regression-release-readiness/README.yaml
intent: Own end-to-end regression planning across public interfaces and integration
  tests. This tactical step verifies read, validation, dry-run write, real checked
  write, validation failure, dedupe behavior, CLI behavior, and separate read-back
  verification while routing internal failures to their owning subsystem instead of
  patching internals here.
self_contained_context:
  global_goal: G-008 owns public interfaces, integration checks, and release readiness
    without owning internal parser, path, mutation, validation, or writer logic.
  regression_requirements:
  - Test successful read operations against real fixtures.
  - Test failed read operations with invalid YAML, missing path, and ambiguous path.
  - Test dry-run write and verify no file change.
  - Test real checked write and verify result through separate read API.
  - Test validation failure leaves file unchanged.
  - Test append with dedupe=true is idempotent.
  - Test CLI commands use the same public API behavior.
  - Test wheel build and installed import in a separate release-readiness step.
  boundaries:
  - Regression tests may call multiple public subsystems through public APIs.
  - Production logic must stay in owned interfaces paths.
  - Do not patch internal subsystem code from this step.
owned_code_paths: []
owned_test_paths:
- tests/integration/test_end_to_end_regression.py
owned_docs_paths:
- docs/regression_observations.md
forbidden_paths:
- pyproject.toml
- README.md
- yaml_editor/contracts/
- yaml_editor/document_io/
- yaml_editor/path_language/
- yaml_editor/reader/
- yaml_editor/mutations/
- yaml_editor/validation/
- yaml_editor/transaction_writer/
- yaml_editor/interfaces/public_api.py
- yaml_editor/interfaces/cli.py
- tests/document_io/
- tests/path_language/
- tests/reader/
- tests/mutations/
- tests/validation/
- tests/transaction_writer/
- tests/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - G-008/T-001 public API boundary
  - G-008/T-002 CLI adapter
  may_be_used_by:
  - G-008 release checklist
public_contracts_provided:
- tests/integration/test_end_to_end_regression.py
- docs/regression_observations.md
regression_policy:
  real_write_safety:
  - Use only temporary fixtures or test-owned files.
  - Every real write must be verified by a separate read API call.
  - Failed validation or failed mutation must leave original file byte-for-byte unchanged.
  failure_routing:
  - If a public API regression reveals an internal parser, mutation, validation, or
    writer defect, document the owning global step.
  - Do not patch internal subsystem files here.
responsibilities:
- Define end-to-end regression coverage through public interfaces.
- Record actual command outcomes in regression observations during implementation.
- Preserve safety rules for real writes and destructive tests.
verification:
  scope: tactical_completion_gate
  commands:
  - python -m pytest tests/integration/test_end_to_end_regression.py
  expected:
  - Read, validation, dry-run, real write, validation failure, dedupe, and CLI integration
    scenarios are covered.
  - Real write scenarios use separate read-back verification.
  - Failures are documented with owning subsystem routing.
acceptance_criteria:
- Regression coverage is end-to-end through public interfaces only.
- Observations record commands, expected, actual, error, root cause, fix routing,
  post-fix verification, and status.
- This step edits only its owned docs and test paths during implementation.
model_assignment_spec:
  performer: qa_agent
  instruction: Work only on tests/integration/test_end_to_end_regression.py and docs/regression_observations.md.
    Add end-to-end regression coverage through public interfaces for read, validation,
    dry-run write, real checked write with separate read-back verification, validation
    failure no-change, append dedupe, and CLI behavior. Do not patch parser, path,
    mutation, validation, transaction writer, public API, or CLI internals. Route
    failures to the owning subsystem in observations. Do not edit .venv, venv, site-packages,
    or installed dependencies.
observations_template:
- command: ''
  expected: ''
  actual: ''
  error: ''
  root_cause: ''
  fix: ''
  post_fix_verification: ''
  status: ''
quality_loop_observations:
- iteration: 1
  point: G-008/T-005
  problem: Tactical README did not exist for end-to-end regression suite.
  action: Created a self-contained tactical README constrained to G-008 regression
    ownership.
  status: fixed
