- yaml_editor/interfaces/unsafe_lines.py
- tests/document_io/
- tests/path_language/
- tests/reader/
- tests/mutations/
- tests/validation/
- tests/transaction_writer/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - G-004 reader query public contracts
  - G-005 mutation operation public contracts
  - G-006 validation public contracts
  - G-007 checked transaction writer public contracts
  - G-008/T-001 public API boundary
  may_be_used_by:
  - G-008 CLI adapter
  - external MCP wrappers
public_contracts_provided:
- yaml_update_command(file_path, command_name, patch, dry_run)
- yaml_append_verification(file_path, item, dedupe=true)
- yaml_validate_plan_task(file_path)
model_helper_policy:
  yaml_update_command:
    selector: commands[name=command_name]
    patch_policy: Deep-merge patch into selected command object without replacing
      unrelated command fields.
    write_policy: Use checked write and preserve dry_run semantics.
  yaml_append_verification:
    selector: verification
    dedupe_default: true
    write_policy: Use checked write and preserve dry_run semantics when exposed.
  yaml_validate_plan_task:
    validation_schema: plan_task_v1
    validation_scope: parse, schema, semantic, rendered YAML, and render determinism
      through public validation contracts.
responsibilities:
- Provide the model-friendly helper functions from the technical specification.
- Keep helpers thin and compositional over public contracts.
- Preserve nested success=false results honestly.
- Document helper examples for MCP and CLI users.
verification:
  scope: tactical_completion_gate
  commands:
  - python -m pytest tests/interfaces/test_model_friendly_write_helpers.py
  expected:
  - yaml_update_command creates checked write operations targeting commands[name=...].
  - yaml_update_command preserves dry_run behavior.
  - yaml_append_verification appends with dedupe=true by default.
  - yaml_validate_plan_task delegates to plan_task_v1 validation contracts.
  - Helpers do not import internal subsystem modules directly.
acceptance_criteria:
- Model-friendly helpers from the technical specification have explicit ownership.
- Write helpers use checked write semantics and cannot bypass validation or changed
  path gates.
- This step edits only its owned code, test, and docs paths during implementation.
model_assignment_spec:
  performer: coding_agent
  instruction: Work only on yaml_editor/interfaces/model_helpers.py, yaml_editor/interfaces/public_api.py,
    tests/interfaces/test_model_friendly_write_helpers.py, docs/mcp_integration.md,
    and docs/cli_usage.md. Implement yaml_update_command, yaml_append_verification,
    and yaml_validate_plan_task as thin model-friendly helpers over public reader,
    validation, mutation, and checked writer contracts. Do not implement path, mutation,
    validation, or writer internals. Do not bypass yaml_write_checked for write helpers.
    Do not edit .venv, venv, site-packages, or installed dependencies.
