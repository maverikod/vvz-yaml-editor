format: tactical_step_v1
parent_step_id: G-008
parent_step_name: interfaces_release
tactical_step_id: T-009
tactical_step_name: model_friendly_write_helpers
title: Model-friendly write helper APIs
status: draft
source_documents:
- docs/tech_spec.md
- docs/plans/create_pip_package_for_mcp.yaml
- docs/plans/G-008-regression-release-readiness/README.yaml
intent: Own high-level model-friendly write helper APIs from the technical specification.
  This tactical step exposes yaml_update_command, yaml_append_verification, and yaml_validate_plan_task
  as thin public API helpers that compose reader, mutation, validation, and checked
  writer contracts without duplicating internal subsystem logic.
self_contained_context:
  global_goal: G-008 owns public user-facing and MCP-facing interfaces.
  technical_spec_helpers:
  - yaml_update_command(file_path, command_name, patch, dry_run)
  - yaml_append_verification(file_path, item, dedupe=true)
  - yaml_validate_plan_task(file_path)
  related_read_helpers:
  - yaml_get_command(file_path, command_name)
  - yaml_get_verification(file_path)
  helper_semantics:
  - yaml_update_command finds commands[name=command_name], deep-merges patch into
    that command, and applies the result through checked write semantics.
  - yaml_append_verification appends to verification with dedupe=true by default through
    checked write semantics.
  - yaml_validate_plan_task runs plan_task_v1 parse, schema, semantic, rendered YAML,
    and determinism validation through validation public contracts.
  boundaries:
  - Do not implement path parsing internals.
  - Do not implement mutation internals.
  - Do not implement validation internals.
  - Do not implement transaction writer internals.
  - Do not bypass yaml_write_checked for write helpers.
owned_code_paths:
- yaml_editor/interfaces/model_helpers.py
- yaml_editor/interfaces/public_api.py
owned_test_paths:
- tests/interfaces/test_model_friendly_write_helpers.py
owned_docs_paths:
- docs/mcp_integration.md
