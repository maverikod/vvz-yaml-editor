core_responsibilities:
- Expose stable public functions for MCP server wrappers.
- Implement CLI diagnostics as thin wrappers over public functions.
- Document request and response examples for MCP integration.
- Document unsafe line fallback as emergency-only if such fallback is ever added.
- Run end-to-end regression tests across subsystem boundaries.
- Verify package build, wheel install, import, and CLI behavior.
