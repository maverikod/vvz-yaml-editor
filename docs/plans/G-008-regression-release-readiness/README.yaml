- tactical_step_id: T-010
  tactical_step_name: console_entry_point_alignment
  readme_path: docs/plans/G-008-regression-release-readiness/T-010-console-entry-point-alignment/README.yaml
  purpose: Own console script target alignment between package metadata and the G-008
