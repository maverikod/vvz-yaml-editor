mcp_contract_rules:
- MCP wrappers must import interfaces/public_api only, not internal subsystem modules.
- MCP wrappers must pass through nested success=false results honestly.
- Queue completion must not be treated as operation success unless nested result.success
  is true.
- Every real write in MCP-level testing must be verified through a separate read command.
quality_gates:
  local_static_checks:
  - python -m ruff check .
  - python -m mypy ai_editor
  local_tests:
  - python -m pytest
  - python -m pytest --cov=ai_editor
  packaging_checks:
  - python -m build
  - python -m twine check dist/*
  install_checks:
  - python -m pip install dist/*.whl
  - python -c "import ai_editor; print(ai_editor.__version__)"
subsystem_independence_rules:
- This subsystem must not implement YAML parser internals.
- This subsystem must not implement path parser internals.
- This subsystem must not implement mutation internals.
- This subsystem must not implement validation internals.
- This subsystem must not implement atomic writer internals.
- It may compose public contracts from other subsystems into user-facing APIs.
- Integration tests may call multiple subsystems, but production logic must stay in
  owned interfaces paths.
regression_requirements:
- connect() returns session_key and empty buffer list.
- open(session_key, file_path, formatter=yaml) returns buffer_descriptor with readonly=False,
  modified=False.
- find_one(session_key, buffer_id, query) returns formatter-provided address.
- copy(session_key, buffer_id, address) returns clipboard_item_id.
- paste(session_key, buffer_id, address, clipboard_item_id) marks buffer modified=True
  without writing real file.
- validate(session_key, buffer_id) returns ValidationResult without writing file or
  changing modified.
- save(session_key, buffer_id) writes real file, creates one project git commit, returns
  old_hash and new_hash.
- verify save result via separate find_one or open+find_one on fresh session.
- write_all(session_key, force=False) writes only modified buffers; returns written_buffers,
  failed_buffers, skipped_buffers.
- write_all with validation failure records buffer in failed_buffers and skips write;
  other buffers continue.
- write_all(session_key, force=True) writes all non-readonly buffers regardless of
  modified flag.
- open same file in two sessions with readwrite returns BUFFER_LOCKED on second.
- open with formatter=text on .yaml file forces text formatter regardless of extension.
- undo(session_key, buffer_id) restores buffer to previous state; modified reflects
  restored state.
- redo after undo restores forward state; redo after new mutation returns REDO_AT_END.
- 'connect(auto_write=True): mutation immediately writes real file without explicit
  save.'
- 'connect(readonly=True): mutation returns BUFFER_READONLY on any buffer.'
- disconnect(close_unsaved=False) with modified buffer returns SESSION_HAS_UNSAVED_BUFFERS.
- disconnect(close_unsaved=True) closes session despite modified buffers.
- reconnect(session_key) restores all buffer_descriptors without re-opening files.
- yaml_write_checked compatibility wrapper works as mapping over open/mutate/save.
- yaml_get compatibility wrapper works as mapping over open/find_one.
- CLI ai-editor connect returns session_key on stdout for scripting.
- CLI ai-editor open --session-key <key> <file> returns buffer_id.
- Package builds as wheel; import ai_editor has no side effects after install.
release_artifacts:
- dist/*.whl
- dist/*.tar.gz
- docs/mcp_integration.md
- docs/cli_usage.md
- docs/release_checklist.md
- docs/regression_observations.md
verification:
  commands:
  - python -m pytest tests/interfaces tests/integration
  - ai-editor --help
  - ai-editor version
  - python -m build
  - python -m twine check dist/*
  expected:
  - Interface and integration tests pass.
  - CLI commands return expected exit codes.
  - Package builds successfully.
  - Built distributions pass twine check.
acceptance_criteria:
- Public API is sufficient for MCP server usage.
- CLI is a thin diagnostic wrapper and does not duplicate internals.
- End-to-end tests prove read, dry-run write, real write, validation failure, and
  read-back verification.
- Release checklist records actual commands and outcomes.
- Lower-level interface tasks can understand user-facing goals without touching internal
  subsystem files.
model_assignment_spec:
  performer: coding_agent
  instruction: 'Implement only the public interface, CLI, MCP documentation, integration
    tests, and release readiness assets. Do not edit internal subsystem directories.
    ADAPTER INTEGRATION: All ai_editor MCP commands inherit from mcp_proxy_adapter.commands.base.Command
    (NOT FastAPI routes). Register commands via ai_editor/hooks_register.py + mcp_proxy_adapter.commands.hooks.register_custom_commands_hook.
    Adapter generates help, OpenAPI, MCP tools automatically from get_schema() + metadata().
    NEVER write HTTP routes, JSON-RPC handlers, or OpenAPI YAML manually. CONFIG:
    Reader = SimpleConfig.load() from adapter. ai_editor owns AiEditorConfig dataclass
    (config/config_section.py), AiEditorConfigGenerator (config/config_generator.py
    extends SimpleConfigGenerator), AiEditorConfigValidator (config/config_validator.py
    extends BaseValidator). Settings in ''ai_editor'' section of config.json. database
    section from server''s config.json. Passwords from .env. COMMAND LAYOUT per metadatastd.md:
    ai_editor/commands/<cmd>_command.py + <cmd>_schema.py + <cmd>_metadata.py. MAIN
    PATTERN: SimpleConfig.load() -> AiEditorConfigValidator.validate() -> AiEditorConfig.from_config_json()
    -> create_app() -> register_all_commands() -> engine.run_server(). If a behavior
    fails because of internals, document the failing contract and route the fix to
    the owning global subsystem instead of patching it here.'
