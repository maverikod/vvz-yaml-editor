- tactical_step_id: T-005
  tactical_step_name: end_to_end_regression_suite
  readme_path: docs/plans/G-008-regression-release-readiness/T-005-end-to-end-regression-suite/README.yaml
  purpose: Own end-to-end public-interface regression suite and regression observations.
- tactical_step_id: T-006
  tactical_step_name: packaging_and_install_checks
