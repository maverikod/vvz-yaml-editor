  purpose: Define yaml-editor CLI adapter behavior as a thin wrapper over public API.
- tactical_step_id: T-003
  tactical_step_name: mcp_integration_docs
  readme_path: docs/plans/G-008-regression-release-readiness/T-003-mcp-integration-docs/README.yaml
