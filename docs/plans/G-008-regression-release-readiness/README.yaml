branch_self_containment_policy:
- Technical Specification -> this G-008 README.yaml -> any one T-YYY README.yaml under
  this directory must give an implementer the full picture for that tactical branch.
- Tactical README files under G-008 must repeat the relevant parent context and must
  not require reading sibling T branches.
- Maximizing tactical steps means maximizing independent steps inside G-008 only;
  no T step under G-008 may include implementation work from parser internals, path
  internals, mutation internals, validation internals, transaction writer internals,
  or unrelated branches.
ws_job_result_policy:
  client_library: mcp_proxy_adapter.client.jsonrpc_client.ws_job_status
  description: Long-running commands (embed, rename, any queued job) use WebSocket
    for result delivery instead of HTTP polling. The client subscribes to job_id on
    /ws immediately after enqueue and waits for a terminal event.
  flow:
  - call command via HTTP POST -> returns job_id immediately
  - open WebSocket to /ws (same auth headers and TLS as HTTP transport)
  - 'send subscribe: {action: subscribe, subscription_type: queue_job, job_id: <job_id>}'
  - 'wait in receive loop for terminal event: job_completed | job_failed | job_stopped'
  - extract result from terminal event payload
  - 'send unsubscribe: {action: unsubscribe, subscription_type: queue_job, job_id:
    <job_id>}'
  implementation:
    one_shot: wait_for_job_via_websocket(transport, job_id, timeout) -> last message
      dict
    bidirectional: open_bidirectional_ws_channel(transport) -> BidirectionalWsChannel
      context manager; use send_json + receive_iter
  invariants:
  - WebSocket URL is transport.ws_url (same base as HTTP, /ws path)
  - Auth headers (X-API-Key, mTLS cert) are the same as HTTP transport
  - 'Terminal events: job_completed, job_failed, job_stopped'
  - 'ws_delivery terminal events: delivery_completed, delivery_failed, delivery_cancelled
    (used for file transfer)'
  - Polling via queue_get_job_status is the fallback only; WebSocket is the primary
    result channel
  source_files:
  - mcp_proxy_adapter/client/jsonrpc_client/ws_job_status.py
  - mcp_proxy_adapter/examples/ws_examples/ws_example_runner.py
mcp_proxy_adapter_integration:
  adapter_generates_api: The mcp-proxy-adapter automatically generates help, OpenAPI,
    and MCP tool surface from command class attributes (name, version, descr, category,
    author, email), get_schema(), and metadata(). ai_editor must NEVER implement external
    API routes manually. Register commands only. The adapter owns the external surface.
  command_file_layout: 'For each MCP command: ai_editor/commands/<cmd>_command.py,
    ai_editor/commands/<cmd>_schema.py, ai_editor/commands/<cmd>_metadata.py. Very
    large metadata may split further into _descr_params.py, _errors_return.py, _examples.py.'
  command_shape: 'class SomeCommand(BaseMCPCommand): name, version, descr, category,
    author, email; classmethod get_schema() -> Dict; validate_params(params) -> Dict
    (call super first); execute(...) -> Dict; classmethod metadata() -> Dict.'
  config_database_section: config.json at project root contains 'database' section
    with DB connection settings. Read via SimpleConfig.load() which is the adapter's
    reader. ai_editor reads 'ai_editor' section from the same file. Passwords in .env
    at project root.
  config_pattern: 'ai_editor owns: ai_editor/config/config_section.py (AiEditorConfig
    dataclass), ai_editor/config/config_generator.py (AiEditorConfigGenerator extends
    SimpleConfigGenerator), ai_editor/config/config_validator.py (AiEditorConfigValidator
    extends BaseValidator). Reader = mcp_proxy_adapter SimpleConfig.load() reading
    ''ai_editor'' section from config.json. Do NOT create a separate config file.'
  config_section_key: Use 'ai_editor' as top-level section key in config.json. OR
    write settings to config root if they are server-wide. SimpleConfig.load() reads
    the full JSON; ai_editor reads its own section from config_data.
  hooks_registration: 'ai_editor registers commands in ai_editor/hooks_register.py
    (one file, split to part1/part2 if many commands). Pattern: def register_ai_editor_commands(reg):
    reg.register(BufferOpenCommand, ''custom''); reg.register(BufferCloseCommand,
    ''custom''); ... In code_analysis/hooks.py (or equivalent adapter entry point):
    from ai_editor.hooks_register import register_ai_editor_commands; hooks.register_custom_commands_hook(register_ai_editor_commands)'
  metadata_standard: 'Every command must follow docs/metadatastd.md. Required: name,
    version, description, category, author, email, detailed_description, parameters,
    return_value, usage_examples, error_cases, best_practices. Schema (get_schema)
    and metadata() are SEPARATE. Do not merge them.'
  no_manual_api: Do NOT write FastAPI routes, OpenAPI YAML, MCP tool definitions,
    or JSON-RPC handlers manually. The adapter reads get_schema() and metadata() and
    generates everything.
  reference_commands: 'Study as style examples (actual paths in cst-code/): cst-code/code_analysis/commands/cst_load_file_command.py
    + cst_load_file_metadata.py, cst_modify_tree_command.py + cst_modify_tree_schema.py
    + cst_modify_tree_metadata.py. For ai_editor own commands the layout is: ai_editor/commands/<cmd>_command.py,
    ai_editor/commands/<cmd>_schema.py, ai_editor/commands/<cmd>_metadata.py.'
  registration_checklist:
  - Command class has name, version, descr, category, author, email.
  - Command is registered with reg.register(..., 'custom') in hooks_register.py.
  - get_schema() returns type=object, all params in properties, required explicit,
    additionalProperties explicit.
  - validate_params() calls super().validate_params(params) first, then semantic validation.
  - metadata() includes all required fields per metadatastd.md.
  - Command appears in adapter help after restart.
  - Command executes successfully through MCP.
  - Write commands verified through separate read command.
