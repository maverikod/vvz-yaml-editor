format: global_package_step_v2
plan_id: ai_editor_pip_package_for_mcp
step_id: G-008
step_name: interfaces_release
title: Public interfaces, MCP/CLI adapters, regression, and release readiness subsystem
status: draft
source_plan: docs/plans/create_pip_package_for_mcp.yaml
global_intent: Own the outer interface layer and release verification for the package.
  This subsystem exposes stable public APIs, CLI commands, MCP adapter examples, integration
  docs, and end-to-end regression checks without owning internal parser, path, mutation,
  validation, or writer logic.
why_this_block_exists: 'Lower-level interface and release tasks must understand the
  whole external-facing responsibility: wire internal subsystem contracts into user-visible
  APIs, verify the package through actual commands, and prove MCP usage without duplicating
  core logic.'
