format: tactical_step_v1
parent_step_id: G-008
parent_step_name: interfaces_release
tactical_step_id: T-007
tactical_step_name: release_checklist_and_final_readiness
title: Release checklist, final readiness decision, and handoff
status: draft
source_documents:
- docs/tech_spec.md
- docs/plans/create_pip_package_for_mcp.yaml
- docs/plans/G-008-regression-release-readiness/README.yaml
intent: Own final release-readiness checklist consolidation for the package. This
  tactical step records whether public API, CLI, MCP documentation, regression, packaging,
  installation, import, and release artifacts are complete, and produces a final readiness
  decision without patching implementation code.
self_contained_context:
  global_goal: G-008 owns outer public interfaces and release verification for the
    yaml_editor package.
  release_artifacts:
  - dist/*.whl
  - dist/*.tar.gz
  - docs/mcp_integration.md
  - docs/cli_usage.md
  - docs/release_checklist.md
  - docs/regression_observations.md
  readiness_inputs:
  - G-008/T-001 public API boundary
  - G-008/T-002 CLI adapter
  - G-008/T-003 MCP integration documentation
  - G-008/T-004 CLI usage documentation
  - G-008/T-005 end-to-end regression suite
  - G-008/T-006 packaging and install checks
  boundaries:
  - Do not edit implementation code from this step.
  - Do not patch failing tests from this step.
  - Do not edit pyproject.toml or package metadata from this step.
  - Route unresolved failures to owning tactical or global steps.
owned_code_paths: []
owned_test_paths: []
owned_docs_paths:
- docs/release_checklist.md
forbidden_paths:
- yaml_editor/
- tests/
- pyproject.toml
- README.md
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - G-008/T-001 public API boundary
  - G-008/T-002 CLI adapter
  - G-008/T-003 MCP integration docs
  - G-008/T-004 CLI usage docs
  - G-008/T-005 end-to-end regression suite
  - G-008/T-006 packaging and install checks
  may_be_used_by: []
public_contracts_provided:
- docs/release_checklist.md
readiness_policy:
  final_status_values:
  - ready
  - blocked
  - ready_with_documented_risks
  required_sections:
  - public API checklist
  - CLI checklist
  - MCP documentation checklist
  - regression checklist
  - packaging checklist
  - install and import checklist
  - release artifacts checklist
  - unresolved risks and owning steps
  - final readiness decision
  failure_routing:
  - Every failed gate must name the owning tactical or global step.
  - The checklist must not silently mark failed or unrun gates as passed.
responsibilities:
- Consolidate release readiness evidence from G-008 tactical outputs.
- Record final release status and unresolved risks.
- Preserve a truthful distinction between passed, failed, skipped, and not-run gates.
verification:
  scope: tactical_completion_gate
  commands:
  - python -m pytest tests/interfaces tests/integration
  - yaml-editor --help
  - yaml-editor version
  - python -m build
  - python -m twine check dist/*
  expected:
  - Release checklist records each command outcome truthfully.
  - Any failed or unrun gate remains visible with owning-step routing.
  - Final readiness decision is supported by recorded evidence.
acceptance_criteria:
- Release checklist gives a complete final handoff for the package.
- No implementation file is edited by this step during implementation.
- Final readiness decision is not marked ready unless all required gates are passed
  or explicitly waived with documented risk.
model_assignment_spec:
  performer: release_agent
  instruction: Work only on docs/release_checklist.md. Consolidate public API, CLI,
    MCP docs, regression, packaging, install, import, artifact, unresolved risk, and
    final readiness status into the release checklist. Do not edit yaml_editor code,
    tests, pyproject.toml, README.md, .venv, venv, site-packages, or installed dependencies.
    Do not mark failed or unrun gates as passed; route failures to the owning tactical
    or global step.
observations_template:
- command: ''
  expected: ''
  actual: ''
  error: ''
  root_cause: ''
  fix: ''
  post_fix_verification: ''
  status: ''
quality_loop_observations:
- iteration: 1
  point: G-008/T-007
  problem: Tactical README did not exist for final release readiness consolidation.
  action: Created a self-contained tactical README constrained to G-008 release checklist
    and final readiness decision.
  status: fixed
