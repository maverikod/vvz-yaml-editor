format: tactical_step_v1
parent_step_id: G-008
parent_step_name: interfaces_release
tactical_step_id: T-008
tactical_step_name: unsafe_line_fallback_api
title: Unsafe emergency line-range fallback API
status: draft
source_documents:
- docs/tech_spec.md
- docs/plans/create_pip_package_for_mcp.yaml
- docs/plans/G-008-regression-release-readiness/README.yaml
intent: Own the explicitly unsafe emergency line-range fallback surface required by
  the technical specification. This tactical step exposes yaml_read_lines and yaml_write_lines_unsafe
  only as last-resort diagnostics or repair helpers, while preserving structural YAML
  paths as the normal model workflow.
self_contained_context:
  global_goal: G-008 owns outer public interfaces and release verification.
  technical_spec_requirement: Line ranges are allowed only as a fallback, with yaml_write_lines_unsafe
    visibly marked unsafe.
  fallback_commands:
  - yaml_read_lines
  - yaml_write_lines_unsafe
  normal_workflow_rule: Models must use structural YAML operations for normal work
    and must not use unsafe line writes for ordinary editing.
  boundaries:
  - Do not implement parser, path, mutation, validation, or writer internals.
  - Do not make unsafe write part of yaml_write_checked.
  - Do not expose unsafe write as a recommended MCP workflow.
owned_code_paths:
- yaml_editor/interfaces/unsafe_lines.py
owned_test_paths:
- tests/interfaces/test_unsafe_line_fallback_api.py
owned_docs_paths:
- docs/mcp_integration.md
- docs/cli_usage.md
forbidden_paths:
- pyproject.toml
- README.md
- yaml_editor/contracts/
- yaml_editor/document_io/
- yaml_editor/path_language/
- yaml_editor/reader/
- yaml_editor/mutations/
- yaml_editor/validation/
- yaml_editor/transaction_writer/
- yaml_editor/interfaces/public_api.py
- yaml_editor/interfaces/cli.py
- tests/document_io/
- tests/path_language/
- tests/reader/
- tests/mutations/
- tests/validation/
- tests/transaction_writer/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - G-001 package contracts and diagnostics
  may_be_used_by:
  - G-008 MCP integration docs
  - G-008 CLI usage docs
public_contracts_provided:
- yaml_read_lines(file_path, start_line, end_line)
- yaml_write_lines_unsafe(file_path, start_line, end_line, new_lines)
unsafe_policy:
  allowed_usage:
  - emergency diagnostics
  - emergency low-level repair when structural YAML operations cannot be used
  forbidden_usage:
  - normal model editing workflows
  - checked write replacement
  - MCP wrapper default write command
  naming_rule: Unsafe write must keep the unsafe suffix in all public names and docs.
  warning_rule: Public docs must warn that unsafe writes bypass structural YAML guarantees.
responsibilities:
- Define the unsafe fallback public surface explicitly.
- Document that unsafe writes are emergency-only and not a normal workflow.
- Keep unsafe line operations isolated from checked writer and structural mutation
  APIs.
verification:
  scope: tactical_completion_gate
  commands:
  - python -m pytest tests/interfaces/test_unsafe_line_fallback_api.py
  expected:
  - yaml_read_lines reads only requested line ranges.
  - yaml_write_lines_unsafe is visibly marked unsafe in API and docs.
  - Unsafe write is not used by yaml_write_checked or normal public mutation helpers.
acceptance_criteria:
- The fallback commands from the technical specification have an explicit owner.
- Unsafe line write cannot be confused with checked structural writes.
- This step edits only its owned code, test, and docs paths during implementation.
model_assignment_spec:
  performer: coding_agent
  instruction: Work only on yaml_editor/interfaces/unsafe_lines.py, tests/interfaces/test_unsafe_line_fallback_api.py,
    docs/mcp_integration.md, and docs/cli_usage.md. Implement and document yaml_read_lines
    and yaml_write_lines_unsafe as emergency-only fallback APIs. Do not integrate
    unsafe write into yaml_write_checked or normal mutation helpers. Do not edit parser,
    path, mutation, validation, transaction writer, CLI internals outside owned docs,
    .venv, venv, site-packages, or installed dependencies.
observations_template:
- command: ''
  expected: ''
  actual: ''
  error: ''
  root_cause: ''
  fix: ''
  post_fix_verification: ''
  status: ''
quality_loop_observations:
- iteration: 1
  point: G-008/T-008
  problem: yaml_read_lines and yaml_write_lines_unsafe were required by the technical
    specification but had no tactical owner.
  action: Created a self-contained tactical README constrained to G-008 unsafe fallback
    ownership.
  status: fixed
