format: tactical_step_v1
parent_step_id: G-008
parent_step_name: interfaces_release
tactical_step_id: T-010
tactical_step_name: console_entry_point_alignment
title: Console script entry point alignment
status: draft
source_documents:
- docs/tech_spec.md
- docs/plans/create_pip_package_for_mcp.yaml
- docs/plans/G-001-package-foundation/README.yaml
- docs/plans/G-008-regression-release-readiness/README.yaml
intent: Own the planning handoff that resolves the console script path mismatch between
  package metadata and the G-008 CLI implementation owner. This tactical step makes
  the yaml-editor console command target explicit and defines coordination with G-001
  package metadata without allowing ad hoc edits to pyproject.toml from unrelated
  steps.
self_contained_context:
  global_goal: G-008 owns the user-facing CLI adapter and release verification.
  conflict_to_resolve:
    root_plan_entry_point: yaml-editor=yaml_editor.cli:main
    g008_cli_owner_path: yaml_editor/interfaces/cli.py
    g001_rule: G-001 owns pyproject.toml and does not implement CLI behavior.
  required_decision:
  - Preferred target is yaml-editor=yaml_editor.interfaces.cli:main unless a compatibility
    wrapper yaml_editor/cli.py is explicitly chosen.
  - The implementation must keep CLI behavior owned by G-008.
  - Package metadata changes must be coordinated with G-001 ownership rules.
  boundaries:
  - Do not implement CLI commands here.
  - Do not edit parser, path, mutation, validation, or writer internals.
  - Do not let packaging metadata point at a non-owned or nonexistent CLI module.
owned_code_paths:
- yaml_editor/interfaces/cli.py
owned_test_paths:
- tests/interfaces/test_console_entry_point_alignment.py
owned_docs_paths:
- docs/release_checklist.md
coordinated_paths_requiring_owner_approval:
- pyproject.toml
forbidden_paths:
- README.md
- yaml_editor/contracts/
- yaml_editor/document_io/
- yaml_editor/path_language/
- yaml_editor/reader/
- yaml_editor/mutations/
- yaml_editor/validation/
- yaml_editor/transaction_writer/
- yaml_editor/interfaces/public_api.py
- yaml_editor/interfaces/model_helpers.py
- yaml_editor/interfaces/unsafe_lines.py
- tests/document_io/
- tests/path_language/
- tests/reader/
- tests/mutations/
- tests/validation/
- tests/transaction_writer/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - G-001 package metadata ownership
  - G-008/T-002 CLI adapter
  - G-008/T-006 packaging and install checks
  may_be_used_by:
  - G-008 release checklist and final readiness
public_contracts_provided:
- console entry point alignment policy
entry_point_policy:
  preferred_console_script: yaml-editor=yaml_editor.interfaces.cli:main
  compatibility_option: yaml_editor/cli.py may exist only as a thin wrapper if explicitly
    chosen by the package metadata owner.
  verification_commands:
  - yaml-editor --help
  - yaml-editor version
  - python -m pip install dist/*.whl
  failure_policy:
  - If installed yaml-editor cannot import the configured target, release readiness
    is blocked.
  - The owning fix must be routed to package metadata owner or CLI adapter owner according
    to the failing path.
responsibilities:
- Make console script target ownership explicit.
- Ensure release checks verify the installed console command target.
- Route pyproject.toml changes through G-001 ownership rather than silently editing
  it from unrelated steps.
verification:
  scope: tactical_completion_gate
  commands:
  - python -m pytest tests/interfaces/test_console_entry_point_alignment.py
  - yaml-editor --help
  - yaml-editor version
  expected:
  - Console entry point target matches the G-008 CLI owner path or an explicitly documented
    compatibility wrapper.
  - Installed yaml-editor command imports and runs.
  - Any mismatch blocks release readiness with owning-step routing.
acceptance_criteria:
- The root plan and G-008 CLI ownership no longer conflict silently.
- Release checklist includes console entry point target verification.
- This step edits only owned CLI/test/docs paths unless a coordinated G-001 package
  metadata task explicitly owns pyproject.toml.
model_assignment_spec:
  performer: release_agent
  instruction: Work only on tests/interfaces/test_console_entry_point_alignment.py
    and docs/release_checklist.md, and coordinate pyproject.toml changes only through
    the G-001 package metadata owner. Verify that yaml-editor points to yaml_editor.interfaces.cli:main
    or to an explicitly documented compatibility wrapper. Do not implement CLI command
    behavior here. Do not edit parser, path, mutation, validation, transaction writer,
    .venv, venv, site-packages, or installed dependencies.
observations_template:
- command: ''
  expected: ''
  actual: ''
  error: ''
  root_cause: ''
  fix: ''
  post_fix_verification: ''
  status: ''
quality_loop_observations:
- iteration: 1
  point: G-008/T-010
  problem: Root package plan used yaml_editor.cli:main while G-008 CLI ownership used
    yaml_editor/interfaces/cli.py, leaving console script ownership ambiguous.
  action: Created a self-contained tactical README constrained to G-008 console entry
    point alignment and G-001 metadata coordination.
  status: fixed
