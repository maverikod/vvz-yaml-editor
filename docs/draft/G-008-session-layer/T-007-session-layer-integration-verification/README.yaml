  - G-002 AbstractBuffer (via session layer)
  - G-003 text formatter (as test formatter)
  provides_to:
  - G-008 public interfaces implementer (docs/sessions.md as reference)
public_contracts_provided:
- docs/sessions.md documenting session model, connect/reconnect/disconnect, buffer
  lifecycle within session, mutation commit, undo/redo, clipboard, write_all, startup_sweep.
implementation_notes: "Integration tests should exercise complete user workflows:\n\
  \  connect -> open -> mutate -> undo -> redo -> save -> disconnect\n  connect ->\
  \ open -> mutate -> disconnect(close_unsaved=False) -> SESSION_HAS_UNSAVED_BUFFERS\n\
  \  connect -> open -> mutate -> disconnect(close_unsaved=True) -> session deleted\n\
  \  connect(session A) -> open file -> connect(session B) -> open same file readwrite\
  \ -> BUFFER_LOCKED\n  connect -> open -> copy(address) -> cut(address) -> paste(address)\
  \ -> save\n  connect(auto_write=True) -> open -> mutate -> verify real file written\
  \ without explicit save\n  connect(readonly=True) -> open -> mutate -> BUFFER_READONLY\n\
  \  startup_sweep after simulated crash: stale locks released, expired dirs deleted\n\
  \  write_all with mixed modified and unmodified buffers\n  reconnect restores buffer\
  \ list from .buf files without re-opening real files\nTests run in temp directories\
  \ to avoid modifying real project. docs/sessions.md must include: session model\
  \ overview, session attributes and lifecycle, buffer operations within session,\
  \ undo/redo model, clipboard model, write_all and auto_write, startup_sweep, write-lock\
  \ enforcement, and session directory structure.\n"
verification:
  commands:
  - python -m pytest tests/sessions/ -v
  - test -f docs/sessions.md
  expected:
  - All G-008 acceptance criteria pass in integration.
  - connect creates session directory with ses_settings.json and git bare repo.
  - reconnect restores buffer list from .buf files without re-opening real files.
  - disconnect with close_unsaved=False and modified buffer returns SESSION_HAS_UNSAVED_BUFFERS.
  - disconnect with close_unsaved=True closes and deletes directory.
  - open same file readwrite in two sessions returns BUFFER_LOCKED on second.
  - Mutation commits to buffer branch and writes .buf file.
  - undo restores buffer content and .buf file.
  - undo at first commit returns UNDO_AT_BEGINNING.
  - New mutation after undo resets redo stack.
  - Clipboard paste from session A into session B returns SESSION_LOCK_CONFLICT.
  - idle_timeout expiry closes session as close_unsaved=True.
  - connect with auto_write=True causes mutation to write real file immediately.
  - connect with readonly=True opens all buffers readonly.
  - write_all returns written_buffers, failed_buffers, skipped_buffers.
  - startup_sweep releases stale locks and deletes expired session directories.
  - docs/sessions.md exists and covers session model and all acceptance criteria.
acceptance_criteria:
- Integration test suite passes for all G-008 acceptance criteria.
- docs/sessions.md documents the session model for implementers.
- No new production code is introduced in this step.
- Integration tests run in temp directories.
