intent: 'Write integration tests that verify all G-008 acceptance criteria together:
  connect, reconnect, disconnect, open, mutation commit, undo/redo, clipboard, write_all,
  auto_write, startup_sweep, idle_timeout, and write-lock enforcement across sessions.
  Produce docs/sessions.md documenting the session model for G-008 implementers.

  '
why_this_step_exists: 'Unit tests in T-001..T-006 test each component in isolation.
  T-007 adds end-to-end integration tests of the full session lifecycle. These tests
  confirm all components interoperate correctly and that all G-008 acceptance criteria
  are satisfied together.

  '
