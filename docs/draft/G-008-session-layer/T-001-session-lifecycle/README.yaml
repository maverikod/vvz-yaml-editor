public_contracts_provided:
- 'connect(idle_timeout_seconds, auto_write, readonly) -> SessionDescriptor: generates
  UUID4 session_key, creates session directory, writes ses_settings.json, initialises
  bare git repo at session_dir/git/ via gitpython, returns SessionDescriptor with
  session_key and empty open_buffers list.

  '
- 'reconnect(session_key) -> SessionDescriptor: reads ses_settings.json, restores
  all session attributes, restores buffer_descriptor list from .buf files. Returns
  SessionDescriptor. Updates last_active_at.

  '
- 'disconnect(session_key, force=False, close_unsaved=False) -> DisconnectResult:
  if close_unsaved=False and session.readonly=False: check for modified buffers; if
  any -> return SESSION_HAS_UNSAVED_BUFFERS. If close_unsaved=True or readonly: proceed.
  Release write locks. Atomically delete session directory (rename to .closing then
  rmtree).

  '
- 'session_status(session_key) -> SessionDescriptor: returns current session state
  and list of open buffer_descriptor objects from ses_settings.json and buf files.

  '
- 'SesSettings — module owning ses_settings.json read/write/format.

  '
implementation_notes: 'ses_settings.json fields: session_key, created_at, last_active_at,
  idle_timeout_seconds, auto_write, readonly, buffer_ids (list of UUID4 strings).
  Session directory: sessions_base_dir/<session_key>/ where sessions_base_dir is read
  from AiEditorConfig.sessions.base_dir (default ''.ai_editor_sessions'' relative
  to project_root). Git repo initialised at session_dir/git/ via gitpython git.Repo.init(bare=True).
  Atomic delete: os.rename(session_dir, session_dir + ''.closing'') then shutil.rmtree.
  idle_timeout: now - last_active_at > idle_timeout_seconds -> session is expired;
  behaves as close_unsaved=True. reconnect does NOT re-open real files from disk;
  restores content from .buf files.

  '
verification:
  commands:
  - python -m pytest tests/sessions/test_session_lifecycle.py -v
  expected:
  - connect creates session directory with ses_settings.json and git bare repo.
  - connect returns session_key and empty buffer list.
  - reconnect reads ses_settings.json and restores buffer_descriptor list from .buf
    files.
  - reconnect does not re-open real files.
  - disconnect with close_unsaved=False and modified buffer returns SESSION_HAS_UNSAVED_BUFFERS.
  - disconnect with close_unsaved=True closes despite modified buffers.
  - disconnect deletes session directory atomically.
  - session_status returns correct open_buffers list.
  - Expired session (idle_timeout exceeded) behaves as close_unsaved=True.
  - connect with readonly=True sets session.readonly=True.
acceptance_criteria:
- connect generates UUID4 session_key and creates session directory.
- ses_settings.json written at connect and after every state change.
- reconnect restores attributes and buffer list without re-reading real files.
- disconnect with close_unsaved=False checks modified buffers.
- Session directory deleted atomically on disconnect.
- idle_timeout expiry behaves as close_unsaved=True.
- auto_write and readonly are set at connect and never change.
