parent_global_context: 'G-008 owns the session layer: the stateful context in which
  a client opens buffers, edits documents, tracks operation history, and manages a
  clipboard. Every buffer operation requires a session_key. G-008 owns the session
  directory, ses_settings.json, .buf files, editor-internal bare git repo, write-lock
  enforcement, and session-scoped clipboard. G-002 owns AbstractBuffer lifecycle;
  G-008 aggregates through sessions. T-001 owns the session directory lifecycle and
  the four lifecycle commands.

  '
intent: 'Implement connect(idle_timeout_seconds, auto_write, readonly) -> SessionDescriptor,
  reconnect(session_key) -> SessionDescriptor, disconnect(session_key, force, close_unsaved)
  -> DisconnectResult, and session_status(session_key) -> SessionDescriptor. Implement
  session directory creation at <sessions_base_dir>/<session_key>/, ses_settings.json
  read/write, idle_timeout enforcement, and atomic session directory deletion on disconnect.

  '
why_this_step_exists: 'Session lifecycle (connect/reconnect/disconnect/status) is
  independently testable without buffer open/close logic (T-002), git commit history
  (T-003), undo/redo (T-004), clipboard (T-005), or write_all (T-006). Isolating it
  here lets each subsequent step build on a stable session lifecycle foundation.

  '
