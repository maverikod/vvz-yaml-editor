parent_global_context: 'G-008 owns the session layer. The session-local bare git repo
  at session_dir/git/ holds one branch buf/<buffer_id> per open buffer. Every mutation
  creates one commit on that branch (T-003). T-004 owns undo and redo: moving HEAD
  on the buffer branch to restore previous or future buffer states.

  '
intent: 'Implement undo(session_key, buffer_id, steps=1) and redo(session_key, buffer_id,
  steps=1). undo: git checkout HEAD~steps on buf/<buffer_id>; reload buffer content
  from that commit; write .buf file; modified stays True unless back at initial commit.
  Returns UNDO_AT_BEGINNING if already at first commit. redo: move HEAD forward by
  steps; returns REDO_AT_END if already at latest commit. Redo stack resets on any
  new mutation.

  '
why_this_step_exists: 'undo/redo is independently testable from the mutation commit
  pipeline (T-003). The commit history is a prerequisite (created by T-003); undo/redo
  only navigates it. Isolating undo/redo here prevents T-003 from including navigation
  logic and keeps each step focused.

  '
