public_contracts_provided:
- 'undo(session, buffer_id, steps=1) -> UndoRedoResult: git checkout HEAD~steps on
  buf/<buffer_id>; reload buffer content from commit tree; write .buf; set modified=True
  unless at initial commit. UNDO_AT_BEGINNING if already at first commit. HISTORY_UNAVAILABLE
  if git repo missing.

  '
- 'redo(session, buffer_id, steps=1) -> UndoRedoResult: move HEAD forward by steps;
  reload content; write .buf. REDO_AT_END if at latest commit. Redo stack is the standard
  git reflog position; any new mutation resets it.

  '
- 'UndoRedoResult — dataclass: success (bool), buffer_id (str), modified (bool), diagnostics
  (list).

  '
implementation_notes: 'undo uses gitpython repo.git.checkout(''HEAD~N'') on the buffer
  branch. Buffer content after checkout is read from the committed tree: repo.head.commit.tree.
  write_buf writes the restored content to <session_dir>/<buffer_id>.buf. modified=False
  only when HEAD is back at the initial ''open:'' commit (the very first commit on
  the branch). Otherwise modified stays True. Redo: gitpython does not expose a native
  redo; track redo position via a per-buffer pointer stored in session memory (or
  via reflog). Any new mutation after undo advances the branch HEAD with a new commit
  which discards the redo future (standard git behavior).

  '
verification:
  commands:
  - python -m pytest tests/sessions/test_undo_redo.py -v
  expected:
  - undo restores buffer to previous commit content.
  - undo writes .buf file with restored content.
  - undo at first commit returns UNDO_AT_BEGINNING without modifying buffer.
  - undo sets modified=False when back at initial open commit.
  - redo moves HEAD forward and restores buffer content.
  - redo at latest commit returns REDO_AT_END.
  - New mutation after undo resets redo stack; redo then returns REDO_AT_END.
  - HISTORY_UNAVAILABLE returned when git repo missing.
acceptance_criteria:
- undo restores buffer content and .buf file from commit tree.
- UNDO_AT_BEGINNING returned at first commit without side effects.
- REDO_AT_END returned at latest commit without side effects.
- Redo stack resets on any new mutation.
- modified=False only when HEAD is at the initial open commit.
- git failure returns HISTORY_UNAVAILABLE without crashing.
