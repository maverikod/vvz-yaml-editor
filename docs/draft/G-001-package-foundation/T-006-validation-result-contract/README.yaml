format: tactical_step_v1
parent_step_id: G-001
parent_step_name: package_contracts_and_distribution
tactical_step_id: T-006
tactical_step_name: validation_result_contract
title: Shared ValidationResult contract
status: draft
source_documents:
- docs/tech_spec.md
- docs/plans/G-001-package-foundation/README.yaml
intent: Define the shared validation result shape that future validation and checked-write
  subsystems will use to report YAML parse, schema, semantic, deterministic-render,
  and changed-path validation outcomes without owning validation behavior.
owned_code_paths:
- ai_editor/contracts/validation.py
owned_test_paths:
- tests/contracts/test_validation_result_contract.py
owned_docs_paths: []
forbidden_paths:
- pyproject.toml
- ai_editor/__init__.py
- ai_editor/contracts/result.py
- ai_editor/contracts/errors.py
- ai_editor/contracts/diagnostics.py
- ai_editor/contracts/operations.py
- ai_editor/contracts/__init__.py
- ai_editor/document_io/
- ai_editor/path_language/
- ai_editor/reader/
- ai_editor/mutations/
- ai_editor/validation/
- ai_editor/transaction_writer/
- ai_editor/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - T-005-diagnostics-contract
  may_be_used_by:
  - T-003-result-envelope
  - T-007-operation-result-contract
  - T-008-contracts-public-index
  - future_validation_subsystem
  - future_transaction_writer_subsystem
public_contracts_provided:
- ValidationResult
- ValidationCheckResult
validation_result_contract:
  required_check_names:
  - yaml_parse
  - schema
  - semantic
  - deterministic_render
  - changed_path_match
  validation_check_result_fields:
  - name
  - success
  - diagnostics
  validation_result_fields:
  - success
  - checks
  - diagnostics
  field_semantics:
    success: Overall validation success; true only when every check succeeds.
    checks: Ordered list of per-check results for required_check_names.
    diagnostics: Aggregated JSON-safe diagnostics from failed or warning checks.
  invariants:
  - ValidationResult.success is true only if every ValidationCheckResult.success is
    true.
  - Every required_check_name is representable even if a future caller skips or marks
    it not applicable by policy.
  - Failed checks preserve diagnostics from T-005 Diagnostic-compatible shapes.
  - diagnostics is always present as a list, even when empty.
  - This contract must not implement actual validation, schema loading, semantic checks,
    rendering, or changed-path comparison.
responsibilities:
- Define a generic validation result structure, not concrete validators.
- Represent per-check outcomes for yaml_parse, schema, semantic, deterministic_render,
  and changed_path_match.
- Carry diagnostics in a JSON-safe T-005 Diagnostic-compatible form.
- Support overall success/failure aggregation without owning validation rules.
requirements_from_tech_spec:
  validation_checks:
  - yaml_parse
  - schema
  - semantic
  - deterministic_render
  - changed_path_match
  write_response_must_return:
  - validation_result
implementation_notes:
- This tactical step must not implement plan_task_v1 validation rules.
- This tactical step must not import future validation subsystem modules.
- Field names should match future MCP response expectations.
- Use the T-005 diagnostic shape for diagnostics but do not add validation behavior
  here.
verification:
  commands:
  - python -m pytest tests/contracts/test_validation_result_contract.py
  expected:
  - ValidationResult can represent all required check names.
  - ValidationResult.success aggregates per-check success truthfully.
  - ValidationResult can be converted to a JSON-safe dict.
  - Failed check diagnostics are preserved.
  - Contract does not import forbidden subsystem modules.
acceptance_criteria:
- ValidationResult is implementation-neutral and reusable.
- ValidationResult and ValidationCheckResult fields and invariants are explicit.
- It can represent both dry-run and real-write validation outcomes.
- It edits only owned code and tests.
model_assignment_spec:
  performer: coding_agent
  instruction: Implement only the ValidationResult and ValidationCheckResult contract
    and tests. Do not implement validators, schema loading, semantic checks, rendering,
    changed-path comparison, writer behavior, CLI, or MCP wrappers. This step defines
    the result data shape and truthful aggregation only.
observations_template:
- actual: ''
  command: ''
  error: ''
  expected: ''
  fix: ''
  post_fix_verification: ''
  root_cause: ''
  status: ''
quality_loop_observations:
- iteration: 1
  point: G-001/T-006
  problem: ValidationResult and ValidationCheckResult fields and invariants were not
    explicit
  action: added validation_result_contract with required checks, fields, semantics,
    and invariants
  status: fixed
- iteration: 1
  point: G-001/T-006
  problem: overall success aggregation was underspecified
  action: required ValidationResult.success to be true only when every per-check result
    succeeds
  status: fixed
