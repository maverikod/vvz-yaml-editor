format: tactical_step_v1
parent_step_id: G-001
parent_step_name: package_contracts_and_distribution
tactical_step_id: T-012
tactical_step_name: release_checklist_foundation
title: Foundation release checklist
status: draft
source_documents:
- docs/tech_spec.md
- docs/plans/G-001-package-foundation/README.yaml
intent: 'Create the release checklist section that applies to the G-001 foundation
  only: package metadata, import safety, public contract availability, typed marker
  packaging, boundary documentation, and build readiness. This checklist must not
  claim full YAML editor readiness.'
owned_code_paths: []
owned_test_paths:
- tests/contracts/test_release_checklist_foundation.py
owned_docs_paths:
- docs/release_checklist.md
forbidden_paths:
- pyproject.toml
- README.md
- ai_editor/__init__.py
- ai_editor/contracts/
- ai_editor/py.typed
- docs/package_contracts.md
- ai_editor/document_io/
- ai_editor/path_language/
- ai_editor/reader/
- ai_editor/mutations/
- ai_editor/validation/
- ai_editor/transaction_writer/
- ai_editor/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - T-001-package-configuration
  - T-002-version-export
  - T-008-contracts-public-index
  - T-009-typed-package-marker
  - T-011-package-boundary-docs
  may_be_used_by:
  - T-013-contract-layer-verification
  - future_release_tasks
public_contracts_provided:
- docs/release_checklist.md foundation section
release_checklist_policy:
  scope: G-001 foundation only
  must_include_sections:
  - package metadata and build readiness
  - package import and version export
  - public contracts import surface
  - typed marker packaging
  - boundary documentation presence
  - explicit G-001 non-goals
  required_public_contract_imports:
  - ResultEnvelope
  - ErrorCode
  - Diagnostic
  - DiagnosticSeverity
  - ValidationResult
  - ValidationCheckResult
  - OperationResult
  - RenderPreview
  - FileHashPair
  forbidden_readiness_claims:
  - yaml_load is implemented
  - yaml_get is implemented
  - yaml_write_checked is implemented
  - yaml_validate is implemented
  - CLI or MCP wrapper is ready
  - full YAML editor production readiness is achieved
  check_classification:
    local_doc_check: docs/release_checklist.md content and scope
    cross_step_foundation_checks: build, import, contract imports, typed marker packaging
foundation_release_checks:
- python -m build
- python -c "import ai_editor; print(ai_editor.__version__)"
- python -c "from ai_editor.contracts import ResultEnvelope, ErrorCode, Diagnostic,
  DiagnosticSeverity, ValidationResult, ValidationCheckResult, OperationResult, RenderPreview,
  FileHashPair"
- python -m pytest tests/contracts
non_goals:
- Do not validate yaml_load, yaml_get, yaml_write_checked, or yaml_validate behavior
  here.
- Do not require MCP server integration in the foundation checklist.
- Do not claim production readiness for YAML editing before later subsystems exist.
responsibilities:
- Define release checks for the package foundation layer.
- Include package build checks as cross-step foundation verification.
- Include import-safety checks.
- Include full public contract import checks from T-008.
- Include py.typed packaging checks.
- Include boundary-documentation checks from T-011.
- Explicitly exclude YAML behavior readiness from this checklist stage.
implementation_notes:
- This is a documentation-only tactical step, except for its doc-specific test.
- The checklist should be easy to extend by later global steps.
- Keep foundation checks distinct from future full release checks.
- Do not edit pyproject.toml, package root, contracts, typed marker, or boundary docs
  from this step.
verification:
  commands:
  - python -m pytest tests/contracts/test_release_checklist_foundation.py
  expected:
  - docs/release_checklist.md exists.
  - The checklist includes build, import, full public contracts, typed marker, and
    boundary documentation checks.
  - The checklist clearly says YAML behavior is out of scope for G-001.
  - The checklist does not claim CLI, MCP wrapper, or full YAML editor readiness.
acceptance_criteria:
- Release checklist is truthful for foundation scope.
- Future release tasks can append without overwriting foundation checks.
- The checklist imports every public contract exported by T-008 in its documented
  foundation checks.
- This step edits only its owned documentation and test files.
model_assignment_spec:
  performer: coding_agent
  instruction: Work only on docs/release_checklist.md and its foundation checklist
    test. Do not edit metadata, package root, contracts, README, boundary docs, typed
    marker, or future subsystem directories. The checklist must not claim full YAML
    editor readiness. It must include every public contract exported by T-008 and
    classify build/import/package checks as G-001 foundation checks, not full product
    readiness.
observations_template:
- actual: ''
  command: ''
  error: ''
  expected: ''
  fix: ''
  post_fix_verification: ''
  root_cause: ''
  status: ''
quality_loop_observations:
- iteration: 1
  point: G-001/T-012
  problem: foundation checklist imported only the older subset of public contracts
  action: updated contract import checks to match the T-008 public index exactly
  status: fixed
- iteration: 1
  point: G-001/T-012
  problem: release checks did not explicitly classify build/import checks as foundation
    cross-step checks and not full YAML readiness
  action: added release_checklist_policy with scope, forbidden readiness claims, and
    check classification
  status: fixed
- iteration: 1
  point: G-001/T-012
  problem: T-011 boundary documentation was relevant but not listed as a dependency
    or checklist section
  action: added T-011 dependency and boundary documentation checks
  status: fixed
