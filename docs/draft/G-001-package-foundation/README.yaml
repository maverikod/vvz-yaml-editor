format: global_package_step_v2
plan_id: ai_editor_pip_package_for_mcp
step_id: G-001
step_name: package_contracts_and_distribution
title: Package contracts, distribution shell, and subsystem boundaries
status: draft
source_documents:
- docs/tech_spec.md
- docs/plans/create_pip_package_for_mcp.yaml
global_intent: Define the pip package as a composition of independent subsystems.
  This block owns package metadata, top-level contracts, public error/result types,
  and the rules that prevent lower-level steps from editing the same code files across
  subsystems.
why_this_block_exists: Every lower-level task needs stable package boundaries before
  implementation starts. This global block tells implementers where the package entry
  points live, which contracts are shared intentionally, and which directories belong
  to other subsystems.
owned_code_paths:
- pyproject.toml
- README.md
- ai_editor/__init__.py
- ai_editor/contracts/
- ai_editor/py.typed
owned_test_paths:
- tests/contracts/
owned_docs_paths:
- docs/release_checklist.md
- docs/package_contracts.md
forbidden_code_paths:
- ai_editor/editor_core/
- ai_editor/formatters/
- ai_editor/search/
- ai_editor/sessions/
- ai_editor/config/
- ai_editor/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on: []
  may_be_used_by:
  - G-002 document_io (internal to G-003)
  - G-003 path_language
  - G-004 reader_queries (compat, internal to G-003)
  - G-005 mutation_operations (absorbed into G-003 and G-006)
  - G-006 validation_rules (absorbed into G-003 and G-006)
  - G-007 writer (ai_editor/writer.py)
  - G-008 interfaces_release
  - G-002 editor_core_buffer_registry
  - G-003 text_yaml_formatters
  - G-004 universal_search
  - G-005 foreign_formatters
  - G-006 cst_formatter
  - G-007 project_refactor
  - G-008 session_layer
public_contracts_provided:
- ResultEnvelope — wraps success (bool), error_code (str | None), message (str), details
  (dict), diagnostics (dict).
- ErrorCode — enum. Must include ALL codes from ТЗ /error_model/typed_errors. Full
  list is authoritative there; T-004 reads it directly.
- 'Diagnostic — dataclass: code (str), message (str), path (str | None), details (dict).'
- 'ValidationResult — dataclass: success (bool), diagnostics (list[Diagnostic]).'
- 'OperationResult — dataclass: success (bool), error_code (str | None), message (str),
  diagnostics (list[Diagnostic]).'
- 'WriteAllResult — dataclass: success (bool), written_buffers (list[str]), failed_buffers
  (list[dict]), skipped_buffers (list[str]), diagnostics (list[Diagnostic]).'
- 'SessionKey — type alias: str (UUID4).'
- 'SessionDescriptor — dataclass: session_key (SessionKey), open_buffers (list[BufferDescriptor]),
  diagnostics (list[Diagnostic]).'
- 'BufferDescriptor — dataclass: buffer_id (str), session_key (SessionKey), filename
  (str), relative_path (str | None), formatter (str), modified (bool), readonly (bool),
  buf_file_path (str | None).'
- Package version export — __version__ string in ai_editor/__init__.py.
core_responsibilities:
- Define package identity and build backend.
- Define shared result and error contracts used by all subsystems.
- Define dependency policy and package data inclusion policy.
- Define subsystem ownership map so later detailed tasks do not edit the same code
  files.
- Keep imports side-effect free for MCP servers.
- Do not define CLI console entry points in G-001; CLI belongs to G-008.
subsystem_independence_rules:
- A lower-level task may edit only files inside its own owned paths.
- Cross-subsystem usage must happen through documented public contracts, never by
  editing another subsystem files.
- Shared types live only in ai_editor/contracts/ and are owned by G-001.
- No subsystem may patch .venv, venv, site-packages, or installed dependencies.
implementation_outline:
- Create pyproject.toml with hatchling, dependencies, optional dev dependencies, and
  package-data policy.
- pyproject.toml must include package-data glob for ai_editor/schemas/**/*.json so
  that plan_task_v1.schema.json (created by G-003) is bundled in the wheel. G-001
  owns pyproject.toml; G-003 owns the schema file itself.
- Do not declare console entry points in G-001; console entry point is owned by G-008.
- Create ai_editor/contracts/ with stable DTOs and error codes.
- Export package version without importing heavy subsystems.
- Add package boundary documentation.
verification:
  scope: global_g001_integration_only
  commands:
  - python -m build
  - python -c "import ai_editor; print(ai_editor.__version__)"
  - python -m pytest tests/contracts
  expected:
  - Package builds as wheel and sdist after the G-001-owned package root and contracts
    exist.
  - Import has no side effects.
  - Contract tests pass.
acceptance_criteria:
- All subsystem directories are named and non-overlapping.
- Shared contracts are explicit and minimal.
- Lower-level implementers can identify whether a file is theirs before editing.
- Package metadata is ready for pip installation.
- No CLI console entry point is declared by G-001.
- owned_test_paths and owned_code_paths do not overlap.
- pyproject.toml package-data includes ai_editor/schemas/**/*.json so G-003 schema
  files are bundled in the wheel without G-001 owning those files.
