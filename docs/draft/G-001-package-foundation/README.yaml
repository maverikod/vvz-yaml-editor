model_assignment_spec:
  performer: coding_agent
  instruction: Implement only the package shell and shared contract layer as decomposed
    in tactical_decomposition. Do not implement YAML loading, path parsing, mutations,
    validation, writing, CLI, or MCP wrapper logic. Do not declare CLI console entry
    points in this global step; console entry point ownership belongs to G-008. Use
    each tactical step README.yaml to determine which G-001-owned files are editable
    in that task. Do not edit ai_editor/editor_core/, ai_editor/sessions/, ai_editor/formatters/,
    ai_editor/search/, ai_editor/interfaces/, .venv, venv, or site-packages. The ErrorCode
    enum in T-004 must include ALL error codes from docs/plans/create_pip_package_for_mcp.yaml
    /error_model/typed_errors — including session, buffer, formatter, search, clipboard,
    validation, write, and git codes.
