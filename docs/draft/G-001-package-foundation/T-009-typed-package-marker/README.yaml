format: tactical_step_v1
parent_step_id: G-001
parent_step_name: package_contracts_and_distribution
tactical_step_id: T-009
tactical_step_name: typed_package_marker
title: PEP 561 typed package marker
status: draft
source_documents:
- docs/tech_spec.md
- docs/plans/G-001-package-foundation/README.yaml
intent: Mark the package as typed for downstream MCP servers and future subsystems
  without implementing runtime YAML editor behavior or changing package metadata owned
  by T-001.
owned_code_paths:
- ai_editor/py.typed
owned_test_paths:
- tests/contracts/test_typed_package_marker.py
owned_docs_paths: []
forbidden_paths:
- pyproject.toml
- README.md
- ai_editor/__init__.py
- ai_editor/contracts/
- ai_editor/document_io/
- ai_editor/path_language/
- ai_editor/reader/
- ai_editor/mutations/
- ai_editor/validation/
- ai_editor/transaction_writer/
- ai_editor/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - T-001-package-configuration
  may_be_used_by:
  - T-012-release-checklist-foundation
  - T-013-contract-layer-verification
  - future_subsystems
public_contracts_provided:
- PEP 561 typed package marker
typed_marker_contract:
  marker_path: ai_editor/py.typed
  marker_content_policy:
    required: true
    allowed_content: empty file or comment-only marker
    forbidden_content:
    - Python runtime code
    - imports
    - package metadata declarations
  packaging_dependency:
    owner: T-001-package-configuration
    requirement: T-001 owns pyproject.toml inclusion rules for ai_editor/py.typed.
  completion_gate:
    required_for_t009:
    - marker file exists at ai_editor/py.typed
    - marker presence test passes
    cross_step_only:
    - python -m build
    - wheel contains ai_editor/py.typed
responsibilities:
- Add py.typed marker to the package root.
- Verify marker presence without editing package metadata.
- Keep the marker independent from runtime implementation.
implementation_notes:
- py.typed should be empty or comment-only.
- Do not add imports or code behavior in this step.
- Do not edit pyproject.toml from this step; package-data inclusion belongs to T-001.
- Wheel-content verification belongs to G-001 integration or release checklist unless
  all build preconditions are already satisfied.
verification:
  commands:
  - python -m pytest tests/contracts/test_typed_package_marker.py
  optional_cross_step_commands:
  - python -m build
  expected:
  - py.typed exists in ai_editor.
  - py.typed has no runtime code or imports.
  - T-009 completion does not require editing pyproject.toml.
  - Built wheel includes ai_editor/py.typed only when cross-step build verification
    is run.
acceptance_criteria:
- py.typed is present at ai_editor/py.typed.
- py.typed is empty or comment-only and contains no runtime behavior.
- This step edits no runtime code and no package metadata.
- Future typed consumers can detect ai_editor as a typed package after T-001 packaging
  rules and cross-step build verification are satisfied.
model_assignment_spec:
  performer: coding_agent
  instruction: Implement only the PEP 561 marker and its marker-presence test. Edit
    only ai_editor/py.typed and tests/contracts/test_typed_package_marker.py. Do not
    edit pyproject.toml, runtime code, contracts, YAML subsystems, CLI, MCP wrappers,
    .venv, venv, site-packages, or installed packages. Treat wheel build checks as
    cross-step verification unless the current run explicitly performs G-001 integration
    verification.
observations_template:
- actual: ''
  command: ''
  error: ''
  expected: ''
  fix: ''
  post_fix_verification: ''
  root_cause: ''
  status: ''
quality_loop_observations:
- iteration: 1
  point: G-001/T-009
  problem: completion gate mixed marker creation with package build and wheel-content
    verification
  action: separated T-009 required verification from optional cross-step build verification
  status: fixed
- iteration: 1
  point: G-001/T-009
  problem: marker content policy was implicit
  action: added typed_marker_contract requiring empty or comment-only marker with
    no imports or runtime code
  status: fixed
