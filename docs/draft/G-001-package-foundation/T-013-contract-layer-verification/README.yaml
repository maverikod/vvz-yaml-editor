format: tactical_step_v1
parent_step_id: G-001
parent_step_name: package_contracts_and_distribution
tactical_step_id: T-013
tactical_step_name: contract_layer_verification
title: Foundation contract-layer integration verification
status: draft
source_documents:
- docs/tech_spec.md
- docs/plans/G-001-package-foundation/README.yaml
intent: Verify that all G-001 tactical outputs work together as a foundation layer
  while still preserving tactical ownership boundaries. This step owns only integration-style
  contract tests and observations for the G-001 layer; it must not patch earlier tactical
  outputs.
owned_code_paths: []
owned_test_paths:
- tests/contracts/test_foundation_contract_layer.py
owned_docs_paths:
- docs/foundation_observations.md
forbidden_paths:
- pyproject.toml
- README.md
- ai_editor/__init__.py
- ai_editor/contracts/
- ai_editor/py.typed
- docs/package_contracts.md
- docs/release_checklist.md
- ai_editor/document_io/
- ai_editor/path_language/
- ai_editor/reader/
- ai_editor/mutations/
- ai_editor/validation/
- ai_editor/transaction_writer/
- ai_editor/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - T-001-package-configuration
  - T-002-version-export
  - T-003-result-envelope
  - T-004-error-codes
  - T-005-diagnostics-contract
  - T-006-validation-result-contract
  - T-007-operation-result-contract
  - T-008-contracts-public-index
  - T-009-typed-package-marker
  - T-010-package-readme
  - T-011-package-boundary-docs
  - T-012-release-checklist-foundation
  may_be_used_by:
  - G-001-final-review
public_contracts_provided:
- tests/contracts/test_foundation_contract_layer.py
- docs/foundation_observations.md
foundation_verification_policy:
  required_public_contract_imports:
  - ResultEnvelope
  - ErrorCode
  - Diagnostic
  - DiagnosticSeverity
  - ValidationResult
  - ValidationCheckResult
  - OperationResult
  - RenderPreview
  - FileHashPair
  required_documentation_outputs:
  - README.md
  - docs/package_contracts.md
  - docs/release_checklist.md
  required_package_outputs:
  - ai_editor.__version__
  - ai_editor/py.typed
  check_classification:
    local_step_outputs:
    - tests/contracts/test_foundation_contract_layer.py
    - docs/foundation_observations.md
    integration_checks:
    - public contract import surface
    - package import and version export
    - typed marker presence
    - foundation documentation presence
    cross_step_release_checks:
    - python -m pytest tests/contracts
    - python -m build
  failure_routing_policy:
  - This step may record failures and owning_step in docs/foundation_observations.md.
  - This step must not modify production code or docs owned by earlier tactical steps.
  - If an earlier tactical output is wrong, route the fix to that owning T-step.
  - Observations must include command, expected, actual, error, root_cause when known,
    owning_step, fix, post_fix_verification, and status.
responsibilities:
- Verify that the package imports without side effects.
- Verify that all public contracts exported by T-008 import from ai_editor.contracts.
- Verify that contract values are JSON-safe where applicable.
- Verify that py.typed is present and package metadata can include it via T-001 rules.
- Verify that docs describe foundation scope truthfully.
- Record observations for any G-001 foundation issue found with owning tactical step
  identified.
verification_scope:
  includes:
  - package import
  - version export
  - full T-008 public contract imports
  - contract JSON-safety
  - typed marker presence
  - foundation documentation presence
  - observation routing to owning tactical steps
  excludes:
  - yaml_load behavior
  - yaml_get behavior
  - yaml_write_checked behavior
  - YAML path parsing
  - schema or semantic validation behavior
  - CLI or MCP wrapper behavior
implementation_notes:
- This step may read outputs from earlier tactical steps but must not modify them.
- If a contract issue is found, report it in observations and route the fix to the
  owning T-step.
- Do not patch another tactical step's owned file from this step.
- Treat python -m build as cross-step release verification, not as proof of YAML editor
  readiness.
verification:
  commands:
  - python -m pytest tests/contracts/test_foundation_contract_layer.py
  optional_cross_step_commands:
  - python -m pytest tests/contracts
  - python -m build
  expected:
  - Foundation contract-layer tests pass.
  - The integration test covers every public contract exported by T-008.
  - Package import, version export, typed marker, and foundation docs are checked.
  - Any failure is documented with owning tactical step identified.
  - Optional cross-step build/test checks do not claim YAML behavior readiness.
acceptance_criteria:
- G-001 tactical outputs are compatible as a package foundation.
- Full public contract import surface from T-008 is covered.
- Any failure is documented with owning tactical step identified.
- This step does not edit production code or another tactical step's owned docs.
model_assignment_spec:
  performer: coding_agent
  instruction: Implement only G-001 integration verification tests and foundation
    observations. Edit only tests/contracts/test_foundation_contract_layer.py and
    docs/foundation_observations.md. Do not edit production code or docs owned by
    other tactical steps. The verification must cover every public contract exported
    by T-008, package import/version export, typed marker presence, and foundation
    documentation presence. If verification fails, document the issue and identify
    the owning tactical step instead of patching it here.
observations_template:
- actual: ''
  command: ''
  error: ''
  expected: ''
  fix: ''
  post_fix_verification: ''
  root_cause: ''
  status: ''
quality_loop_observations:
- iteration: 1
  point: G-001/T-013
  problem: verification step did not require the full T-008 public contract import
    surface
  action: added foundation_verification_policy.required_public_contract_imports matching
    T-008
  status: fixed
- iteration: 1
  point: G-001/T-013
  problem: local verification and cross-step build/test checks were not separated
  action: moved aggregate pytest/build into optional_cross_step_commands and classified
    them as release checks
  status: fixed
- iteration: 1
  point: G-001/T-013
  problem: failure routing to owning tactical steps was only informal
  action: added explicit failure_routing_policy and observation requirements
  status: fixed
