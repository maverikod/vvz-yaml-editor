format: tactical_step_v1
parent_step_id: G-001
parent_step_name: package_contracts_and_distribution
tactical_step_id: T-002
tactical_step_name: version_export
title: Lightweight package version export
status: draft
source_documents:
- docs/tech_spec.md
- docs/plans/G-001-package-foundation/README.yaml
intent: Provide a lightweight package import surface that exposes the package version
  without importing YAML editor behavior modules, future subsystems, CLI, MCP wrappers,
  or causing filesystem side effects.
owned_code_paths:
- ai_editor/__init__.py
owned_test_paths:
- tests/contracts/test_version_export.py
owned_docs_paths: []
forbidden_paths:
- pyproject.toml
- ai_editor/contracts/result.py
- ai_editor/contracts/errors.py
- ai_editor/contracts/diagnostics.py
- ai_editor/contracts/validation.py
- ai_editor/contracts/operations.py
- ai_editor/contracts/__init__.py
- ai_editor/py.typed
- ai_editor/editor_core/
- ai_editor/formatters/
- ai_editor/search/
- ai_editor/document_io/
- ai_editor/path_language/
- ai_editor/reader/
- ai_editor/mutations/
- ai_editor/validation/
- ai_editor/transaction_writer/
- ai_editor/interfaces/
- .venv
- venv
- site-packages
allowed_dependencies:
  may_depend_on:
  - T-001-package-configuration
  may_be_used_by:
  - T-008-contracts-public-index
public_contracts_provided:
- ai_editor.__version__
version_export_policy:
  source_of_truth: T-001-package-configuration project.version
  initial_version: 0.1.0
  allowed_implementation_options:
  - lightweight local constant matching the T-001 static project.version
  - importlib.metadata lookup for distribution ai-editor-mcp with explicit fallback
    to initial_version
  forbidden_implementation_options:
  - reading pyproject.toml during package import
  - importing YAML parser, reader, mutation, validation, writer, CLI, MCP wrapper,
    or subsystem modules
  - deriving the version from runtime YAML behavior
import_safety_boundary:
  package_root_may_import:
  - Python standard library modules required for version lookup
  package_root_must_not_import_categories:
  - YAML document IO or parser behavior
  - structural path language behavior
  - read or inspection API behavior
  - mutation engine behavior
  - validation or rendering behavior
  - checked-write or transaction writer behavior
  - public interface, CLI, or MCP wrapper behavior
  - shared contract DTO internals except where a later tactical step explicitly owns
    that public index
responsibilities:
- Export __version__ from the package root.
- Keep package import side-effect free for MCP servers.
- Keep package root import limited to package identity, not YAML editor behavior.
requirements_from_g001:
- Keep imports side-effect free for MCP servers.
- Provide package version export.
implementation_notes:
- Use a lightweight version export policy consistent with T-001 static project.version.
- The package root must not import document_io, path_language, reader, mutations,
  validation, transaction_writer, or interfaces.
- The package root must not read repository files or initialize YAML behavior during
  import.
- This step may remove package-root re-exports of YAML behavior functions if such
  re-exports exist, but must not edit the behavior modules themselves.
verification:
  commands:
  - python -c "import ai_editor; print(ai_editor.__version__)"
  - python -m pytest tests/contracts/test_version_export.py
  expected:
  - Import succeeds and prints the T-001 version string.
  - Import does not touch filesystem state or import forbidden behavior, subsystem,
    CLI, or MCP wrapper modules.
acceptance_criteria:
- ai_editor/__init__.py is the only production file edited by this tactical step.
- __version__ is available from ai_editor.
- __version__ matches the T-001 static project.version for the current package foundation.
- Package root import remains lightweight and side-effect free.
- Package root import does not import YAML editor behavior modules, future subsystems,
  CLI, or MCP wrappers.
- tests/contracts/test_version_export.py covers version export and import-safety behavior.
model_assignment_spec:
  performer: coding_agent
  instruction: Work only on the package root version export and its tests. Edit only
    ai_editor/__init__.py and tests/contracts/test_version_export.py. Do not edit
    pyproject.toml, contract modules, typed marker, YAML behavior modules, future
    subsystem directories, CLI, MCP wrappers, .venv, venv, site-packages, or installed
    packages. The package root must expose ai_editor.__version__ using a lightweight
    policy consistent with T-001 project.version and must not import parser, reader,
    mutation, validation, renderer, writer, interface, CLI, or MCP wrapper behavior.
    This step is about package identity and import boundaries only, not YAML editor
    behavior.
observations_template:
- actual: ''
  command: ''
  error: ''
  expected: ''
  fix: ''
  post_fix_verification: ''
  root_cause: ''
  status: ''
quality_loop_observations:
- iteration: 1
  point: G-001/T-002
  problem: version export source was ambiguous between importlib.metadata and a local
    constant
  action: added explicit version_export_policy tied to T-001 project.version
  status: fixed
- iteration: 1
  point: G-001/T-002
  problem: import-safety boundary was too general and did not enumerate forbidden
    behavior categories
  action: added import_safety_boundary and strengthened acceptance criteria
  status: fixed
