allowed_dependencies:
  consumes_from:
  - G-002/T-002 BufferRegistry and BufferState
  - G-002/T-003 ConcreteBuffer fields (modified, readonly, file_path)
  - G-002/T-004 save_pipeline.save (called per eligible buffer)
  - G-001 contracts (WriteAllResult)
  provides_to:
  - G-008 session layer (calls write_all and get_state and get_formatter)
  - ai_editor/api.py public API layer (exposes write_all result to caller)
public_contracts_provided:
- 'write_all(session_key, force=False) -> WriteAllResult: for each buffer in session
  where readonly=False: if force=False skip buffers where modified=False; call formatter.validate_document;
  if fails add to failed_buffers and skip write; call save_pipeline.save; if fails
  add to failed_buffers; on success add to written_buffers. New unsaved buffers (file_path=None)
  silently added to skipped_buffers. WriteAllResult fields: success (True only if
  all eligible succeeded), written_buffers, failed_buffers (list of dicts with buffer_id,
  error_code, message), skipped_buffers.

  '
- 'get_state(session_key, buffer_id) -> BufferState: reads buffer fields from registry
  and returns BufferState dataclass. No side effects.

  '
- 'get_formatter(session_key, buffer_id) -> AbstractFormatter: returns the active
  formatter instance for the buffer. No side effects.

  '
implementation_notes: 'write_all success=True only if every eligible buffer (non-readonly,
  non-unsaved, modified=True when force=False) was written without error. Partial
  write is valid; session remains open on partial failure. get_state and get_formatter
  are pure lookup functions; they must not modify any state. All three functions receive
  buffers via BufferRegistry.list_for_session.

  '
verification:
  commands:
  - python -m pytest tests/editor_core/test_write_all.py -v
  expected:
  - write_all with force=False writes only modified non-readonly buffers.
  - write_all with force=True writes all non-readonly buffers.
  - write_all with validation failure records buffer in failed_buffers; others continue.
  - New unsaved buffers (file_path=None) appear in skipped_buffers.
  - write_all success=False when any eligible buffer fails.
  - write_all success=True when all eligible buffers succeed.
  - get_state returns BufferState with correct fields for known buffer.
  - get_formatter returns AbstractFormatter instance for known buffer.
  - get_state with unknown buffer_id returns BUFFER_NOT_FOUND.
acceptance_criteria:
- write_all iterates only buffers belonging to the given session_key.
- force=False skips unmodified buffers (they appear in skipped_buffers).
- failed_buffers contains buffer_id, error_code, and message per failed buffer.
- Session remains open after partial write failure.
- get_state and get_formatter are pure read operations with no side effects.
