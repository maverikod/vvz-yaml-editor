parent_global_context: 'G-002 owns the format-independent editor core. T-006 owns
  write_all(session_key, force=False) -> WriteAllResult and the get_state / get_formatter
  accessors. These are read/batch operations; they do not introduce new lifecycle
  or mutation logic.

  '
intent: 'Implement write_all(session_key, force=False) -> WriteAllResult that iterates
  all open buffers in the session and calls save_pipeline.save for each eligible buffer.
  Implement get_state(session_key, buffer_id) -> BufferState and get_formatter(session_key,
  buffer_id) -> AbstractFormatter as simple registry lookups. These complete the AbstractBuffer
  contract and allow G-008 and G-008 to query and batch-write buffers.

  '
why_this_step_exists: 'write_all is independently testable without touching open/close,
  save/validate, or copy/cut/paste. get_state and get_formatter are pure read accessors.
  Grouping them here completes the AbstractBuffer contract coverage within G-002 without
  mixing concerns from other T steps.

  '
