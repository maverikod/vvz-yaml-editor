  instruction: 'Define AbstractBuffer as an ABC with @abstractmethod for: open(session_key,
    file_path, formatter, open_as_text, readonly) -> str; new(session_key, formatter,
    display_name) -> str; save(session_key, buffer_id); save_as(session_key, buffer_id,
    file_path, overwrite); close(session_key, buffer_id, save); reload(session_key,
    buffer_id); get_state(session_key, buffer_id) -> BufferState; get_formatter(session_key,
    buffer_id); validate(session_key, buffer_id) -> ValidationResult; write_all(session_key,
    force) -> WriteAllResult. Implement BufferRegistry as a thread-safe in-memory
    dict-of-dict with register/lookup/lookup_by_id/unregister/list_for_session. Define
    BufferState dataclass and BufferStatus enum. Define BufferAddress dataclass with
    address: Any. Export all from ai_editor/editor_core/__init__.py. Tests in tests/editor_core/test_buffer_registry.py.

    '
  non_goals:
  - Concrete open/close/save implementation (that is T-003 and T-004)
  - File edit lock logic
  - Config reading
  - Formatter invocation
