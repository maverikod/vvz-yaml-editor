parent_global_context: 'G-002 owns the format-independent editor core: AbstractBuffer,
  BufferRegistry, buffer lifecycle, formatter fallback policy, file edit lock, save/validate
  pipeline, copy/cut/paste orchestration, and config integration. T-002 defines the
  base class contract and the in-memory registry mapping (session_key, file_path)
  -> buffer_id. All other T steps build on this foundation.

  '
intent: 'Define AbstractBuffer as an abstract base class (or protocol) with all public
  methods declared and typed. Implement BufferRegistry as an in-memory mapping from
  (session_key, file_path) to buffer_id. Define BufferState dataclass and BufferStatus
  enum (normal | small_file | format_fallback). Define BufferAddress dataclass. These
  are the contracts that all other G-002 tactical steps and G-008 depend on.

  '
why_this_step_exists: 'Separating the abstract contract from the concrete lifecycle
  implementation (T-003) allows G-008 and G-008 to depend on a stable interface without
  coupling to the implementation detail of how open/save/close work. The registry
  lives here because it is shared across all buffer operations and must be instantiated
  once per process.

  '
