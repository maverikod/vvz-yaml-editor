public_contracts_provided:
- 'AbstractBuffer — abstract base class with methods: open, new, save, save_as, close,
  reload, get_state, get_formatter, validate, write_all. All declared with typed parameters
  including session_key: str as required first argument.

  '
- 'BufferRegistry — in-memory mapping (session_key: str, file_path: str) -> buffer_id:
  str. Methods: register, lookup, lookup_by_id, unregister, list_for_session.

  '
- 'BufferState — dataclass: buffer_id, session_key, filename, relative_path, formatter,
  modified, readonly, buffer_status (BufferStatus enum).

  '
- 'BufferStatus — enum: normal | small_file | format_fallback.

  '
- 'BufferAddress — dataclass: buffer_id (str), address (Any). address is opaque to
  editor core; interpreted only by the formatter.

  '
implementation_notes: "1. AbstractBuffer: declare all methods as @abstractmethod with\
  \ full type signatures.\n   session_key: str is the first parameter for every method.\n\
  \   Do not implement any logic here — pure contract.\n2. BufferRegistry: thread-safe\
  \ dict of dict. Key level 1: session_key. Key level 2:\n   file_path. Value: buffer_id.\
  \ Second dict also has reverse lookup buffer_id -> file_path.\n   Methods: register(session_key,\
  \ buffer_id, file_path), lookup(session_key, file_path)\n   -> Optional[str], lookup_by_id(buffer_id)\
  \ -> Optional[str], unregister(buffer_id),\n   list_for_session(session_key) ->\
  \ list[str].\n3. BufferState includes buffer_status field of type BufferStatus to\
  \ communicate\n   small_file/format_fallback to callers without coupling them to\
  \ formatter internals.\n4. BufferAddress.address is typed as Any to remain opaque;\
  \ editor core must never\n   inspect or transform address.\n"
verification:
  commands:
  - python -m pytest tests/editor_core/test_buffer_registry.py -v
  expected:
  - BufferRegistry.register stores (session_key, file_path) -> buffer_id mapping.
  - BufferRegistry.lookup returns buffer_id for known (session_key, file_path).
  - BufferRegistry.lookup returns None for unknown pair.
  - BufferRegistry.lookup_by_id returns file_path for known buffer_id.
  - BufferRegistry.unregister removes both forward and reverse mappings.
  - BufferRegistry.list_for_session returns all buffer_ids for session.
  - Two sessions can each open the same file_path independently.
  - AbstractBuffer cannot be instantiated directly (is abstract).
  - BufferAddress.address field accepts arbitrary value without inspection.
acceptance_criteria:
- AbstractBuffer declares all required methods with correct signatures.
- BufferRegistry enforces one buffer_id per (session_key, file_path) pair.
- BufferState includes buffer_id, session_key, filename, relative_path, formatter,
  modified, readonly, buffer_status fields.
- 'BufferStatus enum has exactly three members: normal, small_file, format_fallback.'
- BufferAddress dataclass has buffer_id (str) and address (Any) fields.
- All symbols importable from ai_editor.editor_core.
