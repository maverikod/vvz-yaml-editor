  instruction: 'Implement safety_checkpoint.py with: detect_git_availability(project_root)
    -> bool using subprocess or gitpython; create_git_checkpoint(job_uuid, old_name,
    new_name, project_root) -> (tag_name, commit_sha) using gitpython on PROJECT git
    repo; BackupRecord dataclass; create_backup_checkpoint(file_paths) -> BackupRecord
    using shutil.copy2 with path.bak_<job_uuid>; rollback_git(tag_name, project_root)
    -> bool; rollback_backups(backup_record) -> bool. Write tests in tests/project_refactor/test_safety_checkpoint.py.
    Do not implement reference search, rename execution, or MCP command.

    '
  non_goals:
  - Reference search engine (T-003)
  - Rename execution pipeline (T-004)
  - MCP command class (T-005)
  - Editor-internal session git operations
