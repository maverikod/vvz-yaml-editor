public_contracts_provided:
- 'RenameCommand — class extending BaseMCPCommand: name=''rename'', version=''1.0.0'',
  category=''custom''. Provides get_schema() -> Dict, validate_params(params) -> Dict,
  execute(...) -> Dict (returns job_id immediately), classmethod metadata() -> Dict.

  '
- 'hooks_register.py — register_ai_editor_commands(reg): calls reg.register(RenameCommand,
  ''custom''). Entry point: from ai_editor.hooks_register import register_ai_editor_commands.

  '
implementation_notes: "Command file layout follows docs/metadatastd.md:\n  rename_command.py:\
  \ RenameCommand class with execute().\n  rename_schema.py: get_schema() returning\
  \ JSON Schema object with required=[target, new_name].\n  rename_metadata.py: metadata()\
  \ dict with name, version, description, parameters,\n  return_value, usage_examples,\
  \ error_cases, best_practices.\nexecute() enqueues a queue job and returns {success:\
  \ True, job_id: <str>} immediately. Queue job calls execute_rename from rename_pipeline\
  \ and returns RenameJobResult as payload. WebSocket delivery: client opens /ws,\
  \ subscribes to queue_job/<job_id>, waits for job_completed|job_failed|job_stopped\
  \ event. validate_params calls super() then validates new_name is a valid Python\
  \ identifier. Schema: type=object, properties target (object) and new_name (string)\
  \ and update_references (boolean, default true) and dry_run (boolean, default false)\
  \ and scope (array of strings, nullable). required=[target, new_name]. additionalProperties=false.\n"
verification:
  commands:
  - python -m pytest tests/project_refactor/test_rename_command.py -v
  expected:
  - RenameCommand has name, version, descr, category, author, email attributes.
  - RenameCommand is registered with reg.register(RenameCommand, 'custom') in hooks_register.py.
  - get_schema() returns valid JSON Schema with required=[target, new_name].
  - validate_params rejects new_name that is a Python keyword.
  - validate_params rejects non-identifier new_name.
  - execute() returns job_id immediately without blocking.
  - metadata() includes all required fields per metadatastd.md.
  - dry_run=True executes without writing files, creating git tags, or creating backups.
  - Command appears in adapter help after restart.
acceptance_criteria:
- RenameCommand follows docs/metadatastd.md command shape exactly.
- execute() returns job_id immediately; never blocks.
- validate_params validates new_name as Python identifier.
- Schema has required=[target, new_name] and additionalProperties=false.
- hooks_register.py registers RenameCommand with category=custom.
- metadata() includes best_practices recommending dry_run first and rename_status
  verification.
