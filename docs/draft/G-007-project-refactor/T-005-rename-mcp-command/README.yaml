parent_global_context: 'G-007 owns project-wide rename refactoring. T-005 wraps the
  rename_pipeline (T-004) as an mcp-proxy-adapter command class. rename() always enqueues
  a job in the adapter queue and returns job_id immediately. Result is delivered via
  WebSocket. This step owns only the MCP surface; it does not reimplement pipeline,
  checkpoint, or search.

  '
intent: 'Implement RenameCommand class following docs/metadatastd.md: name=rename,
  separate rename_command.py, rename_schema.py, rename_metadata.py files. execute()
  enqueues a queue job that calls execute_rename from T-004 and returns job_id immediately.
  Register via ai_editor/hooks_register.py. Result delivered via WebSocket subscriber;
  polling via queue_get_job_status as fallback.

  '
why_this_step_exists: 'The MCP command surface is independently testable from the
  execution pipeline. The adapter integration (registration, schema validation, queue
  dispatch, WebSocket delivery) is a distinct ownership concern. Isolating it here
  means T-004 can be tested without adapter machinery and T-005 can be tested without
  the full rename pipeline.

  '
